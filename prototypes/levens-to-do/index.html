<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Levens-to-do · proefje</title>
<!-- Klikbaar prototype APP-18 (werktitel), 8 november 2026. Eén bestand, geen externe bronnen, geen tracking.
     Gegevens blijven alleen in deze browser (localStorage); er wordt niets verstuurd. -->
<style>
:root{--acc:#346B5C;--acc-l:#E4EFEB;--warm:#8A6022;--warm-l:#F3EEE4;--ink:#1F1F1F;--sub:#6B6B6B;--line:#E6E3DC;--bg:#F6F5F1;--card:#FFFFFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
.app{max-width:420px;min-height:100vh;margin:0 auto;background:#fff;display:flex;flex-direction:column;position:relative}
main{flex:1;padding:20px 22px 110px}
h1{font-size:26px;margin:18px 0 4px}
h2{font-size:17px;margin:26px 0 10px}
.sub{color:var(--sub);font-size:14px}
.klein{font-size:13px;color:var(--sub)}
.midden{text-align:center}
.rij{display:flex;gap:8px}
.chip{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 6px;font-size:15px;text-align:center;cursor:pointer;user-select:none}
.chip.aan{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{flex:0 0 calc(50% - 4px)}
.knop{display:block;width:100%;border:0;border-radius:24px;background:var(--acc);color:#fff;font:600 17px/1 inherit;padding:15px;margin-top:22px;cursor:pointer}
.knop.rand{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
.knop.warm{background:var(--warm)}
.link{background:none;border:0;color:var(--acc);font:500 14px inherit;padding:8px 0;cursor:pointer}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:16px/1.4 inherit;background:var(--bg);resize:none}
textarea:focus,input:focus{outline:2px solid var(--acc-l);border-color:var(--acc)}
.kaart{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;background:var(--card)}
.kaart .kop{display:flex;align-items:center;gap:12px}
.kaart .titel{flex:1;font-weight:600}
.vink{width:24px;height:24px;border-radius:50%;border:2px solid var(--acc);background:#fff;cursor:pointer;flex:none;padding:0}
.vink.af{background:var(--acc)}
.visie{background:var(--warm-l);border-radius:10px;padding:8px 10px;margin-top:10px;font-size:13px}
.visie b{color:var(--warm);font-size:12px;display:block}
.tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tag{border:1px solid var(--line);border-radius:10px;padding:4px 9px;font-size:12px;background:#fff;cursor:pointer}
.tag.aan{background:var(--acc-l);border-color:var(--acc);color:var(--acc)}
.acties{display:flex;gap:14px;margin-top:8px}
.acties button{background:none;border:0;padding:4px 0;font:500 13px inherit;color:var(--sub);cursor:pointer}
.acties button.groen{color:var(--acc)}
.dump{display:flex;gap:8px}
.dump input{flex:1}
.dump button{border:0;border-radius:14px;background:var(--acc);color:#fff;font:600 15px inherit;padding:0 16px;cursor:pointer}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#fff;border-top:1px solid var(--line);display:flex;padding:10px 0 calc(14px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;font:500 14px inherit;color:var(--sub);padding:8px;cursor:pointer}
nav button.aan{color:var(--acc);font-weight:700}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:#fff;width:100%;max-width:420px;border-radius:24px 24px 0 0;padding:14px 22px 34px;text-align:center}
.sheet .greep{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.beeld{height:170px;border-radius:18px;margin:12px 0;background-size:cover;background-position:center;position:relative;overflow:hidden}
.beeld .label{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.85);border-radius:11px;padding:3px 10px;font-size:12px}
.lijst{border-top:1px solid var(--line)}
.lijst div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.lijst span{color:var(--sub);font-size:13px}
.lijst span.groen{color:var(--acc)}
.adem{width:150px;height:150px;border-radius:50%;background:var(--acc-l);margin:30px auto;display:flex;align-items:center;justify-content:center;color:var(--acc);font-weight:600;animation:adem 10s ease-in-out infinite}
@keyframes adem{0%,100%{transform:scale(.7)}40%{transform:scale(1)}}
.stil{padding:14px;border-radius:14px;background:var(--bg);font-size:13px;color:var(--sub);margin-top:26px}
.gebiedkaart{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;cursor:pointer}
.gebiedkaart .mini{width:52px;height:52px;border-radius:12px;background-size:cover;background-position:center;flex:none}
.gebiedkaart .leeg{background:var(--bg);border:1px dashed var(--line)}
</style>
</head>
<body>
<div class="app">
<main id="scherm"></main>
<nav id="nav" hidden>
  <button data-tab="nukan">Nu kan</button>
  <button data-tab="gebieden">Gebieden</button>
  <button data-tab="alles">Alles</button>
</nav>
</div>
<div id="sheet"></div>
<script>
// ---------- gegevens (alleen in deze browser) ----------
const SLEUTEL = "levenstodo-proefje-v1";
const GEBIEDEN = ["Lichaam","Relatie","Vrienden","Werk","Geld","Zingeving"];
const VOORBEELD = {
  Lichaam:"Sterk en krachtig, als een ijsbader",
  Relatie:"Elke week echt tijd voor elkaar",
  Vrienden:"Als ik hulp nodig heb, staan ze klaar",
  Werk:"Werk waar ik trots op ben",
  Geld:"Rustig, met een buffer voor een jaar",
  Zingeving:"Elke dag iets doen dat ertoe doet"
};
const BEELDEN = [ // abstracte beelden, zelf getekend (geen externe bron)
  "linear-gradient(180deg,#E8D7B5 0%,#9DB8A8 70%,#6E9483 100%)",
  "linear-gradient(160deg,#F3EEE4 0%,#C08A3E 100%)",
  "linear-gradient(200deg,#E4EFEB 0%,#3E7C6B 100%)"
];
let S = laad() || nieuw();
function nieuw(){ return {tijd:null, ruimte:null, kaarten:[], gebieden:{}, gevraagd:{}, scherm:"start", gestart:Date.now()}; }
function laad(){ try{ return JSON.parse(localStorage.getItem(SLEUTEL)); }catch(e){ return null; } }
function bewaar(){ try{ localStorage.setItem(SLEUTEL, JSON.stringify(S)); }catch(e){} }
function id(){ return Math.random().toString(36).slice(2,9); }
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- navigatie ----------
function ga(scherm){ S.scherm = scherm; bewaar(); teken(); window.scrollTo(0,0); }
document.querySelectorAll("nav button").forEach(b => b.onclick = () => ga(b.dataset.tab));
function teken(){
  const tabs = ["nukan","gebieden","alles","gebied"];
  $("#nav").hidden = !tabs.includes(S.scherm);
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("aan", b.dataset.tab === S.scherm || (S.scherm==="gebied" && b.dataset.tab==="gebieden")));
  $("#scherm").innerHTML = (SCHERMEN[S.scherm] || SCHERMEN.start)();
  koppel();
}

// ---------- logica "nu kan" ----------
const DUUR = ["kort","half uur","lang"];
function past(k){
  if (k.af || k.wacht || k.los) return false;
  if (k.nietnu && k.nietnu > Date.now()) return false;
  const max = S.tijd === "5 min" ? 0 : S.tijd === "half uur" ? 1 : 2;
  if (DUUR.indexOf(k.duur) > max) return false;
  if (S.ruimte === "vol" && k.energie === "zwaar") return false;
  return true;
}
function nuKan(){ return S.kaarten.filter(past).slice(0,3); }

// ---------- schermen ----------
const SCHERMEN = {
start(){
  const terug = S.kaarten.length > 0;
  return `<h1 class="midden">${terug ? "Welkom terug" : "Goedemorgen"}</h1>
  <p class="sub midden">${terug ? "Niets hoeft ingehaald. Twee vragen, dan zie je wat kan." : "Geen account. Twee vragen, dan klaar."}</p>
  <h2>Hoeveel tijd heb je nu?</h2>
  <div class="rij">${["5 min","half uur","langer"].map(o=>`<div class="chip ${S.tijd===o?"aan":""}" data-tijd="${o}">${o}</div>`).join("")}</div>
  <h2>Hoeveel ruimte in je hoofd?</h2>
  <div class="rij">${["vol","gaat wel","ruim"].map(o=>`<div class="chip ${S.ruimte===o?"aan":""}" data-ruimte="${o}">${o}</div>`).join("")}</div>
  <p class="klein midden" style="margin-top:18px">Je kunt dit altijd overslaan.</p>
  <button class="knop" data-actie="naStart">${terug ? "Laat zien wat kan" : "Verder"}</button>
  <p class="midden"><button class="link" data-ga="dump">Gedachten eerst kwijt?</button></p>
  <div class="stil">Dit is een proefje. Alles blijft in deze browser op dit toestel; er wordt niets verstuurd. <button class="link" data-actie="wis">Alles wissen</button></div>`;
},
ruimte(){
  return `<h1>Eerst ruimte</h1>
  <p class="sub">Je hoofd is vol. Dat mag. Kies wat nu helpt.</p>
  <button class="knop" data-ga="adem">Een minuut ademen</button>
  <button class="knop rand" data-actie="kleineKlus">Eén kleine klus</button>
  <button class="knop rand" data-ga="dump">Eerst alles uit mijn hoofd</button>
  <p class="klein midden" style="margin-top:20px">Wil je vaker rust? Daar komt een aparte rust-app voor.</p>`;
},
adem(){
  return `<h1 class="midden">Adem mee</h1>
  <p class="sub midden">In als de cirkel groeit, langzaam uit als hij krimpt.</p>
  <div class="adem">adem</div>
  <button class="knop" data-actie="kleineKlus">Klaar, laat één kleine klus zien</button>
  <button class="knop rand" data-ga="start">Terug</button>`;
},
dump(){
  return `<h1>Wat zit er in je hoofd?</h1>
  <p class="sub">Typ wat er opkomt. Elke zin wordt een kaart. Sorteren hoeft niet.</p>
  <div class="dump" style="margin-top:16px"><input type="text" id="nieuw" placeholder="Bijvoorbeeld: Marijn bellen" autocomplete="off"><button data-actie="voegToe">+</button></div>
  ${S.kaarten.filter(k=>!k.af).length ? "" : `<p><button class="link" data-actie="voorbeelden">Of laad een paar voorbeelden</button></p>`}
  ${S.kaarten.filter(k=>!k.af && !k.los).map(k=>`<div class="kaart"><div class="kop"><div class="titel">${esc(k.titel)}</div></div>
    <div class="tags">
      <span class="tag aan" data-duur="${k.id}">${k.duur}</span>
      <span class="tag ${k.wacht?"aan":""}" data-wacht="${k.id}">${k.wacht?"wacht op iemand":"wacht niet"}</span>
      <span class="tag ${k.energie==="zwaar"?"aan":""}" data-energie="${k.id}">${k.energie}</span>
    </div></div>`).join("")}
  <p class="klein">Tik op een eigenschap om hem te wisselen: duur, wacht op iemand, licht of zwaar.</p>
  <button class="knop" data-actie="naDump">Klaar</button>`;
},
kiesgebied(){
  const g = S.kiesGebied || "Lichaam";
  return `<h1>Waar wil je dit jaar iets moois van maken?</h1>
  <p class="sub">Kies één gebied en schrijf één zin. Een karikatuur mag. Een beeld kan later.</p>
  <div class="chips" style="margin-top:16px">${GEBIEDEN.map(o=>`<div class="chip ${g===o?"aan":""}" data-kies="${o}">${o}</div>`).join("")}</div>
  <h2>${g}: één zin</h2>
  <input type="text" id="zin" placeholder="${esc(VOORBEELD[g])}" value="${esc((S.gebieden[g]||{}).zin||"")}">
  <p class="klein">Bijvoorbeeld: "${esc(VOORBEELD[g])}".</p>
  <button class="knop" data-actie="bewaarGebied">Bewaar</button>
  <button class="knop rand" data-actie="nietNuGebied">Goede vraag, maar niet nu</button>`;
},
nukan(){
  const lijst = nuKan();
  const rest = S.kaarten.filter(k=>!k.af && !k.los).length - lijst.length;
  return `<div style="display:flex;justify-content:space-between;align-items:baseline"><h1>Nu kan</h1>
    <button class="link" data-ga="start">${S.tijd||"?"} · ${S.ruimte||"?"}</button></div>
  ${lijst.length ? lijst.map(kaartHtml).join("") : `<div class="kaart midden"><p><b>Niets dat nu past.</b></p><p class="sub">Prima zo. Je kunt ook iets uit je hoofd zetten.</p><button class="link" data-ga="dump">Gedachten dumpen</button></div>`}
  <p class="sub midden" style="margin-top:22px">De rest wacht. Je hoeft er nu niets mee.</p>
  ${rest>0?`<p class="klein midden">${rest} ${rest===1?"kaart wacht":"kaarten wachten"} rustig. <button class="link" data-ga="alles">Toch kijken</button></p>`:""}
  <p class="midden"><button class="link" data-ga="dump">+ Iets uit je hoofd zetten</button></p>`;
},
gebieden(){
  return `<h1>Gebieden</h1><p class="sub">Begin met één. De rest komt als je er ruimte voor hebt.</p>
  ${GEBIEDEN.map(g=>{ const G=S.gebieden[g]; return `<div class="gebiedkaart" data-open="${g}">
    <div class="mini ${G&&G.beeld?"":"leeg"}" style="${G&&G.beeld?beeldStijl(G.beeld):""}"></div>
    <div><b>${g}</b><div class="klein">${G&&G.zin?esc(G.zin):(S.naProef&&Object.keys(S.gebieden).some(x=>S.gebieden[x].zin)?"in de aankoop":"nog geen zin · niet nu is ook goed")}</div></div></div>`;}).join("")}`;
},
gebied(){
  const g = S.openGebied; const G = S.gebieden[g] || {};
  const bij = S.kaarten.filter(k=>k.gebied===g);
  return `<button class="link" data-ga="gebieden">‹ Gebieden</button>
  <div class="beeld" style="${G.beeld?beeldStijl(G.beeld):"background:var(--bg)"}"><span class="label">${G.beeld&&G.beeld.startsWith("data:")?"eigen foto":"beeld"}</span></div>
  <div class="tags">${BEELDEN.map((b,i)=>`<span class="tag" data-beeld="${i}">beeld ${i+1}</span>`).join("")}
    <label class="tag">eigen foto<input type="file" accept="image/*" id="foto" hidden></label></div>
  <h1>${g}</h1>
  <input type="text" id="gzin" value="${esc(G.zin||"")}" placeholder="${esc(VOORBEELD[g])}">
  <button class="knop rand" data-actie="bewaarZin" style="margin-top:10px;padding:11px">Bewaar zin</button>
  <h2 class="klein" style="font-size:14px">Draagt hieraan bij</h2>
  <div class="lijst">${bij.length?bij.map(k=>`<div>${esc(k.titel)}<span class="${past(k)?"groen":""}">${k.af?"gedaan":past(k)?"nu kan":k.wacht?"wacht":"later"}</span></div>`).join(""):`<div><span>Nog niets. Koppel een kaart vanuit "Nu kan".</span></div>`}</div>
  <p class="klein">De foto blijft op dit toestel.</p>`;
},
alles(){
  const groep = (titel, lijst) => lijst.length ? `<h2>${titel}</h2><div class="lijst">${lijst.map(k=>`<div>${esc(k.titel)}<span>${k.los?`<button class="link" data-terug="${k.id}">terughalen</button>`:k.af?"gedaan":k.wacht?"wacht op iemand":k.duur}</span></div>`).join("")}</div>` : "";
  const open = S.kaarten.filter(k=>!k.af && !k.los);
  return `<h1>Alles</h1><p class="sub">Hier staat alles, als je het wilt zien. Geen tellers, geen rood.</p>
  ${groep("Open", open)}${groep("Gedaan", S.kaarten.filter(k=>k.af))}${groep("Losgelaten", S.kaarten.filter(k=>k.los))}
  <div class="stil">Kaarten waar je 21 dagen niets mee doet, gaan vanzelf naar "losgelaten", zoals oude mail. Terughalen kan altijd.
  <br><button class="link" data-actie="week">Probeer: een week later terugkomen</button></div>
  <div class="stil"><button class="link" data-actie="export">Exporteer je kaarten als tekst</button> · altijd gratis
  <br><button class="link" data-actie="naproef">${S.naProef?"Terug naar de proef":"Probeer: na de proef van 14 dagen, zonder aankoop"}</button></div>`;
},
betaal(){
  return `<button class="link" data-ga="gebieden">‹ Gebieden</button><h1>Meer gebieden?</h1>
  <p class="sub">Je kaarten, één gebied en Nu kan blijven altijd gratis. Exporteren ook.</p>
  <div class="lijst"><div>Alle zes gebieden<span>✓</span></div><div>Visievragen bij ruimte<span>✓</span></div><div>Het kompas: hoe voelde dat?<span>✓</span></div></div>
  <p class="sub" style="margin-top:14px">Eén keer betalen, geen abonnement. Wat je koopt, blijft van jou. (Prototype: de prijs vragen we in het gesprek.)</p>
  <button class="knop" data-actie="koop">Koop, één keer</button><button class="knop rand" data-ga="gebieden">Niet nu</button>`;
}
};
function beeldStijl(b){ return b.startsWith("data:") ? `background-image:url(${b})` : `background:${BEELDEN[+b]}`; }
function kaartHtml(k){
  const G = k.gebied && S.gebieden[k.gebied];
  const zin = G && G.zin ? `<div class="visie"><b>${k.gebied}</b>${esc(G.zin)}</div>` : "";
  const koppel = Object.keys(S.gebieden).filter(g=>S.gebieden[g].zin);
  return `<div class="kaart"><div class="kop"><button class="vink" data-af="${k.id}" aria-label="gedaan"></button><div class="titel">${esc(k.titel)}</div><span class="klein">${k.duur}</span></div>${zin}
  <div class="acties"><button data-nietnu="${k.id}">Niet nu</button>${!k.gebied&&koppel.length?`<button class="groen" data-koppel="${k.id}">Draagt bij aan ${koppel[0]}</button>`:""}</div></div>`;
}

// ---------- acties ----------
function koppel(){
  document.querySelectorAll("[data-tijd]").forEach(e=>e.onclick=()=>{S.tijd=e.dataset.tijd;bewaar();teken();});
  document.querySelectorAll("[data-ruimte]").forEach(e=>e.onclick=()=>{S.ruimte=e.dataset.ruimte;bewaar();teken();});
  document.querySelectorAll("[data-ga]").forEach(e=>e.onclick=()=>ga(e.dataset.ga));
  document.querySelectorAll("[data-kies]").forEach(e=>e.onclick=()=>{S.kiesGebied=e.dataset.kies;teken();});
  document.querySelectorAll("[data-open]").forEach(e=>e.onclick=()=>{const g=e.dataset.open;const metZin=Object.keys(S.gebieden).filter(x=>S.gebieden[x].zin);
    if(S.naProef&&!(S.gebieden[g]&&S.gebieden[g].zin)&&metZin.length>=1){ga("betaal");return;}
    S.openGebied=g;ga("gebied");});
  document.querySelectorAll("[data-duur]").forEach(e=>e.onclick=()=>{const k=vind(e.dataset.duur);k.duur=DUUR[(DUUR.indexOf(k.duur)+1)%3];bewaar();teken();});
  document.querySelectorAll("[data-wacht]").forEach(e=>e.onclick=()=>{const k=vind(e.dataset.wacht);k.wacht=!k.wacht;bewaar();teken();});
  document.querySelectorAll("[data-energie]").forEach(e=>e.onclick=()=>{const k=vind(e.dataset.energie);k.energie=k.energie==="licht"?"zwaar":"licht";bewaar();teken();});
  document.querySelectorAll("[data-af]").forEach(e=>e.onclick=()=>{const k=vind(e.dataset.af);k.af=true;bewaar();if(S.ruimte==="ruim"&&!S.naProef)kompas(k);else teken();});
  document.querySelectorAll("[data-nietnu]").forEach(e=>e.onclick=()=>{vind(e.dataset.nietnu).nietnu=Date.now()+12*3600e3;bewaar();teken();});
  document.querySelectorAll("[data-koppel]").forEach(e=>e.onclick=()=>{vind(e.dataset.koppel).gebied=Object.keys(S.gebieden).find(g=>S.gebieden[g].zin);bewaar();teken();});
  document.querySelectorAll("[data-terug]").forEach(e=>e.onclick=()=>{const k=vind(e.dataset.terug);k.los=false;bewaar();teken();});
  document.querySelectorAll("[data-beeld]").forEach(e=>e.onclick=()=>{(S.gebieden[S.openGebied] ||= {}).beeld=e.dataset.beeld;bewaar();teken();});
  const foto=$("#foto"); if(foto) foto.onchange=()=>{const f=foto.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>verklein(r.result, d=>{(S.gebieden[S.openGebied] ||= {}).beeld=d;bewaar();teken();}); r.readAsDataURL(f);};
  const nw=$("#nieuw"); if(nw){ nw.onkeydown=e=>{if(e.key==="Enter")ACTIES.voegToe();}; }
  document.querySelectorAll("[data-actie]").forEach(e=>e.onclick=()=>ACTIES[e.dataset.actie]());
}
function vind(i){ return S.kaarten.find(k=>k.id===i); }
function verklein(src, klaar){ const im=new Image(); im.onload=()=>{const c=document.createElement("canvas");const w=600,h=Math.round(im.height*w/im.width);c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);klaar(c.toDataURL("image/jpeg",.7));}; im.src=src; }
const ACTIES = {
  naStart(){ if(!S.tijd) S.tijd="half uur"; if(!S.ruimte) S.ruimte="gaat wel";
    if(S.ruimte==="vol") return ga("ruimte");
    if(!S.kaarten.length) return ga("dump");
    if(S.ruimte==="ruim" && !Object.values(S.gebieden).some(g=>g.zin) && !S.gevraagd.gebied) return ga("kiesgebied");
    ga("nukan"); visievraag(); },
  naDump(){ if(S.ruimte==="ruim" && !Object.values(S.gebieden).some(g=>g.zin) && !S.gevraagd.gebied) return ga("kiesgebied"); ga("nukan"); },
  voegToe(){ const v=$("#nieuw").value.trim(); if(!v) return; v.split(/\n|;/).map(x=>x.trim()).filter(Boolean).forEach(t=>S.kaarten.push({id:id(),titel:t,duur:"kort",wacht:false,energie:"licht",gemaakt:Date.now()})); bewaar(); teken(); $("#nieuw").focus(); },
  voorbeelden(){ [["Marijn bellen","kort",false,"licht","Vrienden"],["Rondje wandelen","half uur",false,"licht","Lichaam"],["Offerte afmaken","half uur",false,"zwaar","Werk"],["Etentje met Sanne plannen","kort",true,"licht","Relatie"],["Belastingaangifte","lang",false,"zwaar",null],["Kaart voor Tom","kort",false,"licht",null]]
      .forEach(([t,d,w,e,g])=>S.kaarten.push({id:id(),titel:t,duur:d,wacht:w,energie:e,gebied:g,gemaakt:Date.now()})); bewaar(); teken(); },
  bewaarGebied(){ const g=S.kiesGebied||"Lichaam";
    if(S.naProef && !(S.gebieden[g]&&S.gebieden[g].zin) && Object.keys(S.gebieden).some(x=>x!==g&&S.gebieden[x].zin)){ ga("betaal"); return; } const z=$("#zin").value.trim()||VOORBEELD[g]; (S.gebieden[g] ||= {}).zin=z; S.gevraagd.gebied=true; bewaar(); ga("nukan"); },
  nietNuGebied(){ S.gevraagd.gebied=true; bewaar(); ga("nukan"); },
  bewaarZin(){ (S.gebieden[S.openGebied] ||= {}).zin=$("#gzin").value.trim(); bewaar(); teken(); },
  kleineKlus(){ S.tijd="5 min"; S.ruimte="vol"; bewaar(); ga(S.kaarten.length?"nukan":"dump"); },
  export(){ alert("Prototype: de export zou je kaarten en gebieden als tekst geven.\n\n"+S.kaarten.slice(0,4).map(k=>"- "+k.titel+(k.gebied?" ("+k.gebied+")":"")).join("\n")); },
  naproef(){ S.naProef=!S.naProef; bewaar(); teken(); },
  koop(){ if(confirm("Dit is een prototype. Er wordt niet betaald. Aankoop nabootsen?")){ S.naProef=false; bewaar(); ga("gebieden"); } },
  week(){ S.kaarten.forEach(k=>{ if(!k.af && !k.gebied && k.duur==="lang") k.los=true; k.nietnu=0; }); S.tijd=null; S.ruimte=null; bewaar(); ga("start"); },
  wis(){ if(confirm("Alles in dit proefje wissen?")){ try{localStorage.removeItem(SLEUTEL);}catch(e){} S=nieuw(); teken(); } }
};
function sheet(html){ $("#sheet").innerHTML=`<div class="sheet-bg"><div class="sheet"><div class="greep"></div>${html}</div></div>`; $("#sheet .sheet-bg").onclick=e=>{if(e.target.classList.contains("sheet-bg"))sluit();}; $("#sheet").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sluit(); if(b.dataset.s==="ja") ga("kiesgebied");}); }
function sluit(){ $("#sheet").innerHTML=""; teken(); }
function visievraag(){
  if(S.naProef) return;
  if(S.ruimte!=="ruim" || S.gevraagd.visie) return;
  const g = Object.keys(S.gebieden).find(x=>S.gebieden[x].zin) || "Lichaam";
  S.gevraagd.visie=true; S.kiesGebied=g; bewaar();
  sheet(`<p class="klein">Een vraag, omdat je ruimte hebt</p><h2 style="font-size:22px">${g}: wat wil je hier dit jaar echt?</h2><p class="sub">Eén zin is genoeg. Een karikatuur mag.</p>
    <button class="knop" data-s="ja">Antwoorden</button><button class="knop rand" data-s="nee">Goede vraag, maar niet nu</button><p class="klein">Niet nu kost niets. Geen herinnering.</p>`);
}
function kompas(k){
  sheet(`<p class="klein">Gedaan: ${esc(k.titel)}</p><h2 style="font-size:22px">Hoe voelde dat?</h2>
  <div class="rij" style="margin-top:14px"><div class="chip" data-s="x">goed</div><div class="chip" data-s="x">neutraal</div><div class="chip" data-s="x">moest</div></div>
  <button class="knop rand" data-s="x">Niet nu</button><p class="klein">Zo zie je later wat uit jezelf komt en wat uit "moeten".</p>`);
}
teken();
</script>
</body>
</html>
