<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Etmaal v2 · Doezel · prototype</title>
<style>
:root{
  --abrikoos:#F4A97C; --abrikoos-d:#E38A5A; --creme:#FFF4E6; --roze:#F7C6C0; --cacao:#5A3E36; --cacao-z:#6B4E45;
  --pruim:#1E1420; --pruim-z:#140D16; --amber:#C9733A; --amber-l:#E0A574; --geel:#FFC86B;
  --kop:"Poppins","Avenir Next","Segoe UI","Helvetica Neue",system-ui,sans-serif;
  --tekst:"Lato","Helvetica Neue","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#EDE3DA;font-family:var(--tekst);color:var(--cacao)}
body{min-height:100vh;display:flex;gap:32px;align-items:flex-start;justify-content:center;padding:28px 16px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
/* telefoon */
.telefoon{width:390px;height:844px;border-radius:52px;background:#000;padding:0;position:relative;box-shadow:0 30px 60px rgba(90,62,54,.25),0 0 0 10px #2B2024;flex:none}
.eiland{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:34px;border-radius:20px;background:#000;z-index:5;pointer-events:none}
#app{position:absolute;inset:0;border-radius:52px;overflow:hidden;display:flex;flex-direction:column}
.binnen{flex:1;overflow-y:auto;padding:0 24px 24px;display:flex;flex-direction:column}
.statusbalk{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 34px;font-family:var(--kop);font-weight:600;font-size:17px}
.geluidknop{width:44px;height:44px;border-radius:22px;border:0;background:rgba(90,62,54,.08);display:flex;align-items:center;justify-content:center;margin-right:2px}
.geluidknop svg{width:24px;height:24px}
.geluidknop.aan{background:var(--abrikoos)}
/* thema's */
.thema-dag{background:linear-gradient(180deg,#FFF7EE 0%,#FFF1E2 100%)}
.thema-avond{background:linear-gradient(180deg,#FFF1E2 0%,#F9DCC8 70%,#F4CDBB 100%)}
.thema-ochtend{background:linear-gradient(180deg,#FFD9A8 0%,#FFF7EC 65%)}
.thema-nacht{background:radial-gradient(120% 70% at 50% 34%,#3A2218 0%,var(--pruim) 55%,var(--pruim-z) 100%);color:var(--amber-l);font-size:22px}
.thema-nacht .geluidknop{background:rgba(201,115,58,.14)}
.thema-nacht .geluidknop.aan{background:rgba(201,115,58,.45)}
/* tekst */
h1{font-family:var(--kop);font-weight:600;font-size:30px;margin:8px 0 6px;letter-spacing:-.3px}
h2{font-family:var(--kop);font-weight:600;font-size:20px;margin:22px 0 8px}
p,li,label,.t{font-size:17px;line-height:1.45}
.klein{font-size:17px;color:var(--cacao-z)}
.waarom{font-size:17px;color:var(--cacao);margin:10px 4px}
.thema-nacht p,.thema-nacht li,.thema-nacht .waarom,.thema-nacht label{font-size:22px;color:var(--amber-l)}
.thema-nacht h1{font-size:28px;color:#E9B48A}
.thema-nacht h2{font-size:24px;color:#E9B48A}
.geheugen{font-style:italic;text-align:center;color:var(--cacao-z);font-size:17px;margin:8px 0}
/* doezel */
.doezelvak{display:flex;justify-content:center;margin:6px 0 0;border:0;background:none;padding:0}
.doezel{width:190px;height:auto;overflow:visible}
.doezel.groot{width:240px}
.doezel .adem{transform-box:view-box;transform-origin:50% 90%;animation:adem var(--adem,10s) ease-in-out infinite}
.doezel .beweeg{transform-box:view-box;transform-origin:50% 95%}
.doezel .ogen{transform-box:fill-box;transform-origin:50% 50%;animation:knipper 8s infinite}
.doezel .arm{transform-box:fill-box;transform-origin:0% 100%;animation:zwaai 1.8s ease-in-out 2}
@keyframes adem{0%{transform:scale(1,1)}40%{transform:scale(1.025,1.05)}100%{transform:scale(1,1)}}
@keyframes knipper{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes zwaai{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
/* Doezel-standen: ademtempo, beweging, oogleden en kleur. Geen meter, alleen Doezel zelf. */
.doezel.st-wakker{--adem:7s}
.doezel.st-energiek{--adem:5s}
.doezel.st-doezelig{--adem:12s}
.doezel.st-slapend{--adem:14s}
.doezel.st-halfwakker{--adem:10s}
.doezel.st-brak{--adem:14s}
.doezel.st-wakker .beweeg{animation:wieg 6s ease-in-out infinite}
.doezel.st-energiek .beweeg{animation:wieg 5s ease-in-out infinite}
.doezel.st-doezelig .beweeg{animation:knik 9s ease-in-out infinite}
.doezel.st-doezelig .ogen{animation:zwaar 9s ease-in-out infinite}
.doezel.st-doezelig .gaap{transform-box:fill-box;transform-origin:50% 20%;transform:scaleY(.18);animation:gaap 9s ease-in-out 1}
/* review 110: hooguit één gaap per avond */
.doezel.gegaapt .gaap{animation:none}
.doezel.st-slapend .ogen{animation:none}
.doezel.st-halfwakker .ogen{animation:knipper 12s infinite}
.doezel.st-slapend .gloed{opacity:.55}
@keyframes wieg{0%,100%{transform:rotate(0)}50%{transform:rotate(1.6deg)}}
@keyframes knik{0%,60%,100%{transform:rotate(0)}75%{transform:rotate(-3deg) translateY(2px)}}
@keyframes zwaar{0%,55%,100%{transform:scaleY(1)}68%,80%{transform:scaleY(.3)}}
@keyframes gaap{0%,55%,100%{transform:scaleY(.18)}68%,80%{transform:scaleY(1)}}
.chips.samen{justify-content:center;margin-top:12px}
/* besluit Pjotr 24-11 (1): Doezels hoekje, alleen overdag, naast Doezel. Geen teller, geen getal. */
.doezelrij{display:flex;justify-content:center;align-items:flex-end}
.hoekje{width:104px;height:auto;flex:none;margin-left:-14px}
/* besluit Pjotr 24-11 (2): toon Rustig. Geen gaap, geen wiegen, rustiger ademen, tekst 18 px. */
.toon-rustig .doezel .gaap{animation:none!important;transform:scaleY(.18)}
.toon-rustig .doezel .beweeg{animation:none!important}
.toon-rustig .doezel .adem{animation-duration:16s!important}
#app.toon-rustig:not(.thema-nacht) p,#app.toon-rustig:not(.thema-nacht) li,#app.toon-rustig:not(.thema-nacht) label,#app.toon-rustig:not(.thema-nacht) .link,#app.toon-rustig:not(.thema-nacht) .lees,#app.toon-rustig:not(.thema-nacht) .chip,#app.toon-rustig:not(.thema-nacht) summary,#app.toon-rustig:not(.thema-nacht) .kaart .label{font-size:18px}
/* review 112: in Rustig geen labels in hoofdletters */
#app.toon-rustig .kaart .label{letter-spacing:0}
@media (prefers-reduced-motion:reduce){.doezel .adem,.doezel .ogen,.doezel .arm,.doezel .beweeg,.doezel .gaap,.cirkel{animation:none!important}}
/* ballon en kaart */
.ballon{background:#FFFBF6;border-radius:28px;padding:18px 20px 12px;margin:14px 0 0;position:relative;box-shadow:0 8px 24px rgba(90,62,54,.08)}
.ballon:before{content:"";position:absolute;top:-9px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:#FFFBF6}
.ballon .zin{font-family:var(--kop);font-weight:500;font-size:21px;line-height:1.35;margin:0 0 6px}
.thema-nacht .ballon{background:none;box-shadow:none;text-align:center;padding:8px 0}
.thema-nacht .ballon:before{display:none}
.thema-nacht .ballon .zin{font-size:24px;color:#E9B48A;font-weight:400}
.lees{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0;min-height:44px;font-size:17px;color:var(--cacao)}
.lees i{width:34px;height:34px;border-radius:17px;background:var(--abrikoos);display:inline-flex;align-items:center;justify-content:center;font-style:normal}
.lees svg{width:18px;height:18px}
.thema-nacht .lees{color:var(--amber-l);font-size:22px}
.thema-nacht .klein,.thema-nacht .proto{font-size:22px;color:var(--amber-l)}
.thema-nacht .lees i{background:rgba(201,115,58,.35)}
.kaart{background:#FFFDF9;border:1.5px solid var(--abrikoos);border-radius:28px;padding:16px 20px;margin:14px 0 0}
.kaart.rustig{border-color:rgba(90,62,54,.12)}
.kaart .label{font-size:17px;letter-spacing:.8px;font-weight:700;color:var(--cacao);margin:0 0 4px}
.kaart .voorstel{font-family:var(--kop);font-size:20px;font-weight:500;line-height:1.35;margin:0}
.antwoord{font-family:var(--kop);font-size:18px;margin:10px 0 0;color:var(--cacao)}
/* knoppen */
.knoppen{margin-top:auto;padding-top:18px;display:flex;flex-direction:column;gap:10px}
.knop{min-height:60px;border-radius:30px;border:0;background:linear-gradient(180deg,#F7B78F,var(--abrikoos-d));font-family:var(--kop);font-weight:600;font-size:21px;color:#3E2A24;box-shadow:0 8px 18px rgba(227,138,90,.28),inset 0 2px 0 rgba(255,255,255,.35);width:100%;padding:0 20px;border:1.5px solid #A65A2E}
.knop.zon{background:linear-gradient(180deg,var(--geel),var(--abrikoos))}
.knop.twee{background:#FFFBF6;box-shadow:none;border:1.5px solid var(--cacao-z)}
.link{border:0;background:none;min-height:44px;font-size:17px;text-decoration:underline;text-underline-offset:3px;color:var(--cacao);padding:0 4px}
.linkrij{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px}
.thema-nacht .knop{background:rgba(201,115,58,.10);border:1.5px solid var(--amber);color:#E9B48A;box-shadow:none;font-weight:500;font-size:22px}
.thema-nacht .link{color:var(--amber-l);font-size:22px}
.nachtgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nachtgrid .knop{min-height:64px}
/* chips, schakelaar */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:2px solid var(--cacao-z);background:#FFFBF6;font-size:17px;color:var(--cacao)}
.chip.aan{background:var(--abrikoos);border-color:var(--abrikoos-d);color:#3E2A24;font-weight:700}
.thema-nacht .chip{background:none;border-color:var(--amber);color:#E9B48A;font-size:22px}
.thema-nacht .chip.aan{background:rgba(201,115,58,.35)}
.rij{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.schakel{width:72px;height:44px;border-radius:22px;border:2px solid var(--cacao-z);background:#EFE4DC;position:relative;flex:none}
.schakel:after{content:"";position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:16px;background:var(--cacao-z);transition:left .2s}
.schakel.aan{background:var(--cacao);border-color:var(--cacao)}
.schakel.aan:after{left:32px;background:#fff}
.tijdkiezer{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0 6px}
.tijdinvoer{font-family:var(--kop);font-weight:600;font-size:48px;min-height:64px;padding:4px 16px;border-radius:20px;border:2px solid var(--cacao-z);background:#FFFBF6;color:var(--cacao)}
.tijdinvoer.klein-tijd{font-size:32px;min-height:56px}
/* review 112: de morgen-kaart en de middagwekker op Welterusten (alleen overdag en 's avonds) */
.thema-nacht .kaart{background:rgba(201,115,58,.08);border-color:var(--amber)}
.thema-nacht .tijdinvoer{background:var(--pruim-z);color:#E9B48A;border-color:var(--amber)}
details{margin:12px 0}
summary{min-height:44px;display:flex;align-items:center;font-size:17px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.thema-nacht summary{font-size:22px}
ul.lijst,ol.lijst{padding-left:22px;margin:6px 0}
ul.lijst li,ol.lijst li{margin:4px 0}
.tel{font-weight:700;text-decoration:underline}
/* adem */
.ademvak{display:flex;flex-direction:column;align-items:center;margin:10px 0}
.cirkel{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(201,115,58,.45),rgba(201,115,58,.08) 70%);border:1.5px solid rgba(201,115,58,.5);display:flex;align-items:center;justify-content:center;animation:ademcirkel 10s ease-in-out infinite;font-family:var(--kop);font-size:26px;color:#E9B48A}
@keyframes ademcirkel{0%{transform:scale(.62)}40%{transform:scale(1)}100%{transform:scale(.62)}}
/* nav */
.nav{flex:none;display:flex;justify-content:space-around;padding:6px 10px 22px;background:rgba(255,251,246,.85);border-top:1px solid rgba(90,62,54,.08)}
.nav button{min-height:48px;min-width:64px;border:0;background:none;font-size:17px;font-weight:600;color:var(--cacao-z);border-radius:16px}
.nav button.actief{color:var(--cacao);background:rgba(244,169,124,.25)}
.toast{position:absolute;left:20px;right:20px;bottom:96px;background:var(--cacao);color:#FFF4E6;padding:14px 18px;border-radius:20px;font-size:17px;z-index:6}
.wekker-tijd{font-family:var(--kop);font-weight:500;font-size:84px;text-align:center;margin:10px 0 0;letter-spacing:-2px}
.proto{display:inline-block;font-size:17px;background:rgba(90,62,54,.08);border-radius:12px;padding:4px 10px;margin:4px 0}
.thema-nacht .proto{background:rgba(201,115,58,.12)}
.timer{font-family:var(--kop);font-size:64px;font-weight:500;text-align:center;margin:6px 0}
input[type=range]{width:100%;height:44px;accent-color:var(--abrikoos-d)}
/* nachtstand: helemaal zwart, en Doezel slapend zonder zin */
.thema-zwart{background:#000}
.zwartvlak{position:absolute;inset:0;border:0;background:#000;width:100%;height:100%;padding:0;display:flex;align-items:center;justify-content:center}
.slaapvlak{background:radial-gradient(120% 70% at 50% 40%,#2A1810 0%,var(--pruim) 55%,var(--pruim-z) 100%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.deal .knop{margin-top:12px}
/* review 110, S-2: gedachten parkeren */
.parkeervak{width:100%;min-height:160px;border-radius:20px;border:1.5px solid var(--amber);background:var(--pruim-z);color:var(--amber-l);font:inherit;font-size:22px;padding:14px 16px;margin:10px 0;resize:vertical}
/* demopaneel */
.demo{width:300px;background:#FFFBF6;border-radius:24px;padding:20px 22px;box-shadow:0 10px 30px rgba(90,62,54,.12);font-size:16px}
.demo h3{font-family:var(--kop);margin:0 0 4px;font-size:20px}
.demo .groep{margin:14px 0 0}
.demo .groep b{display:block;font-size:14px;letter-spacing:.6px;text-transform:uppercase;color:var(--cacao-z);margin-bottom:6px}
.demo .chip{min-height:40px;font-size:15px;padding:0 12px}
.demo select{width:100%;min-height:40px;font-size:15px;border-radius:12px;border:1.5px solid rgba(90,62,54,.25);background:#fff;padding:0 8px}
.demo .knop{min-height:46px;font-size:17px}
.demo p{font-size:14px;color:var(--cacao-z);margin:6px 0 0}
</style>
</head>

const ICON_GELUID_AAN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>`;
const ICON_GELUID_UIT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>`;
const ICON_LEES = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>`;
const knop = (act, tekst, cls, arg) => `<button class="knop ${cls || ""}" data-act="${act}"${arg != null ? ` data-arg="${esc(arg)}"` : ""}>${esc(tekst)}</button>`;

const chip = (act, tekst, aan, arg) => `<button class="chip${aan ? " aan" : ""}" aria-pressed="${aan ? "true" : "false"}" data-act="${act}"${arg != null ? ` data-arg="${esc(arg)}"` : ""}>${esc(tekst)}</button>`;
const schakel = (act, aan, label) => `<button class="schakel${aan ? " aan" : ""}" role="switch" aria-checked="${aan}" aria-label="${esc(label)}" data-act="${act}"></button>`;
const waarom = (s) => `<p class="waarom">${esc(s)}</p>`;
// review 112 (65): kaartlabels in hoofdletters, behalve in Rustig
const labelTekst = (s) => (S.toon === "rustig" ? s : s.toUpperCase());
const lees = (sleutel) => `<button class="lees" data-act="lees" data-arg="${sleutel}"><i>${ICON_LEES}</i>${esc(T.LEES_VOOR)}</button>`;
const ballon = (sleutel, tekst) => `<div class="ballon"><p class="zin">${esc(tekst || T[sleutel])}</p>${lees(sleutel)}</div>`;
const lijst = (arr, ol) => `<${ol ? "ol" : "ul"} class="lijst">${arr.map((x) => `<li>${esc(x)}</li>`).join("")}</${ol ? "ol" : "ul"}>`;
const p = (s, cls) => `<p${cls ? ` class="${cls}"` : ""}>${esc(s)}</p>`;
const ptel = (s, cls) => `<p${cls ? ` class="${cls}"` : ""}>${telLinks(s)}</p>`;
const doezelVak = (opt) => `<button class="doezelvak" data-act="doezelTik" aria-label="${esc(T.DOEZEL_ALT)}">${doezel(doezelStand(), Object.assign({ oog: S.nachtOog, zwaar: avondDoezel() >= 2, opgerold: isNacht() }, opt))}</button>`;
// besluit Pjotr 24-11 (1): het hoekje staat overdag naast Doezel, 's nachts niet
const doezelKnop = (opt) => (!isNacht() && S.hoekje > 0 ? `<div class="doezelrij">${doezelVak(opt)}${hoekjeSvg()}</div>` : doezelVak(opt));
const HOEKJE_DING = {
  KLEED: `<ellipse cx="58" cy="140" rx="54" ry="8" fill="#D9B8A6" opacity=".75"/>`,
  LAMPJE: `<circle cx="30" cy="62" r="24" fill="#FFC86B" opacity=".2"/><path d="M30 70 v62" stroke="#8A6555" stroke-width="2.6"/><ellipse cx="30" cy="133" rx="10" ry="3" fill="#8A6555"/><path d="M18 70 h24 l-5 -17 h-14z" fill="#F3D3A3"/>`,
  KUSSEN: `<ellipse cx="44" cy="132" rx="28" ry="11" fill="#E9A98A"/><path d="M20 130 q24 -10 48 0" stroke="#C98466" stroke-width="2" fill="none"/>`,
  PLANTJE: `<path d="M78 112 h18 l-3 22 h-12z" fill="#B9714A"/><path d="M87 112 C82 96 74 90 66 88 C78 88 86 96 87 108 C88 94 96 84 106 82 C100 90 92 98 88 112" fill="#7E9A6B"/>`,
  BOEKEN: `<rect x="92" y="130" width="24" height="7" rx="1.5" fill="#8E6A9A"/><rect x="94" y="123" width="20" height="7" rx="1.5" fill="#6F8FA6"/>`,

const HOEKJE_LAAG = ["KLEED", "LAMPJE", "KUSSEN", "PLANTJE", "BOEKEN", "MOK"];
function hoekjeSvg() {
  const er = HOEKJE.slice(0, Math.min(S.hoekje, HOEKJE.length));
  return `<svg class="hoekje" data-dingen="${er.join(" ").toLowerCase()}" viewBox="0 0 120 150" role="img" aria-label="${esc(T.HOEKJE_ALT)}">${HOEKJE_LAAG.filter((d) => er.includes(d)).map((d) => HOEKJE_DING[d]).join("")}</svg>`;

// overdag: minder melden (review 109). "Ik ben op" gebeurt vanzelf bij Stop; alleen zonder wekker staat er een kleine knop.
const samenDag = () => (S.op ? "" : `<div class="chips samen">${chip("ikBenOp", T.SAMEN_KNOP_OP, false)}</div>`);
// review 111: één tijdkiezer (input type=time) in plaats van stappen van 5 minuten
const invoerTijd = (m) => pad2(Math.floor(m / 60) % 24) + ":" + pad2(m % 60);
const uitInvoer = (v) => { const m = String(v || "").match(/^(\d{1,2}):(\d{2})/); return m ? (Number(m[1]) % 24) * 60 + Math.min(59, Number(m[2])) : null; };
const wektijdKiezer = (act, waarde, groot) => `<div class="tijdkiezer"${groot ? "" : ' style="margin:4px 0"'}>
        <input class="tijdinvoer${groot ? "" : " klein-tijd"}" type="time" step="60" data-input="tijd" data-act-tijd="${act}" value="${invoerTijd(waarde)}" aria-label="${esc(T.VANDAAG_WEKTIJD)}">
      </div>`;
// review 109 (voorstel, keuze Pjotr): na zeven avonden met een deal zegt Doezel het één keer. Geen teller in beeld.
// review 110: zonder getal en hooguit één keer per maand (30 dagen)
const ritmeNu = () => S.dealDagen >= 7 && (S.ritmeLaatst == null || S.dagNr - S.ritmeLaatst >= 30) && !S.deal && !S.reactie;
const ritmeZeg = () => { if (ritmeNu()) S.ritmeLaatst = S.dagNr; };
// review 110, S-5 [voorstel]: één keer een regel op Vandaag, op dag 13 en dag 15
const koopRegelNu = () => !S.gekocht && (S.proefdag === 13 || S.proefdag === 15) && !S.koopGezien[S.proefdag];
// review 110, S-1 en 65: Lees voor op Toilet en Hulp
const LEESTEKST = {
  TOILET_LEES: () => [T.TOILET_TITEL].concat(T.TOILET).concat(slaappilNu() ? [T.SLAAPPIL] : []).concat(plaspilNu() ? [T.PLASPIL] : []).join(" "),
  HULP_LEES: () => [T.N5_HULP, T.STOP112, T.NHULP_VAL, T.NHULP_DAG, T.N5_OPEN, T.N5_LIGGEN, T.NHULP_LANG].concat(slaappilNu() ? [T.SLAAPPIL] : []).concat(plaspilNu() ? [T.PLASPIL] : []).join(" ")
};
const dagZin = (standaard) => {
  if (S.reactie) return S.reactie;
  // besluit Pjotr 24-11 (1): Doezel noemt het nieuwe ding hooguit één keer, kort
  if (S.hoekjeNieuw && S.hoekje > 0 && !isNacht()) { S.hoekjeGetoond = true; return "HOEKJE_ZIN_" + HOEKJE[S.hoekje - 1]; }
  return doezelStand() === "brak" ? "SAMEN_BRAK" : doezelStand() === "energiek" ? "SAMEN_ENERGIEK" : standaard;
};

// review 112 (28): morgen anders de avond ervoor, gratis (besluit 3). Op Vanavond en Welterusten, alleen overdag en 's avonds.
// Eén tikbare regel; die opent een kleine kaart met de tijdkiezer, "Alleen morgen" en (als er een wekker gaat) "Geen wekker morgen".
function morgenRegel() {
  if (S.tijd === "nacht") return "";
  const gaat = wekkerMorgen();
  const regel = gaat
    ? `<p class="klein" data-morgenregel="1">${esc(T.AVOND_WEKKER.replace("[tijd]", kloktijd(wektijdMorgen())))} ${link("morgenKaart", T.WEK_MORGEN)}</p>`
    : `<p class="klein" data-morgenregel="1">${esc(T.MORGEN_GEEN)} ${link("morgenKaart", T.MORGEN_TOCH)}</p>`;
  const kaart = S.morgenKaart ? `<div class="kaart rustig" data-morgenkaart="1">${wektijdKiezer("morgenConcept", S.morgenConcept != null ? S.morgenConcept : wektijdMorgen())}${p(T.MORGEN_KAART_ZIN, "klein")}
      ${knop("morgenAlleen", T.MORGEN_ALLEEN)}${gaat ? `<div class="linkrij">${link("morgenGeen", T.MORGEN_GEENKNOP)}</div>` : ""}</div>` : "";
  return regel + kaart;
}
// review 112 (28): na de dienstlink een eenmalige wekker voor vanmiddag, gratis. Alleen overdag.
function middagBlok() {
  if (!S.dienst || S.tijd === "nacht") return "";
  if (S.middagTijd != null) return `<p class="klein" data-middag="1">${esc(T.RUST_MIDDAG_GEZET.replace("[tijd]", kloktijd(S.middagTijd)))} ${link("middagWeg", T.RUST_MIDDAG_WEG)}</p>`;
  return `<div class="linkrij" data-middag="1" style="justify-content:flex-start">${link("middagOpen", T.RUST_MIDDAG_LINK)}</div>` +
    (S.middagOpen ? `<div class="kaart rustig" data-middagkaart="1">${wektijdKiezer("middagConcept", S.middagConcept)}${p(T.RUST_MIDDAG_ZIN, "klein")}${knop("middagZet", T.RUST_MIDDAG_KNOP)}</div>` : "");
}
function gezBlok() {
  let h = `<p class="klein">${esc(T.GEZ_INLEIDING)}</p><p>${esc(T.GEZVRAAG)}</p>`;
  h += `<div class="chips">${chip("gez", T.GEZ_JA, S.gez === "ja", "ja")}${chip("gez", T.GEZ_NEE, S.gez === "nee", "nee")}${chip("gez", T.GEZ_OVERSLAAN, S.gez === "over", "over")}</div>`;
  if (S.gez === "ja") {
    h += `<p class="klein">${esc(T.GEZ_CHIPKOP)}</p><div class="chips">${T.GEZCHIPS.map((c) => chip("gezchip", c, !!S.chips[c], c)).join("")}</div>`;
    if (S.chips.slaappil) h += p(T.SLAAPPIL_MELA, "klein");
  }
  if (S.gez) h += p(T.GEZ_DANK, "klein");
  return h;
}
function wekdagChips() {
  const werk = S.dagen.join() === "true,true,true,true,true,false,false";
  const alle = S.dagen.every(Boolean);
  return `<div class="chips">${chip("weksnel", T.WEKSNEL[0], werk, "werk")}${chip("weksnel", T.WEKSNEL[1], alle, "alle")}</div>`;
}

/* ---------- render ---------- */
let laatsteHtml = "";
function shell(r) {
  if (r.zwart) return r.html; // helemaal zwart: geen statusbalk, geen knop in beeld
  const nacht = r.thema === "nacht";
  const klok = nacht ? "" : (S.scherm === "wekker" ? kloktijd(S.wekVandaag != null ? S.wekVandaag : S.wektijd) : { avond: "22.04", nacht: "", ochtend: "07.18", dag: "13.30" }[S.tijd]);
  const nav = r.nav ? `<nav class="nav">${[["nu", T.NAV_NU, "home"], ["vandaag", T.NAV_VANDAAG, "vandaag"], ["info", T.NAV_INFO, "info"], ["meer", T.NAV_MEER, "meer"]]
    .map(([k, t, doel]) => `<button class="${r.nav === k ? "actief" : ""}" data-act="${doel === "home" ? "home" : "naar"}" data-arg="${doel}">${esc(t)}</button>`).join("")}</nav>` : "";
  return `<div class="statusbalk"><span>${klok}</span>
    <button class="geluidknop${S.geluid ? " aan" : ""}" data-act="geluidWissel" aria-pressed="${S.geluid}" aria-label="${esc(S.geluid ? T.GELUID_AAN : T.GELUID_UITLABEL)}" title="${esc(S.geluid ? T.GELUID_AAN : T.GELUID_WEKKER)}">${S.geluid ? ICON_GELUID_AAN : ICON_GELUID_UIT}</button></div>
    <div class="binnen">${r.html}</div>${nav}${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ""}`;
}
function render() {
  const app = document.getElementById("app");
  const r = SCHERMEN[S.scherm]();
  laatsteHtml = shell(r);
  app.innerHTML = laatsteHtml;
  app.className = "thema-" + r.thema + (S.toon === "rustig" ? " toon-rustig" : "");
  const demo = document.getElementById("demo");
  if (demo) demo.innerHTML = demoHtml();
}
function toon(s) { S.toast = s; clearTimeout(timers.toast); timers.toast = setTimeout(() => { S.toast = null; render(); }, 3200); render(); }
function stopLopend() {
  clearTimeout(timers.adem); timers.adem = null; S.ademAan = false;
  clearInterval(timers.buiten); timers.buiten = null; S.buitenAan = false;
}
function go(scherm) {
  stopLopend();
  if (S.scherm === "wekker" && scherm !== "wekker") wekStop();
  if (scherm !== "geluid" && !NACHTSCHERMEN.includes(scherm)) klankStop(false);
  if (scherm === "buiten") { S.buitenSec = 300; S.buitenKlaar = false; }
  if (scherm === "nacht") S.nachtOog = false;
  // de regel over de aankoop staat er één keer (review 110, S-5)
  if (S.scherm === "vandaag" && scherm !== "vandaag" && koopRegelNu()) S.koopGezien[S.proefdag] = true;
  // Welterusten: eerst 10 s doezelig, dan slaapt Doezel (review 110)
  if (scherm === "welterusten" && S.scherm !== "welterusten") { S.rustSlaapt = false; clearTimeout(timers.rust); timers.rust = setTimeout(() => act("rustSlaap"), RUST_SLAAP_MS); }
  S.reactie = null; S.parkeerNet = false; S.gezNet = false;
  if (scherm !== S.scherm) { S.morgenKaart = false; S.middagOpen = false; }
  if (S.hoekjeGetoond) { S.hoekjeNieuw = false; S.hoekjeGetoond = false; }
  S.scherm = scherm; render();
}
function ademStap() {
  S.ademFase = S.ademFase === "in" ? "uit" : "in";
  ademToon(S.ademFase);
  const c = document.getElementById("cirkel");
  if (c) c.textContent = S.ademFase === "in" ? T.ADEM_IN : T.ADEM_UIT;
  timers.adem = setTimeout(ademStap, S.ademFase === "in" ? 4000 : 6000);
}

/* ---------- acties ---------- */
const ACTS = {
  beginnen: () => go("wektijd"),
  nachtNu: () => { S.eerste = false; S.nachtFase = "wakker"; S.viaRust = false; go("nacht"); },
  // review 109, R-1: nachtstand na Welterusten. Doezel slaapt, na 20 s zwart. Een tik maakt hem half wakker.
  nachtAan: () => { S.nachtFase = "slaapt"; S.viaRust = true; S.rustSlaapt = true; go("nacht"); nachtTimer(NACHT_ZWART_MS); },
  // review 110, S-1: na een tik terug naar Hulp (of Gedachten parkeren) als je daar was
  nachtTik: () => {
    S.nachtFase = "wakker"; S.nachtOog = false;
    const terug = S.voorZwart; S.voorZwart = null;
    if (terug === "nachthulp" || terug === "parkeer" || terug === "toilet") go(terug); else render();
  },
  nachtStil: () => {
    if (!NACHT_STIL_SCHERMEN.includes(S.scherm)) return;
    if (S.ademAan) { nachtTimer(NACHT_STIL_MS); return; }
    S.voorZwart = S.scherm; S.nachtFase = "zwart"; S.nachtOog = false; go("nacht");
  },
  rustSlaap: () => { if (S.scherm === "welterusten") { S.rustSlaapt = true; render(); } },
  netThuis: () => go("welterusten"),
  dienstSlapen: () => { S.dienst = true; S.nachtVraag = false; go("welterusten"); },
  diensten: () => { S.diensten = !S.diensten; render(); },
  // het veld wordt weer leeg; wat je neerlegde, zie je pas overdag op Vandaag
  parkeerKlaar: () => {
    const t = (S.parkeerTekst || "").trim();
    S.geparkeerd = S.geparkeerd && t ? S.geparkeerd + " / " + t : S.geparkeerd || t;
    S.parkeerTekst = ""; S.parkeerNet = true; render();
  },
  parkeerWeg: () => { S.geparkeerd = null; S.parkeerTekst = ""; render(); },
  // review 110, S-7: één tik na Stop
  // besluit Pjotr 24-11 (7): Overslaan geeft geen reactie en verandert Doezel niet
  nachtAntw: (a) => {
    S.nachtVraag = false;
    if (a === "slecht") { S.brak = true; S.ochtendInfo = "slecht"; slechtTel(); S.reactie = "SAMEN_BRAK"; }
    else if (a === "over") { if (S.reactie === "OCHTEND_HOEWAS") S.reactie = null; }
    else S.reactie = S.op ? "SAMEN_OP" : null;
    render();
  },
  toon: (a) => { S.toon = a === "rustig" ? "rustig" : "gewoon"; render(); },
  // review 110, S-5: na de proef blijft buiten gratis als één tik, en Doezel wordt energiek
  buitenGeweest: () => { S.op = true; S.buiten = true; S.goedeDag = true; S.reactie = S.onthoudBuiten ? "SAMEN_ENERGIEK" : "SAMEN_ONTHOUD_BUITEN"; S.onthoudBuiten = true; render(); },
  morgenAnders: () => { S.morgenOpen = !S.morgenOpen; if (S.morgenTijd == null) S.morgenTijd = S.wektijd; if (S.morgenOpen) { S.morgenExtra = true; S.morgenGeen = false; } render(); }, // review 112b: ook op een dag zonder wekker gaat hij dan
  // review 111: de tijd komt uit de tijdkiezer ("HH:MM")
  morgenTijd: (a) => { const m = uitInvoer(a); if (m != null) { S.morgenTijd = m; S.morgenExtra = true; S.morgenGeen = false; } render(); },
  // review 112 (28): de regel van morgen opent de kaart; "Alleen morgen" zet een eenmalige tijd (ook als er morgen geen wekker ging)
  morgenKaart: () => { if (S.tijd === "nacht") return; S.morgenKaart = !S.morgenKaart; S.morgenConcept = wektijdMorgen(); render(); },
  morgenConcept: (a) => { const m = uitInvoer(a); if (m != null) S.morgenConcept = m; render(); },
  morgenAlleen: () => { S.morgenTijd = S.morgenConcept != null ? S.morgenConcept : wektijdMorgen(); S.morgenExtra = true; S.morgenGeen = false; S.voUit = false; S.morgenKaart = false; render(); },
  morgenGeen: () => { S.morgenGeen = true; S.morgenExtra = false; S.morgenKaart = false; render(); },
  // review 112 (28): na de dienstlink een eenmalige wekker voor vanmiddag
  middagOpen: () => { if (S.tijd === "nacht" || !S.dienst) return; S.middagOpen = !S.middagOpen; render(); },
  middagConcept: (a) => { const m = uitInvoer(a); if (m != null) S.middagConcept = m; render(); },
  middagZet: () => { S.middagTijd = S.middagConcept; S.middagOpen = false; render(); },
  middagWeg: () => { S.middagTijd = null; render(); },
  welkomToon: () => { S.toon = S.toon === "rustig" ? "gewoon" : "rustig"; render(); },
  avondSein: () => { S.avondSein = !S.avondSein; render(); },
  welkomHulp: () => go(S.tijd === "nacht" ? "nachthulp" : "hulpdag"),
  wektijd: (a) => { const m = uitInvoer(a); if (m != null) S.wektijd = m; render(); },
  wekker: () => { S.wekker = !S.wekker; render(); },
  weksnel: (a) => { S.dagen = a === "werk" ? [true, true, true, true, true, false, false] : [true, true, true, true, true, true, true]; render(); },
  dag: (a) => { S.dagen[Number(a)] = !S.dagen[Number(a)]; render(); },
  gez: (a) => { S.gez = a; S.gezNet = a === "ja"; if (a !== "ja") S.chips = {}; render(); },
  gezchip: (a) => { S.chips[a] = !S.chips[a]; render(); },
  klaar: () => { S.eerste = false; go(homeScherm()); },
  home: () => go(homeScherm()),
  naar: (a) => go(a),
  naarInfo: (a) => { go("info"); const el = document.getElementById(a); if (el && el.scrollIntoView) el.scrollIntoView(); },
  // de deal is zelf de dim- of scherm-actie (review 109, R-6)
  deal: () => {
    ritmeZeg();
    S.deal = "ja"; S.goedeDag = true;
    const dk = dealNu();
    if (dk === "LADER") { S.schermWeg = true; S.reactie = "SAMEN_SCHERM"; }
    else if (dk === "DIM") { S.gedimd = true; S.reactie = "SAMEN_DIM"; }
    else S.reactie = "SAMEN_PLAN";
    dealTik(); render();
  },
  // review 111: pas na de tweede tik "Opgeschreven." of "Warm gedoucht."
  dealGedaan: () => { const dk = dealNu(); if (S.deal !== "ja" || !dealTweeTik(dk)) return; S.dealGedaan = true; S.reactie = dk === "SCHRIJF" ? "SAMEN_SCHRIJF" : "SAMEN_DOUCHE"; render(); },
  // overslaan: Doezel blijft gewoon zichzelf, met een begripvolle zin
  dealNiet: () => { ritmeZeg(); S.deal = "nee"; render(); },
  ikBenOp: () => { S.op = true; S.reactie = S.brak ? "SAMEN_OP_BRAK" : "SAMEN_OP"; render(); },
  laterBuiten: () => { go("vandaag"); S.reactie = "SAMEN_LATER"; render(); },
  wekOp: () => { wekStop(); S.snoozes = 0; S.gesnoozed = false; S.op = true; S.nachtVraag = true; go("goedemorgen"); S.reactie = "OCHTEND_HOEWAS"; render(); },
  naarBed: () => { ritmeZeg(); go("welterusten"); },
  doezelTik: () => { if (S.scherm === "nacht") { S.nachtOog = !S.nachtOog; render(); } },
  ademStart: () => { S.ademAan = true; S.ademFase = "in"; render(); ademToon("in"); timers.adem = setTimeout(ademStap, 4000); },
  ademStop: () => { stopLopend(); render(); },
  eb: (a) => { S.eb = a; render(); },
  // review 110 (28): een tik op Regen of Haard zet het geluid ook aan
  klank: (a) => { if (!S.geluid) { S.geluid = true; audioStart(); } klankStart(a); render(); },
  klankStop: () => klankStop(true),
  voJa: () => { S.voUit = true; go("nacht"); },
  voTerug: () => { S.voUit = false; render(); },
  // "Ik ben op" gebeurt vanzelf bij Stop (review 109)
  // review 110, S-7: na Stop eerst "Goedemorgen. Hoe was je nacht?"
  wekStop: () => { wekStop(); S.snoozes = 0; S.gesnoozed = false; S.op = true; S.nachtVraag = true; go("goedemorgen"); S.reactie = "OCHTEND_HOEWAS"; render(); },
  snooze: () => { S.snoozes++; S.gesnoozed = true; wekStop(); render(); },
  wekWeer: () => { S.gesnoozed = false; render(); wekStart(false); },
  // brak gaat weer weg als je "Slecht geslapen?" sluit (review 109, bug hersteld)
  ochtendInfo: (a) => {
    const was = S.ochtendInfo;
    S.ochtendInfo = was === a ? null : a;
    if (S.ochtendInfo === "slecht") { S.brak = true; S.nachtVraag = false; slechtTel(); S.reactie = "SAMEN_BRAK"; }
    else if (was === "slecht") { S.brak = false; S.reactie = null; }
    render();
  },
  buitenStart: () => {
    S.buitenAan = true; render();
    timers.buiten = setInterval(() => { S.buitenSec = Math.max(0, S.buitenSec - 1); if (S.buitenSec === 0) { ACTS.buitenKlaar(); return; } render(); }, 1000);
  },
  buitenKlaar: () => { stopLopend(); S.buitenKlaar = true; S.buiten = true; S.goedeDag = true; if (!S.onthoudBuiten) { S.onthoudBuiten = true; S.reactie = "SAMEN_ONTHOUD_BUITEN"; } render(); },
  tweeSnooze: () => { S.tweeSnooze = !S.tweeSnooze; render(); },
  wekGeluid: (a) => { S.wekGeluid = a; render(); },
  wekTest: () => { if (!S.geluid) { S.geluid = true; audioStart(); } wekStart(true); render(); },
  stem: () => { S.stem = !S.stem; render(); },
  koop: () => { S.gekocht = true; render(); },
  lees: (sleutel) => { if (!S.geluid) { S.geluid = true; audioStart(); render(); } spreek(LEESTEKST[sleutel] ? LEESTEKST[sleutel]() : T[sleutel] || sleutel); },
  geluidWissel: () => {
    S.geluid = !S.geluid;
    if (S.geluid) audioStart();
    // de wekker blijft gewoon afgaan; de knop dempt alleen Doezel en de geluiden
    else { klankStop(false); if (window.speechSynthesis) window.speechSynthesis.cancel(); toon(T.GELUID_WEKKER); return; }
    render();
  },
  // demopaneel
  demoTijd: (a) => { if (a === "ochtend") nieuweDag(); if (a === "avond") nieuweAvond(); S.tijd = a; S.deal = null; S.ochtendInfo = null; S.gesnoozed = false; S.nachtFase = "wakker"; S.viaRust = false; go(homeScherm()); },
  demoAvond: (a) => { if (a === "gisteren") S.gisterenDeal = !S.gisterenDeal; else { S.dealDagen = S.dealDagen >= 7 ? 0 : 7; S.ritmeLaatst = null; } render(); },
  demoDiensten: () => { S.diensten = !S.diensten; render(); },
  demoWekker: () => { nieuweDag(); S.tijd = "ochtend"; S.eerste = false; S.snoozes = 0; S.gesnoozed = false; go("wekker"); wekStart(false); },
  demoNieuweDag: () => { nieuweDag(); nieuweAvond(); go(homeScherm()); },
  // Doezel bekijken: zet het moment zoals het in de app ontstaat, en speelt zijn geluid
  demoStand: (a) => {
    stopLopend(); S.eerste = false; S.gesnoozed = false;
    if (a === "doezelig") { S.tijd = "avond"; nieuweAvond(); S.deal = "ja"; S.gedimd = true; go("vanavond"); S.reactie = "SAMEN_DIM"; }
    else if (a === "slapend") { S.tijd = "avond"; go("welterusten"); S.rustSlaapt = true; }
    else if (a === "halfwakker") { S.tijd = "nacht"; S.nachtFase = "wakker"; go("nacht"); }
    else {
      S.tijd = "ochtend"; nieuweDag(); S.nachtVraag = false; go("goedemorgen");
      if (a === "wakker") { S.op = true; S.reactie = "SAMEN_OP"; }
      if (a === "energiek") { S.op = true; S.buiten = true; S.reactie = "SAMEN_ENERGIEK"; }
      if (a === "brak") { S.brak = true; S.ochtendInfo = "slecht"; S.reactie = "SAMEN_BRAK"; }
    }
    render();
  },
  // besluit Pjotr 24-11 (1): het hoekje een stap verder, of terug naar het begin (alleen in de demo)
  demoHoekje: (a) => {
    if (a === "begin") { S.hoekje = 0; S.hoekjeTel = 0; S.hoekjeNieuw = false; S.hoekjeGetoond = false; }
    else if (S.hoekje < HOEKJE.length) { S.hoekje++; S.hoekjeTel = 0; S.hoekjeNieuw = true; }
    render();
  },
  demoToon: () => { S.toon = S.toon === "rustig" ? "gewoon" : "rustig"; render(); },
  demoProef: (a) => { if (a === "koop") S.gekocht = !S.gekocht; else S.proefdag = Number(a); render(); },
  demoGez: (a) => { S.gez = a === "open" ? null : a === "plas" ? "ja" : a; S.chips = a === "ja" ? { slaappil: true } : a === "plas" ? { "plaspil of bloeddruk": true } : {}; render(); },
  demoOpnieuw: () => { stopLopend(); klankStop(false); wekStop(); const g = S.geluid; S = BEGIN(); S.geluid = g; render(); },
  demoSpring: (a) => { if (SCHERMEN[a]) { S.eerste = a === "welkom" || a === "wektijd" ? S.eerste : false; go(a); } }
};
// Doezel laat zich horen als zijn stand verandert, of als je iets met hem samen doet.
const SAMEN_ACTS = ["deal", "ikBenOp", "buitenKlaar", "wekOp", "wekStop", "doezelTik", "nachtTik", "demoStand"];
function nachtTimer(ms) { clearTimeout(timers.nacht); timers.nacht = setTimeout(() => act("nachtStil"), ms); }
function act(naam, arg) {
  if (!ACTS[naam]) return;
  const voor = doezelStand();
  ACTS[naam](arg);
  const na = doezelStand();
  // zwart worden is stil: geen zuchtje als het scherm uitgaat
  // hooguit één gaap per avond (review 110)
  const alGegaapt = na === "doezelig" && S.gaapGedaan;
  if (!alGegaapt && naam !== "nachtStil" && (voor !== na || SAMEN_ACTS.includes(naam))) standGeluid(na);
  if (na === "doezelig") S.gaapGedaan = true;
  // 's nachts: na 60 s zonder tik weer zwart (review 109, R-1)
  if (NACHT_STIL_SCHERMEN.includes(S.scherm)) { if (S.nachtFase === "wakker" && naam !== "nachtStil") nachtTimer(NACHT_STIL_MS); }
  else { clearTimeout(timers.nacht); timers.nacht = null; }
}

function demoHtml() {
  const c = (a, t, aan, arg) => chip(a, t, aan, arg);
  return `<h3>${esc(D.TITEL)}</h3><p>${esc(D.UITLEG)}</p>
  <div class="groep"><b>${esc(D.TIJD)}</b><div class="chips">${Object.keys(D.TIJDEN).map((k) => c("demoTijd", D.TIJDEN[k], S.tijd === k, k)).join("")}</div></div>
  <div class="groep">${knop("demoWekker", D.WEKKER, "zon")}</div>
  <div class="groep"><b>${esc(D.PROEF)}</b><div class="chips">${c("demoProef", D.DAG1, S.proefdag === 1, 1)}${c("demoProef", D.DAG13, S.proefdag === 13, 13)}${c("demoProef", D.DAG15, S.proefdag === 15, 15)}${c("demoProef", D.GEKOCHT, S.gekocht, "koop")}</div></div>
  <div class="groep"><b>${esc(D.AVOND)}</b><div class="chips">${c("demoAvond", D.GISTEREN, S.gisterenDeal, "gisteren")}${c("demoAvond", D.RITME, S.dealDagen >= 7, "ritme")}</div></div>
  <div class="groep"><b>${esc(D.GEZ)}</b><div class="chips">${c("demoGez", D.GEZJA, S.gez === "ja" && !!S.chips.slaappil, "ja")}${c("demoGez", D.GEZPLAS, S.gez === "ja" && !!S.chips["plaspil of bloeddruk"], "plas")}${c("demoGez", D.GEZNEE, S.gez === "nee", "nee")}${c("demoGez", D.GEZOPEN, S.gez === null, "open")}</div></div>
  <div class="groep"><b>${esc(D.HOEKJE)}</b><div class="chips">${c("demoHoekje", D.HOEKJE_VERDER, false, "verder")}${c("demoHoekje", D.HOEKJE_BEGIN, false, "begin")}</div></div>
  <div class="groep"><b>${esc(D.TOON)}</b><div class="chips">${c("demoToon", D.TOON_RUSTIG, S.toon === "rustig")}</div></div>
  <div class="groep"><b>${esc(D.DIENSTEN)}</b><div class="chips">${c("demoDiensten", D.DIENSTENJA, S.diensten)}</div></div>
  <div class="groep"><b>${esc(D.SPRING)}</b><select data-input="spring">${Object.keys(SCHERMEN).map((k) => `<option value="${k}"${S.scherm === k ? " selected" : ""}>${k}</option>`).join("")}</select></div>
  <div class="groep"><b>${esc(D.STANDEN)}</b><div class="chips">${STANDEN.map((k) => c("demoStand", D.STAND[k], doezelStand() === k, k)).join("")}</div><p>${esc(D.STANDEN_UITLEG)}</p></div>
  <div class="groep">${knop("demoNieuweDag", D.NIEUWEDAG, "twee")}</div>
  <div class="groep">${knop("demoOpnieuw", D.OPNIEUW, "twee")}</div>`;
}

/* ---------- start ---------- */
document.addEventListener("click", (e) => {
  const el = e.target && e.target.closest ? e.target.closest("[data-act]") : null;
  if (!el) return;
  e.preventDefault();
  act(el.getAttribute("data-act"), el.getAttribute("data-arg"));
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el && el.getAttribute && el.getAttribute("data-input") === "spring") act("demoSpring", el.value);
  if (el && el.getAttribute && el.getAttribute("data-input") === "tijd") act(el.getAttribute("data-act-tijd"), el.value);
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el && el.getAttribute && el.getAttribute("data-input") === "volume") S.volume = Number(el.value);
  if (el && el.getAttribute && el.getAttribute("data-input") === "parkeer") S.parkeerTekst = String(el.value || "");
});
if (window.speechSynthesis && window.speechSynthesis.getVoices) window.speechSynthesis.getVoices();
render();
window.Etmaal = { T, T_BASIS, HOEKJE, HOEKJE_DAGEN, D, SCHERMEN, NACHTSCHERMEN, NACHT_STIL_SCHERMEN, STANDEN, NACHT_ZWART_MS, NACHT_STIL_MS, RUST_SLAAP_MS, DEALS, doezelStand, act, go, render, html: () => laatsteHtml, toestand: () => S, zet: (o) => Object.assign(S, o) };
</script>
</body>
</html>
