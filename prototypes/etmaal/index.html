<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Etmaal v2 · Doezel · prototype</title>
<style>
:root{
  --abrikoos:#F4A97C; --abrikoos-d:#E38A5A; --creme:#FFF4E6; --roze:#F7C6C0; --cacao:#5A3E36; --cacao-z:#6B4E45;
  --pruim:#1E1420; --pruim-z:#140D16; --amber:#C9733A; --amber-l:#E0A574; --geel:#FFC86B;
  --kop:"Poppins","Avenir Next","Segoe UI","Helvetica Neue",system-ui,sans-serif;
  --tekst:"Lato","Helvetica Neue","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#EDE3DA;font-family:var(--tekst);color:var(--cacao)}
body{min-height:100vh;display:flex;gap:32px;align-items:flex-start;justify-content:center;padding:28px 16px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
/* telefoon */
.telefoon{width:390px;height:844px;border-radius:52px;background:#000;padding:0;position:relative;box-shadow:0 30px 60px rgba(90,62,54,.25),0 0 0 10px #2B2024;flex:none}
.eiland{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:34px;border-radius:20px;background:#000;z-index:5;pointer-events:none}
#app{position:absolute;inset:0;border-radius:52px;overflow:hidden;display:flex;flex-direction:column}
.binnen{flex:1;overflow-y:auto;padding:0 24px 24px;display:flex;flex-direction:column}
/* review 113, B1: een vast skelet. render() vervangt alleen kop, boven, onder en voet; Doezel (#doezelvast) blijft staan */
#kop,#voet{flex:none}
.deel{display:contents}
.verborgen{display:none!important}
.statusbalk{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 34px;font-family:var(--kop);font-weight:600;font-size:17px}
/* review 114, U2: de geluidknop is alleen een icoon van 44 px, rechts in de titelrij (geen eigen rij meer).
   Het label staat in aria-label; bij een tik komt kort een melding (2 s). */
.geluidknop{position:absolute;top:58px;right:16px;z-index:4;width:44px;height:44px;border-radius:22px;border:1.5px solid var(--cacao-z);background:#FFFBF6;display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--cacao)}
.geluidknop svg{width:24px;height:24px;flex:none}
.geluidknop.aan{background:var(--abrikoos);border-color:#A65A2E;color:#3E2A24}
.binnen h1{padding-right:52px}
/* thema's */
.thema-dag{background:linear-gradient(180deg,#FFF7EE 0%,#FFF1E2 100%);--bodem:#FFF1E2}
.thema-avond{background:linear-gradient(180deg,#FFF1E2 0%,#F9DCC8 70%,#F4CDBB 100%);--bodem:#F4CDBB}
.thema-ochtend{background:linear-gradient(180deg,#FFD9A8 0%,#FFF7EC 65%);--bodem:#FFF7EC}
.thema-nacht{background:radial-gradient(120% 70% at 50% 34%,#3A2218 0%,var(--pruim) 55%,var(--pruim-z) 100%);color:var(--amber-l);font-size:22px;--bodem:#170F19}
.thema-nacht .geluidknop{background:rgba(201,115,58,.14);border-color:var(--amber);color:#E9B48A}
.thema-nacht .geluidknop.aan{background:rgba(201,115,58,.45)}
/* tekst */
h1{font-family:var(--kop);font-weight:600;font-size:30px;margin:8px 0 6px;letter-spacing:-.3px}
h2{font-family:var(--kop);font-weight:600;font-size:20px;margin:22px 0 8px}
p,li,label,.t{font-size:17px;line-height:1.45}
.klein{font-size:17px;color:var(--cacao-z)}
.waarom{font-size:17px;color:var(--cacao);margin:10px 4px}
.thema-nacht p,.thema-nacht li,.thema-nacht .waarom,.thema-nacht label{font-size:22px;color:var(--amber-l)}
.thema-nacht h1{font-size:28px;color:#E9B48A}
.thema-nacht h2{font-size:24px;color:#E9B48A}
.geheugen{font-style:italic;text-align:center;color:var(--cacao-z);font-size:17px;margin:8px 0}
/* doezel */
.doezelvak{display:flex;justify-content:center;margin:6px 0 0;border:0;background:none;padding:0}
/* review 113, B1: overdag is Doezel 150 px breed (was 190) */
.doezel{width:150px;height:auto;overflow:visible}
.doezel.groot{width:240px}
#doezelvast.ademtrek{margin-top:-30px}
.doezel .adem{transform-box:view-box;transform-origin:50% 90%;animation:adem var(--adem,10s) ease-in-out infinite}
.doezel .beweeg{transform-box:view-box;transform-origin:50% 95%}
.doezel .ogen{transform-box:fill-box;transform-origin:50% 50%;animation:knipper 8s infinite}
.doezel .arm{transform-box:fill-box;transform-origin:0% 100%;animation:zwaai 1.8s ease-in-out 2}
@keyframes adem{0%{transform:scale(1,1)}40%{transform:scale(1.025,1.05)}100%{transform:scale(1,1)}}
@keyframes knipper{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes zwaai{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
/* Doezel-standen: ademtempo, beweging, oogleden en kleur. Geen meter, alleen Doezel zelf. */
.doezel.st-wakker{--adem:7s}
.doezel.st-energiek{--adem:5s}
.doezel.st-doezelig{--adem:12s}
.doezel.st-slapend{--adem:14s}
.doezel.st-halfwakker{--adem:10s}
.doezel.st-brak{--adem:14s}
.doezel.st-wakker .beweeg{animation:wieg 6s ease-in-out infinite}
.doezel.st-energiek .beweeg{animation:wieg 5s ease-in-out infinite}
.doezel.st-doezelig .beweeg{animation:knik 9s ease-in-out infinite}
.doezel.st-doezelig .ogen{animation:zwaar 9s ease-in-out infinite}
.doezel.st-doezelig .gaap{transform-box:fill-box;transform-origin:50% 20%;transform:scaleY(.18);animation:gaap 9s ease-in-out 1}
/* review 110: hooguit één gaap per avond */
.doezel.gegaapt .gaap{animation:none}
.doezel.st-slapend .ogen{animation:none}
.doezel.st-halfwakker .ogen{animation:knipper 12s infinite}
.doezel.st-slapend .gloed{opacity:.55}
@keyframes wieg{0%,100%{transform:rotate(0)}50%{transform:rotate(1.6deg)}}
@keyframes knik{0%,60%,100%{transform:rotate(0)}75%{transform:rotate(-3deg) translateY(2px)}}
@keyframes zwaar{0%,55%,100%{transform:scaleY(1)}68%,80%{transform:scaleY(.3)}}
@keyframes gaap{0%,55%,100%{transform:scaleY(.18)}68%,80%{transform:scaleY(1)}}
/* review 113, B1: elke stand heeft eigen ogen en een eigen mond. Alles staat in hetzelfde SVG-element; alleen de klasse wisselt, met 600 ms overgang.
   review 114, U1: Doezel blijft overal dezelfde tint (abrikoos). De standen verschillen in helderheid, gloed, oogvorm en ademtempo:
   energiek helderder (#F6B48A) met een warme gloed, doezelig gedempter, brak lichtgrijs-abrikoos, slapend ('s nachts) donkerder.
   Het lijf heeft een rand van 2 px in cacao, zodat hij op elk verloop minstens 3 : 1 haalt (op 30 % haalde de rand dat niet; het is 60 %). */
.doezel .lijf{transition:fill .6s ease}
.doezel .buik,.doezel .glans,.doezel .gloed,.doezel .dgloed{transition:opacity .6s ease}
.doezel .vorm{opacity:0;transition:opacity .6s ease}
.doezel.dag .lijf{stroke:#5A3E36;stroke-opacity:.6;stroke-width:2}
.doezel.dag .lijf{fill:#EFA67C}
.doezel.dag.st-rustig .lijf{fill:#EFA67C}
.doezel.dag.st-wakker .lijf{fill:#F4AD80}
.doezel.dag.st-energiek .lijf{fill:#F6B48A}
.doezel.dag.st-doezelig .lijf{fill:#DDA287}
.doezel.dag.st-brak .lijf{fill:#D9B3A3}
.doezel.dag .dgloed{opacity:0}
.doezel.dag.st-wakker .dgloed{opacity:.35}
.doezel.dag.st-energiek .dgloed{opacity:.9}
/* review 114, U1: bij een standwissel een klein pufje en ogen die opengaan (geen fade alleen) */
.doezelvak{position:relative;z-index:1}
.doezelvak.pufje svg.doezel.dag{animation:pufje .3s ease-out}
.doezelvak.pufje svg.doezel.dag .ogen{animation:ogenOpen .4s ease-out}
@keyframes pufje{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes ogenOpen{0%{transform:scaleY(.15)}100%{transform:scaleY(1)}}
.doezel.dag .buik{opacity:.28}
.doezel.dag.st-energiek .buik{opacity:.36}
.doezel.dag.st-brak .buik{opacity:.22}
.doezel.dag .glans{opacity:.2}
.doezel.dag.st-energiek .glans{opacity:.38}
.doezel.dag.st-doezelig .glans,.doezel.dag.st-brak .glans{opacity:.12}
.doezel.dag.st-rustig .oog-rustig,.doezel.dag.st-rustig .mond-rustig,.doezel.dag.st-wakker .oog-wakker,.doezel.dag.st-wakker .mond-wakker,.doezel.dag.st-energiek .oog-energiek,.doezel.dag.st-energiek .mond-energiek,.doezel.dag.st-doezelig .oog-doezelig,.doezel.dag.st-doezelig .mond-doezelig,.doezel.dag.st-brak .oog-brak,.doezel.dag.st-brak .mond-brak{opacity:1}
.doezel .oog-doezelig g{transition:opacity .6s ease}
.doezel .oog-doezelig .zw{opacity:0}
.doezel.zwaar .oog-doezelig .zw{opacity:1}
.doezel.zwaar .oog-doezelig .lt{opacity:0}
.doezel.nacht .lijf{fill:#A9653F}
.doezel.nacht.st-slapend .lijf{fill:#8A4F30}
.doezel.nacht.st-slapend .noog-slapend,.doezel.nacht.st-halfwakker .noog-half,.doezel.nacht.st-halfwakker.oog .noog-een,.doezel.nacht.st-doezelig .noog-doezelig{opacity:1}
.doezel.nacht.st-halfwakker.oog .noog-half{opacity:0}
.chips.samen{justify-content:center;margin-top:12px}
/* besluit Pjotr 24-11 (1): Doezels hoekje, alleen overdag, naast Doezel. Geen teller, geen getal. */
/* review 113, B1 en B4: het hoekje is groter (elk ding minstens 24 px) en een nieuw ding komt in 600 ms in beeld */
/* review 114, U2: het hoekje staat half achter Doezel en is lager (viewBox zonder de lege bovenkant); Doezel staat in het midden,
   zodat het puntje van de ballon naar hem wijst */
.doezelrij{display:flex;justify-content:center;align-items:flex-end;position:relative}
.hoekje{width:140px;height:auto;flex:none;position:absolute;left:50%;bottom:0;margin-left:18px;z-index:0}
.hoekje .nieuw{animation:dingIn .6s ease-out}
@keyframes dingIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
/* besluit Pjotr 24-11 (2): toon Rustig. Geen gaap, geen wiegen, rustiger ademen, tekst 18 px. */
.toon-rustig .doezel .gaap{animation:none!important;transform:scaleY(.18)}
.toon-rustig .doezel .beweeg{animation:none!important}
.toon-rustig .doezel .adem{animation-duration:16s!important}
#app.toon-rustig:not(.thema-nacht) p,#app.toon-rustig:not(.thema-nacht) li,#app.toon-rustig:not(.thema-nacht) label,#app.toon-rustig:not(.thema-nacht) .link,#app.toon-rustig:not(.thema-nacht) .lees,#app.toon-rustig:not(.thema-nacht) .chip,#app.toon-rustig:not(.thema-nacht) summary,#app.toon-rustig:not(.thema-nacht) .kaart .label{font-size:18px}
/* review 112: in Rustig geen labels in hoofdletters */
#app.toon-rustig .kaart .label{letter-spacing:0}
/* review 113, A2: op Adem één tempo voor Doezel, de cirkel en de toon (4 in, 6 uit = 10 s, piek op 40 %), ook in Rustig */
/* review 113, B1: Doezel staat nu buiten het ademvak (in #doezelvast); de regel hangt aan het scherm (scherm-adem) */
#app.scherm-adem .doezel .adem{animation:adem 10s ease-in-out infinite!important}
@media (prefers-reduced-motion:reduce){.doezel .adem,.doezel .ogen,.doezel .arm,.doezel .beweeg,.doezel .gaap,.cirkel,.hoekje .nieuw,#app.scherm-adem .doezel .adem,.doezelvak.pufje svg.doezel.dag,.doezelvak.pufje svg.doezel.dag .ogen{animation:none!important}.doezel *{transition:none!important}}
/* ballon en kaart */
.ballon{background:#FFFBF6;border-radius:28px;padding:18px 20px 12px;margin:14px 0 0;position:relative;box-shadow:0 8px 24px rgba(90,62,54,.08)}
.ballon:before{content:"";position:absolute;top:-9px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:#FFFBF6}
.ballon .zin{font-family:var(--kop);font-weight:500;font-size:21px;line-height:1.35;margin:0 0 6px}
.thema-nacht .ballon{background:none;box-shadow:none;text-align:center;padding:8px 0}
.thema-nacht .ballon:before{display:none}
.thema-nacht .ballon .zin{font-size:24px;color:#E9B48A;font-weight:400}
.lees{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0;min-height:44px;font-size:17px;color:var(--cacao)}
.lees i{width:34px;height:34px;border-radius:17px;background:var(--abrikoos);display:inline-flex;align-items:center;justify-content:center;font-style:normal}
.lees svg{width:18px;height:18px}
.thema-nacht .lees{color:var(--amber-l);font-size:22px}
.thema-nacht .klein,.thema-nacht .proto{font-size:22px;color:var(--amber-l)}
.thema-nacht .lees i{background:rgba(201,115,58,.35)}
.kaart{background:#FFFDF9;border:1.5px solid var(--abrikoos);border-radius:28px;padding:16px 20px;margin:14px 0 0}
.kaart.rustig{border-color:rgba(90,62,54,.12)}
.kaart .label{font-size:17px;letter-spacing:.8px;font-weight:700;color:var(--cacao);margin:0 0 4px}
.kaart .voorstel{font-family:var(--kop);font-size:20px;font-weight:500;line-height:1.35;margin:0}
.antwoord{font-family:var(--kop);font-size:18px;margin:10px 0 0;color:var(--cacao)}
/* knoppen */
/* review 113, B1: de hoofdknop staat vast onderaan (sticky), met daaronder een kleine regel met de tweede keuze */
.knoppen{margin-top:auto;padding-top:18px;padding-bottom:8px;display:flex;flex-direction:column;gap:10px;position:sticky;bottom:0;z-index:2;background:linear-gradient(180deg,rgba(255,255,255,0),var(--bodem,transparent) 18px)}
.knop{min-height:60px;border-radius:30px;border:0;background:linear-gradient(180deg,#F7B78F,var(--abrikoos-d));font-family:var(--kop);font-weight:600;font-size:21px;color:#3E2A24;box-shadow:0 8px 18px rgba(227,138,90,.28),inset 0 2px 0 rgba(255,255,255,.35);width:100%;padding:0 20px;border:1.5px solid #A65A2E}
.knop.zon{background:linear-gradient(180deg,var(--geel),var(--abrikoos))}
.knop.twee{background:#FFFBF6;box-shadow:none;border:1.5px solid var(--cacao-z)}
.link{border:0;background:none;min-height:44px;font-size:17px;text-decoration:underline;text-underline-offset:3px;color:var(--cacao);padding:0 4px}
.linkrij{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px}
.thema-nacht .knop{background:rgba(201,115,58,.10);border:1.5px solid var(--amber);color:#E9B48A;box-shadow:none;font-weight:500;font-size:22px}
.thema-nacht .link{color:var(--amber-l);font-size:22px}
.nachtgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nachtgrid .knop{min-height:64px}
/* chips, schakelaar */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:2px solid var(--cacao-z);background:#FFFBF6;font-size:17px;color:var(--cacao)}
.chip.aan{background:var(--abrikoos);border-color:var(--abrikoos-d);color:#3E2A24;font-weight:700}
.thema-nacht .chip{background:none;border-color:var(--amber);color:#E9B48A;font-size:22px}
.thema-nacht .chip.aan{background:rgba(201,115,58,.35)}
.rij{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.schakel{width:72px;height:44px;border-radius:22px;border:2px solid var(--cacao-z);background:#EFE4DC;position:relative;flex:none}
.schakel:after{content:"";position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:16px;background:var(--cacao-z);transition:left .2s}
.schakel.aan{background:var(--cacao);border-color:var(--cacao)}
.schakel.aan:after{left:32px;background:#fff}
.tijdkiezer{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0 6px}
.tijdinvoer{font-family:var(--kop);font-weight:600;font-size:48px;min-height:64px;padding:4px 16px;border-radius:20px;border:2px solid var(--cacao-z);background:#FFFBF6;color:var(--cacao)}
.tijdinvoer.klein-tijd{font-size:32px;min-height:56px}
/* review 112: de morgen-kaart en de middagwekker op Welterusten (alleen overdag en 's avonds) */
.thema-nacht .kaart{background:rgba(201,115,58,.08);border-color:var(--amber)}
.thema-nacht .tijdinvoer{background:var(--pruim-z);color:#E9B48A;border-color:var(--amber)}
details{margin:12px 0}
summary{min-height:44px;display:flex;align-items:center;font-size:17px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.thema-nacht summary{font-size:22px}
ul.lijst,ol.lijst{padding-left:22px;margin:6px 0}
ul.lijst li,ol.lijst li{margin:4px 0}
.tel{font-weight:700;text-decoration:underline}
/* adem */
.ademvak{display:flex;flex-direction:column;align-items:center;margin:10px 0}
.cirkel{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(201,115,58,.45),rgba(201,115,58,.08) 70%);border:1.5px solid rgba(201,115,58,.5);display:flex;align-items:center;justify-content:center;animation:ademcirkel 10s ease-in-out infinite;font-family:var(--kop);font-size:26px;color:#E9B48A}
@keyframes ademcirkel{0%{transform:scale(.62)}40%{transform:scale(1)}100%{transform:scale(.62)}}
/* review 113, A2: na 10 minuten dooft de cirkel in 30 s uit; daarna wordt het scherm zwart */
.cirkel.uitdoof{animation:ademcirkel 10s ease-in-out infinite,uitdoof 30s linear forwards}
@keyframes uitdoof{0%{opacity:1}100%{opacity:0}}
/* nav */
.nav{flex:none;display:flex;justify-content:space-around;padding:6px 10px 22px;background:rgba(255,251,246,.85);border-top:1px solid rgba(90,62,54,.08)}
.nav button{min-height:48px;min-width:64px;border:0;background:none;font-size:17px;font-weight:600;color:var(--cacao-z);border-radius:16px}
.nav button.actief{color:var(--cacao);background:rgba(244,169,124,.25)}
.toast{position:absolute;left:20px;right:20px;top:104px;pointer-events:none;background:var(--cacao);color:#FFF4E6;padding:14px 18px;border-radius:20px;font-size:17px;z-index:6}
.wekker-tijd{font-family:var(--kop);font-weight:500;font-size:84px;text-align:center;margin:10px 0 0;letter-spacing:-2px}
.proto{display:inline-block;font-size:17px;background:rgba(90,62,54,.08);border-radius:12px;padding:4px 10px;margin:4px 0}
.thema-nacht .proto{background:rgba(201,115,58,.12)}
.timer{font-family:var(--kop);font-size:64px;font-weight:500;text-align:center;margin:6px 0}
input[type=range]{width:100%;height:44px;accent-color:var(--abrikoos-d)}
/* nachtstand: helemaal zwart, en Doezel slapend zonder zin */
.thema-zwart{background:#000}
.zwartvlak{position:absolute;inset:0;border:0;background:#000;width:100%;height:100%;padding:0;display:flex;align-items:center;justify-content:center}
.slaapvlak{background:radial-gradient(120% 70% at 50% 40%,#2A1810 0%,var(--pruim) 55%,var(--pruim-z) 100%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.deal .knop{margin-top:12px}
/* review 110, S-2: gedachten parkeren */
.parkeervak{width:100%;min-height:160px;border-radius:20px;border:1.5px solid var(--amber);background:var(--pruim-z);color:var(--amber-l);font:inherit;font-size:22px;padding:14px 16px;margin:10px 0;resize:vertical}
/* demopaneel */
.demo{width:300px;background:#FFFBF6;border-radius:24px;padding:20px 22px;box-shadow:0 10px 30px rgba(90,62,54,.12);font-size:16px}
.demo h3{font-family:var(--kop);margin:0 0 4px;font-size:20px}
.demo .groep{margin:14px 0 0}
.demo .groep b{display:block;font-size:14px;letter-spacing:.6px;text-transform:uppercase;color:var(--cacao-z);margin-bottom:6px}
.demo .chip{min-height:40px;font-size:15px;padding:0 12px}
.demo select{width:100%;min-height:40px;font-size:15px;border-radius:12px;border:1.5px solid rgba(90,62,54,.25);background:#fff;padding:0 8px}
.demo .knop{min-height:46px;font-size:17px}
.demo p{font-size:14px;color:var(--cacao-z);margin:6px 0 0}
/* echte functies (25-11): de band bovenaan (niet in de app), het kleine camerabeeld van de lichtcheck */

  if (S.avondSein && S.bedVraag) return seinBlok();
  if (S.avondSein && S.seinNet) return `<p class="klein" data-seinnet="1">${esc(T.SEIN_AAN)}</p>`;
  if (seinAanbodNu()) return `<div class="linkrij" data-seinaanbod="1" style="justify-content:flex-start">${link("seinAanbod", T.SEIN_AANBOD)}</div>`;
  return "";
}
// review 113, B2: bij de eerste start één keer de vraag "Geluid aan?" op Welkom (een keuze, geen extra klik in de route); niet 's nachts
const geluidVraagNu = () => S.eerste && !S.geluidGevraagd && !S.geluid && S.tijd !== "nacht";
function gezBlok() {
  let h = `<p class="klein">${esc(T.GEZ_INLEIDING)}</p><p>${esc(T.GEZVRAAG)}</p>`;
  h += `<div class="chips">${chip("gez", T.GEZ_JA, S.gez === "ja", "ja")}${chip("gez", T.GEZ_NEE, S.gez === "nee", "nee")}${chip("gez", T.GEZ_OVERSLAAN, S.gez === "over", "over")}</div>`;
  if (S.gez === "ja") {
    h += `<p class="klein">${esc(T.GEZ_CHIPKOP)}</p><div class="chips">${T.GEZCHIPS.map((c) => chip("gezchip", c, !!S.chips[c], c)).join("")}</div>`;
    if (S.chips.slaappil) h += p(T.SLAAPPIL_MELA, "klein");
  }
  // review 113, A1: "Ik houd er rekening mee" pas na een gekozen chip; "Ja" zonder chip houdt de voorzichtige stand aan
  if (S.gez === "ja") h += gezChipGekozen() ? p(T.GEZ_DANK, "klein") : p(T.GEZ_GEENCHIP, "klein");
  else if (S.gez) h += p(T.GEZ_DANK_KORT, "klein");
  return h;
}
function wekdagChips() {
  const werk = S.dagen.join() === "true,true,true,true,true,false,false";
  const alle = S.dagen.every(Boolean);
  return `<div class="chips">${chip("weksnel", T.WEKSNEL[0], werk, "werk")}${chip("weksnel", T.WEKSNEL[1], alle, "alle")}</div>`;
}

let laatsteHtml = "", skeletKlaar = false, laatsteScherm = null, hoekjeNu = null;

// wat Doezel nu is: zichtbaar, dag of nacht, stand en extra klassen. Het hoekje staat overdag naast hem, 's nachts niet.
function doezelNu(zicht) {

function bouwSkelet(app) {

// zet een deel alleen opnieuw als de inhoud anders is; geeft true als het deel vervangen is
function zetDeel(id, html) {
  if (delenNu[id] === html) return false;

  if (el) el.innerHTML = html;

// alleen in een echte browser: de klasse, data-stand, aria-label, zichtbaarheid en het hoekje van de vaste Doezel
function zetDoezel(dz) {
  const vak = document.getElementById("doezelvast");
  if (!vak || typeof vak.querySelector !== "function") return;
  vak.classList.toggle("verborgen", !dz.zicht);
  if (!dz.zicht) return;
  vak.classList.toggle("ademtrek", !!dz.ademtrek);
  if (dz.deel) vak.setAttribute("data-deel", "doezel"); else vak.removeAttribute("data-deel");
  const dag = vak.querySelector("svg.doezel.dag"), nacht = vak.querySelector("svg.doezel.nacht");
  const aan = dz.nacht ? nacht : dag, uit = dz.nacht ? dag : nacht;
  if (uit) uit.classList.add("verborgen");
  if (aan) {
    // review 114, U1: overdag een pufje bij een standwissel
    const oudStand = aan.getAttribute("data-stand"), wasZicht = !aan.classList.contains("verborgen");
    if (!dz.nacht && wasZicht && oudStand && oudStand !== dz.stand) pufje();
    let cls = (dz.nacht ? "doezel groot nacht st-" : "doezel dag st-") + dz.stand + dz.cls;
    // de gaap loopt één keer: blijft Doezel doezelig, dan geen "gegaapt" erbij midden in de gaap
    if (!dz.nacht && dz.stand === "doezelig" && aan.classList.contains("st-doezelig") && !aan.classList.contains("verborgen") && !aan.classList.contains("gegaapt")) cls = cls.replace(" gegaapt", "");
    aan.setAttribute("class", cls);
    aan.setAttribute("data-stand", dz.stand);
    aan.setAttribute("aria-label", altStand(dz.stand));
  }
  if (dz.hoekje !== hoekjeNu) {
    const oud = vak.querySelector("svg.hoekje");
    if (oud) oud.remove();

// op Adem: komt de cirkel opnieuw in beeld, dan begint Doezels adem gelijk met de cirkel (review 113, A2)

// Alleen in een echte browser (de rooktest heeft geen classList); bij minder beweging staat de animatie uit (CSS).

// review 114 (heftig): een tik op "Meer" (summary) of het openen of sluiten van een uitklap telt 's nachts als tik:
// de 60 s naar zwart beginnen opnieuw. Op de nacht onthoudt de app of Meer open staat.
function nachtTikTelt(details) {
  if (details && S.scherm === "nacht" && details.getAttribute && details.getAttribute("data-nachtmeer") === "1") S.nachtMeerOpen = !!details.open;
  if (NACHT_STIL_SCHERMEN.includes(S.scherm) && S.nachtFase === "wakker") nachtTimer(NACHT_STIL_MS);
}
document.addEventListener("toggle", (e) => { if (e.target && e.target.tagName === "DETAILS") nachtTikTelt(e.target); }, true);
document.addEventListener("click", (e) => {
  const el = e.target && e.target.closest ? e.target.closest("[data-act]") : null;
  if (!el) { if (e.target && e.target.closest && e.target.closest("summary, details")) nachtTikTelt(null); return; }
  e.preventDefault();
  act(el.getAttribute("data-act"), el.getAttribute("data-arg"));
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el && el.getAttribute && el.getAttribute("data-input") === "spring") act("demoSpring", el.value);
  if (el && el.getAttribute && el.getAttribute("data-input") === "tijd") act(el.getAttribute("data-act-tijd"), el.value);
});
document.addEventListener("input", (e) => {
  const el = e.target;
  // review 113, B2: één volumeregelaar voor de stem, de geluiden, Adem en Doezel (de wekker niet)
  if (el && el.getAttribute && el.getAttribute("data-input") === "volume") { S.volume = Number(el.value); volumeZet(); }
  if (el && el.getAttribute && el.getAttribute("data-input") === "parkeer") S.parkeerTekst = String(el.value || "");
});
if (window.speechSynthesis && window.speechSynthesis.getVoices) {
  stemNl();
  // review 113, B2: Chrome laadt de stemmen soms later; dan alsnog de Nederlandse stem kiezen
  // echte functies (25-11): en het demopaneel laat meteen zien welke stem er gekozen is
  try { window.speechSynthesis.onvoiceschanged = () => { stemNl(); stemDemoZet(); }; } catch (e) { /* geen voiceschanged: dan de standaardstem */ }
}
