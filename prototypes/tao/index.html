echtigheid. Zodra die kwamen, was Tao al verlaten.","t98":"Toen het volk nog in Tao leefde was er vanzelf liefde van de menschen onder elkaar, was er vanzelf geen strijd en misdaad. Alles was Wu Wei. Vanzelf was er dus ook geen begrip Menschlievendheid en geen begrip Gerechtigheid. Zoodra die kwamen, was Tao al verlaten."},{"v":[2],"l":"2","t":"De vorst, die in Tao leefde, regeerde Wu Wei (zie het vorige Hoofdstuk), en behoefde geen bizondere slimheid te gebruiken; deed hij dit, dan ging het volk dat met dezelfde wapenen te keer, en de Huichelarij ontstond. Johnson geeft: „With the sharpening of the wits come trickery and sham.”—Ik ga in dezen eerder mede met Thi We Tszʼ, The Thsing en Julien, die dit gezegde betrekking doen hebben op de regering (in verband dus met het vorige hoofdstuk).","t98":"De vorst, die in Tao leefde, regeerde Wu Wei (zie het vorige Hoofdstuk), en behoefde geen bizondere slimheid te gebruiken; deed hij dit, dan ging het volk dat met dezelfde wapenen te keer, en de Huichelarij ontstond. Johnson geeft: „With the sharpening of the wits come trickery and sham.”—Ik ga in dezen eerder mede met Thi We Tszʼ, The Thsing en Julien, die dit gezegde betrekking doen hebben op de regeering (in verband dus met het vorige hoofdstuk)."},{"v":[3],"l":"3","t":"Van ouds was er vanzelf harmonie in de familie (lett. staat er: „de zes bloedverwanten” d.i. vader—zon, oudere broeder—jongere broeder, en man—vrouw). Het was Wu Wei, natuurlijk. Toen er Hiao (liefde voor de ouders) en Tszʼ (hier: liefde voor de kinderen) kwamen was de harmonie natuurlijk niet meer natuurlijk bestaande.","t98":"Van ouds was er vanzelf harmonie in de familie (lett. staat er: „de zes bloedverwanten” d.i. vader—zoon, oudere broeder—jongere broeder, en man—vrouw). Het was Wu Wei, natuurlijk. Toen er Hiao (liefde voor de ouders) en Tszʼ (hier: liefde voor de kinderen) kwamen was de harmonie natuurlijk niet meer natuurlijk bestaande."},{"v":[4],"l":"4","t":"Johnson zegt hiervan terecht: „The call for examples of this kind is a sign. Lao Tszʼ is showing that what causes the boast or claim of special virtues is the consciousness of self, the absence of spontaneous goodness in an old traditioned state of society beset by formulas and prescriptions.”","t98":"Johnson zegt hiervan terecht: „The call for examples of this kind is a sign. Lao Tszʼ is showing that what causes the boast or claim of special virtues is the consciousness of self, the absence of spontaneous goodness in an old traditioned state of society beset by formulas and prescriptions.”"}]},{"n":19,"r":"XIX","d":"Tao","zh":["絕聖棄智，民利百倍；絕仁棄義，民復孝慈；絕巧棄利，盜賊無有。","此三者以為文不足，故令有所屬：見素抱樸，少私寡欲。"],"nl":[[1,["Doe de Wijsheid vàn u, en weg met het Weten, dan zal het volk honderdmaal meer gelukkig zijn."]],[2,["Doe de Filantropie vàn u, en weg met Gerechtigheid, en het volk zal (vanzelf) terugkeren tot liefde voor de ouders en voor de kinderen."]],[3,["Doe de Knapheid vàn u, en weg met Gewinzucht, en er zullen geen dieven en rovers meer wezen."]],[4,["Doet afstand van deze drie dingen. Hebt niet genoeg aan den schijn."]],[5,["Daarom toon ik u, wáár gij u aan moet houden: Ziet uzelf in uwen (oorspronkelijken) eenvoud en behoud uw (oorspronkelijke) puurheid. Hebt weinig egoïsme en weinig begeerten."]]],"n98":[[1,["Doe de Wijsheid vàn u, en weg met het Weten, dan zal het volk honderdmaal meer gelukkig zijn."]],[2,["Doe de Filantropie vàn u, en weg met Gerechtigheid, en het volk zal (vanzelf) terugkeeren tot liefde voor de ouders en voor de kinderen."]],[3,["Doe de Knapheid vàn u, en weg met Gewinzucht, en er zullen geen dieven en roovers meer wezen."]],[4,["Doet afstand van deze drie dingen. Hebt niet genoeg aan den schijn."]],[5,["Daarom toon ik u, wáár gij u aan moet houden: Ziet uzelf in uwen (oorspronkelijken) eenvoud en behoud uw (oorspronkelijke) puurheid. Hebt weinig egoïsme en weinig begeerten."]]],"en":[[1,["If we could renounce our sageness and discard our wisdom, it would be better for the people a hundredfold. If we could renounce our benevolence and discard our righteousness, the people would again become filial and kindly. If we could renounce our artful contrivances and discard our (scheming for) gain, there would be no thieves nor robbers."]],[2,["Those three methods (of government)\nThought olden ways in elegance did fail\nAnd made these names their want of worth to veil;\nBut simple views, and courses plain and true\nWould selfish ends and many lusts eschew."]]],"no":[{"v":[],"l":"hoofdstuk","t":"In verband met het vorige hoofdstuk is dit negentiende duidelijk genoeg. Véél beter dan te weten achtte Lao Tszʼ het, zijn oorspronkelijken natuurstaat te behouden. In den natuurstaat is men, volgens Lao Tszʼ, vanzelf (Tszʼ Jan) wijs, filantropies en knap, maar zonder het te weten, onbewust, en zijn die dingen dus een onbewuste realiteit. Zodra men ze echter met namen gaat noemen, als iets bizonders, ontaardt die realiteit in een schijn. Men vergelijke dit Hoofdstuk en ook het volgende met Hoofdstuk 3 uit de „Imitation de Jésus Christ.” O.a. „L’humble connaissance de toi-même est une voie plus sûre pour aller à Dieu que les profondes enquêtes de la science,” en „Combien périssent par la vaine science dans le siècle, insouciants du service de Dieu.” (trad L. Moreau.) Treffend is ook de gelijkenis met Hoofdstuk 2 uit hetzelfde boek. O.a. „Tout homme désire naturellement savoir; mais la science, sans la crainte de Dieu, que produit-elle? Certainement, l’humble paysan qui sert Dieu vaut mieux que le philosophe superbe qui, négligeant son âme, observe le cours des astres.” Dit slaat ook op den eersten tekst van het volgende Hoofdstuk XX.","t98":"In verband met het vorige hoofdstuk is dit negentiende duidelijk genoeg. Véél beter dan te weten achtte Lao Tszʼ het, zijn oorspronkelijken natuurstaat te behouden. In den natuurstaat is men, volgens Lao Tszʼ, vanzelf (Tszʼ Jan) wijs, filantropiesch en knap, maar zonder het te weten, onbewust, en zijn die dingen dus een onbewuste realiteit. Zoodra men ze echter met namen gaat noemen, als iets bizonders, ontaardt die realiteit in een schijn. Men vergelijke dit Hoofdstuk en ook het volgende met Hoofdstuk 3 uit de „Imitation de Jésus Christ.” O.a. „L’humble connaissance de toi-même est une voie plus sûre pour aller à Dieu que les profondes enquêtes de la science,” en „Combien périssent par la vaine science dans le siècle, insouciants du service de Dieu.” (trad L. Moreau.) Treffend is ook de gelijkenis met Hoofdstuk 2 uit hetzelfde boek. O.a. „Tout homme désire naturellement savoir; mais la science, sans la crainte de Dieu, que produit-elle? Certainement, l’humble paysan qui sert Dieu vaut mieux que le philosophe superbe qui, négligeant son âme, observe le cours des astres.” Dit slaat ook op den eersten tekst van het volgende Hoofdstuk XX."}]},{"n":20,"r":"XX","d":"Tao","zh":["絕學無憂，唯之與阿，相去幾何？","善之與惡，相去若何？","人之所畏，不可不畏。","荒兮其未央哉！","眾人熙熙，如享太牢，如春登臺。","我獨泊兮其未兆，如嬰兒之未孩；儽儽兮若無所歸。","眾人皆有餘，而我獨若遺。","我愚人之心也哉！","沌沌兮，俗人昭昭，我獨昏昏。","俗人察察，我獨悶悶。","澹兮其若海，飂兮若無止。","眾人皆有以，而我獨頑似鄙。","我獨異於人，而貴食母。"],"nl":[[1,["Doe de Studie vàn u, dan zult gij geen zorgen hebben."]],[2,["Wat doet het er eigenlijk toe of we het karakter „wei” dan wel het karakter „oh” voor „ja!” gebruiken? (Maar) het is héél iets anders (om te weten) het onderscheid tussen goed en kwaad."]],[3,["Helaas! de wereld is een wildernis geworden, en er is nog geen einde aan!"]],[4,["Alle mensen zijn blij en vrolijk, als hij, die geniet van rundvlees, als hij, die in de lente een hoog terras heeft bestegen."]],[5,["Ik alleen ben kalm, en heb nog niet éven bewogen; ik ben als een klein kindje, dat nog niet geglimlacht heeft. Ik ben vrij, zonder belemmering, alsof er niets was, waarheen ik zou willen terugkeren."]],[6,["De gewone mensen hebben over; ik alleen ben als een, die (alles) verloren heeft. Ik heb het hart van een domme, ik ben een chaos van verwarring."]],[7,["De gewone mensen zijn schitterend verlicht, ik alleen ben als duister. De gewone mensen zijn doordringend van doorzicht; ik alleen ben droevig ongerust. Ik ben vaag als de zee, ik word door de golven heen en weergedreven, als rusteloos."]],[8,["Alle mensen hebben overal een reden voor; ik alleen ben dom, als iemand van het land."]],[9,["Ik alleen ben anders dan de (gewone) mensen, omdat ik de Moeder vereer, die alles voedt (Tao)."]]],"n98":[[1,["Doe de Studie vàn u, dan zult gij geen zorgen hebben."]],[2,["Wat doet het er eigenlijk toe of we het karakter „wei” dan wel het karakter „oh” voor „ja!” gebruiken? (Maar) het is héél iets anders (om te weten) het onderscheid tusschen goed en kwaad."]],[3,["Helaas! de wereld is een wildernis geworden, en er is nog geen einde aan!"]],[4,["Alle menschen zijn blij en vroolijk, als hij, die geniet van rundvleesch, als hij, die in de lente een hoog terras heeft bestegen."]],[5,["Ik alleen ben kalm, en heb nog niet éven bewogen; ik ben als een klein kindje, dat nog niet geglimlacht heeft. Ik ben vrij, zonder belemmering, alsof er niets was, waarheen ik zou willen terugkeeren."]],[6,["De gewone menschen hebben over; ik alleen ben als een, die (alles) verloren heeft. Ik heb het hart van een domme, ik ben een chaos van verwarring."]],[7,["De gewone menschen zijn schitterend verlicht, ik alleen ben als duister. De gewone menschen zijn doordringend van doorzicht; ik alleen ben droevig ongerust. Ik ben vaag als de zee, ik word door de golven heen en weêrgedreven, als rusteloos."]],[8,["Alle menschen hebben overal een reden voor; ik alleen ben dom, als iemand van het land."]],[9,["Ik alleen ben anders dan de (gewone) menschen, omdat ik de Moeder vereer, die alles voedt (Tao)."]]],"en":[[1,["When we renounce learning we have no troubles.\nThe (ready) 'yes,' and (flattering) 'yea;'--\nSmall is the difference they display.\nBut mark their issues, good and ill;--\nWhat space the gulf between shall fill?","What all men fear is indeed to be feared; but how wide and without end is the range of questions (asking to be discussed)!"]],[2,["The multitude of men look satisfied and pleased; as if enjoying a full banquet, as if mounted on a tower in spring. I alone seem listless and still, my desires having as yet given no indication of their presence. I am like an infant which has not yet smiled. I look dejected and forlorn, as if I had no home to go to. The multitude of men all have enough and to spare. I alone seem to have lost everything. My mind is that of a stupid man; I am in a state of chaos.","Ordinary men look bright and intelligent, while I alone seem to be benighted. They look full of discrimination, while I alone am dull and confused. I seem to be carried about as on the sea, drifting as if I had nowhere to rest. All men have their spheres of action, while I alone seem dull and incapable, like a rude borderer. (Thus) I alone am different from other men, but I value the nursing-mother (the Tao)."]]],"no":[{"v":[5],"l":"5","t":"Ik vertaal hier „kalm” bij gebrek aan beter woord. Het karakter „poh” betekent „ankeren, ten anker liggen”, wat Alexander wel wat vrij, maar zeer schoon doet vertalen: „I am as a solitary ship at anchor on an unknown shore”. De commentator The Thsing merkt bij den laatsten zin op: „Ik ben als een vaartuig, welks kabeltouw is gebroken”.","t98":"Ik vertaal hier „kalm” bij gebrek aan beter woord. Het karakter „poh” beteekent „ankeren, ten anker liggen”, wat Alexander wel wat vrij, maar zeer schoon doet vertalen: „I am as a solitary ship at anchor on an unknown shore”. De commentator The Thsing merkt bij den laatsten zin op: „Ik ben als een vaartuig, welks kabeltouw is gebroken”."},{"v":[6],"l":"6","t":"Lao Tszʼ meent met „alles verloren”: „alle aardse dingen verloren, maar het ééne, Tao, behouden. Ik heb een chaos van verwarring”, daar „tun” betekent „het neerstorten van een stroom, chaotisch, verward” (Wells Williams.) Julien, op gezag van Sie Hoeï, vertaalt met „dépourvue de connaissances, ignorant” deze herhaling „tun tun”.","t98":"Lao Tszʼ meent met „alles verloren”: „alle aardsche dingen verloren, maar het ééne, Tao, behouden. Ik heb een chaos van verwarring”, daar „tun” beteekent „het neerstorten van een stroom, chaotisch, verward” (Wells Williams.) Julien, op gezag van Sie Hoeï, vertaalt met „dépourvue de connaissances, ignorant” deze herhaling „tun tun”."},{"v":[9],"l":"9","t":"Dit correspondeert met in Hfdst. I: „Als Zijn kan men Het noemen de Moeder aller dingen”. Ik heb na 2 een zin uitgelaten, luidende: „Voor dat, wat de mensen vrezen, mogen wij niet onbevreesd zijn”, daar deze mij geheel buiten het verband van dit zo schone hoofdstuk leek te liggen.","t98":"Dit correspondeert met in Hfdst. I: „Als Zijn kan men Het noemen de Moeder aller dingen”. Ik heb na 2 een zin uitgelaten, luidende: „Voor dat, wat de menschen vreezen, mogen wij niet onbevreesd zijn”, daar deze mij geheel buiten het verband van dit zoo schoone hoofdstuk leek te liggen."}]},{"n":21,"r":"XXI","d":"Tao","zh":["孔德之容，惟道是從。","道之為物，惟恍惟惚。","惚兮恍兮，其中有象；恍兮惚兮，其中有物。","窈兮冥兮，其中有精；其精甚真，其中有信。","自今及古，其名不去，以閱眾甫。","吾何以知眾甫之狀哉？","以此。"],"nl":[[1,["De (zichtbare) manifestaties van de grote Teh zijn een emanatie van Tao.","Ziehier de natuur van Tao."]],[2,["Tao is vaag en verward. Hoe verward!... Hoe vaag!... En (toch) bevat het de vormen (der dingen)! Hoe vaag!... Hoe verward!... En (toch) bevat het een spirituele essence! Deze spirituele essence is ten zéerste reëel, en bevat de onfeilbare getuigenis (van wat zij is)."]],[3,["Van oudsher tot nú toe was Zijn naam onvergankelijk, en Het geeft geboorte aan de gehele creatie."]],[4,["Hoe weet ik, dat de gehele creatie hierin haar oorsprong heeft? Door Tao zelf."]]],"n98":[[1,["De (zichtbare) manifestaties van de groote Teh zijn eene emanatie van Tao.","Ziehier de natuur van Tao."]],[2,["Tao is vaag en verward. Hoe verward!... Hoe vaag!... En (toch) bevat het de vormen (der dingen)! Hoe vaag!... Hoe verward!... En (toch) bevat het eene spiritueele essence! Deze spiritueele essence is ten zéerste reëel, en bevat de onfeilbare getuigenis (van wat zij is)."]],[3,["Van oudsher tot nú toe was Zijn naam onvergankelijk, en Het geeft geboorte aan de geheele creatie."]],[4,["Hoe weet ik, dat de geheele creatie hierin haar oorsprong heeft? Door Tao zelf."]]],"en":[[1,["The grandest forms of active force\nFrom Tao come, their only source.\nWho can of Tao the nature tell?\nOur sight it flies, our touch as well.\nEluding sight, eluding touch,\nThe forms of things all in it crouch;\nEluding touch, eluding sight,\nThere are their semblances, all right.\nProfound it is, dark and obscure;\nThings' essences all there endure.\nThose essences the truth enfold\nOf what, when seen, shall then be told.\nNow it is so; 'twas so of old.\nIts name--what passes not away;\nSo, in their beautiful array,\nThings form and never know decay.","How know I that it is so with all the beauties of existing things? By this (nature of the Tao)."]]],"no":[{"v":[1],"l":"1","t":"Hier gebruikt Lao Tszʼ „Deugd” (Teh) voor Tao. Letterlijk staat er niet „manifestatie”, maar „uiterlijk, voorkomen, vorm”. In het tweede deel van dit werk zal ik nader over deze verwisseling spreken.—Tao heeft geen lichaam, maar in circulatie in het helal noemt Lao Tszʼ het Teh (Deugd), zodat Teh (Deugd) de manifestatie van Tao is (Sou Tszʼ You).","t98":"Hier gebruikt Lao Tszʼ „Deugd” (Teh) voor Tao. Letterlijk staat er niet „manifestatie”, maar „uiterlijk, voorkomen, vorm”. In het tweede deel van dit werk zal ik nader over deze verwisseling spreken.—Tao heeft geen lichaam, maar in circulatie in het heelal noemt Lao Tszʼ het Teh (Deugd), zoodat Teh (Deugd) de manifestatie van Tao is (Sou Tszʼ You)."},{"v":[2],"l":"2","t":"Tao, met andere woorden, is de essence, het transcendentale, mystieke, eeuwige Wezen van alle sterfelijke lichamen en dingen. Julien voegt hier bij: „In medio ejus est spiritus”. De onfeilbare getuigenis van het Wezen dier spirituele essence is dat zij onsterfelijk is, terwijl ál het andere buiten haar sterft.","t98":"Tao, met andere woorden, is de essence, het transcendentale, mystieke, eeuwige Wezen van alle sterfelijke lichamen en dingen. Julien voegt hier bij: „In medio ejus est spiritus”. De onfeilbare getuigenis van het Wezen dier spiritueele essence is dat zij onsterfelijk is, terwijl ál het andere buiten haar sterft."},{"v":[3],"l":"3","t":"Het karakter, dat dit „geboorte geven” uitdrukt, bevat een poort. Julien zegt er, op den commentator Sie Hoeï afgaande, bij: „Lao Tszʼ vergelijkt hier Tao met een poort, waar alle wezens uitkomen om in het leven te gaan.”","t98":"Het karakter, dat dit „geboorte geven” uitdrukt, bevat een poort. Julien zegt er, op den commentator Sie Hoeï afgaande, bij: „Lao Tszʼ vergelijkt hier Tao met een poort, waar alle wezens uitkomen om in het leven te gaan.”"}]},{"n":22,"r":"XXII","d":"Tao","zh":["曲則全，枉則直，窪則盈，敝則新，少則得，多則惑。","是以聖人抱一為天下式。","不自見故明，不自是故彰，不自伐故有功，不自矜故長。","夫唯不爭，故天下莫能與之爭。","古之所謂曲則全者，豈虛言哉！","誠全而歸之。"],"nl":[[1,["Het onvolmaakte zal volmaakt worden. Het gebogene zal recht worden. Het holle zal vol worden. Het versletene zal nieuw worden."]],[2,["Met weinig wordt Het verkregen, met véél dwaalt men er van af."]],[3,["Daarom, de Wijze omvat het Ene (Tao), en maakt zich (zo) het voorbeeld van de wereld."]],[4,["Hij wenst zelf niet licht te schijnen, en dáárom juist is hij verlicht. Hij wenst niet zelf de ware man te wezen, en dáárom juist steekt hij boven de anderen uit. Hij pocht niet op zijn werk, en dáárom juist heeft hij verdienste. Hij stelt zichzelf niet hoog, en is dáárom juist de meerdere. Hij strijdt niet, en dáárom juist is er niemand in de wereld die tegen hem op kan."]],[5,["Hoe zou het een leeg gezegde kunnen zijn wat de Ouden noemden: „Het onvolmaakte wordt volmaakt”? Als iemand het volmaakte bereikt heeft, onderwerpt zich alles aan hem."]]],"n98":[[1,["Het onvolmaakte zal volmaakt worden. Het gebogene zal recht worden. Het holle zal vol worden. Het versletene zal nieuw worden."]],[2,["Met weinig wordt Het verkregen, met véél dwaalt men er van af."]],[3,["Daarom, de Wijze omvat het Eene (Tao), en maakt zich (zoo) het voorbeeld van de wereld."]],[4,["Hij wenscht zelf niet licht te schijnen, en dáárom juist is hij verlicht. Hij wenscht niet zelf de ware man te wezen, en dáárom juist steekt hij boven de anderen uit. Hij pocht niet op zijn werk, en dáárom juist heeft hij verdienste. Hij stelt zichzelf niet hoog, en is dáárom juist de meerdere. Hij strijdt niet, en dáárom juist is er niemand in de wereld die tegen hem op kan."]],[5,["Hoe zou het een leeg gezegde kunnen zijn wat de Ouden noemden: „Het onvolmaakte wordt volmaakt”? Als iemand het volmaakte bereikt heeft, onderwerpt zich alles aan hem."]]],"en":[[1,["The partial becomes complete; the crooked, straight; the empty, full; the worn out, new. He whose (desires) are few gets them; he whose (desires) are many goes astray."]],[2,["Therefore the sage holds in his embrace the one thing (of humility), and manifests it to all the world. He is free from self-display, and therefore he shines; from self-assertion, and therefore he is distinguished; from self-boasting, and therefore his merit is acknowledged; from self-complacency, and therefore he acquires superiority. It is because he is thus free from striving that therefore no one in the world is able to strive with him."]],[3,["That saying of the ancients that 'the partial becomes complete' was not vainly spoken:--all real completion is comprehended under it."]]],"no":[{"v":[2],"l":"2","t":"„Het” is hier Tao.","t98":"„Het” is hier Tao."},{"v":[5],"l":"5","t":"Volgens anderen „Als iemand het volmaakte bereikt heeft, keren allen tot hun oorspronkelijken staat van eenvoud terug”.","t98":"Volgens anderen „Als iemand het volmaakte bereikt heeft, keeren allen tot hun oorspronkelijken staat van eenvoud terug”."}]},{"n":23,"r":"XXIII","d":"Tao","zh":["希言自然。","故飄風不終朝，驟雨不終日。","孰為此者？","天地。","天地尚不能久，而況於人乎？","故從事於道者，道者同於道，德者同於德，失者同於失。","同於道者，道亦樂得之；同於德者，德亦樂得之；同於失者，失亦樂得之。","信不足焉，有不信焉。"],"nl":[[1,["Wie weinig spreekt is van-zelf natuurlijk (Tszʼ Jan)."]],[2,["Wat is het, dat maakt dat een strenge wind geen gehelen morgen duurt, en een hevige regen geen gehelen dag? (De actie van) Hemel en Aarde. Als de Hemel en de Aarde niet lang kunnen duren, hoeveel te minder dan de mens!"]],[3,["Daarom de mens die al zijne daden regelt naar Tao zal gelijk aan Tao worden; degenen, die zich regelen naar de Deugd zullen gelijk aan de Deugd worden; die zich regelt naar de Misdaad zal gelijk aan de Misdaad worden."]],[4,["Wie gelijk aan Tao is verkrijgt ook Tao, wie gelijk aan de Deugd is verkrijgt ook de Deugd, wie gelijk aan de Misdaad is verkrijgt ook de Misdaad."]],[5,["Niet genoeg geloof hebben is géén geloof hebben."]]],"n98":[[1,["Wie weinig spreekt is van-zelf natuurlijk (Tszʼ Jan)."]],[2,["Wat is het, dat maakt dat een strenge wind geen geheelen morgen duurt, en een hevige regen geen geheelen dag? (De actie van) Hemel en Aarde. Als de Hemel en de Aarde niet lang kunnen duren, hoeveel te minder dan de mensch!"]],[3,["Daarom de mensch die al zijne daden regelt naar Tao zal gelijk aan Tao worden; degenen, die zich regelen naar de Deugd zullen gelijk aan de Deugd worden; die zich regelt naar de Misdaad zal gelijk aan de Misdaad worden."]],[4,["Wie gelijk aan Tao is verkrijgt ook Tao, wie gelijk aan de Deugd is verkrijgt ook de Deugd, wie gelijk aan de Misdaad is verkrijgt ook de Misdaad."]],[5,["Niet genoeg geloof hebben is géén geloof hebben."]]],"en":[[1,["Abstaining from speech marks him who is obeying the spontaneity of his nature. A violent wind does not last for a whole morning; a sudden rain does not last for the whole day. To whom is it that these (two) things are owing? To Heaven and Earth. If Heaven and Earth cannot make such (spasmodic) actings last long, how much less can man!"]],[2,["Therefore when one is making the Tao his business, those who are also pursuing it, agree with him in it, and those who are making the manifestation of its course their object agree with him in that; while even those who are failing in both these things agree with him where they fail."]],[3,["Hence, those with whom he agrees as to the Tao have the happiness of attaining to it; those with whom he agrees as to its manifestation have the happiness of attaining to it; and those with whom he agrees in their failure have also the happiness of attaining (to the Tao). (But) when there is not faith sufficient (on his part), a want of faith (in him) ensues (on the part of the others)."]]],"no":[{"v":[1],"l":"1","t":"Zoals ik reeds in mijn vorige werk, over Confucius, zeide, is Tszʼ Jan: „van-zelf, natuurlijk”. Sie Hoeï merkt hierbij aan, wat ik ook reeds vroeger opmerkte vóór dit te lezen, dat Tszʼ Jan in Lao Tszʼ gelijk is aan Wu Wei.","t98":"Zooals ik reeds in mijn vorige werk, over Confucius, zeide, is Tszʼ Jan: „van-zelf, natuurlijk”. Sie Hoeï merkt hierbij aan, wat ik ook reeds vroeger opmerkte vóór dit te lezen, dat Tszʼ Jan in Lao Tszʼ gelijk is aan Wu Wei."},{"v":[5],"l":"5","t":"Dit is weer iets uit het verband, of het geloof hebben zou moeten slaan op het geloven in de woorden van dit hoofdstuk, wat ik niet waarschijnlijk vind.","t98":"Dit is weer iets uit het verband, of het geloof hebben zou moeten slaan op het gelooven in de woorden van dit hoofdstuk, wat ik niet waarschijnlijk vind."}]},{"n":24,"r":"XXIV","d":"Tao","zh":["企者不立，跨者不行，自見者不明，自是者不彰，自伐者無功，自矜者不長。","其在道也，曰餘食贅行。","物或惡之，故有道者不處。"],"nl":[[1,["Wie op zijn tenen gaat staan kan niet rechtop blijven; wie de benen ver uitstrekt kan niet lopen."]],[2,["Wie zelf licht wenst te schijnen is niet verlicht. Wie zelf de ware man wenst te wezen steekt niet boven de anderen uit. Wie op zijn werk pocht heeft geen verdienste. Wie zich zelf hoog stelt is niet superieur."]],[3,["Zulke manieren van doen, vergeleken bij (de goddelijke principes van) Tao, zijn als overblijfseltjes van eten, of andere walgelijke dingen, die altijd verafschuwd worden."]],[4,["Daarom, wie in Tao leven, houden er zich niet mede op."]]],"n98":[[1,["Wie op zijn teenen gaat staan kan niet rechtop blijven; wie de beenen ver uitstrekt kan niet loopen."]],[2,["Wie zelf licht wenscht te schijnen is niet verlicht. Wie zelf de ware man wenscht te wezen steekt niet boven de anderen uit. Wie op zijn werk pocht heeft geen verdienste. Wie zich zelf hoog stelt is niet superieur."]],[3,["Zulke manieren van doen, vergeleken bij (de goddelijke principes van) Tao, zijn als overblijfseltjes van eten, of andere walgelijke dingen, die altijd verafschuwd worden."]],[4,["Daarom, wie in Tao leven, houden er zich niet mede op."]]],"en":[[1,["He who stands on his tiptoes does not stand firm; he who stretches his legs does not walk (easily). (So), he who displays himself does not shine; he who asserts his own views is not distinguished; he who vaunts himself does not find his merit acknowledged; he who is self-conceited has no superiority allowed to him. Such conditions, viewed from the standpoint of the Tao, are like remnants of food, or a tumour on the body, which all dislike. Hence those who pursue (the course) of the Tao do not adopt and allow them."]]],"no":[]},{"n":25,"r":"XXV","d":"Tao","zh":["有物混成，先天地生。","寂兮寥兮，獨立而不改，周行而不殆，可以為天下母。","吾不知其名，字之曰道，強為之名曰大。","大曰逝，逝曰遠，遠曰反。","故道大，天大，地大，王亦大。","域中有四大，而王居其一焉。","人法地，地法天，天法道，道法自然。"],"nl":[[1,["Vóór Hemel en Aarde bestonden, was er een vaag Wezen."]],[2,["Hoe rustig-kalm! Hoe onstoffelijk!"]],[3,["Het staat alleen, op-zich-zelf, en verandert niet."]],[4,["Het doorvloeit alles en loopt (toch) geen gevaar."]],[5,["Het mag wel de Moeder van alles onder den Hemel worden genoemd."]],[6,["Ik weet niet Zijnen naam."]],[7,["(Maar) Het een karakter willende geven noem ik Het Tao."]],[8,["Wil ik Het met alle geweld omschrijven, dan noem ik Het groot."]],[9,["Van groot noem ik Het vervliedend."]],[10,["Van vervliedend noem ik Het vèr."]],[11,["Van vèr noem ik Het (weer) terugkerend."]],[12,["Daarom, Tao is groot, de Hemel is groot, de Aarde is groot, de Koning is groot."]],[13,["Er zijn vier grote machten in de wereld, en de Koning is er één van."]],[14,["De wet van den Koning is van de Aarde; de wet van de Aarde is van den Hemel; de wet van den Hemel is van Tao."]],[15,["(Maar) de Wet van Tao is van-zich-zelven."]]],"n98":[[1,["Vóór Hemel en Aarde bestonden, was er een vaag Wezen."]],[2,["Hoe rustig-kalm! Hoe onstoffelijk!"]],[3,["Het staat alleen, op-zich-zelf, en verandert niet."]],[4,["Het doorvloeit alles en loopt (toch) geen gevaar."]],[5,["Het mag wel de Moeder van alles onder den Hemel worden genoemd."]],[6,["Ik weet niet Zijnen naam."]],[7,["(Maar) Het een karakter willende geven noem ik Het Tao."]],[8,["Wil ik Het met alle geweld omschrijven, dan noem ik Het groot."]],[9,["Van groot noem ik Het vervliedend."]],[10,["Van vervliedend noem ik Het vèr."]],[11,["Van vèr noem ik Het (weer) terugkeerend."]],[12,["Daarom, Tao is groot, de Hemel is groot, de Aarde is groot, de Koning is groot."]],[13,["Er zijn vier groote machten in de wereld, en de Koning is er één van."]],[14,["De wet van den Koning is van de Aarde; de wet van de Aarde is van den Hemel; de wet van den Hemel is van Tao."]],[15,["(Maar) de Wet van Tao is van-zich-zelven."]]],"en":[[1,["There was something undefined and complete, coming into existence before Heaven and Earth. How still it was and formless, standing alone, and undergoing no change, reaching everywhere and in no danger (of being exhausted)! It may be regarded as the Mother of all things."]],[2,["I do not know its name, and I give it the designation of the Tao (the Way or Course). Making an effort (further) to give it a name I call it The Great."]],[3,["Great, it passes on (in constant flow). Passing on, it becomes remote. Having become remote, it returns. Therefore the Tao is great; Heaven is great; Earth is great; and the (sage) king is also great. In the universe there are four that are great, and the (sage) king is one of them."]],[4,["Man takes his law from the Earth; the Earth takes its law from Heaven; Heaven takes its law from the Tao. The law of the Tao is its being what it is."]]],"no":[{"v":[2],"l":"2","t":"Ik vertaal hier „tsih” met rustig-kalm, omdat het zowel rustig als kalm betekent, en dit eigenlijk nog gecombineerd met „eenzaam”.—En „liao”, dat „leeg, stil” betekent, vertaal ik, evenals Julien, op gezag van enige chinese commentators, met „onstoffelijk”.","t98":"Ik vertaal hier „tsih” met rustig-kalm, omdat het zoowel rustig als kalm beteekent, en dit eigenlijk nog gecombineerd met „eenzaam”.—En „liao”, dat „leeg, stil” beteekent, vertaal ik, evenals Julien, op gezag van eenige chineesche commentators, met „onstoffelijk”."},{"v":[4],"l":"4","t":"Lo Tchin Kong voegt hier aan toe: „De warmte van de zon verbrandt Het niet, de vocht beschimmelt Het niet. Het gaat door alle lichamen en is aan geen enkel gevaar blootgesteld” (Julien).","t98":"Lo Tchin Kong voegt hier aan toe: „De warmte van de zon verbrandt Het niet, de vocht beschimmelt Het niet. Het gaat door alle lichamen en is aan geen enkel gevaar blootgesteld” (Julien)."},{"v":[5],"l":"5","t":"Vergelijk Hoofdstuk I, 2.","t98":"Vergelijk Hoofdstuk I, 2."},{"v":[6,7],"l":"6 en 7","t":"Deze teksten zijn wel het duidelijkste bewijs, dat Tao hier niet, als in Confucius, kan vertaald worden en in Lao Tszʼ geen „Weg” of „Pad” betekent. Met „een karakter” wordt hier bedoeld „een chinees schriftteken.”","t98":"Deze teksten zijn wel het duidelijkste bewijs, dat Tao hier niet, als in Confucius, kan vertaald worden en in Lao Tszʼ geen „Weg” of „Pad” beteekent. Met „een karakter” wordt hier bedoeld „een chineesch schriftteeken.”"},{"v":[10],"l":"10","t":"„Ver” hier meer in den zin van „die ver gaat, die in de verte gaat, als in de griekse werkwoorden τηλέπορος, μακροπορος (Julien).","t98":"„Ver” hier meer in den zin van „die ver gaat, die in de verte gaat, als in de grieksche werkwoorden τηλέπορος, μακροπορος (Julien)."},{"v":[14,15],"l":"14 en 15","t":"Op Tao komt dus alles neer, en wie koning wil zijn kan dus niet buiten Tao.","t98":"Op Tao komt dus alles neer, en wie koning wil zijn kan dus niet buiten Tao."}]},{"n":26,"r":"XXVI","d":"Tao","zh":["重為輕根，靜為躁君。","是以聖人終日行不離輜重。","雖有榮觀，燕處超然。","奈何萬乘之主，而以身輕天下？","輕則失本，躁則失君。"],"nl":[[1,["Het zware is de wortel van het lichte; de rust is Overheerser van de beweging."]],[2,["Daarom laat de Wijze nooit af van zwaarte en rust."]],[3,["Al is er nóg zoveel schoons te zien, hij blijft wonen in de rust, en gaat er vér van."]],[4,["Maar helaas, de Heer van tienduizend wagenen acht het Rijk licht om zich zelf."]],[5,["Door ze gering te achten verliest hij zijne ministers, door zich te laten medeslepen verliest hij de heerschappij."]]],"n98":[[1,["Het zware is de wortel van het lichte; de rust is Overheerser van de beweging."]],[2,["Daarom laat de Wijze nooit af van zwaarte en rust."]],[3,["Al is er nóg zooveel schoons te zien, hij blijft wonen in de rust, en gaat er vér van."]],[4,["Maar helaas, de Heer van tienduizend wagenen acht het Rijk licht om zich zelf."]],[5,["Door ze gering te achten verliest hij zijne ministers, door zich te laten medesleepen verliest hij de heerschappij."]]],"en":[[1,["Gravity is the root of lightness; stillness, the ruler of movement."]],[2,["Therefore a wise prince, marching the whole day, does not go far from his baggage waggons. Although he may have brilliant prospects to look at, he quietly remains (in his proper place), indifferent to them. How should the lord of a myriad chariots carry himself lightly before the kingdom? If he do act lightly, he has lost his root (of gravity); if he proceed to active movement, he will lose his throne."]]],"no":[{"v":[1],"l":"1","t":"„Beweging” hier vooral als haastige, overijlde beweging. De geleerde commentator Peh Yü Shen van een mijner edities, die heel korte, maar treffende commentaren geeft, merkt bij dezen tekst op: „Het hart is de wortel (lett. voorvader) van alle dingen, en Tao is het eigenlijke Wezen van het hart”.","t98":"„Beweging” hier vooral als haastige, overijlde beweging. De geleerde commentator Peh Yü Shen van een mijner edities, die heel korte, maar treffende commentaren geeft, merkt bij dezen tekst op: „Het hart is de wortel (lett. voorvader) van alle dingen, en Tao is het eigenlijke Wezen van het hart”."},{"v":[3],"l":"3","t":"Peh Yü Shen merkt hier bij op: „Het hart gaat buiten de dingen”.","t98":"Peh Yü Shen merkt hier bij op: „Het hart gaat buiten de dingen”."},{"v":[4],"l":"4","t":"Vele commentators menen dat met dezen „Heer van tienduizend wagenen” de Keizer wordt bedoeld. Peh Yü Shen ziet er echter weder „het hart” in.","t98":"Vele commentators meenen dat met dezen „Heer van tienduizend wagenen” de Keizer wordt bedoeld. Peh Yü Shen ziet er echter weder „het hart” in."}]},{"n":27,"r":"XXVII","d":"Tao","zh":["善行無轍迹，善言無瑕讁；善數不用籌策；善閉無關楗而不可開，善結無繩約而不可解。","是以聖人常善救人，故無棄人；常善救物，故無棄物，是謂襲明。","故善人者，不善人之師；不善人者，善人之資。","不貴其師，不愛其資，雖智大迷，是謂要妙。"],"nl":[[1,["Hij, die goed (in Tao) gaat, laat geen sporen achter. Hij, die goed spreekt, geeft geen reden tot blaam. Hij, die goed telt, gebruikt geen bamboe-tabletjes. Hij, die goed sluit, gebruikt geen houten bouten, en toch kan men niet openen (wat hij sluit). Hij, die goed bindt, gebruikt geen koorden, en toch kan men niet losmaken (wat hij bindt)."]],[2,["Daarom, de Wijze munt altijd uit in het helpen van mensen, en hij verwerpt er géén; hij munt altijd uit in het helpen van dingen, en hij verwerpt er geen. Dit noem ik dubbel verlicht zijn."]],[3,["Daarom, de goede is de leermeester van den slechte; de slechte is de leermeester van den goede."]],[4,["Hij, die geen waarde hecht aan macht, en niet houdt van weelde, al moge zijn wijsheid als dom schijnen, heeft de Al-Wijsheid verkregen."]]],"n98":[[1,["Hij, die goed (in Tao) gaat, laat geen sporen achter. Hij, die goed spreekt, geeft geen reden tot blaam. Hij, die goed telt, gebruikt geen bamboe-tabletjes. Hij, die goed sluit, gebruikt geen houten bouten, en toch kan men niet openen (wat hij sluit). Hij, die goed bindt, gebruikt geen koorden, en toch kan men niet losmaken (wat hij bindt)."]],[2,["Daarom, de Wijze munt altijd uit in het helpen van menschen, en hij verwerpt er géén; hij munt altijd uit in het helpen van dingen, en hij verwerpt er geen. Dit noem ik dubbel verlicht zijn."]],[3,["Daarom, de goede is de leermeester van den slechte; de slechte is de leermeester van den goede."]],[4,["Hij, die geen waarde hecht aan macht, en niet houdt van weelde, al moge zijn wijsheid als dom schijnen, heeft de Al-Wijsheid verkregen."]]],"en":[[1,["The skilful traveller leaves no traces of his wheels or footsteps; the skilful speaker says nothing that can be found fault with or blamed; the skilful reckoner uses no tallies; the skilful closer needs no bolts or bars, while to open what he has shut will be impossible; the skilful binder uses no strings or knots, while to unloose what he has bound will be impossible. In the same way the sage is always skilful at saving men, and so he does not cast away any man; he is always skilful at saving things, and so he does not cast away anything. This is called 'Hiding the light of his procedure.'"]],[2,["Therefore the man of skill is a master (to be looked up to) by him who has not the skill; and he who has not the skill is the helper of (the reputation of) him who has the skill. If the one did not honour his master, and the other did not rejoice in his helper, an (observer), though intelligent, might greatly err about them. This is called 'The utmost degree of mystery.'"]]],"no":[{"v":[],"l":"hoofdstuk","t":"Dit Hoofdstuk is een der duisterste uit het gehele werk, wat de constructie der chinese zinnen aangaat, en heeft, zowel van chinese als europese zijden, tot de meest verschillende en uiteenlopende verklaringen aanleiding gegeven. Ik zou dan ook niet gaarne volhouden dat mijne vertaling hier onfeilbaar is.","t98":"Dit Hoofdstuk is een der duisterste uit het geheele werk, wat de constructie der chineesche zinnen aangaat, en heeft, zoowel van chineesche als europeesche zijden, tot de meest verschillende en uiteenloopende verklaringen aanleiding gegeven. Ik zou dan ook niet gaarne volhouden dat mijne vertaling hier onfeilbaar is."},{"v":[1],"l":"1","t":"Deze eerste tekst lijkt mij duidelijk genoeg. Ik ga hier gaarne mede met den commentator Shun Yang van een mijner chinese edities, die hier in ziet de verheffing van Wu Wei (van-zelf doen) boven Wei (onnatuurlijk doen). Alles wat Wu Wei gedaan wordt, staat er figuurlijk, is onvernietigbaar. Vroeger rekende men met bamboe-tabletjes.","t98":"Deze eerste tekst lijkt mij duidelijk genoeg. Ik ga hier gaarne mede met den commentator Shun Yang van een mijner chineesche edities, die hier in ziet de verheffing van Wu Wei (van-zelf doen) boven Wei (onnatuurlijk doen). Alles wat Wu Wei gedaan wordt, staat er figuurlijk, is onvernietigbaar. Vroeger rekende men met bamboe-tabletjes."},{"v":[2],"l":"2","t":"Het „daarom” hier lijkt mij niet logisch te volgen in zinsverband met het vorige.","t98":"Het „daarom” hier lijkt mij niet logisch te volgen in zinsverband met het vorige."},{"v":[3,4],"l":"3 en 4","t":"Deze teksten zijn zeer duister in het chinees, zodat ik niet kan instaan voor de vertaling. Ik heb hier „yaou miao” met „teh Tao”, een mystieke uitdrukking voor „de Al-Wijsheid, het Al-Weten”, vertaald, op gezag van Shun Yang.","t98":"Deze teksten zijn zeer duister in het chineesch, zoodat ik niet kan instaan voor de vertaling. Ik heb hier „yaou miao” met „teh Tao”, eene mystieke uitdrukking voor „de Al-Wijsheid, het Al-Weten”, vertaald, op gezag van Shun Yang."}]},{"n":28,"r":"XXVIII","d":"Tao","zh":["知其雄，守其雌，為天下谿。","為天下谿，常德不離，復歸於嬰兒。","知其白，守其黑，為天下式。","為天下式，常德不忒，復歸於無極。","知其榮，守其辱，為天下谷，常德乃足，復歸於樸。","樸散則為器，聖人用之，則為官長，故大制不割。"],"nl":[[1,["Hij, die zijne mannelijke kracht kent, en toch vrouwelijke zachtheid behoudt, is de vallei van het rijk."]],[2,["Als hij de vallei is van het rijk, zal de altijddurende deugd hem niet verlaten, en hij zal terugkeren tot den simpelen staat van een kind."]],[3,["Hij, die zijn licht kent, en toch in de schaduw blijft, is het voorbeeld voor het rijk."]],[4,["Is hij het voorbeeld van het rijk, dan zal de altijddurende deugd in hem niet falen, en hij keert terug tot het eindeloze."]],[5,["Hij, die zijne glorie weet en blijft in de schande, is de vallei van het rijk."]],[6,["Als hij de vallei is van het rijk zal de altijddurende deugd in hem haar volmaaktheid bereiken, en hij zal tot den oorspronkelijken, simpelen staat terugkeren."]],[7,["Toen de oorspronkelijke, simpele staat zich verspreidde, zijn de dingen gevormd."]],[8,["De Wijze, als hij (dit alles) gebruikt, zal het hoofd der mandarijnen zijn."]],[9,["Hij regeert met grandeur, en kwetst niemand."]]],"n98":[[1,["Hij, die zijne mannelijke kracht kent, en toch vrouwelijke zachtheid behoudt, is de vallei van het rijk."]],[2,["Als hij de vallei is van het rijk, zal de altijddurende deugd hem niet verlaten, en hij zal terugkeeren tot den simpelen staat van een kind."]],[3,["Hij, die zijn licht kent, en toch in de schaduw blijft, is het voorbeeld voor het rijk."]],[4,["Is hij het voorbeeld van het rijk, dan zal de altijddurende deugd in hem niet falen, en hij keert terug tot het eindelooze."]],[5,["Hij, die zijne glorie weet en blijft in de schande, is de vallei van het rijk."]],[6,["Als hij de vallei is van het rijk zal de altijddurende deugd in hem haar volmaaktheid bereiken, en hij zal tot den oorspronkelijken, simpelen staat terugkeeren."]],[7,["Toen de oorspronkelijke, simpele staat zich verspreidde, zijn de dingen gevormd."]],[8,["De Wijze, als hij (dit alles) gebruikt, zal het hoofd der mandarijnen zijn."]],[9,["Hij regeert met grandeur, en kwetst niemand."]]],"en":[[1,["Who knows his manhood's strength,\nYet still his female feebleness maintains;\nAs to one channel flow the many drains,\nAll come to him, yea, all beneath the sky.\nThus he the constant excellence retains;\nThe simple child again, free from all stains.","Who knows how white attracts,\nYet always keeps himself within black's shade,\nThe pattern of humility displayed,\nDisplayed in view of all beneath the sky;\nHe in the unchanging excellence arrayed,\nEndless return to man's first state has made.","Who knows how glory shines,\nYet loves disgrace, nor e'er for it is pale;\nBehold his presence in a spacious vale,\nTo which men come from all beneath the sky.\nThe unchanging excellence completes its tale;\nThe simple infant man in him we hail."]],[2,["The unwrought material, when divided and distributed, forms vessels. The sage, when employed, becomes the Head of all the Officers (of government); and in his greatest regulations he employs no violent measures."]]],"no":[{"v":[1],"l":"1","t":"De „vallei” is een geliefkoosd beeld van Lao Tszʼ om uit de drukken het lage, nederige, waar toch alles zich aan onderwerpt en zich in uitstort.","t98":"De „vallei” is een geliefkoosd beeld van Lao Tszʼ om uit de drukken het lage, nederige, waar toch alles zich aan onderwerpt en zich in uitstort."}]},{"n":29,"r":"XXIX","d":"Tao","zh":["將欲取天下而為之，吾見其不得已。","天下神器，不可為也，為者敗之，執者失之。","故物或行或隨，或歔或吹。","或強或羸，或挫或隳。","是以聖人去甚，去奢，去泰。"],"nl":[[1,["Als de mens het rijk wil volmaken met actie, zie ik dat hij niet slaagt."]],[2,["Het rijk is een heilige offervaas, waaraan men niet mag werken."]],[3,["Werkt men er aan, dan bederft men haar, grijpt men er naar, dan verliest men haar."]],[4,["Daarom, onder de mensen zijn er die vooruitgaan en die volgen, die verwarmen en die verkoelen, die sterk zijn en die zwak zijn, die bewegen en die stilstaan."]],[5,["Daarom, de Wijze verwerpt den wellust, de luxe en de buitensporigheid."]]],"n98":[[1,["Als de mensch het rijk wil volmaken met actie, zie ik dat hij niet slaagt."]],[2,["Het rijk is een heilige offervaas, waaraan men niet mag werken."]],[3,["Werkt men er aan, dan bederft men haar, grijpt men er naar, dan verliest men haar."]],[4,["Daarom, onder de menschen zijn er die vooruitgaan en die volgen, die verwarmen en die verkoelen, die sterk zijn en die zwak zijn, die bewegen en die stilstaan."]],[5,["Daarom, de Wijze verwerpt den wellust, de luxe en de buitensporigheid."]]],"en":[[1,["If any one should wish to get the kingdom for himself, and to effect this by what he does, I see that he will not succeed. The kingdom is a spirit-like thing, and cannot be got by active doing. He who would so win it destroys it; he who would hold it in his grasp loses it."]],[2,["The course and nature of things is such that\nWhat was in front is now behind;\nWhat warmed anon we freezing find.\nStrength is of weakness oft the spoil;\nThe store in ruins mocks our toil.","Hence the sage puts away excessive effort, extravagance, and easy indulgence."]]],"no":[{"v":[1,2],"l":"1 en 2","t":"Alleen met „Wu Wei” is het rijk te regeren. De grondvesten van het rijk zijn de diviene principes van Tao, dus dingen, die van-zelf, natuurlijk uit Tao voortvloeien. Alleen door dus „Wu Wei” te zijn, d.i. in alles gehoorzaam aan het rythme van Tao, is een goede regering mogelijk.","t98":"Alleen met „Wu Wei” is het rijk te regeeren. De grondvesten van het rijk zijn de diviene principes van Tao, dus dingen, die van-zelf, natuurlijk uit Tao voortvloeien. Alleen door dus „Wu Wei” te zijn, d.i. in alles gehoorzaam aan het rythme van Tao, is een goede regeering mogelijk."},{"v":[4],"l":"4","t":"De bedoeling is, dat de vorst aan de zo verschillend aangelegde mensen vrijheid moet laten om hun eigen natuur te volgen, maar ze niet met alle geweld anders moet maken dan ze zijn.","t98":"De bedoeling is, dat de vorst aan de zoo verschillend aangelegde menschen vrijheid moet laten om hun eigen natuur te volgen, maar ze niet met alle geweld anders moet maken dan ze zijn."}]},{"n":30,"r":"XXX","d":"Tao","zh":["以道佐人主者，不以兵強天下。","其事好還。","師之所處，荊棘生焉。","大軍之後，必有凶年。","善有果而已，不敢以取強。","果而勿矜，果而勿伐，果而勿驕。","果而不得已，果而勿強。","物壯則老，是謂不道，不道早已。"],"nl":[[1,["Zij, die den heerser over mensen helpen in Tao, onderwerpen het rijk niet met geweld van wapenen."]],[2,["Wat men aan de mensen doet krijgt men op dezelfde manier terug als het gegeven is."]],[3,["Overal, waar legers zijn geweest, groeien doornen en distels."]],[4,["Op grote veldtochten volgen stellig jaren van hongersnood."]],[5,["De ware Goede slaat ééns met vrucht een slag en houdt dán op, maar durft niet met ruw geweld doorgaan."]],[6,["Hij slaat één goeden slag, maar verheft zich niet."]],[7,["Hij slaat één goeden slag, maar roemt er niet over."]],[8,["Hij slaat één goeden slag, maar is er niet trots over."]],[9,["Hij slaat één goeden slag, maar alleen omdat hij niet anders kan."]],[10,["Hij slaat één goeden slag, maar wil niet sterk en geweldig lijken."]],[11,["Vanaf het toppunt van kracht worden de (mensen en) dingen oud, dat wil zeggen, zij zijn niet gelijk aan Tao, en wat niet gelijk is aan Tao neemt een spoedig einde."]]],"n98":[[1,["Zij, die den heerscher over menschen helpen in Tao, onderwerpen het rijk niet met geweld van wapenen."]],[2,["Wat men aan de menschen doet krijgt men op dezelfde manier terug als het gegeven is."]],[3,["Overal, waar legers zijn geweest, groeien doornen en distels."]],[4,["Op groote veldtochten volgen stellig jaren van hongersnood."]],[5,["De ware Goede slaat ééns met vrucht een slag en houdt dán op, maar durft niet met ruw geweld doorgaan."]],[6,["Hij slaat één goeden slag, maar verheft zich niet."]],[7,["Hij slaat één goeden slag, maar roemt er niet over."]],[8,["Hij slaat één goeden slag, maar is er niet trotsch over."]],[9,["Hij slaat één goeden slag, maar alleen omdat hij niet anders kan."]],[10,["Hij slaat één goeden slag, maar wil niet sterk en geweldig lijken."]],[11,["Vanaf het toppunt van kracht worden de (menschen en) dingen oud, dat wil zeggen, zij zijn niet gelijk aan Tao, en wat niet gelijk is aan Tao neemt een spoedig einde."]]],"en":[[1,["He who would assist a lord of men in harmony with the Tao will not assert his mastery in the kingdom by force of arms. Such a course is sure to meet with its proper return."]],[2,["Wherever a host is stationed, briars and thorns spring up. In the sequence of great armies there are sure to be bad years."]],[3,["A skilful (commander) strikes a decisive blow, and stops. He does not dare (by continuing his operations) to assert and complete his mastery. He will strike the blow, but will be on his guard against being vain or boastful or arrogant in consequence of it. He strikes it as a matter of necessity; he strikes it, but not from a wish for mastery."]],[4,["When things have attained their strong maturity they become old. This may be said to be not in accordance with the Tao: and what is not in accordance with it soon comes to an end."]]],"no":[]},{"n":31,"r":"XXXI","d":"Tao","zh":["夫佳兵者，不祥之器，物或惡之，故有道者不處。","君子居則貴左，用兵則貴右。","兵者不祥之器，非君子之器，不得已而用之，恬淡為上。","勝而不美，而美之者，是樂殺人。","夫樂殺人者，則不可以得志於天下矣。","吉事尚左，凶事尚右。","偏將軍居左，上將軍居右，言以喪禮處之。","殺人之眾，以哀悲泣之，戰勝，以喪禮處之。"],"nl":[[1,["De beste wapenen zijn instrumenten van onheil."]],[2,["Allen verachten ze, daarom, zij die Tao bezitten houden er zich niet mede op."]],[3,["In de woning van den Kiün Tszʼ is de linkerplaats de ereplaats, hij, die soldaten gebruikt, eert de rechterplaats."]],[4,["Wapenen zijn instrumenten van onheil, geen instrumenten van den Kiün Tszʼ."]],[5,["Deze gebruikt ze alléén als ’t niet anders kán, en de kalmte en de rust zijn voor hem het hoogste."]],[6,["Overwint hij, dan verblijdt hij er zich niet over, want zich daarin verblijden zou zijn houden van mensen-doodslag."]],[7,["En wie houdt van doodslag kan nooit zijn doel bereiken in de goede regering van het rijk."]],[8,["In alles, wat geluk aanbrengt, is de linkerplaats de hoogste, in al wat ongeluk aanbrengt de rechterplaats."]],[9,["De onderbevelhebber neemt de linkerplaats in, de opperbevelhebber de rechter."]],[10,["Dat is, men plaatst hen volgens de ceremonieën van den rouwdienst."]],[11,["Hij, die een grote menigte mensen gedood heeft, moet over hen rouwen en wenen."]],[12,["Hem, die een veldslag gewonnen heeft, moet men plaatsen als in de ceremonieën voor de doden."]]],"n98":[[1,["De beste wapenen zijn instrumenten van onheil."]],[2,["Allen verachten ze, daarom, zij die Tao bezitten houden er zich niet mede op."]],[3,["In de woning van den Kiün Tszʼ is de linkerplaats de eereplaats, hij, die soldaten gebruikt, eert de rechterplaats."]],[4,["Wapenen zijn instrumenten van onheil, geen instrumenten van den Kiün Tszʼ."]],[5,["Deze gebruikt ze alléén als ’t niet anders kán, en de kalmte en de rust zijn voor hem het hoogste."]],[6,["Overwint hij, dan verblijdt hij er zich niet over, want zich daarin verblijden zou zijn houden van menschen-doodslag."]],[7,["En wie houdt van doodslag kan nooit zijn doel bereiken in de goede regeering van het rijk."]],[8,["In alles, wat geluk aanbrengt, is de linkerplaats de hoogste, in al wat ongeluk aanbrengt de rechterplaats."]],[9,["De onderbevelhebber neemt de linkerplaats in, de opperbevelhebber de rechter."]],[10,["Dat is, men plaatst hen volgens de ceremonieën van den rouwdienst."]],[11,["Hij, die een groote menigte menschen gedood heeft, moet over hen rouwen en weenen."]],[12,["Hem, die een veldslag gewonnen heeft, moet men plaatsen als in de ceremonieën voor de dooden."]]],"en":[[1,["Now arms, however beautiful, are instruments of evil omen, hateful, it may be said, to all creatures. Therefore they who have the Tao do not like to employ them."]],[2,["The superior man ordinarily considers the left hand the most honourable place, but in time of war the right hand. Those sharp weapons are instruments of evil omen, and not the instruments of the superior man;--he uses them only on the compulsion of necessity. Calm and repose are what he prizes; victory (by force of arms) is to him undesirable. To consider this desirable would be to delight in the slaughter of men; and he who delights in the slaughter of men cannot get his will in the kingdom."]],[3,["On occasions of festivity to be on the left hand is the prized position; on occasions of mourning, the right hand. The second in command of the army has his place on the left; the general commanding in chief has his on the right;--his place, that is, is assigned to him as in the rites of mourning. He who has killed multitudes of men should weep for them with the bitterest grief; and the victor in battle has his place (rightly) according to those rites."]]],"no":[{"v":[3],"l":"3","t":"De ereplaats is ook thans nog bij de chinezen de linkerzijde. De gast zit ter linkerzijde van den gastheer.","t98":"De eereplaats is ook thans nog bij de chineezen de linkerzijde. De gast zit ter linkerzijde van den gastheer."},{"v":[6],"l":"6","t":"Letterlijk staat er niet „verblijdt hij er zich niet over” maar „vindt hij het niet mooi”.","t98":"Letterlijk staat er niet „verblijdt hij er zich niet over” maar „vindt hij het niet mooi”."},{"v":[12],"l":"12","t":"Als in den ouden tijd een generaal een veldslag gewonnen had, nam hij den rouw aan, en ging hij in den tempel, in rouwklederen, wenende de ceremonieën der doden verrichten.","t98":"Als in den ouden tijd een generaal een veldslag gewonnen had, nam hij den rouw aan, en ging hij in den tempel, in rouwkleederen, weenende de ceremonieën der dooden verrichten."}]},{"n":32,"r":"XXXII","d":"Tao","zh":["道常無名，樸雖小，天下莫能臣也。","侯王若能守之，萬物將自賓。","天地相合，以降甘露，民莫之令而自均。","始制有名，名亦既有，夫亦將知止，知止所以不殆。","譬道之在天下，猶川谷之於江海。"],"nl":[[1,["Tao is eeuwig en heeft geen naam."]],[2,["Ofschoon zo simpel-klein van natuur durft de gehele wereld Het niet te onderwerpen."]],[3,["Als prinsen en koningen Het konden handhaven zouden de tienduizend wezens en dingen zich aan hen onderwerpen."]],[4,["Hemel en Aarde zouden zich verenigen, en een zoeten dauw doen nederdalen, en het volk zou zonder bevelen van zelf tot harmonie komen."]],[5,["Van (het moment) dat Tao verdeeld was, kreeg Het een naam."]],[6,["Die naam, eenmaal bepaald zijnde, moet men zich weten in te houden."]],[7,["Wie zich weet in te houden komt in géén gevaar."]],[8,["Tao is verspreid in het Heelal."]],[9,["Alles keert tot Tao terug, als de bergstromen tot de rivieren en zeeën."]]],"n98":[[1,["Tao is eeuwig en heeft geen naam."]],[2,["Ofschoon zoo simpel-klein van natuur durft de geheele wereld Het niet te onderwerpen."]],[3,["Als prinsen en koningen Het konden handhaven zouden de tienduizend wezens en dingen zich aan hen onderwerpen."]],[4,["Hemel en Aarde zouden zich vereenigen, en een zoeten dauw doen nederdalen, en het volk zou zonder bevelen van zelf tot harmonie komen."]],[5,["Van (het moment) dat Tao verdeeld was, kreeg Het een naam."]],[6,["Die naam, eenmaal bepaald zijnde, moet men zich weten in te houden."]],[7,["Wie zich weet in te houden komt in géén gevaar."]],[8,["Tao is verspreid in het Heelal."]],[9,["Alles keert tot Tao terug, als de bergstroomen tot de rivieren en zeeën."]]],"en":[[1,["The Tao, considered as unchanging, has no name."]],[2,["Though in its primordial simplicity it may be small, the whole world dares not deal with (one embodying) it as a minister. If a feudal prince or the king could guard and hold it, all would spontaneously submit themselves to him."]],[3,["Heaven and Earth (under its guidance) unite together and send down the sweet dew, which, without the directions of men, reaches equally everywhere as of its own accord."]],[4,["As soon as it proceeds to action, it has a name. When it once has that name, (men) can know to rest in it. When they know to rest in it, they can be free from all risk of failure and error."]],[5,["The relation of the Tao to all the world is like that of the great rivers and seas to the streams from the valleys."]]],"no":[{"v":[1],"l":"1","t":"Zie de noot bij Hfdst. XXV 6 en 7.","t98":"Zie de noot bij Hfdst. XXV 6 en 7."},{"v":[3],"l":"3","t":"Letterlijk staat er niet „zich onderwerpen” maar „zouden alle dingen (d.i. de gehele creatie) hun gasten zijn.”","t98":"Letterlijk staat er niet „zich onderwerpen” maar „zouden alle dingen (d.i. de geheele creatie) hun gasten zijn.”"},{"v":[5],"l":"5","t":"Toen Tao, het (schijnbaar) zo simpel-kleine (want één-in-zich-zelve), zich verdeelde (verspreidde), ontstond de creatie.","t98":"Toen Tao, het (schijnbaar) zoo simpel-kleine (want één-in-zich-zelve), zich verdeelde (verspreidde), ontstond de creatie."},{"v":[6],"l":"6","t":"Dit betekent hier „De creatie eenmaal ontstaan zijnde,” dus ook „de wezens eenmaal uit Tao geboren zijnde”. „Inhouden” is hier „zich aan Tao houden,” zich niet door de actie van begeerten, hartstochten enz. laten medeslepen. De commentator Peh Yü Shen van een mijner edities, wiens uitstekende, geserreerde commentaren ik reeds menigmaal aanhaalde, ziet bij tekst 3 in de „koningen en hertogen” slechts een symbolieke uitdrukking voor „het hart”, in „de tienduizend dingen” de gehele creatie en in „het volk” een uitdrukking voor „het lichaam.” In „het verspreiden van Tao” ziet hij een verborgen betekenis voor „het zich verdelen van Tao in de menselijke harten.” Zodat hij in dit Hoofdstuk eigenlijk de bedoeling ziet, dat als het hart slechts Tao behoudt, en daar nooit buiten gaat, het lichaam ook vanzelf tot rust en harmonie komt, en het hart dan de gastheer, de Meester is over alle wezens en dingen in de creatie, die als zijne gasten zijn. Ik teken hierbij aan dat „hart” in ’t chinees dikwijls synoniem is met ziel.","t98":"Dit beteekent hier „De creatie eenmaal ontstaan zijnde,” dus ook „de wezens eenmaal uit Tao geboren zijnde”. „Inhouden” is hier „zich aan Tao houden,” zich niet door de actie van begeerten, hartstochten enz. laten medesleepen. De commentator Peh Yü Shen van een mijner edities, wiens uitstekende, geserreerde commentaren ik reeds menigmaal aanhaalde, ziet bij tekst 3 in de „koningen en hertogen” slechts een symbolieke uitdrukking voor „het hart”, in „de tienduizend dingen” de geheele creatie en in „het volk” een uitdrukking voor „het lichaam.” In „het verspreiden van Tao” ziet hij eene verborgen beteekenis voor „het zich verdeelen van Tao in de menschelijke harten.” Zoodat hij in dit Hoofdstuk eigenlijk de bedoeling ziet, dat als het hart slechts Tao behoudt, en daar nooit buiten gaat, het lichaam ook vanzelf tot rust en harmonie komt, en het hart dan de gastheer, de Meester is over alle wezens en dingen in de creatie, die als zijne gasten zijn. Ik teeken hierbij aan dat „hart” in ’t chineesch dikwijls synoniem is met ziel."}]},{"n":33,"r":"XXXIII","d":"Tao","zh":["知人者智，自知者明。","勝人者有力，自勝者強。","知足者富。","強行者有志。","不失其所者久。","死而不亡者壽。"],"nl":[[1,["Hij, die de mensen kent, is verstandig, maar hij, die zichzelf kent, is verlicht."]],[2,["Hij, die andere mensen overwint, is sterk, maar hij, die zichzelf overwint, is almachtig."]],[3,["Hij, die zich weet te matigen, is rijk, maar hij, die energiek is, heeft kracht van wil."]],[4,["Hij, die niet van zijn essentiële natuur afwijkt, zal lang leven, maar hij, die sterft, en toch niet verloren gaat, geniet het eeuwigdurend leven."]]],"n98":[[1,["Hij, die de menschen kent, is verstandig, maar hij, die zichzelf kent, is verlicht."]],[2,["Hij, die andere menschen overwint, is sterk, maar hij, die zichzelf overwint, is almachtig."]],[3,["Hij, die zich weet te matigen, is rijk, maar hij, die energiek is, heeft kracht van wil."]],[4,["Hij, die niet van zijn essentieele natuur afwijkt, zal lang leven, maar hij, die sterft, en toch niet verloren gaat, geniet het eeuwigdurend leven."]]],"en":[[1,["He who knows other men is discerning; he who knows himself is intelligent. He who overcomes others is strong; he who overcomes himself is mighty. He who is satisfied with his lot is rich; he who goes on acting with energy has a (firm) will."]],[2,["He who does not fail in the requirements of his position, continues long; he who dies and yet does not perish, has longevity."]]],"no":[{"v":[4],"l":"4","t":"Letterlijk staat er: „hij, die niet verliest wat hij gekregen heeft,” dus hij, die niet van zijne essentiële natuur afwijkt, zal lang leven. De bedoeling van den gehelen tekst, zoals vele chinese commentaren haar dan ook geven, zal wel deze zijn: „Het animale leven vergaat, maar de ziel blijft altijd.”","t98":"Letterlijk staat er: „hij, die niet verliest wat hij gekregen heeft,” dus hij, die niet van zijne essentieele natuur afwijkt, zal lang leven. De bedoeling van den geheelen tekst, zooals vele chineesche commentaren haar dan ook geven, zal wel deze zijn: „Het animale leven vergaat, maar de ziel blijft altijd.”"}]},{"n":34,"r":"XXXIV","d":"Tao","zh":["大道氾兮，其可左右。","萬物恃之而生而不辭，功成不名有。","衣養萬物而不為主，常無欲，可名於小；萬物歸焉而不為主，可名為大。","以其終不自為大，故能成其大。"],"nl":[[1,["Hoe oneindig strekt Tao zich uit!"]],[2,["Het kan naar links gaan, het kan naar rechts gaan."]],[3,["Alle wezens steunen op Tao om geboren te worden, en Het weigert géén."]],[4,["Als het werk volbracht is, noemt Tao het niet het Zijne."]],[5,["Het heeft alle wezens lief, en voedt ze, en beschouwt zich toch niet als hun Meester."]],[6,["Het is eeuwig zonder begeerte; men zou Het (dus) klein kunnen noemen."]],[7,["Alle wezens keren er toe terug, en toch beschouwt Het zich niet als hun Meester, men zou Het (dus) groot kunnen noemen."]],[8,["Daarom doet de Wijze zijn gehele leven lang niet groot, en daardoor juist volmaakt hij zijne grootheid."]]],"n98":[[1,["Hoe oneindig strekt Tao zich uit!"]],[2,["Het kan naar links gaan, het kan naar rechts gaan."]],[3,["Alle wezens steunen op Tao om geboren te worden, en Het weigert géén."]],[4,["Als het werk volbracht is, noemt Tao het niet het Zijne."]],[5,["Het heeft alle wezens lief, en voedt ze, en beschouwt zich toch niet als hun Meester."]],[6,["Het is eeuwig zonder begeerte; men zou Het (dus) klein kunnen noemen."]],[7,["Alle wezens keeren er toe terug, en toch beschouwt Het zich niet als hun Meester, men zou Het (dus) groot kunnen noemen."]],[8,["Daarom doet de Wijze zijn geheele leven lang niet groot, en daardoor juist volmaakt hij zijne grootheid."]]],"en":[[1,["All-pervading is the Great Tao! It may be found on the left hand and on the right."]],[2,["All things depend on it for their production, which it gives to them, not one refusing obedience to it. When its work is accomplished, it does not claim the name of having done it. It clothes all things as with a garment, and makes no assumption of being their lord;--it may be named in the smallest things. All things return (to their root and disappear), and do not know that it is it which presides over their doing so;--it may be named in the greatest things."]],[3,["Hence the sage is able (in the same way) to accomplish his great achievements. It is through his not making himself great that he can accomplish them."]]],"no":[{"v":[],"l":"hoofdstuk","t":"Men vergelijke dit Hfdst. met Hfdst. X.","t98":"Men vergelijke dit Hfdst. met Hfdst. X."},{"v":[8],"l":"8","t":"Men vergelijke in Thomas à Kempis’ „Imitation de Jésus Christ”: „Vraiment grand est celui qui en soi-même est petit et tient pour néant tout faîte d’honneur.” (Ch. 3.)","t98":"Men vergelijke in Thomas à Kempis’ „Imitation de Jésus Christ”: „Vraiment grand est celui qui en soi-même est petit et tient pour néant tout faîte d’honneur.” (Ch. 3.)"}]},{"n":35,"r":"XXXV","d":"Tao","zh":["執大象，天下往。","往而不害，安平太。","樂與餌，過客止。","道之出口，淡乎其無味，視之不足見，聽之不足聞，用之不足既。"],"nl":[[1,["Alle volken van het rijk stromen toe naar hem, die de grote conceptie van Tao kan bevatten."]],[2,["Zij stromen toe, en komen niet in gevaar, en hij zal ze tot rust en vrede brengen."]],[3,["Voor muziek en fijne gerechten houdt de voorbijgaande vreemdeling op."]],[4,["(Maar) als Tao uit onzen mond komt lijkt Het flauw en zonder smaak."]],[5,["Wij kijken er naar, en zien Het niet duidelijk; wij luisteren er naar, en horen Het niet genoeg; wij willen Het (geheel) gebruiken, maar Het is onuitputtelijk."]]],"n98":[[1,["Alle volken van het rijk stroomen toe naar hem, die de groote conceptie van Tao kan bevatten."]],[2,["Zij stroomen toe, en komen niet in gevaar, en hij zal ze tot rust en vrede brengen."]],[3,["Voor muziek en fijne gerechten houdt de voorbijgaande vreemdeling op."]],[4,["(Maar) als Tao uit onzen mond komt lijkt Het flauw en zonder smaak."]],[5,["Wij kijken er naar, en zien Het niet duidelijk; wij luisteren er naar, en hooren Het niet genoeg; wij willen Het (geheel) gebruiken, maar Het is onuitputtelijk."]]],"en":[[1,["To him who holds in his hands the Great Image (of the invisible Tao), the whole world repairs. Men resort to him, and receive no hurt, but (find) rest, peace, and the feeling of ease."]],[2,["Music and dainties will make the passing guest stop (for a time). But though the Tao as it comes from the mouth, seems insipid and has no flavour, though it seems not worth being looked at or listened to, the use of it is inexhaustible."]]],"no":[]},{"n":36,"r":"XXXVI","d":"Tao","zh":["將欲歙之，必固張之；將欲弱之，必固強之；將欲廢之，必固興之；將欲奪之，必固與之。","是謂微明。","柔弱勝剛強。","魚不可脫於淵，國之利器不可以示人。"],"nl":[[1,["Als een ding gaat contracteren, moet het stellig oorspronkelijk expansie hebben gehad."]],[2,["Als een ding gaat verzwakken, moet het stellig eerst sterkte hebben gehad."]],[3,["Als een ding gaat vervallen moet het stellig eerst in bloei zijn geweest."]],[4,["Als iemand op ’t punt staat beroofd te worden, moet hem stellig eerst gegeven zijn."]],[5,["Dit noem ik een vage, en (tegelijk) heldere leer."]],[6,["Het zachte overwint het harde, het zwakke overwint het sterke."]],[7,["Vissen kunnen niet uit het water worden genomen; de instrumenten van de regering kunnen niet aan het volk worden gegeven."]]],"n98":[[1,["Als een ding gaat contracteeren, moet het stellig oorspronkelijk expansie hebben gehad."]],[2,["Als een ding gaat verzwakken, moet het stellig eerst sterkte hebben gehad."]],[3,["Als een ding gaat vervallen moet het stellig eerst in bloei zijn geweest."]],[4,["Als iemand op ’t punt staat beroofd te worden, moet hem stellig eerst gegeven zijn."]],[5,["Dit noem ik een vage, en (tegelijk) heldere leer."]],[6,["Het zachte overwint het harde, het zwakke overwint het sterke."]],[7,["Visschen kunnen niet uit het water worden genomen; de instrumenten van de regeering kunnen niet aan het volk worden gegeven."]]],"en":[[1,["When one is about to take an inspiration, he is sure to make a (previous) expiration; when he is going to weaken another, he will first strengthen him; when he is going to overthrow another, he will first have raised him up; when he is going to despoil another, he will first have made gifts to him:--this is called 'Hiding the light (of his procedure).'"]],[2,["The soft overcomes the hard; and the weak the strong."]],[3,["Fishes should not be taken from the deep; instruments for the profit of a state should not be shown to the people."]]],"no":[{"v":[6],"l":"6","t":"Daar het uitgezette gaat contracteren, het sterke verzwakken, het bloeiende vervallen, enz., zo is het ook duidelijk, dat het zachte het harde overwint.","t98":"Daar het uitgezette gaat contracteeren, het sterke verzwakken, het bloeiende vervallen, enz., zoo is het ook duidelijk, dat het zachte het harde overwint."},{"v":[7],"l":"7","t":"Het verband van dezen tekst met het vorige is mij niet recht duidelijk. Mijn commentator zegt dat „vissen kunnen niet uit het water worden genomen” een symbolische uitdrukking is voor „de ziel kan niet buiten Tao gaan”.","t98":"Het verband van dezen tekst met het vorige is mij niet recht duidelijk. Mijn commentator zegt dat „visschen kunnen niet uit het water worden genomen” eene symbolische uitdrukking is voor „de ziel kan niet buiten Tao gaan”."}]},{"n":37,"r":"XXXVII","d":"Tao","zh":["道常無為而無不為。","侯王若能守之，萬物將自化。","化而欲作，吾將鎮之以無名之樸。","無名之樸，夫亦將無欲。","不欲以靜，天下將自定。"],"nl":[[1,["Tao is eeuwig Wu Wei, en toch is er niets, wat Het niet doet."]],[2,["Als koningen en vorsten Wu Wei konden blijven, zouden alle mensen zich hervormen."]],[3,["Als zij na die hervorming toch nog bewegen wilden, zou ik ze met het simpele Wezen dat geen naam heeft (Tao) bedwingen."]],[4,["Het simpele Wezen dat geen naam heeft bevrijdt ons van begeerte, en, vrij van begeerte, komen wij tot de Rust."]],[5,["En dan komt het Rijk van-zelf terecht."]]],"n98":[[1,["Tao is eeuwig Wu Wei, en toch is er niets, wat Het niet doet."]],[2,["Als koningen en vorsten Wu Wei konden blijven, zouden alle menschen zich hervormen."]],[3,["Als zij na die hervorming toch nog bewegen wilden, zou ik ze met het simpele Wezen dat geen naam heeft (Tao) bedwingen."]],[4,["Het simpele Wezen dat geen naam heeft bevrijdt ons van begeerte, en, vrij van begeerte, komen wij tot de Rust."]],[5,["En dan komt het Rijk van-zelf terecht."]]],"en":[[1,["The Tao in its regular course does nothing (for the sake of doing it), and so there is nothing which it does not do."]],[2,["If princes and kings were able to maintain it, all things would of themselves be transformed by them."]],[3,["If this transformation became to me an object of desire, I would express the desire by the nameless simplicity.","Simplicity without a name\nIs free from all external aim.\nWith no desire, at rest and still,\nAll things go right as of their will."]]],"no":[{"v":[1],"l":"1","t":"Johnson ziet hier een analogie met Hegel en zegt: „The analogy with Hegels theses of the development of the Idea, in itself, and for itself, of the logic of the movement of the spirit, and of progress as the identity of being and nought,—is obvious. The German philosopher has formulated for the West the same conceptions which are here instinctive and intuitive in the East. Lao-Tse combines with them a profoundly religious spirit, and a sense of personal liberty through cognition of the universal, as rare as it is admirable”.","t98":"Johnson ziet hier eene analogie met Hegel en zegt: „The analogy with Hegels theses of the development of the Idea, in itself, and for itself, of the logic of the movement of the spirit, and of progress as the identity of being and nought,—is obvious. The German philosopher has formulated for the West the same conceptions which are here instinctive and intuitive in the East. Lao-Tse combines with them a profoundly religious spirit, and a sense of personal liberty through cognition of the universal, as rare as it is admirable”."},{"v":[3],"l":"3","t":"Niet zeer getrouw aan den tekst, maar toch karakteristiek vertaalt Giles: „Smouldering ambition I would repress by extreme simplicity”.","t98":"Niet zeer getrouw aan den tekst, maar toch karakteristiek vertaalt Giles: „Smouldering ambition I would repress by extreme simplicity”."},{"v":[4],"l":"4","t":"Het is niet duidelijk of deze tekst misschien niet beter vertaald ware met: „Het simpele Wezen, dat geen naam heeft, heeft geen begeerte, en geen begeerte hebbende, is Het in rust”.","t98":"Het is niet duidelijk of deze tekst misschien niet beter vertaald ware met: „Het simpele Wezen, dat geen naam heeft, heeft geen begeerte, en geen begeerte hebbende, is Het in rust”."}]},{"n":38,"r":"XXXVIII","d":"Teh","zh":["上德不德，是以有德；下德不失德，是以無德。","上德無為而無以為，下德為之而有以為。","上仁為之而無以為，上義為之而有以為。","上禮為之而莫之應，則攘臂而扔之。","故失道而後德，失德而後仁，失仁而後義，失義而後禮。","夫禮者，忠信之薄，而亂之首。","前識者，道之華，而愚之始。","是以大丈夫處其厚，不居其薄；處其實，不居其華。","故去彼取此。"],"nl":[[1,["De hoogste Deugd (Teh) is geen deugd, en is dáárom juist Deugd. De lagere deugd verliest niet (het idee) deugd, en is dáárom juist geen Deugd."]],[2,["De hoogste Deugd is Wu Wei, zonder er (expres) iets voor te doen. De lagere deugd is Wei (doende) en doet (alles) met opzet."]],[3,["De hoogste Menslievendheid ageert, zonder er (expres) iets voor te doen; de hoogste Plichtmatigheid ageert, maar doet (alles) met opzet."]],[4,["De hoogste Li (Decorum) ageert, maar er is geen antwoord op. Zij wordt erkend door een beweging van den arm."]],[5,["Daarom, als Tao verloren is, komt daarna de deugd; als de deugd verloren is, komt daarna de menslievendheid; als de menslievendheid verloren is, komt daarna plichtmatigheid; als de plichtmatigheid verloren is komt daarna het decorum."]],[6,["Welnu, het decorum is maar de schors van rechtheid en waarheid, en het begin van verwarring."]],[7,["Het schijn-weten is maar de bloem van Tao, en het begin van domheid."]],[8,["Daarom houdt de wijze mens zich aan wat substantieel en niet aan wat oppervlakkig is, aan wat reëel en niet aan wat mooie schijn is. Hij verwerpt het ene en langt naar het andere."]]],"n98":[[1,["De hoogste Deugd (Teh) is geen deugd, en is dáárom juist Deugd. De lagere deugd verliest niet (het idee) deugd, en is dáárom juist geen Deugd."]],[2,["De hoogste Deugd is Wu Wei, zonder er (expres) iets voor te doen. De lagere deugd is Wei (doende) en doet (alles) met opzet."]],[3,["De hoogste Menschlievendheid ageert, zonder er (expres) iets voor te doen; de hoogste Plichtmatigheid ageert, maar doet (alles) met opzet."]],[4,["De hoogste Li (Decorum) ageert, maar er is geen antwoord op. Zij wordt erkend door een beweging van den arm."]],[5,["Daarom, als Tao verloren is, komt daarna de deugd; als de deugd verloren is, komt daarna de menschlievendheid; als de menschlievendheid verloren is, komt daarna plichtmatigheid; als de plichtmatigheid verloren is komt daarna het decorum."]],[6,["Welnu, het decorum is maar de schors van rechtheid en waarheid, en het begin van verwarring."]],[7,["Het schijn-weten is maar de bloem van Tao, en het begin van domheid."]],[8,["Daarom houdt de wijze mensch zich aan wat substantieel en niet aan wat oppervlakkig is, aan wat reëel en niet aan wat mooie schijn is. Hij verwerpt het eene en langt naar het andere."]]],"en":[[1,["(Those who) possessed in highest degree the attributes (of the Tao) did not (seek) to show them, and therefore they possessed them (in fullest measure). (Those who) possessed in a lower degree those attributes (sought how) not to lose them, and therefore they did not possess them (in fullest measure)."]],[2,["(Those who) possessed in the highest degree those attributes did nothing (with a purpose), and had no need to do anything. (Those who) possessed them in a lower degree were (always) doing, and had need to be so doing."]],[3,["(Those who) possessed the highest benevolence were (always seeking) to carry it out, and had no need to be doing so. (Those who) possessed the highest righteousness were (always seeking) to carry it out, and had need to be so doing."]],[4,["(Those who) possessed the highest (sense of) propriety were (always seeking) to show it, and when men did not respond to it, they bared the arm and marched up to them."]],[5,["Thus it was that when the Tao was lost, its attributes appeared; when its attributes were lost, benevolence appeared; when benevolence was lost, righteousness appeared; and when righteousness was lost, the proprieties appeared."]],[6,["Now propriety is the attenuated form of leal-heartedness and good faith, and is also the commencement of disorder; swift apprehension is (only) a flower of the Tao, and is the beginning of stupidity."]],[7,["Thus it is that the Great man abides by what is solid, and eschews what is flimsy; dwells with the fruit and not with the flower. It is thus that he puts away the one and makes choice of the other."]]],"no":[{"v":[],"l":"hoofdstuk","t":"Dit hoofdstuk is een van de moeilijkste van het gehele werk, en iedere vertaler heeft weer een andere versie. De meesten nemen „teh” verkrijgen voor „teh” deugd, maar dit behoeft hier in ’t geheel niet. Wie goed heeft gelezen wat ik in mijn Voorwoord over vertalingen uit het chinees heb gezegd, zal begrijpen, hoe weinig het verschil in zinswending enz. er toe doet, mits het hoofdidee maar juist is. Verscheidene vertalers hebben, op eigen beter weten, den chinesen tekst veranderd, en er een eigen chinesen tekst van gemaakt. Toch lijkt mij de hoofdbedoeling vrij duidelijk, in verband met den gehelen geest van de Tao Teh King. Een zin uit Chuang Tszʼ: „Het hoogste Geluk is geen geluk” correspondeert er mede.","t98":"Dit hoofdstuk is een van de moeilijkste van het geheele werk, en iedere vertaler heeft weer een andere versie. De meesten nemen „teh” verkrijgen voor „teh” deugd, maar dit behoeft hier in ’t geheel niet. Wie goed heeft gelezen wat ik in mijn Voorwoord over vertalingen uit het chineesch heb gezegd, zal begrijpen, hoe weinig het verschil in zinswending enz. er toe doet, mits het hoofdidee maar juist is. Verscheidene vertalers hebben, op eigen beter weten, den chineeschen tekst veranderd, en er een eigen chineeschen tekst van gemaakt. Toch lijkt mij de hoofdbedoeling vrij duidelijk, in verband met den geheelen geest van de Tao Teh King. Een zin uit Chuang Tszʼ: „Het hoogste Geluk is geen geluk” correspondeert er mede."},{"v":[1,2],"l":"1 en 2","t":"De hoogste Deugd is van-zelf, uit Tao, is dus Wu Wei. Maar zodra men, deugdzaam zijnde, het idee heeft: „dit is nu deugd,” dan is het al geen Deugd meer, dan krijgt men den schijn voor de realiteit, den naam voor het ding zelf.","t98":"De hoogste Deugd is van-zelf, uit Tao, is dus Wu Wei. Maar zoodra men, deugdzaam zijnde, het idee heeft: „dit is nu deugd,” dan is het al geen Deugd meer, dan krijgt men den schijn voor de realiteit, den naam voor het ding zelf."},{"v":[3],"l":"3","t":"De hoogste Menslievendheid doet goed van-zelf, omdat zij niet anders kan, uit haar natuur. Zodra er het idee „dit is mijn plicht” bijkomt, wordt het al onzuiver.","t98":"De hoogste Menschlievendheid doet goed van-zelf, omdat zij niet anders kan, uit haar natuur. Zoodra er het idee „dit is mijn plicht” bijkomt, wordt het al onzuiver."},{"v":[4],"l":"4","t":"Hier ga ik mede met de van alle anderen afwijkende vertaling van Giles. Deze zin komt mij ietwat misplaatst voor in het hoofdstuk. De bedoeling schijnt te zijn: „De ware Liʼ is de Liʼ van het hart, meer als een ding van zelf-respect gedaan dan als respect voor anderen. En hierop kan natuurlijk geen antwoord zijn behalve de uitwendige en zichtbare gebaren.”","t98":"Hier ga ik mede met de van alle anderen afwijkende vertaling van Giles. Deze zin komt mij ietwat misplaatst voor in het hoofdstuk. De bedoeling schijnt te zijn: „De ware Liʼ is de Liʼ van het hart, meer als een ding van zelf-respect gedaan dan als respect voor anderen. En hierop kan natuurlijk geen antwoord zijn behalve de uitwendige en zichtbare gebaren.”"},{"v":[5],"l":"5","t":"Dit correspondeert met de dingen in Hoofdstuk XVIII. Decorum (Liʼ) is hier blijkbaar genomen in den lageren zin van alleen het uiterlijke decorum, dat slechts een oppervlakkig ding is als de schors van een boom.","t98":"Dit correspondeert met de dingen in Hoofdstuk XVIII. Decorum (Liʼ) is hier blijkbaar genomen in den lageren zin van alleen het uiterlijke decorum, dat slechts een oppervlakkig ding is als de schors van een boom."},{"v":[7],"l":"7","t":"Met het „schijn-weten”, letterlijk „vooraf-weten”, wordt hier bedoeld het geleerde, buitenissige weten van allerlei bizondere dingen, zonder het ware al-wetten in Tao, dus het oppervlakkige weten van den schijn der dingen, zonder het wezen te kennen.","t98":"Met het „schijn-weten”, letterlijk „vooraf-weten”, wordt hier bedoeld het geleerde, buitenissige weten van allerlei bizondere dingen, zonder het ware al-wetten in Tao, dus het oppervlakkige weten van den schijn der dingen, zonder het wezen te kennen."}]},{"n":39,"r":"XXXIX","d":"Teh","zh":["昔之得一者，天得一以清，地得一以寧，神得一以靈，谷得一以盈，萬物得一以生，侯王得一以為天下貞。","其致之，天無以清將恐裂，地無以寧將恐發，神無以靈將恐歇，谷無以盈將恐竭，萬物無以生將恐滅，侯王無以貴高將恐蹶。","故貴以賤為本，高以下為基。","是以侯王自稱孤、寡、不穀。","此非以賤為本邪？","非乎？","故致數輿無輿，不欲琭琭如玉，珞珞如石。"],"nl":[[1,["De dingen, die eertijds de Éénheid hebben verkregen zijn:","de Hemel, die puur is door de Eénheid.","de Aarde, die in rust is door de Eénheid.","de Geesten, die spiritueel zijn door de Eénheid.","de Valleien, die vol zijn door de Eénheid.","de tienduizend Dingen die baren door Eénheid.","de Prinsen en Koningen, die het voorbeeld der wereld zijn door hun Eénheid.","Dát heeft de Eénheid voortgebracht."]],[2,["Als de Hemel zijn puurheid niet had zou hij dreigen uiteen te scheuren.","Als de Aarde haar rust niet had zou zij gevaar lopen uiteen te barsten.","Als de Geesten hun spiritualiteit niet hadden zouden zij gevaar lopen van optehouden te bestaan.","Als de valleien niet gevuld werden, zouden zij gevaar lopen van te verdrogen.","Als de tienduizend Dingen niet baarden zouden zij gevaar lopen uit te sterven.","Als de prinsen en koningen trots waren op hun hoogheid, en niet het voorbeeld der wereld waren, zouden zij gevaar lopen van den troon te worden gestoten."]],[3,["Daarom, het aanzienlijke heeft zijn basis in het ordinaire, het hoge heeft zijne grondvesten in het lage.","Daarom noemen de prinsen en koningen zich wezen, mensen van weinig verdienste, zonder deugd. Is dit niet omdat zij hun basis zien in het ordinaire, en terecht?"]],[4,["Wie véél basissen heeft, heeft géén basis."]],[5,["De Wijze wil niet hooggeschat worden als jaspis, maar ook niet veracht als (gewone) steen."]]],"n98":[[1,["De dingen, die eertijds de Éénheid hebben verkregen zijn:","de Hemel, die puur is door de Eénheid.","de Aarde, die in rust is door de Eénheid.","de Geesten, die spiritueel zijn door de Eénheid.","de Valleien, die vol zijn door de Eénheid.","de tienduizend Dingen die baren door Eénheid.","de Prinsen en Koningen, die het voorbeeld der wereld zijn door hun Eénheid.","Dát heeft de Eénheid voortgebracht."]],[2,["Als de Hemel zijn puurheid niet had zou hij dreigen uiteen te scheuren.","Als de Aarde haar rust niet had zou zij gevaar loopen uiteen te barsten.","Als de Geesten hun spiritualiteit niet hadden zouden zij gevaar loopen van optehouden te bestaan.","Als de valleien niet gevuld werden, zouden zij gevaar loopen van te verdrogen.","Als de tienduizend Dingen niet baarden zouden zij gevaar loopen uit te sterven.","Als de prinsen en koningen trotsch waren op hun hoogheid, en niet het voorbeeld der wereld waren, zouden zij gevaar loopen van den troon te worden gestooten."]],[3,["Daarom, het aanzienlijke heeft zijn basis in het ordinaire, het hooge heeft zijne grondvesten in het lage.","Daarom noemen de prinsen en koningen zich weezen, menschen van weinig verdienste, zonder deugd. Is dit niet omdat zij hun basis zien in het ordinaire, en terecht?"]],[4,["Wie véél basissen heeft, heeft géén basis."]],[5,["De Wijze wil niet hooggeschat worden als jaspis, maar ook niet veracht als (gewone) steen."]]],"en":[[1,["The things which from of old have got the One (the Tao) are--",
