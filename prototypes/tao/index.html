"Heaven which by it is bright and pure;\nEarth rendered thereby firm and sure;\nSpirits with powers by it supplied;\nValleys kept full throughout their void\nAll creatures which through it do live\nPrinces and kings who from it get\nThe model which to all they give.","All these are the results of the One (Tao)."]],[2,["If heaven were not thus pure, it soon would rend;\nIf earth were not thus sure, 'twould break and bend;\nWithout these powers, the spirits soon would fail;\nIf not so filled, the drought would parch each vale;\nWithout that life, creatures would pass away;\nPrinces and kings, without that moral sway,\nHowever grand and high, would all decay."]],[3,["Thus it is that dignity finds its (firm) root in its (previous) meanness, and what is lofty finds its stability in the lowness (from which it rises). Hence princes and kings call themselves 'Orphans,' 'Men of small virtue,' and as 'Carriages without a nave.' Is not this an acknowledgment that in their considering themselves mean they see the foundation of their dignity? So it is that in the enumeration of the different parts of a carriage we do not come on what makes it answer the ends of a carriage. They do not wish to show themselves elegant-looking as jade, but (prefer) to be coarse-looking as an (ordinary) stone."]]],"no":[{"v":[1,2],"l":"1 en 2","t":"De hoofdbedoeling hiervan is, te doen voelen, dat alle wezens en dingen hunne verschillende naturen hebben te danken aan één ding, Tao, de Eenheid. Die Eenheid is de basis van alle uiterlijk zo verschillende dingen. Zonder die Eenheid zou de Hemel niet puur zijn, de Aarde niet in rust, enz. enz.","t98":"De hoofdbedoeling hiervan is, te doen voelen, dat alle wezens en dingen hunne verschillende naturen hebben te danken aan één ding, Tao, de Eenheid. Die Eenheid is de basis van alle uiterlijk zoo verschillende dingen. Zonder die Eenheid zou de Hemel niet puur zijn, de Aarde niet in rust, enz. enz."},{"v":[3],"l":"3","t":"De hoogheid en gedistingeerdheid der vorsten hebben tot basis de laagheid en gewoonheid van het volk. De koningen geven zich uit bescheidenheid die lage titels om te doen uitkomen, dat zij hun oorsprong hebben gehad in het volk.","t98":"De hoogheid en gedistingeerdheid der vorsten hebben tot basis de laagheid en gewoonheid van het volk. De koningen geven zich uit bescheidenheid die lage titels om te doen uitkomen, dat zij hun oorsprong hebben gehad in het volk."},{"v":[4],"l":"4","t":"Letterlijker staat er, véél wielen, géén wagen. De bedoeling is duidelijk in verband met het vorige over de Eénheid.","t98":"Letterlijker staat er, véél wielen, géén wagen. De bedoeling is duidelijk in verband met het vorige over de Eénheid."}]},{"n":40,"r":"XL","d":"Teh","zh":["反者道之動，弱者道之用。","天下萬物生於有，有生於無。"],"nl":[[1,["De beweging van Tao is terugkeer (tot zichzelf).","Zachtheid is Zijne functie."]],[2,["Alle bestaan op de wereld is uit Zijn. Alle Zijn is uit Niet-Zijn."]]],"n98":[[1,["De beweging van Tao is terugkeer (tot zichzelf).","Zachtheid is Zijne functie."]],[2,["Alle bestaan op de wereld is uit Zijn. Alle Zijn is uit Niet-Zijn."]]],"en":[[1,["The movement of the Tao\nBy contraries proceeds;\nAnd weakness marks the course\nOf Tao's mighty deeds."]],[2,["All things under heaven sprang from It as existing (and named); that existence sprang from It as non-existent (and not named)."]]],"no":[{"v":[1],"l":"1","t":"Deze zin correspondeert met wat ik in mijne Inleiding zeide, n.l. dat niet alleen alle dingen uit Tao zijn voortgekomen, maar hun tevens een natuurlijke, van-zelve beweging is medegegeven, die hen onvermijdelijk weder naar Tao terugvoert. Zich op die beweging in gehoorzaamheid te laten megaan is, volgens Lao Tszʼ, de hoogste levenswijsheid, is Wu Wei zijn.","t98":"Deze zin correspondeert met wat ik in mijne Inleiding zeide, n.l. dat niet alleen alle dingen uit Tao zijn voortgekomen, maar hun tevens eene natuurlijke, van-zelve beweging is medegegeven, die hen onvermijdelijk weder naar Tao terugvoert. Zich op die beweging in gehoorzaamheid te laten meêgaan is, volgens Lao Tszʼ, de hoogste levenswijsheid, is Wu Wei zijn."},{"v":[2],"l":"2","t":"Zie Inleiding en Hfdst. I.","t98":"Zie Inleiding en Hfdst. I."}]},{"n":41,"r":"XLI","d":"Teh","zh":["上士聞道，勤而行之；中士聞道，若存若亡；下士聞道，大笑之。","不笑不足以為道。","故建言有之：明道若昧，進道若退，夷道若纇，上德若谷，大白若辱，廣德若不足，建德若偷，質真若渝，大方無隅，大器晚成，大音希聲，大象無形，道隱無名。","夫唯道，善貸且成。"],"nl":[[1,["Als superieure geleerden van Tao horen, begaan zij Het (dadelijk) ijverig. Als middelmatige geleerden van Tao horen, handhaven zij Het nú, en verliezen Het dán weer. Als inferieure geleerden van Tao horen, lachen zij er hard om. Als zij er niet om lachten zou het Tao niet zijn."]],[2,["Daarom, een oud gezegde luidt: De verlichten in Tao zijn als duister; de vergevorderden in Tao zijn als achteruitgaande; zij, die de opperste deugd hebben zijn (laag) als een vallei; de uiterst reinen zijn als vuil; zij, die deugd in overvloed hebben, zijn alsof ze niet genoeg hebben; zij die (vast) gegrondveste deugd hebben, zijn als lui; zij, die waar en simpel zijn, zijn als verachtelijk."]],[3,["Als een groot vierkant zonder hoeken, als een grote vaas, die nog lang niet afgewerkt is, als een groot geluid, waarvan men den klank zelden hoort, als een groot beeld zonder vormen, zóó is (voor ons) Tao verborgen, en heeft geen naam."]],[4,["Het helpt de wezens en dingen en volmaakt ze."]]],"n98":[[1,["Als superieure geleerden van Tao hooren, begaan zij Het (dadelijk) ijverig. Als middelmatige geleerden van Tao hooren, handhaven zij Het nú, en verliezen Het dán weer. Als inferieure geleerden van Tao hooren, lachen zij er hard om. Als zij er niet om lachten zou het Tao niet zijn."]],[2,["Daarom, een oud gezegde luidt: De verlichten in Tao zijn als duister; de vergevorderden in Tao zijn als achteruitgaande; zij, die de opperste deugd hebben zijn (laag) als een vallei; de uiterst reinen zijn als vuil; zij, die deugd in overvloed hebben, zijn alsof ze niet genoeg hebben; zij die (vast) gegrondveste deugd hebben, zijn als lui; zij, die waar en simpel zijn, zijn als verachtelijk."]],[3,["Als een groot vierkant zonder hoeken, als een groote vaas, die nog lang niet afgewerkt is, als een groot geluid, waarvan men den klank zelden hoort, als een groot beeld zonder vormen, zóó is (voor ons) Tao verborgen, en heeft geen naam."]],[4,["Het helpt de wezens en dingen en volmaakt ze."]]],"en":[[1,["Scholars of the highest class, when they hear about the Tao, earnestly carry it into practice. Scholars of the middle class, when they have heard about it, seem now to keep it and now to lose it. Scholars of the lowest class, when they have heard about it, laugh greatly at it. If it were not (thus) laughed at, it would not be fit to be the Tao."]],[2,["Therefore the sentence-makers have thus expressed themselves:--","'The Tao, when brightest seen, seems light to lack;\nWho progress in it makes, seems drawing back;\nIts even way is like a rugged track.\nIts highest virtue from the vale doth rise;\nIts greatest beauty seems to offend the eyes;\nAnd he has most whose lot the least supplies.\nIts firmest virtue seems but poor and low;\nIts solid truth seems change to undergo;\nIts largest square doth yet no corner show\nA vessel great, it is the slowest made;\nLoud is its sound, but never word it said;\nA semblance great, the shadow of a shade.'"]],[3,["The Tao is hidden, and has no name; but it is the Tao which is skilful at imparting (to all things what they need) and making them complete."]]],"no":[{"v":[2],"l":"2","t":"Het „daarom” schijnt niet in direct logisch verband met het vorige onder 1 te staan. De bedoeling is verder duidelijk genoeg, n.l. dat de verlichten in Tao, in stede van trots te zijn, nederig blijven enz. enz. De meeste vertalers hebben verder: „Hij, die de opperste deugd heeft, enz. wat op hetzelfde neerkomt. In den tekst staat alleen, zoals ik heb, „de opperste deugd,” „de grote reinheid” enz.","t98":"Het „daarom” schijnt niet in direct logisch verband met het vorige onder 1 te staan. De bedoeling is verder duidelijk genoeg, n.l. dat de verlichten in Tao, in stede van trotsch te zijn, nederig blijven enz. enz. De meeste vertalers hebben verder: „Hij, die de opperste deugd heeft, enz. wat op hetzelfde neerkomt. In den tekst staat alleen, zooals ik heb, „de opperste deugd,” „de groote reinheid” enz."},{"v":[3],"l":"3","t":"Het volgende, ook al weer niet in direct verband met het vorige, slaat weer op Tao.","t98":"Het volgende, ook al weer niet in direct verband met het vorige, slaat weer op Tao."}]},{"n":42,"r":"XLII","d":"Teh","zh":["道生一，一生二，二生三，三生萬物。","萬物負陰而抱陽，沖氣以為和。","人之所惡，唯孤、寡、不穀，而王公以為稱。","故物或損之而益，或益之而損。","人之所教，我亦教之。","強梁者不得其死，吾將以為教父。"],"nl":[[1,["Tao baarde één; één baarde twee; twee baarde drie; drie baarde alle dingen.","Want alle dingen komen uit het duister tot het licht, en worden in harmonie gebracht door den adem der Natuur."]],[2,["Wat de mensen verafschuwen is te zijn wezen, mensen van weinig verdiensten, zonder deugd, en toch noemen koningen en hertogen zich zo (als met een erenaam)."]],[3,["Daarom, wie zich vernedert zal verheven worden, en wie zich verheft zal vernederd worden."]],[4,["Wat de mensen leren, dat leer ik ook."]],[5,["De geweldigen en tyrannen zullen geen natuurlijken dood sterven."]],[6,["Ik zal hen tot het voorbeeld van mijn leer nemen."]]],"n98":[[1,["Tao baarde één; één baarde twee; twee baarde drie; drie baarde alle dingen.","Want alle dingen komen uit het duister tot het licht, en worden in harmonie gebracht door den adem der Natuur."]],[2,["Wat de menschen verafschuwen is te zijn weezen, menschen van weinig verdiensten, zonder deugd, en toch noemen koningen en hertogen zich zoo (als met een eerenaam)."]],[3,["Daarom, wie zich vernedert zal verheven worden, en wie zich verheft zal vernederd worden."]],[4,["Wat de menschen leeren, dat leer ik ook."]],[5,["De geweldigen en tyrannen zullen geen natuurlijken dood sterven."]],[6,["Ik zal hen tot het voorbeeld van mijn leer nemen."]]],"en":[[1,["The Tao produced One; One produced Two; Two produced Three; Three produced All things. All things leave behind them the Obscurity (out of which they have come), and go forward to embrace the Brightness (into which they have emerged), while they are harmonised by the Breath of Vacancy."]],[2,["What men dislike is to be orphans, to have little virtue, to be as carriages without naves; and yet these are the designations which kings and princes use for themselves. So it is that some things are increased by being diminished, and others are diminished by being increased."]],[3,["What other men (thus) teach, I also teach. The violent and strong do not die their natural death. I will make this the basis of my teaching."]]],"no":[{"v":[1],"l":"1","t":"Tao vóór de creatie, éénig in-zich-zelf, bestaande was er natuurlijk niet eens het begrip één. Tao baarde één. Eén verdeelde zich in twee, en wel de principes Yin (vrouwelijk, rust, duister), en Yang (mannelijk, beweging, licht). De chinese filosofie van de „I King” leert dat door de verbinding in harmonie—dit is dus drie, de harmoniese samensmelting van Yin en Yang—dezer twee principes alle dingen ontstaan zijn. Eén ontstond zodra Tao zich naar buiten manifesteerde, twéé zodra één zich verdeelde in Yin en Yang, en drie zodra de harmonie ontstond tussen die twee. Onnodig te zeggen dat zendelingen in dezen tekst een chinese uitdrukking voor de Drieëenheid hebben gezocht!","t98":"Tao vóór de creatie, éénig in-zich-zelf, bestaande was er natuurlijk niet eens het begrip één. Tao baarde één. Eén verdeelde zich in twee, en wel de principes Yin (vrouwelijk, rust, duister), en Yang (mannelijk, beweging, licht). De chineesche filosofie van de „I King” leert dat door de verbinding in harmonie—dit is dus drie, de harmoniesche samensmelting van Yin en Yang—dezer twee principes alle dingen ontstaan zijn. Eén ontstond zoodra Tao zich naar buiten manifesteerde, twéé zoodra één zich verdeelde in Yin en Yang, en drie zoodra de harmonie ontstond tusschen die twee. Onnoodig te zeggen dat zendelingen in dezen tekst een chineesche uitdrukking voor de Drieëenheid hebben gezocht!"},{"v":[2,3,4,5,6],"l":"2–6","t":"Dit volgt alweer niet in direct verband met het vorige, maar is een tekst apart.","t98":"Dit volgt alweer niet in direct verband met het vorige, maar is een tekst apart."}]},{"n":43,"r":"XLIII","d":"Teh","zh":["天下之至柔，馳騁天下之至堅。","無有入無間，吾是以知無為之有益。","不言之教，無為之益，天下希及之。"],"nl":[[1,["Het allerzachtste in de wereld overwint het allerhardste."]],[2,["Het immateriële dringt binnen in het ondoordringbare."]],[3,["Vandaar, dat ik het nut weet van Wu Wei.","Er zijn er maar weinigen onder den Hemel die toe zijn aan de Leer zonder woorden, en aan het nut van Wu Wei."]]],"n98":[[1,["Het allerzachtste in de wereld overwint het allerhardste."]],[2,["Het immaterieele dringt binnen in het ondoordringbare."]],[3,["Vandaar, dat ik het nut weet van Wu Wei.","Er zijn er maar weinigen onder den Hemel die toe zijn aan de Leer zonder woorden, en aan het nut van Wu Wei."]]],"en":[[1,["The softest thing in the world dashes against and overcomes the hardest; that which has no (substantial) existence enters where there is no crevice. I know hereby what advantage belongs to doing nothing (with a purpose)."]],[2,["There are few in the world who attain to the teaching without words, and the advantage arising from non-action."]]],"no":[{"v":[1],"l":"1","t":"Men vergelijke dit met het nog te volgen Hoofdstuk LXXVIII, waarin Lao Tszʼ spreekt van water, dat, hoe zacht ook, het hardste kan vernietigen.","t98":"Men vergelijke dit met het nog te volgen Hoofdstuk LXXVIII, waarin Lao Tszʼ spreekt van water, dat, hoe zacht ook, het hardste kan vernietigen."},{"v":[2],"l":"2","t":"Letterlijk staat er „Het Niet-Zijn dringt binnen in waar geen opening is”.","t98":"Letterlijk staat er „Het Niet-Zijn dringt binnen in waar geen opening is”."},{"v":[3],"l":"3","t":"Juist zoals het immateriële het ondoordringbare doordringt, zo overwint ook Wu Wei, de zuivere ziele-actie, álle andere actie, die niet uit de zuivere ziel komt.","t98":"Juist zooals het immaterieele het ondoordringbare doordringt, zoo overwint ook Wu Wei, de zuivere ziele-actie, álle andere actie, die niet uit de zuivere ziel komt."}]},{"n":44,"r":"XLIV","d":"Teh","zh":["名與身孰親？","身與貨孰多？","得與亡孰病？","是故甚愛必大費，多藏必厚亡，知足不辱，知止不殆，可以長久。"],"nl":[[1,["Wat is ons het naaste, onze naam of ons Zelf?","Wat is ons het meeste, ons Zelf of onze rijkdommen?"]],[2,["Wat is het ergste, ze te verkrijgen of ze te verliezen?"]],[3,["Daarom is het, dat wie veel liefheeft, veel zal verkwisten.","Wie veel (schatten) verbergt zal stellig veel verliezen.","Wie genoeg weet te hebben zal niet onteerd worden. Wie weet (waar) op te houden zal niet ondergaan. Deze zal langen tijd bestaan."]]],"n98":[[1,["Wat is ons het naaste, onze naam of ons Zelf?","Wat is ons het meeste, ons Zelf of onze rijkdommen?"]],[2,["Wat is het ergste, ze te verkrijgen of ze te verliezen?"]],[3,["Daarom is het, dat wie veel liefheeft, veel zal verkwisten.","Wie veel (schatten) verbergt zal stellig veel verliezen.","Wie genoeg weet te hebben zal niet onteerd worden. Wie weet (waar) op te houden zal niet ondergaan. Deze zal langen tijd bestaan."]]],"en":[[1,["Or fame or life,\nWhich do you hold more dear?\nOr life or wealth,\nTo which would you adhere?\nKeep life and lose those other things;\nKeep them and lose your life:--which brings\nSorrow and pain more near?"]],[2,["Thus we may see,\nWho cleaves to fame\nRejects what is more great;\nWho loves large stores\nGives up the richer state."]],[3,["Who is content\nNeeds fear no shame.\nWho knows to stop\nIncurs no blame.\nFrom danger free\nLong live shall he."]]],"no":[{"v":[3],"l":"3","t":"„Liefheeft” neme men hier in den lageren zin van passies, begeerten hebben. Hij, die zo liefheeft, zal veel van zijn beste goed verkwisten.","t98":"„Liefheeft” neme men hier in den lageren zin van passies, begeerten hebben. Hij, die zoo liefheeft, zal veel van zijn beste goed verkwisten."}]},{"n":45,"r":"XLV","d":"Teh","zh":["大成若缺，其用不弊。","大盈若沖，其用不窮。","大直若屈，其用不居。","大巧若拙，其用不輟。","大辯若訥，其用不差。","躁勝寒，靜勝熱。","清靜為天下正。"],"nl":[[1,["(De Wijze) is ganselijk volmaakt, en lijkt onvolmaakt; zijne middelen raken nooit op. Hij is ganselijk vol en lijkt ledig; zijne middelen (bronnen) zijn nooit uitgeput. Hij is ganselijk recht en lijkt krom. Hij is ganselijk bekwaam en lijkt dom. Hij is zéér welsprekend en lijkt een stamelaar."]],[2,["De beweging overwint de koude, de rust overwint de warmte."]],[3,["Hij die puur en rustig is, wordt het voorbeeld van het rijk."]]],"n98":[[1,["(De Wijze) is ganschelijk volmaakt, en lijkt onvolmaakt; zijne middelen raken nooit op. Hij is ganschelijk vol en lijkt ledig; zijne middelen (bronnen) zijn nooit uitgeput. Hij is ganschelijk recht en lijkt krom. Hij is ganschelijk bekwaam en lijkt dom. Hij is zéér welsprekend en lijkt een stamelaar."]],[2,["De beweging overwint de koude, de rust overwint de warmte."]],[3,["Hij die puur en rustig is, wordt het voorbeeld van het rijk."]]],"en":[[1,["Who thinks his great achievements poor\nShall find his vigour long endure.\nOf greatest fulness, deemed a void,\nExhaustion ne'er shall stem the tide.\nDo thou what's straight still crooked deem;\nThy greatest art still stupid seem,\nAnd eloquence a stammering scream."]],[2,["Constant action overcomes cold; being still overcomes heat. Purity and stillness give the correct law to all under heaven."]]],"no":[{"v":[2],"l":"2","t":"De bedoeling zal wel zijn die van Li Si Tchaï, door Julien overgenomen, dat de beweging, die de koude overwint door warm te maken, en de rust, die de warmte overwint door te verkoelen, beide hun grenzen hebben. Maar als de mens Wu Wei is, zoekt hij niet te overwinnen, en daardoor kan ook niets hém overwinnen.","t98":"De bedoeling zal wel zijn die van Li Si Tchaï, door Julien overgenomen, dat de beweging, die de koude overwint door warm te maken, en de rust, die de warmte overwint door te verkoelen, beide hun grenzen hebben. Maar als de mensch Wu Wei is, zoekt hij niet te overwinnen, en daardoor kan ook niets hém overwinnen."},{"v":[3],"l":"3","t":"Letterlijk staat er „puurheid en rust zijn het rechte van de wereld”.","t98":"Letterlijk staat er „puurheid en rust zijn het rechte van de wereld”."}]},{"n":46,"r":"XLVI","d":"Teh","zh":["天下有道，卻走馬以糞。","天下無道，戎馬生於郊。","禍莫大於不知足；咎莫大於欲得。","故知足之足，常足矣。"],"nl":[[1,["Toen Tao in het rijk regeerde, zond men de vlugge paarden weg om ze op het land te gebruiken; toen Tao niet in het rijk regeerde, werden de krijgsrossen gefokt op de grenzen."]],[2,["Er is géén zo grote misdaad als zich veel begeerten toe te staan; er is géén zo groot ongeluk als niet genoeg weten te hebben; er is géén zo grote ramp als (altijd) maar te willen krijgen."]],[3,["Daarom, hij die genoeg weet te hebben, is altijd tevreden, naar ik meen."]]],"n98":[[1,["Toen Tao in het rijk regeerde, zond men de vlugge paarden weg om ze op het land te gebruiken; toen Tao niet in het rijk regeerde, werden de krijgsrossen gefokt op de grenzen."]],[2,["Er is géén zoo groote misdaad als zich veel begeerten toe te staan; er is géén zoo groot ongeluk als niet genoeg weten te hebben; er is géén zoo groote ramp als (altijd) maar te willen krijgen."]],[3,["Daarom, hij die genoeg weet te hebben, is altijd tevreden, naar ik meen."]]],"en":[[1,["When the Tao prevails in the world, they send back their swift horses to (draw) the dung-carts. When the Tao is disregarded in the world, the war-horses breed in the border lands."]],[2,["There is no guilt greater than to sanction ambition; no calamity greater than to be discontented with one's lot; no fault greater than the wish to be getting. Therefore the sufficiency of contentment is an enduring and unchanging sufficiency."]]],"no":[{"v":[1],"l":"1","t":"Letterlijk staat er: „Toen het rijk Tao had” enz. De commentator Peh Yü Shen neemt dezen tekst figuurlijk, en ziet in het rijk het hart, in de paarden de hartstochten en begeerten. Ik geloof met anderen dat men hier den tekst evengoed in letterlijken zin kan nemen.","t98":"Letterlijk staat er: „Toen het rijk Tao had” enz. De commentator Peh Yü Shen neemt dezen tekst figuurlijk, en ziet in het rijk het hart, in de paarden de hartstochten en begeerten. Ik geloof met anderen dat men hier den tekst evengoed in letterlijken zin kan nemen."}]},{"n":47,"r":"XLVII","d":"Teh","zh":["不出戶，知天下；不闚牖，見天道。","其出彌遠，其知彌少。","是以聖人不行而知，不見而名，不為而成。"],"nl":[[1,["Zonder mijn deur uit te gaan ken ik de wereld, zonder uit mijn venster te kijken zie ik den Weg des Hemels."]],[2,["Hoe verder gij uitgaat, hoe minder gij zult weten."]],[3,["Daarom, de Wijze komt er zonder te lopen, noemt de dingen zonder ze te zien, en volmaakt zich zonder actie."]]],"n98":[[1,["Zonder mijn deur uit te gaan ken ik de wereld, zonder uit mijn venster te kijken zie ik den Weg des Hemels."]],[2,["Hoe verder gij uitgaat, hoe minder gij zult weten."]],[3,["Daarom, de Wijze komt er zonder te loopen, noemt de dingen zonder ze te zien, en volmaakt zich zonder actie."]]],"en":[[1,["Without going outside his door, one understands (all that takes place) under the sky; without looking out from his window, one sees the Tao of Heaven. The farther that one goes out (from himself), the less he knows."]],[2,["Therefore the sages got their knowledge without travelling; gave their (right) names to things without seeing them; and accomplished their ends without any purpose of doing so."]]],"no":[{"v":[],"l":"hoofdstuk","t":"Men zou dit hoofdstuk in ’t kort kunnen verklaren door: „Alles moet van binnen, niet van buiten komen. Het hoogste weten wordt alleen bereikt door zelf-contemplatie, en de oorsprong van alle weten is in de eigen ziel”.","t98":"Men zou dit hoofdstuk in ’t kort kunnen verklaren door: „Alles moet van binnen, niet van buiten komen. Het hoogste weten wordt alleen bereikt door zelf-contemplatie, en de oorsprong van alle weten is in de eigen ziel”."}]},{"n":48,"r":"XLVIII","d":"Teh","zh":["為學日益，為道日損。","損之又損，以至於無為。","無為而無不為。","取天下常以無事，及其有事，不足以取天下。"],"nl":[[1,["Zich toeleggen op de studie is dagelijks „meer krijgen.” Zich wijden aan Tao is dagelijks „minder krijgen,” minder en minder, tot Wu Wei bereikt is."]],[2,["Wu Wei eenmaal bereikt, is er niets wat men niet kan doen, naar ik meen."]],[3,["Door altijd niets te doen kan men over het Rijk meester worden. Maar door te doen is men niet in staat, meester te worden van het Rijk."]]],"n98":[[1,["Zich toeleggen op de studie is dagelijks „meer krijgen.” Zich wijden aan Tao is dagelijks „minder krijgen,” minder en minder, tot Wu Wei bereikt is."]],[2,["Wu Wei eenmaal bereikt, is er niets wat men niet kan doen, naar ik meen."]],[3,["Door altijd niets te doen kan men over het Rijk meester worden. Maar door te doen is men niet in staat, meester te worden van het Rijk."]]],"en":[[1,["He who devotes himself to learning (seeks) from day to day to increase (his knowledge); he who devotes himself to the Tao (seeks) from day to day to diminish (his doing)."]],[2,["He diminishes it and again diminishes it, till he arrives at doing nothing (on purpose). Having arrived at this point of non-action, there is nothing which he does not do."]],[3,["He who gets as his own all under heaven does so by giving himself no trouble (with that end). If one take trouble (with that end), he is not equal to getting as his own all under heaven."]]],"no":[{"v":[1],"l":"1","t":"Met „minder krijgen” is natuurlijk bedoeld „minder verlangens, begeerten, aardse dingen krijgen.”","t98":"Met „minder krijgen” is natuurlijk bedoeld „minder verlangens, begeerten, aardsche dingen krijgen.”"},{"v":[2],"l":"2","t":"De woordspeling is hier alweer eigenaardig. „Als Wu (niets) Wei (doen) bereikt is, is er niets (Wu) wat men niet kan doen (Wei). Ik leg er nog eens den nadruk op voor de zóóveelste maal, en kan dit niet genoeg doen, dat „Wu Wei” volstrekt niet zo maar betekent inactie, indolentie, of niets doen, maar zoals ik in de Inleiding duidelijk maakte, „niets tegen Tao in doen”, dus „zich bewegen, en doen, zuiver en geheel volgens het rythme van Tao dat (zie Hoofdstuk XL weer) naar Tao terugvoert. En dat met „doen” wordt bedoeld „onnatuurlijk, aards gedoe van begeerten en verlangens”.","t98":"De woordspeling is hier alweer eigenaardig. „Als Wu (niets) Wei (doen) bereikt is, is er niets (Wu) wat men niet kan doen (Wei). Ik leg er nog eens den nadruk op voor de zóóveelste maal, en kan dit niet genoeg doen, dat „Wu Wei” volstrekt niet zoo maar beteekent inactie, indolentie, of niets doen, maar zooals ik in de Inleiding duidelijk maakte, „niets tegen Tao in doen”, dus „zich bewegen, en doen, zuiver en geheel volgens het rythme van Tao dat (zie Hoofdstuk XL weer) naar Tao terugvoert. En dat met „doen” wordt bedoeld „onnatuurlijk, aardsch gedoe van begeerten en verlangens”."}]},{"n":49,"r":"XLIX","d":"Teh","zh":["聖人無常心，以百姓心為心。","善者，吾善之；不善者，吾亦善之，德善。","信者，吾信之；不信者，吾亦信之，德信。","聖人在天下歙歙，為天下渾其心，百姓皆注其耳目，聖人皆孩之。"],"nl":[[1,["De Wijze heeft geen buitengewoon hart. Hij beschouwt het hart van het volk als het zijne."]],[2,["Ik ben voor de goeden goed. Voor de niet-goeden ben ik ook goed, om ze goed te maken. Ik geloof de oprechten. De niet-oprechten geloof ik ook, om ze oprecht te maken."]],[3,["De wijze in de wereld is voortdurend in vreze dat de wereld zijn hart in verwarring zal brengen."]],[4,["De oren en ogen der honderd families zijn op hem gericht, en hij beschouwt hen als kinderen."]]],"n98":[[1,["De Wijze heeft geen buitengewoon hart. Hij beschouwt het hart van het volk als het zijne."]],[2,["Ik ben voor de goeden goed. Voor de niet-goeden ben ik ook goed, om ze goed te maken. Ik geloof de oprechten. De niet-oprechten geloof ik ook, om ze oprecht te maken."]],[3,["De wijze in de wereld is voortdurend in vreeze dat de wereld zijn hart in verwarring zal brengen."]],[4,["De ooren en oogen der honderd families zijn op hem gericht, en hij beschouwt hen als kinderen."]]],"en":[[1,["The sage has no invariable mind of his own; he makes the mind of the people his mind."]],[2,["To those who are good (to me), I am good; and to those who are not good (to me), I am also good;--and thus (all) get to be good. To those who are sincere (with me), I am sincere; and to those who are not sincere (with me), I am also sincere;--and thus (all) get to be sincere."]],[3,["The sage has in the world an appearance of indecision, and keeps his mind in a state of indifference to all. The people all keep their eyes and ears directed to him, and he deals with them all as his children."]]],"no":[{"v":[1],"l":"1","t":"Letterlijk staat er „geen eeuwig (onveranderlijk) hart”. Hart hier ook in den zin van „gevoelens”.","t98":"Letterlijk staat er „geen eeuwig (onveranderlijk) hart”. Hart hier ook in den zin van „gevoelens”."},{"v":[2],"l":"2","t":"Van de juiste vertaling, hoe mooi die ook klinken moge, ben ik hier lang niet zeker. Ik heb hier „Teh” deugd moeten vervangen door „teh” verkrijgen, maken, een verwisseling die in het oude chinees veel voorkomt, en die ook o.a. Giles e.a. en veel chinese commentators maken. Anderen behouden Teh als deugd, en vertalen dan aan het slot van den zin: „Dit is het toppunt van de deugd”, waarvan „toppunt” echter niet in den tekst staat. Weer andere chinese commentaren zien in dezen tekst niet anders dan ongenaakbaarheid, alsof Lao Tszʼ wilde zeggen dat goeden en slechten, oprechten en niet-oprechten voor hem hetzelfde waren, iets wat ik niet kan aannemen.","t98":"Van de juiste vertaling, hoe mooi die ook klinken moge, ben ik hier lang niet zeker. Ik heb hier „Teh” deugd moeten vervangen door „teh” verkrijgen, maken, eene verwisseling die in het oude chineesch veel voorkomt, en die ook o.a. Giles e.a. en veel chineesche commentators maken. Anderen behouden Teh als deugd, en vertalen dan aan het slot van den zin: „Dit is het toppunt van de deugd”, waarvan „toppunt” echter niet in den tekst staat. Weer andere chineesche commentaren zien in dezen tekst niet anders dan ongenaakbaarheid, alsof Lao Tszʼ wilde zeggen dat goeden en slechten, oprechten en niet-oprechten voor hem hetzelfde waren, iets wat ik niet kan aannemen."},{"v":[3],"l":"3","t":"Ook van deze vertaling ben ik niet zeker. Evenmin van die van Julien: „Le Saint vivant dans ce monde reste calme et sincère et conserve les mêmes sentiments pour tous”. Hij vat „hwun”, d.i. verward, vuil, chaotisch, op als „het geheel, allen”. Beide betekenissen staan o.a. in Wells Williams’ dictionnaire. Maar „calme et sincère” voor „tieh” vresachtig, verlegen, bezorgd, kan ik niet aannemen.","t98":"Ook van deze vertaling ben ik niet zeker. Evenmin van die van Julien: „Le Saint vivant dans ce monde reste calme et sincère et conserve les mêmes sentiments pour tous”. Hij vat „hwun”, d.i. verward, vuil, chaotisch, op als „het geheel, allen”. Beide beteekenissen staan o.a. in Wells Williams’ dictionnaire. Maar „calme et sincère” voor „tieh” vreesachtig, verlegen, bezorgd, kan ik niet aannemen."},{"v":[4],"l":"4","t":"„De honderd families” is een uitdrukking voor „het volk”.","t98":"„De honderd families” is eene uitdrukking voor „het volk”."}]},{"n":50,"r":"L","d":"Teh","zh":["出生入死。","生之徒，十有三；死之徒，十有三；人之生，動之死地，亦十有三。","夫何故？","以其生生之厚。","蓋聞善攝生者，陸行不遇兕虎，入軍不被甲兵；兕無所投其角，虎無所措其爪，兵無所容其刃。","夫何故？","以其無死地。"],"nl":[[1,["De mens komt uit het leven en gaat in den dood."]],[2,["Er zijn dertien dienaren van het leven en dertien dienaren van den dood."]],[3,["Als de mens geboren is, bewegen hem ook al de dertien dienaren van den dood."]],[4,["Wat is hier toch wel de reden van? Dat hij te intens wil leven, en te veel vitaliteit verspilt."]],[5,["Ik heb horen zeggen, dat hij, die zijn leven weet te regeren, zonder gevaar langs een weg kan gaan, waar rhinocerossen en tijgers zijn, en in het leger kan treden zonder harnas of wapenen, want de rhinoceros zou geen plek kunnen vinden om zijn hoorn in te boren, de tijger geen plek om zijn klauwen in te slaan, de krijgsman geen plek om zijn zwaard in te steken."]],[6,["En hoe komt dat dan wel? Omdat hij niet blootgesteld is aan den dood."]]],"n98":[[1,["De mensch komt uit het leven en gaat in den dood."]],[2,["Er zijn dertien dienaren van het leven en dertien dienaren van den dood."]],[3,["Als de mensch geboren is, bewegen hem ook al de dertien dienaren van den dood."]],[4,["Wat is hier toch wel de reden van? Dat hij te intens wil leven, en te veel vitaliteit verspilt."]],[5,["Ik heb hooren zeggen, dat hij, die zijn leven weet te regeeren, zonder gevaar langs een weg kan gaan, waar rhinocerossen en tijgers zijn, en in het leger kan treden zonder harnas of wapenen, want de rhinoceros zou geen plek kunnen vinden om zijn hoorn in te boren, de tijger geen plek om zijn klauwen in te slaan, de krijgsman geen plek om zijn zwaard in te steken."]],[6,["En hoe komt dat dan wel? Omdat hij niet blootgesteld is aan den dood."]]],"en":[[1,["Men come forth and live; they enter (again) and die."]],[2,["Of every ten three are ministers of life (to themselves); and three are ministers of death."]],[3,["There are also three in every ten whose aim is to live, but whose movements tend to the land (or place) of death. And for what reason? Because of their excessive endeavours to perpetuate life."]],[4,["But I have heard that he who is skilful in managing the life entrusted to him for a time travels on the land without having to shun rhinoceros or tiger, and enters a host without having to avoid buff coat or sharp weapon. The rhinoceros finds no place in him into which to thrust its horn, nor the tiger a place in which to fix its claws, nor the weapon a place to admit its point. And for what reason? Because there is in him no place of death."]]],"no":[{"v":[2],"l":"2","t":"Wie die dertien dienaren (sommigen vertalen „dienaren”, anderen „oorzaken”) zijn, is niet recht duidelijk. De ene chinese commentator zegt dat het zijn 13 deugden (als b.v. zuiverheid, zwakheid, nederigheid, zachtheid, armoede, enz.), die van ’t leven, en 13 ondeugden (b.v. onzuiverheid, rijkdom, kracht, hoogheid, zucht om uit te blinken, enz.), die van den dood. De ander (b.v. Han Fei Tszʼ) zegt dat de beide dertien identiek zijn, n.l. de vier leden, de mond, de ogen, de neus, enz. die in ’t leven gebruikt worden en toch naar den dood leiden.—Maar ik zou niet durven zeggen, wie nu eigenlijk de dertien zijn.","t98":"Wie die dertien dienaren (sommigen vertalen „dienaren”, anderen „oorzaken”) zijn, is niet recht duidelijk. De eene chineesche commentator zegt dat het zijn 13 deugden (als b.v. zuiverheid, zwakheid, nederigheid, zachtheid, armoede, enz.), die van ’t leven, en 13 ondeugden (b.v. onzuiverheid, rijkdom, kracht, hoogheid, zucht om uit te blinken, enz.), die van den dood. De ander (b.v. Han Fei Tszʼ) zegt dat de beide dertien identiek zijn, n.l. de vier leden, de mond, de oogen, de neus, enz. die in ’t leven gebruikt worden en toch naar den dood leiden.—Maar ik zou niet durven zeggen, wie nu eigenlijk de dertien zijn."},{"v":[4],"l":"4","t":"Dat „te intens leven” is hier „zijne hartstochten opzwepen, en zo zijn levenskracht verspillen”.","t98":"Dat „te intens leven” is hier „zijne hartstochten opzweepen, en zoo zijn levenskracht verspillen”."},{"v":[5,6],"l":"5–6","t":"Met „zijn leven regeren” bedoelt Lao Tszʼ hier „Wu Wei” worden, het spirituele tot het hoogste opvoeren.—Hij, die alleen in ’t spirituele leeft, heeft als ’t ware geen lichaam meer, en is dus niet meer blootgesteld aan den dood, die alleen ’t lichaam treft.—Johnson vergelijkt deze regelen terecht met Markus XVI, 18: „Slangen zullen zij (die geloven) opnemen; en al is het dat zij iets dodelijks zullen drinken, het zal hun niet schaden”.","t98":"Met „zijn leven regeeren” bedoelt Lao Tszʼ hier „Wu Wei” worden, het spiritueele tot het hoogste opvoeren.—Hij, die alleen in ’t spiritueele leeft, heeft als ’t ware geen lichaam meer, en is dus niet meer blootgesteld aan den dood, die alleen ’t lichaam treft.—Johnson vergelijkt deze regelen terecht met Markus XVI, 18: „Slangen zullen zij (die gelooven) opnemen; en al is het dat zij iets doodelijks zullen drinken, het zal hun niet schaden”."}]},{"n":51,"r":"LI","d":"Teh","zh":["道生之，德畜之，物形之，勢成之。","是以萬物莫不尊道而貴德。","道之尊，德之貴，夫莫之命而常自然。","故道生之，德畜之。","長之育之，亭之毒之，蓋之覆之。","生而不有，為而不恃，長而不宰。","是謂玄德。"],"nl":[[1,["Tao brengt de dingen voort. Het brengt ze groot door Teh (Zijne manifestatie in hen). Het vormt ze door Zijne substantie. Het volmaakt ze door Zijne impulsie."]],[2,["Daarom, onder alle wezens is er geen, dat niet Tao vereert en Teh hoogacht."]],[3,["Die majesteit van Tao en die eerwaardigheid van Teh zijn niet aan hen gegeven, zij bezitten die eeuwig uit zichzelven."]],[4,["Daarom, Tao baart alle dingen, kweekt ze op, doet ze groeien, brengt ze groot, volmaakt ze, doet ze rijpen, voedt ze, beschermt ze."]],[5,["Te baren, en toch niet als eigendom te beschouwen, te formeren, en dat toch niet als glorie te beschouwen, te regeren, en toch vrij te laten,—dit noem ik de mysterieuze Deugd."]]],"n98":[[1,["Tao brengt de dingen voort. Het brengt ze groot door Teh (Zijne manifestatie in hen). Het vormt ze door Zijne substantie. Het volmaakt ze door Zijne impulsie."]],[2,["Daarom, onder alle wezens is er geen, dat niet Tao vereert en Teh hoogacht."]],[3,["Die majesteit van Tao en die eerwaardigheid van Teh zijn niet aan hen gegeven, zij bezitten die eeuwig uit zichzelven."]],[4,["Daarom, Tao baart alle dingen, kweekt ze op, doet ze groeien, brengt ze groot, volmaakt ze, doet ze rijpen, voedt ze, beschermt ze."]],[5,["Te baren, en toch niet als eigendom te beschouwen, te formeeren, en dat toch niet als glorie te beschouwen, te regeeren, en toch vrij te laten,—dit noem ik de mysterieuze Deugd."]]],"en":[[1,["All things are produced by the Tao, and nourished by its outflowing operation. They receive their forms according to the nature of each, and are completed according to the circumstances of their condition. Therefore all things without exception honour the Tao, and exalt its outflowing operation."]],[2,["This honouring of the Tao and exalting of its operation is not the result of any ordination, but always a spontaneous tribute."]],[3,["Thus it is that the Tao produces (all things), nourishes them, brings them to their full growth, nurses them, completes them, matures them, maintains them, and overspreads them."]],[4,["It produces them and makes no claim to the possession of them; it carries them through their processes and does not vaunt its ability in doing so; it brings them to maturity and exercises no control over them;--this is called its mysterious operation."]]],"no":[{"v":[1],"l":"1","t":"Ik herinner aan wat ik in de Inleiding uitlegde, n.l. dat Lao Tszʼ Tao, in-zich-zelf beschouwd, Tao noemde, en dat hij Teh noemde: Tao als gemanifesteerd zijnde in de creatie. Ik heb hier een vrijheid genomen. Letterlijk staat er: „Tao brengt de dingen voort, Teh brengt ze groot”.—Ik nam mijne vrije vertaling om nog eens goed te doen uitkomen wat Teh is.","t98":"Ik herinner aan wat ik in de Inleiding uitlegde, n.l. dat Lao Tszʼ Tao, in-zich-zelf beschouwd, Tao noemde, en dat hij Teh noemde: Tao als gemanifesteerd zijnde in de creatie. Ik heb hier eene vrijheid genomen. Letterlijk staat er: „Tao brengt de dingen voort, Teh brengt ze groot”.—Ik nam mijne vrije vertaling om nog eens goed te doen uitkomen wat Teh is."},{"v":[5],"l":"5","t":"Met dit „vrij laten” wordt bedoeld, dat Tao niet, zoals b.v. een koning, nog eerst krachtige wetten behoeft te maken, en hen voortdurend onder bedwang houdt, maar hen hun natuur laat volgen. Immers, als ze maar Wu Wei zijn, is alles vanzelf goed. Johnson vergelijkt den eersten tekst, 1, met den schonen tekst uit de Prasna Upanishad. „As the birds to a tree, so all beings repair to the supreme Soul”.","t98":"Met dit „vrij laten” wordt bedoeld, dat Tao niet, zooals b.v. een koning, nog eerst krachtige wetten behoeft te maken, en hen voortdurend onder bedwang houdt, maar hen hun natuur laat volgen. Immers, als ze maar Wu Wei zijn, is alles vanzelf goed. Johnson vergelijkt den eersten tekst, 1, met den schoonen tekst uit de Prasna Upanishad. „As the birds to a tree, so all beings repair to the supreme Soul”."}]},{"n":52,"r":"LII","d":"Teh","zh":["天下有始，以為天下母。","既得其母，以知其子，既知其子，復守其母，沒身不殆。","塞其兌，閉其門，終身不勤。","開其兌，濟其事，終身不救。","見小曰明，守柔曰強。","用其光，復歸其明，無遺身殃，是為習常。"],"nl":[[1,["De wereld heeft een begin, dat werd de Moeder der wereld."]],[2,["Als men de moeder bezit kent men daardoor hare kinderen. Als men hare kinderen kent en daarna de moeder behoudt, al sterft het lichaam weg, men heeft dan geen gevaar te duchten."]],[3,["Hij, die zijn mond sluit, en zijne ogen en oren dichtdoet, zal zijn gehele leven lang niet (behoeven te) tobben. Hij, die zijn mond opendoet, en zich druk gaat maken, is niet (meer) te redden."]],[4,["Het kleine te zien heet verlicht zijn, zwakheid te handhaven heet sterk zijn."]],[5,["Als men gebruik maakt van de afschittering van Tao om daarna tot Zijn licht terug te keren, heeft het lichaam geen ramp meer te vrezen."]],[6,["Dit noem ik dubbel verlicht zijn."]]],"n98":[[1,["De wereld heeft een begin, dat werd de Moeder der wereld."]],[2,["Als men de moeder bezit kent men daardoor hare kinderen. Als men hare kinderen kent en daarna de moeder behoudt, al sterft het lichaam weg, men heeft dan geen gevaar te duchten."]],[3,["Hij, die zijn mond sluit, en zijne oogen en ooren dichtdoet, zal zijn geheele leven lang niet (behoeven te) tobben. Hij, die zijn mond opendoet, en zich druk gaat maken, is niet (meer) te redden."]],[4,["Het kleine te zien heet verlicht zijn, zwakheid te handhaven heet sterk zijn."]],[5,["Als men gebruik maakt van de afschittering van Tao om daarna tot Zijn licht terug te keeren, heeft het lichaam geen ramp meer te vreezen."]],[6,["Dit noem ik dubbel verlicht zijn."]]],"en":[[1,["(The Tao) which originated all under the sky is to be considered as the mother of them all."]],[2,["When the mother is found, we know what her children should be. When one knows that he is his mother's child, and proceeds to guard (the qualities of) the mother that belong to him, to the end of his life he will be free from all peril."]],[3,["Let him keep his mouth closed, and shut up the portals (of his nostrils), and all his life he will be exempt from laborious exertion. Let him keep his mouth open, and (spend his breath) in the promotion of his affairs, and all his life there will be no safety for him."]],[4,["The perception of what is small is (the secret of) clear-sightedness; the guarding of what is soft and tender is (the secret of) strength."]],[5,["Who uses well his light,\nReverting to its (source so) bright,\nWill from his body ward all blight,\nAnd hides the unchanging from men's sight."]]],"no":[{"v":[1],"l":"1","t":"Vergelijk Hoofdstuk I. 2.","t98":"Vergelijk Hoofdstuk I. 2."},{"v":[2],"l":"2","t":"De moeder is hier Tao, hare kinderen de door Hem gecreëerde wezens en dingen. Hij, die weet hoe de wereld gecreëerd is, en waaruit zij is ontstaan, vreest natuurlijk den dood van zijn lichaam niet.","t98":"De moeder is hier Tao, hare kinderen de door Hem gecreëerde wezens en dingen. Hij, die weet hoe de wereld gecreëerd is, en waaruit zij is ontstaan, vreest natuurlijk den dood van zijn lichaam niet."},{"v":[3],"l":"3","t":"Voor „druk maken” (lett. staat er „zijn zaken redden”) hebben sommigen een uitdrukking voor „zijne begeerten vermeerderen” gezien.","t98":"Voor „druk maken” (lett. staat er „zijn zaken redden”) hebben sommigen eene uitdrukking voor „zijne begeerten vermeerderen” gezien."},{"v":[4],"l":"4","t":"Het kleine, d.i. het subtiele.","t98":"Het kleine, d.i. het subtiele."},{"v":[5],"l":"5","t":"Deze tekst is niet heel duidelijk. De uitlegging van een chinees commentator Lüi Kie Fou, ook door Julien aangehaald, komt mij vrij aannemelijk voor. Volgens dezen is zij „hij, die gebruik maakt van de afschittering van Tao om de mensen en dingen te leren kennen en zich aan hen te onttrekken, en dan weer terug keert tot het licht van Tao zelf, om tot de absolute rust te komen, zal niet in rampen komen”. Maar dubieus blijft het.","t98":"Deze tekst is niet heel duidelijk. De uitlegging van een chineesch commentator Lüi Kie Fou, ook door Julien aangehaald, komt mij vrij aannemelijk voor. Volgens dezen is zij „hij, die gebruik maakt van de afschittering van Tao om de menschen en dingen te leeren kennen en zich aan hen te onttrekken, en dan weer terug keert tot het licht van Tao zelf, om tot de absolute rust te komen, zal niet in rampen komen”. Maar dubieus blijft het."}]},{"n":53,"r":"LIII","d":"Teh","zh":["使我介然有知，行於大道，唯施是畏。","大道甚夷，而民好徑。","朝甚除，田甚蕪，倉甚虛；服文綵，帶利劍，厭飲食，財貨有餘；是為盜夸。","非道也哉！"],"nl":[[1,["Als ik, bij toeval, eens een beetje kennis had, zou ik den groten Weg bewandelen."]],[2,["Mijn vrees zou zijn, of ik (deze leer) wel zou kunnen verspreiden."]],[3,["(Want) de grote Weg is zeer vlak, maar het volk houdt van de zijpaden."]],[4,["Als de paleizen veel treden hebben, zijn de velden vol onkruid, en zijn de graanschuren ganselijk ledig."]],[5,["De prinsen kleden zich in schitterende gewaden, dragende een scherp zwaard; zij verzadigen zich aan (lekker) eten en drinken, en hebben schatten en goederen te over."]],[6,["Dit noem ik het voorbeeld geven van diefstal. Dit is niet zich toeleggen op Tao!"]]],"n98":[[1,["Als ik, bij toeval, eens een beetje kennis had, zou ik den grooten Weg bewandelen."]],[2,["Mijn vrees zou zijn, of ik (deze leer) wel zou kunnen verspreiden."]],[3,["(Want) de groote Weg is zeer vlak, maar het volk houdt van de zijpaden."]],[4,["Als de paleizen veel treden hebben, zijn de velden vol onkruid, en zijn de graanschuren ganschelijk ledig."]],[5,["De prinsen kleeden zich in schitterende gewaden, dragende een scherp zwaard; zij verzadigen zich aan (lekker) eten en drinken, en hebben schatten en goederen te over."]],[6,["Dit noem ik het voorbeeld geven van diefstal. Dit is niet zich toeleggen op Tao!"]]],"en":[[1,["If I were suddenly to become known, and (put into a position to) conduct (a government) according to the Great Tao, what I should be most afraid of would be a boastful display."]],[2,["The great Tao (or way) is very level and easy; but people love the by-ways."]],[3,["Their court(-yards and buildings) shall be well kept, but their fields shall be ill-cultivated, and their granaries very empty. They shall wear elegant and ornamented robes, carry a sharp sword at their girdle, pamper themselves in eating and drinking, and have a superabundance of property and wealth;--such (princes) may be called robbers and boasters. This is contrary to the Tao surely!"]]],"no":[{"v":[1],"l":"1","t":"Hier hebben wij weer een voorbeeld, dat Tao gewoon Weg, of Pad betekent, als zo dikwijls in Confucius.—Hier dus, het Pad, de Weg van Tao, het Pad, waarin men gaat (en dit is door Wu Wei te zijn) als men in Tao leeft. Wells Williams, in zijn dictionnaire dit hoofdstuk aanhalende, spreekt van „the way of truth” in dit geval.","t98":"Hier hebben wij weer een voorbeeld, dat Tao gewoon Weg, of Pad beteekent, als zoo dikwijls in Confucius.—Hier dus, het Pad, de Weg van Tao, het Pad, waarin men gaat (en dit is door Wu Wei te zijn) als men in Tao leeft. Wells Williams, in zijn dictionnaire dit hoofdstuk aanhalende, spreekt van „the way of truth” in dit geval."},{"v":[2],"l":"2","t":"Door er een karakter bij te voegen, krijgen vele vertalers, er een dat „doen” betekent (Wei), achterplaatsende dézen zin: „wat ik vrees, is om te ageren”. Maar, het karakter zo latende, krijg ik mijne versie, die toch ook aannemelijk is, en wèl in verband met het volgende.","t98":"Door er een karakter bij te voegen, krijgen vele vertalers, er een dat „doen” beteekent (Wei), achterplaatsende dézen zin: „wat ik vrees, is om te ageeren”. Maar, het karakter zoo latende, krijg ik mijne versie, die toch ook aannemelijk is, en wèl in verband met het volgende."},{"v":[3],"l":"3","t":"„Vlak” ook in den zin van „eenvoudig”.","t98":"„Vlak” ook in den zin van „eenvoudig”."},{"v":[4],"l":"4","t":"„Veel treden hebben”, d.i. dus hoog gelegen zijn, mooi en weelderig zijn.","t98":"„Veel treden hebben”, d.i. dus hoog gelegen zijn, mooi en weelderig zijn."},{"v":[6],"l":"6","t":"Een zo groot geleerde als keizer Khang Hi volgende, heb ik hier, zoals hij in zijn beroemd „Khang Hi’s Woordenboek” deed, hier in deze passage het karakter „ting” bijgevoegd, waardoor ik deze versie kreeg. Letterlijk staat er „dit noem ik zich beroemen op diefstal”. Het gehele hoofdstuk, bemerkt men, is een tirade tegen de toen ter tijde regerende vorsten, die Tao verzaakten in de regering van het rijk.—Het „de grote Weg” in den eersten volzin is een der voornaamste argumenten van velen, dat Lao Tsz’s „Tao” met „Weg” zou moeten vertaald worden.—Maar dat het karakter Tao hier even „Weg” betekent, daaruit volgt nog volstrekt niet, dat het dit per se nu ook overal elders moet betekenen.","t98":"Een zoo groot geleerde als keizer Khang Hi volgende, heb ik hier, zooals hij in zijn beroemd „Khang Hi’s Woordenboek” deed, hier in deze passage het karakter „ting” bijgevoegd, waardoor ik deze versie kreeg. Letterlijk staat er „dit noem ik zich beroemen op diefstal”. Het geheele hoofdstuk, bemerkt men, is eene tirade tegen de toen ter tijde regeerende vorsten, die Tao verzaakten in de regeering van het rijk.—Het „de groote Weg” in den eersten volzin is een der voornaamste argumenten van velen, dat Lao Tsz’s „Tao” met „Weg” zou moeten vertaald worden.—Maar dat het karakter Tao hier even „Weg” beteekent, daaruit volgt nog volstrekt niet, dat het dit per se nu ook overal elders moet beteekenen."}]},{"n":54,"r":"LIV","d":"Teh","zh":["善建者不拔，善抱者不脫，子孫以祭祀不輟。","修之於身，其德乃真；修之於家，其德乃餘；修之於鄉，其德乃長；修之於國，其德乃豐；修之於天下，其德乃普。","故以身觀身，以家觀家，以鄉觀鄉，以國觀國，以天下觀天下。","吾何以知天下然哉？","以此。"],"nl":[[1,["Hij, die goed weet te grondvesten, zal (zijn werk) niet ontworteld zien; hij, die goed weet vast te houden, zal niet laten ontglippen."]],[2,["Zijn zonen en kleinzonen zullen voor hem offeren zonder ophouden."]],[3,["Als de mens Het betracht in zich zelven, zal zijn deugd reëel worden. Als hij Het betracht in zijne familie zal zijn deugd overvloedig worden. Als hij Het in zijn dorp betracht zal zijn deugd (vèr) verspreid worden. Als hij Het in zijn staat betracht zal zijn deugd rijk-bloeiend worden. Als hij Het in het Rijk betracht zal zijn deugd universeel worden."]],[4,["Daarom, naar zich zelf oordeelt men anderen, naar zijne familie oordeelt men andere familieën; naar zijn dorp oordeelt men andere dorpen; naar zijn staat oordeelt men andere staten; naar zijn Rijk oordeelt men andere (toekomstige) Rijken."]],[5,["Hoe weet ik dat het aldus met het Rijk is? (Juist) door Dit."]]],"n98":[[1,["Hij, die goed weet te grondvesten, zal (zijn werk) niet ontworteld zien; hij, die goed weet vast te houden, zal niet laten ontglippen."]],[2,["Zijn zonen en kleinzonen zullen voor hem offeren zonder ophouden."]],[3,["Als de mensch Het betracht in zich zelven, zal zijn deugd reëel worden. Als hij Het betracht in zijne familie zal zijn deugd overvloedig worden. Als hij Het in zijn dorp betracht zal zijn deugd (vèr) verspreid worden. Als hij Het in zijn staat betracht zal zijn deugd rijk-bloeiend worden. Als hij Het in het Rijk betracht zal zijn deugd universeel worden."]],[4,["Daarom, naar zich zelf oordeelt men anderen, naar zijne familie oordeelt men andere familieën; naar zijn dorp oordeelt men andere dorpen; naar zijn staat oordeelt men andere staten; naar zijn Rijk oordeelt men andere (toekomstige) Rijken."]],[5,["Hoe weet ik dat het aldus met het Rijk is? (Juist) door Dit."]]],"en":[[1,["What (Tao's) skilful planter plants\nCan never be uptorn;\nWhat his skilful arms enfold,\nFrom him can ne'er be borne.\nSons shall bring in lengthening line,\nSacrifices to his shrine."]],[2,["Tao when nursed within one's self,\nHis vigour will make true;\nAnd where the family it rules\nWhat riches will accrue!\nThe neighbourhood where it prevails\nIn thriving will abound;\nAnd when 'tis seen throughout the state,\nGood fortune will be found.\nEmploy it the kingdom o'er,\nAnd men thrive all around."]],[3,["In this way the effect will be seen in the person, by the observation of different cases; in the family; in the neighbourhood; in the state; and in the kingdom."]],[4,["How do I know that this effect is sure to hold thus all under the sky? By this (method of observation)."]]],"no":[{"v":[1],"l":"1","t":"„Grondvesten”, d.i. hier „grondvesten op Tao”. „Vast houden”, d.i. hier „de beginselen van Tao goed vasthouden”.—Vergelijk in Confucius, Choeng Yoeng, Hfdst. VIII, blz. 88.","t98":"„Grondvesten”, d.i. hier „grondvesten op Tao”. „Vast houden”, d.i. hier „de beginselen van Tao goed vasthouden”.—Vergelijk in Confucius, Choeng Yoeng, Hfdst. VIII, blz. 88."},{"v":[3],"l":"3","t":"„Het” is hier weer „Tao”.—De opvolging van zich-zelf, zijne familie, zijn dorp, zijn staat, zijn Rijk, doet hier aan een ideeëngang van Confucius denken. Vergelijk „Confucius, Ta Hioh”, Hfdst. I, 5 en 6, blz. 148. Sommige vertalers lezen hier voor „teh” niet overal deugd, maar de gevolgen dier deugd, en krijgen dan o.a. „Hij, die Het in zijn dorp betracht, zal „de bevolking (daarvan)” vermeerderd zien”.","t98":"„Het” is hier weer „Tao”.—De opvolging van zich-zelf, zijne familie, zijn dorp, zijn staat, zijn Rijk, doet hier aan een ideeëngang van Confucius denken. Vergelijk „Confucius, Ta Hioh”, Hfdst. I, 5 en 6, blz. 148. Sommige vertalers lezen hier voor „teh” niet overal deugd, maar de gevolgen dier deugd, en krijgen dan o.a. „Hij, die Het in zijn dorp betracht, zal „de bevolking (daarvan)” vermeerderd zien”."},{"v":[5],"l":"5","t":"„Door Dit”, d.i. door Tao.","t98":"„Door Dit”, d.i. door Tao."}]},{"n":55,"r":"LV","d":"Teh","zh":["含德之厚，比於赤子。","蜂蠆虺蛇不螫，猛獸不據，攫鳥不搏。","骨弱筋柔而握固。","未知牝牡之合而全作，精之至也。","終日號而不嗄，和之至也。","知和曰常，知常曰明。","益生曰祥。","心使氣曰強。","物壯則老，謂之不道，不道早已。"],"nl":[[1,["Hij die een intenze deugd heeft gelijkt op een pasgeboren kind, dat de steken van venijnige insecten niet vreest, noch de klauwen van wilde beesten, noch den greep van roofvogels."]],[2,["Zijn beenderen zijn zwak, zijn pezen zijn week, en (toch) houdt het (de dingen) stevig vast."]],[3,["Het weet nog niet de gemeenschap der beide seksen en (toch) is er (al) wat actie in zijn geslachtsdeel. Dit is door de volmaaktheid van het semen."]],[4,["Het schreeuwt den gansen dag en (toch) wordt zijn keel niet schor. Dit is (door) de volmaaktheid van de harmonie."]],[5,["Te weten wat harmonie is heet onveranderlijk (eeuwigdurend) zijn. Te weten wat onveranderlijk is heet verlicht zijn. Vermeerdering van leven heet zaligheid. De geest het lichaam besturende heet kracht."]],[6,["Vanaf het toppunt van kracht worden de dingen oud, dat wil zeggen, zij zijn niet gelijk aan Tao, en wat niet gelijk is aan Tao neemt een spoedig einde."]]],"n98":[[1,["Hij die een intenze deugd heeft gelijkt op een pasgeboren kind, dat de steken van venijnige insecten niet vreest, noch de klauwen van wilde beesten, noch den greep van roofvogels."]],[2,["Zijn beenderen zijn zwak, zijn pezen zijn week, en (toch) houdt het (de dingen) stevig vast."]],[3,["Het weet nog niet de gemeenschap der beide seksen en (toch) is er (al) wat actie in zijn geslachtsdeel. Dit is door de volmaaktheid van het semen."]],[4,["Het schreeuwt den ganschen dag en (toch) wordt zijn keel niet schor. Dit is (door) de volmaaktheid van de harmonie."]],[5,["Te weten wat harmonie is heet onveranderlijk (eeuwigdurend) zijn. Te weten wat onveranderlijk is heet verlicht zijn. Vermeerdering van leven heet zaligheid. De geest het lichaam besturende heet kracht."]],[6,["Vanaf het toppunt van kracht worden de dingen oud, dat wil zeggen, zij zijn niet gelijk aan Tao, en wat niet gelijk is aan Tao neemt een spoedig einde."]]],"en":[[1,["He who has in himself abundantly the attributes (of the Tao) is like an infant. Poisonous insects will not sting him; fierce beasts will not seize him; birds of prey will not strike him."]],[2,["(The infant's) bones are weak and its sinews soft, but yet its grasp is firm. It knows not yet the union of male and female, and yet its virile member may be excited;--showing the perfection of its physical essence. All day long it will cry without its throat becoming hoarse;--showing the harmony (in its constitution)."]],[3,["To him by whom this harmony is known,\n(The secret of) the unchanging (Tao) is shown,\nAnd in the knowledge wisdom finds its throne.\nAll life-increasing arts to evil turn;\nWhere the mind makes the vital breath to burn,\n(False) is the strength, (and o'er it we should mourn.)"]],[4,["When things have become strong, they (then) become old, which may be said to be contrary to the Tao. Whatever is contrary to the Tao soon ends."]]],"no":[{"v":[1],"l":"1","t":"D. i. „Hij die in Tao leeft”.","t98":"D. i. „Hij die in Tao leeft”."},{"v":[4],"l":"4","t":"Indien mensen schreeuwen van pijn of van pleizier, wordt de keel schor, en is er geen harmonie in dien mens. In het kind is de volkomen harmonie der vitale krachten.","t98":"Indien menschen schreeuwen van pijn of van pleizier, wordt de keel schor, en is er geen harmonie in dien mensch. In het kind is de volkomen harmonie der vitale krachten."},{"v":[5],"l":"5","t":"Zie Hfdst. XVI.—Verlicht is hier synoniem met wijs. Letterlijk staat er „het hart de vitale energie besturende”.","t98":"Zie Hfdst. XVI.—Verlicht is hier synoniem met wijs. Letterlijk staat er „het hart de vitale energie besturende”."},{"v":[6],"l":"6","t":"Zie Hfdst. XXX.","t98":"Zie Hfdst. XXX."}]},{"n":56,"r":"LVI","d":"Teh","zh":["知者不言，言者不知。","塞其兌，閉其門，挫其銳，解其分，和其光，同其塵，是謂玄同。","故不可得而親，不可得而疏；不可得而利，不可得而害；不可得而貴，不可得而賤。","故為天下貴。"],"nl":[[1,["Zij die (Tao) weten spreken er niet over; zij die er over spreken weten Het niet."]],[2,["De Wijze doet zijn mond dicht, sluit ogen en oren, haalt zijne hoge aspiraties neder, ontrafelt het verwarde, tempert het (verblindend) schitterende, en maakt zich gelijk aan het stof. Dit noem ik een mystieke gelijkenis (met Tao)."]],[3,["Gunst noch ongenade, voorspoed noch schade, geëerdheid noch verachting kunnen hem treffen."]],[4,["Daarom is hij de eerbiedwaardigste mens onder den Hemel."]]],"n98":[[1,["Zij die (Tao) weten spreken er niet over; zij die er over spreken weten Het niet."]],[2,["De Wijze doet zijn mond dicht, sluit oogen en ooren, haalt zijne hooge aspiraties neder, ontrafelt het verwarde, tempert het (verblindend) schitterende, en maakt zich gelijk aan het stof. Dit noem ik eene mystieke gelijkenis (met Tao)."]],[3,["Gunst noch ongenade, voorspoed noch schade, geëerdheid noch verachting kunnen hem treffen."]],[4,["Daarom is hij de eerbiedwaardigste mensch onder den Hemel."]]],"en":[[1,["He who knows (the Tao) does not (care to) speak (about it); he who is (ever ready to) speak about it does not know it."]],[2,["He (who knows it) will keep his mouth shut and close the portals (of his nostrils). He will blunt his sharp points and unravel the complications of things; he will attemper his brightness, and bring himself into agreement with the obscurity (of others). This is called 'the Mysterious Agreement.'"]],[3,["(Such an one) cannot be treated familiarly or distantly; he is beyond all consideration of profit or injury; of nobility or meanness:--he is the noblest man under heaven."]]],"no":[{"v":[2],"l":"2","t":"Letterlijk staat er „sluit zijn deuren”, maar volgens verscheidene chinese commentators betekenen die deuren hier „ogen en oren”.","t98":"Letterlijk staat er „sluit zijn deuren”, maar volgens verscheidene chineesche commentators beteekenen die deuren hier „oogen en ooren”."},{"v":[3],"l":"3","t":"Ik vertaal hier „hij haalt zijn hoge aspiraties neder”, maar letterlijk staat er, als in Hfdst. IV: „Het verstompt zijn scherpte”.—Men lette op de woordelijke gelijkenis met Hfdst. IV, waar Tao het onderwerp is. Deze gelijkheid van uitdrukking maakt de gelijkenis nog sterker.","t98":"Ik vertaal hier „hij haalt zijn hooge aspiraties neder”, maar letterlijk staat er, als in Hfdst. IV: „Het verstompt zijn scherpte”.—Men lette op de woordelijke gelijkenis met Hfdst. IV, waar Tao het onderwerp is. Deze gelijkheid van uitdrukking maakt de gelijkenis nog sterker."}]},{"n":57,"r":"LVII","d":"Teh","zh":["以正治國，以奇用兵，以無事取天下。","吾何以知其然哉？","以此。","天下多忌諱，而民彌貧；民多利器，國家滋昬；人多伎巧，奇物滋起；法令滋彰，盜賊多有。","故聖人云：「我無為而民自化，我好靜而民自正，我無事而民自富，我無欲而民自樸。","」"],"nl":[[1,["Met rechtheid regeert men den staat, met listen voert men oorlog, met Wu Wei wint men het Rijk."]],[2,["Hoe weet ik, dat het zo met het Rijk is? Door dit:"]],[3,["Hoe meer bangmakende verbodsbepalingen er in het rijk zijn, des te armer wordt het volk; hoe meer middelen tot productie van weelde het volk heeft, des te verwarder wordt de staat; hoe bekwamer en vernuftiger het volk is, des te meer artificiële dingen worden er gemaakt; hoe rijker en klaarder de wet wordt, des te meer dieven en rovers er komen."]],[4,["Daarom zegt de Wijze: Ik ben Wu Wei en dan zal het volk zich vanzelf hervormen. Ik houd van de rust, en dan zal het volk vanzelf recht worden. Ik doe geen werk, en dan zal het volk vanzelf rijk worden. Ik heb geen begeerten, en dan zal het volk vanzelf (weer) eenvoudig worden."]]],"n98":[[1,["Met rechtheid regeert men den staat, met listen voert men oorlog, met Wu Wei wint men het Rijk."]],[2,["Hoe weet ik, dat het zoo met het Rijk is? Door dit:"]],[3,["Hoe meer bangmakende verbodsbepalingen er in het rijk zijn, des te armer wordt het volk; hoe meer middelen tot productie van weelde het volk heeft, des te verwarder wordt de staat; hoe bekwamer en vernuftiger het volk is, des te meer artificiëele dingen worden er gemaakt; hoe rijker en klaarder de wet wordt, des te meer dieven en roovers er komen."]],[4,["Daarom zegt de Wijze: Ik ben Wu Wei en dan zal het volk zich vanzelf hervormen. Ik houd van de rust, en dan zal het volk vanzelf recht worden. Ik doe geen werk, en dan zal het volk vanzelf rijk worden. Ik heb geen begeerten, en dan zal het volk vanzelf (weer) eenvoudig worden."]]],"en":[[1,["A state may be ruled by (measures of) correction; weapons of war may be used with crafty dexterity; (but) the kingdom is made one's own (only) by freedom from action and purpose."]],[2,["How do I know that it is so? By these facts:--In the kingdom the multiplication of prohibitive enactments increases the poverty of the people; the more implements to add to their profit that the people have, the greater disorder is there in the state and clan; the more acts of crafty dexterity that men possess, the more do strange contrivances appear; the more display there is of legislation, the more thieves and robbers there are."]],[3,["Therefore a sage has said, 'I will do nothing (of purpose), and the people will be transformed of themselves; I will be fond of keeping still, and the people will of themselves become correct. I will take no trouble about it, and the people will of themselves become rich; I will manifest no ambition, and the people will of themselves attain to the primitive simplicity.'"]]],"no":[{"v":[1],"l":"1","t":"Men denke er vooral om, wat ik reeds zo herhaaldelijk releveerde, dat „Wu Wei” niet zomaar niets-doen betekent.","t98":"Men denke er vooral om, wat ik reeds zoo herhaaldelijk releveerde, dat „Wu Wei” niet zoomaar niets-doen beteekent."},{"v":[3],"l":"3","t":"Herbert Giles vertaalt de laatste zinsnede kernachtiger, maar minder getrouw aan den tekst: „Overlegislation increases crime”.—Denkt men bij dezen tekst niet onwillekeurig aan den ontzaglijken berg folio’s van Staatsbladen, die een ambtenaar in Ned.-Indië moet kennen?","t98":"Herbert Giles vertaalt de laatste zinsnede kernachtiger, maar minder getrouw aan den tekst: „Overlegislation increases crime”.—Denkt men bij dezen tekst niet onwillekeurig aan den ontzaglijken berg folio’s van Staatsbladen, die een ambtenaar in Ned.-Indië moet kennen?"},{"v":[4],"l":"4","t":"Men versta hier in dit speciale geval „de Wijze, die een vorst is”. Met „géén werk” wordt bedoeld „geen militaire expedities, grote ondernemingen”, enz.","t98":"Men versta hier in dit speciale geval „de Wijze, die een vorst is”. Met „géén werk” wordt bedoeld „geen militaire expedities, groote ondernemingen”, enz."}]},{"n":58,"r":"LVIII","d":"Teh","zh":["其政悶悶，其民淳淳；其政察察，其民缺缺。","禍兮福之所倚，福兮禍之所伏。","孰知其極？","其無正。","正復為奇，善復為妖。","人之迷，其日固久。","是以聖人方而不割，廉而不劌，直而不肆，光而不燿。"],"nl":[[1,["Als de regering tolerant is, zal het volk schuldeloos zijn; als de regering overal den neus in steekt, zal het volk telkens inbreuk op de wet maken."]],[2,["Falen is de basis van slagen; slagen is de basis van falen. Wie weet (van die twee) het uiterste?"]],[3,["Voor den ongerechte lijkt gerechtigheid als vreemd, en goedheid als verdorvenheid."]],[4,["Waarlijk, de mensheid is gedompeld in dwaling, sinds menigen dag!"]],[5,["Daarom, de Wijze is vierkant, zonder hoekig te zijn, is belangeloos zonder te kwetsen, is oprecht zonder overdreven stipt te zijn, is schitterend zonder te verblinden."]]],"n98":[[1,["Als de regeering tolerant is, zal het volk schuldeloos zijn; als de regeering overal den neus in steekt, zal het volk telkens inbreuk op de wet maken."]],[2,["Falen is de basis van slagen; slagen is de basis van falen. Wie weet (van die twee) het uiterste?"]],[3,["Voor den ongerechte lijkt gerechtigheid als vreemd, en goedheid als verdorvenheid."]],[4,["Waarlijk, de menschheid is gedompeld in dwaling, sinds menigen dag!"]],[5,["Daarom, de Wijze is vierkant, zonder hoekig te zijn, is belangeloos zonder te kwetsen, is oprecht zonder overdreven stipt te zijn, is schitterend zonder te verblinden."]]],"en":[[1,["The government that seems the most unwise,\nOft goodness to the people best supplies;\nThat which is meddling, touching everything,\nWill work but ill, and disappointment bring.","Misery!--happiness is to be found by its side! Happiness!--misery lurks beneath it! Who knows what either will come to in the end?"]],[2,["Shall we then dispense with correction? The (method of) correction shall by a turn become distortion, and the good in it shall by a turn become evil. The delusion of the people (on this point) has indeed subsisted for a long time."]],[3,["Therefore the sage is (like) a square which cuts no one (with its angles); (like) a corner which injures no one (with its sharpness). He is straightforward, but allows himself no license; he is bright, but does not dazzle."]]],"no":[{"v":[1],"l":"1","t":"„Shun” is hier zowel puur als eerlijk, ongemengd, zuiver.—Ik heb mijn commentator Peh Yü Shen gevolgd, die een ander klassenhoofd voor het karakter geeft dan er staat. Anderen, het oorspronkelijke behoudend, krijgen „rijk, liberaal”.","t98":"„Shun” is hier zoowel puur als eerlijk, ongemengd, zuiver.—Ik heb mijn commentator Peh Yü Shen gevolgd, die een ander klassenhoofd voor het karakter geeft dan er staat. Anderen, het oorspronkelijke behoudend, krijgen „rijk, liberaal”."},{"v":[2],"l":"2","t":"Letterlijk staat er „ongeluk is de basis van geluk” enz.","t98":"Letterlijk staat er „ongeluk is de basis van geluk” enz."},{"v":[3],"l":"3","t":"Julien en anderen hebben: „Si le prince n’est pas droit, les hommes droits deviendront trompeurs, et les hommes vertueux pervers”.","t98":"Julien en anderen hebben: „Si le prince n’est pas droit, les hommes droits deviendront trompeurs, et les hommes vertueux pervers”."}]},{"n":59,"r":"LIX","d":"Teh","zh":["治人事天，莫若嗇。","夫唯嗇，是謂早服；早服謂之重積德；重積德則無不克，無不克則莫知其極；莫知其極，可以有國；有國之母，可以長久；是謂深根固柢，長生久視之道。"],"nl":[[1,["Om de mensen te regeren en den Hemel te dienen gaat niets boven de gematigdheid."]],[2,["Gematigdheid is het allereerst nodige voor den mens."]],[3,["Dit allereerst nodige noem ik een zware opeenstapeling van deugd. Met een zware opeenstapeling van deugd is er niets, wat hij niet verwezenlijken kan. Als er niets is, wat hij niet verwezenlijken kan, kent niemand de grenzen (van zijn macht). Als niemand de grenzen kent (van zijn macht) is hij geschikt om het rijk te regeren."]],[4,["Die het oer-principe van het rijk bezit, zal lang blijven (regeren). Dit is wat men noemt „een krachtigen en diep geplanten wortel hebben”. Dit is de leer van lang te leven."]]],"n98":[[1,["Om de menschen te regeeren en den Hemel te dienen gaat niets boven de gematigdheid."]],[2,["Gematigdheid is het allereerst noodige voor den mensch."]],[3,["Dit allereerst noodige noem ik eene zware opeenstapeling van deugd. Met eene zware opeenstapeling van deugd is er niets, wat hij niet verwezenlijken kan. Als er niets is, wat hij niet verwezenlijken kan, kent niemand de grenzen (van zijn macht). Als niemand de grenzen kent (van zijn macht) is hij geschikt om het rijk te regeeren."]],[4,["Die het oer-principe van het rijk bezit, zal lang blijven (regeeren). Dit is wat men noemt „een krachtigen en diep geplanten wortel hebben”. Dit is de leer van lang te leven."]]],"en":[[1,["For regulating the human (in our constitution) and rendering the (proper) service to the heavenly, there is nothing like moderation."]],[2,["It is only by this moderation that there is effected an early return (to man's normal state). That early return is what I call the repeated accumulation of the attributes (of the Tao). With that repeated accumulation of those attributes, there comes the subjugation (of every obstacle to such return). Of this subjugation we know not what shall be the limit; and when one knows not what the limit shall be, he may be the ruler of a state."]],[3,["He who possesses the mother of the state may continue long. His case is like that (of the plant) of which we say that its roots are deep and its flower stalks firm:--this is the way to secure that its enduring life shall long be seen."]]],"no":[{"v":[2],"l":"2","t":"Op autoriteit van keizer Khang Hi neem ik, evenals Julien, hier een kleine vrijheid met het woord „fuh”. Letterlijk staat er dan „Gematigdheid is de eerste zaak van den mens”.","t98":"Op autoriteit van keizer Khang Hi neem ik, evenals Julien, hier een kleine vrijheid met het woord „fuh”. Letterlijk staat er dan „Gematigdheid is de eerste zaak van den mensch”."},{"v":[4],"l":"4","t":"Letterlijk staat er „Wie de moeder van het rijk bezit”. In den laatsten volzin komt Tao hier voor in den zin van „leer”.","t98":"Letterlijk staat er „Wie de moeder van het rijk bezit”. In den laatsten volzin komt Tao hier voor in den zin van „leer”."}]},{"n":60,"r":"LX","d":"Teh","zh":["治大國，若烹小鮮。","以道莅天下，其鬼不神；非其鬼不神，其神不傷人；非其神不傷人，聖人亦不傷人。","夫兩不相傷，故德交歸焉。"],"nl":[[1,["Om een groot rijk te regeren moet men even zo voorzichtig zijn als in ’t bakken van een klein vischje."]],[2,["Als men het rijk regeert met Tao zijn de kwade invloeden tot inactie gedwongen; niet dat zij hun macht verloren hebben, maar zij kwetsen de mensen niet. Niet alleen dat zij de mensen niet kunnen kwetsen, maar zelfs de Wijze kwetst de mensen niet."]],[3,["Noch de Wijze, noch de kwade invloeden kwetsen hen, daarom zullen hunne deugden samen ineenvloeien."]]],"n98":[[1,["Om een groot rijk te regeeren moet men even zoo voorzichtig zijn als in ’t bakken van een klein vischje."]],[2,["Als men het rijk regeert met Tao zijn de kwade invloeden tot inactie gedwongen; niet dat zij hun macht verloren hebben, maar zij kwetsen de menschen niet. Niet alleen dat zij de menschen niet kunnen kwetsen, maar zelfs de Wijze kwetst de menschen niet."]],[3,["Noch de Wijze, noch de kwade invloeden kwetsen hen, daarom zullen hunne deugden samen ineenvloeien."]]],"en":[[1,["Governing a great state is like cooking small fish."]],[2,["Let the kingdom be governed according to the Tao, and the manes of the departed will not manifest their spiritual energy. It is not that those manes have not that spiritual energy, but it will not be employed to hurt men. It is not that it could not hurt men, but neither does the ruling sage hurt them."]],[3,["When these two do not injuriously affect each other, their good influences converge in the virtue (of the Tao)."]]],"no":[{"v":[1],"l":"1","t":"Letterlijk staat er: „Het regeren van een groot rijk is als ’t bakken van een klein vischje”. Ik vertaalde vrijer, om beter de bedoeling te doen uitkomen.","t98":"Letterlijk staat er: „Het regeeren van een groot rijk is als ’t bakken van een klein vischje”. Ik vertaalde vrijer, om beter de bedoeling te doen uitkomen."},{"v":[2,3],"l":"2–3","t":"De rest van dit hoofdstuk is vrij duister. De tekst spreekt hier van „kwei” (zie „kwei-shin” in Confucius blz. 100), maar mij dunkt dat Lao Tszʼ die niet kan bedoeld hebben, en daarom nam ik „kwade invloeden”.","t98":"De rest van dit hoofdstuk is vrij duister. De tekst spreekt hier van „kwei” (zie „kwei-shin” in Confucius blz. 100), maar mij dunkt dat Lao Tszʼ die niet kan bedoeld hebben, en daarom nam ik „kwade invloeden”."},{"v":[4],"l":"4","t":"Dit is niet erg duidelijk.","t98":"Dit is niet erg duidelijk."}]},{"n":61,"r":"LXI","d":"Teh","zh":["大國者下流，天下之交。","天下之牝，牝常以靜勝牡，以靜為下。","故大國以下小國，則取小國；小國以下大國，則取大國。","故或下以取，或下而取。","大國不過欲兼畜人，小國不過欲入事人。","夫兩者各得其所欲，大者宜為下。"],"nl":[[1,["Een groot rijk moet zijn (nederig) als de grote stromen, in welke zich de wateren van het rijk uitstorten."]],[2,["Het moet de vrouwelijke sekse navolgen, die juist door de rust (passiviteit) de mannelijke overwint. Die rust is een vernedering."]],[3,["Daarom, als een groot rijk zich vernedert voor kleinere staten, zal het die kleinere staten winnen. Als de kleinere staten zich vernederen voor het grote rijk, zullen zij het grote rijk winnen."]],[4,["Daarom, de een vernedert zich om te krijgen, de ander om gekregen te worden."]],[5,["Wat een grote staat enkel moet willen is zich te vergroten en uit te breiden, wat een kleine staat enkel moet willen is protectie, dan krijgen beide wat zij nodig hebben."]],[6,["Maar de groten behoren zich te vernederen!"]]],"n98":[[1,["Een groot rijk moet zijn (nederig) als de groote stroomen, in welke zich de wateren van het rijk uitstorten."]],[2,["Het moet de vrouwelijke sekse navolgen, die juist door de rust (passiviteit) de mannelijke overwint. Die rust is eene vernedering."]],[3,["Daarom, als een groot rijk zich vernedert voor kleinere staten, zal het die kleinere staten winnen. Als de kleinere staten zich vernederen voor het groote rijk, zullen zij het groote rijk winnen."]],[4,["Daarom, de een vernedert zich om te krijgen, de ander om gekregen te worden."]],[5,["Wat een groote staat enkel moet willen is zich te vergrooten en uit te breiden, wat een kleine staat enkel moet willen is protectie, dan krijgen beide wat zij noodig hebben."]],[6,["Maar de grooten behooren zich te vernederen!"]]],"en":[[1,["What makes a great state is its being (like) a low-lying, down-flowing (stream);--it becomes the centre to which tend (all the small states) under heaven."]],[2,["(To illustrate from) the case of all females:--the female always overcomes the male by her stillness. Stillness may be considered (a sort of) abasement."]],[3,["Thus it is that a great state, by condescending to small states, gains them for itself; and that small states, by abasing themselves to a great state, win it over to them. In the one case the abasement leads to gaining adherents, in the other case to procuring favour."]],[4,["The great state only wishes to unite men together and nourish them; a small state only wishes to be received by, and to serve, the other. Each gets what it desires, but the great state must learn to abase itself."]]],"no":[]},{"n":62,"r":"LXII","d":"Teh","zh":["道者萬物之奧。","善人之寶，不善人之所保。","美言可以市，尊行可以加人。","人之不善，何棄之有？","故立天子，置三公，雖有拱璧以先駟馬，不如坐進此道。","古之所以貴此道者何？","不曰以求得，有罪以免邪？","故為天下貴。"],"nl":[[1,["Tao is de veilige schuilplaats van alle dingen, de schat van de goeden, de steun van de slechten."]],[2,["Goede woorden kunnen ons tot voordeel zijn, en een eerwaardig gedrag kan ons boven de anderen verheffen."]],[3,["Hoe kan men het wegmaken, dat er slechte mensen zijn?"]],[4,["Daarom heeft men een keizerschap gegrondvest en drie ministers ingesteld."]],[5,["Al houdt men in beide handen een jaspisstaf en gaat men vóór met een vierspan, het is beter te blijven zitten en vooruit te gaan in Tao."]],[6,["Hoe is het, dat de ouden Tao zo vereerden? Is het niet, omdat men Het vanzelf vindt zonder den gansen dag te zoeken, en omdat Het de misdaden vergeeft?"]],[7,["Daarom is Tao het eerbiedwaardigste onder den Hemel."]]],"n98":[[1,["Tao is de veilige schuilplaats van alle dingen, de schat van de goeden, de steun van de slechten."]],[2,["Goede woorden kunnen ons tot voordeel zijn, en een eerwaardig gedrag kan ons boven de anderen verheffen."]],[3,["Hoe kan men het wegmaken, dat er slechte menschen zijn?"]],[4,["Daarom heeft men een keizerschap gegrondvest en drie ministers ingesteld."]],[5,["Al houdt men in beide handen een jaspisstaf en gaat men vóór met een vierspan, het is beter te blijven zitten en vooruit te gaan in Tao."]],[6,["Hoe is het, dat de ouden Tao zoo vereerden? Is het niet, omdat men Het vanzelf vindt zonder den ganschen dag te zoeken, en omdat Het de misdaden vergeeft?"]],[7,["Daarom is Tao het eerbiedwaardigste onder den Hemel."]]],"en":[[1,["Tao has of all things the most honoured place.\nNo treasures give good men so rich a grace;\nBad men it guards, and doth their ill efface."]],[2,["(Its) admirable words can purchase honour; (its) admirable deeds can raise their performer above others. Even men who are not good are not abandoned by it."]],[3,["Therefore when the sovereign occupies his place as the Son of Heaven, and he has appointed his three ducal ministers, though (a prince) were to send in a round symbol-of-rank large enough to fill both the hands, and that as the precursor of the team of horses (in the court-yard), such an offering would not be equal to (a lesson of) this Tao, which one might present on his knees."]],[4,["Why was it that the ancients prized this Tao so much? Was it not because it could be got by seeking for it, and the guilty could escape (from the stain of their guilt) by it? This is the reason why all under heaven consider it the most valuable thing."]]],"no":[{"v":[1],"l":"1","t":"„De steun van de slechten”, omdat de slechten er altijd weer op kunnen steunen om goed te worden.","t98":"„De steun van de slechten”, omdat de slechten er altijd weer op kunnen steunen om goed te worden."},{"v":[3],"l":"3","t":"Dit is een heel lastige zin door de woordschikking in het chinees. Daarom geef ik hier twee andere versies er bij. Julien geeft n.l.: „Si un homme n’est pas vertueux, pourrait-on le repousser avec mépris?” Alexander: „By what means is it possible to get rid of the effects of a mans vileness?”","t98":"Dit is een heel lastige zin door de woordschikking in het chineesch. Daarom geef ik hier twee andere versies er bij. Julien geeft n.l.: „Si un homme n’est pas vertueux, pourrait-on le repousser avec mépris?” Alexander: „By what means is it possible to get rid of the effects of a mans vileness?”"},{"v":[4],"l":"4","t":"Het keizerschap en de ministers zijn n.l. juist ingesteld om er voor te zorgen dat de slechten beter worden en","t98":"Het keizerschap en de ministers zijn n.l. juist ingesteld om er voor te zorgen dat de slechten beter worden en"},{"v":[5],"l":"5","t":"daarvoor is het allereerst nodig dat zij zelf Tao betrachten, en niet dat zij praal maken met jaspisstaven (tekenen van waardigheid der hoge mandarijnen) en vierspannen.","t98":"daarvoor is het allereerst noodig dat zij zelf Tao betrachten, en niet dat zij praal maken met jaspisstaven (teekenen van waardigheid der hooge mandarijnen) en vierspannen."}]},{"n":63,"r":"LXIII","d":"Teh","zh":["為無為，事無事，味無味。","大小多少，報怨以德。","圖難於其易，為大於其細；天下難事必作於易，天下大事必作於細。","是以聖人終不為大，故能成其大。","夫輕諾必寡信，多易必多難。","是以聖人猶難之，故終無難矣。"],"nl":[[1,["De Wijze doet Wu Wei, werkt aan géén werk, en savoureert wat zonder smaak is."]],[2,["Het grote en het kleine, het vele en het weinige zijn even gewichtig voor hem."]],[3,["Hij wreekt kwaad met goed."]],[4,["Als hij moeilijke dingen ontwerpt, begint hij met de gemakkelijke, als hij grote dingen wil doen, begint hij met de kleine."]],[5,["De moeilijke dingen onder den Hemel zijn stellig uit de gemakkelijke gemaakt, de grote dingen onder den Hemel zijn stellig uit de kleine gemaakt."]],[6,["Daarom, de Wijze zoekt geen grote dingen te doen, en daardoor juist volbrengt hij grote dingen."]],[7,["Lichtvaardig gedane beloften worden stellig zelden gehouden, en wie veel voor gemakkelijk houdt, ondervindt dat veel moeilijk is."]],[8,["Daarom, de Wijze vindt alsof alles moeilijk is, en daarom juist ondervindt hij nooit moeilijkheden."]]],"n98":[[1,["De Wijze doet Wu Wei, werkt aan géén werk, en savoureert wat zonder smaak is."]],[2,["Het groote en het kleine, het vele en het weinige zijn even gewichtig voor hem."]],[3,["Hij wreekt kwaad met goed."]],[4,["Als hij moeilijke dingen ontwerpt, begint hij met de gemakkelijke, als hij groote dingen wil doen, begint hij met de kleine."]],[5,["De moeilijke dingen onder den Hemel zijn stellig uit de gemakkelijke gemaakt, de groote dingen onder den Hemel zijn stellig uit de kleine gemaakt."]],[6,["Daarom, de Wijze zoekt geen groote dingen te doen, en daardoor juist volbrengt hij groote dingen."]],[7,["Lichtvaardig gedane beloften worden stellig zelden gehouden, en wie veel voor gemakkelijk houdt, ondervindt dat veel moeilijk is."]],[8,["Daarom, de Wijze vindt alsof alles moeilijk is, en daarom juist ondervindt hij nooit moeilijkheden."]]],"en":[[1,["(It is the way of the Tao) to act without (thinking of) acting; to conduct affairs without (feeling the) trouble of them; to taste without discerning any flavour; to consider what is small as great, and a few as many; and to recompense injury with kindness."]],[2,["(The master of it) anticipates things that are difficult while they are easy, and does things that would become great while they are small. All difficult things in the world are sure to arise from a previous state in which they were easy, and all great things from one in which they were small. Therefore the sage, while he never does what is great, is able on that account to accomplish the greatest things."]],[3,["He who lightly promises is sure to keep but little faith; he who is continually thinking things easy is sure to find them difficult. Therefore the sage sees difficulty even in what seems easy, and so never has any difficulties."]
