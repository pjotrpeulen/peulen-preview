<title>Weg en Deugd · prototype</title>
<style>
:root{--papier:#FBF8F1;--kaart:#FFFDF8;--inkt:#2B2520;--zacht:#7C7266;--lijn:#E6DDCF;--ac:#7A5C3E;--ac2:#EFE6D8;--zh:"Songti TC","Noto Serif CJK TC","Noto Serif TC","PMingLiU","Songti SC",serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;--sans:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;--fs:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E9E3D8}
body{font-family:var(--sans);color:var(--inkt)}
#app{max-width:440px;margin:0 auto;height:100%;background:var(--papier);display:flex;flex-direction:column;position:relative;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;padding-top:max(14px,env(safe-area-inset-top))}
header .titel{font-family:var(--serif);font-size:17px;color:var(--ac);letter-spacing:.02em}

.knoppen{display:flex;gap:6px}

.ik svg{width:19px;height:19px}
.ik.aan{background:var(--ac);color:#fff;border-color:var(--ac)}
main{flex:1;overflow-y:auto;padding:0 20px 24px;-webkit-overflow-scrolling:touch}
nav.tabs{display:flex;border-top:1px solid var(--lijn);background:var(--kaart);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 11px;font:500 11px var(--sans);color:var(--zacht);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.aan{color:var(--ac)}
.kop{text-align:center;margin:6px 0 14px}
.kop .vandaag{font-size:13px;color:var(--zacht)}
.kop .nr{font-family:var(--serif);font-size:44px;font-weight:300;color:var(--ac);line-height:1.1}
.kop .rom{font-family:var(--serif);font-size:13px;color:var(--zacht);letter-spacing:.12em}
.lagen{display:flex;justify-content:center;gap:8px;margin:0 0 6px;flex-wrap:wrap}
.chip{border:1px solid var(--lijn);background:var(--kaart);color:var(--zacht);border-radius:16px;padding:6px 13px;font:600 13px var(--sans);cursor:pointer}
.chip.aan{background:var(--ac2);color:var(--ac);border-color:#D8C8B2}
.chip.zh{font-family:var(--zh);font-weight:600}
.blok{margin:18px 0 6px}
.blok h3{font:700 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ac);margin:0 0 8px}
.blok.zh p{font-family:var(--zh);font-size:calc(var(--fs) + 3px);line-height:1.9;margin:0 0 4px;letter-spacing:.06em}
.vers{font-family:var(--serif);font-size:var(--fs);line-height:1.62;margin:0 0 12px}
.vers .vn{font:600 10px var(--sans);color:#B9AC9A;vertical-align:super;margin-right:4px}
.vers p{margin:0}
.noot-k{border:0;background:none;color:var(--ac);font:600 11px var(--sans);padding:2px 0 0;cursor:pointer}
.noot{background:var(--ac2);border-radius:10px;padding:9px 12px;font-family:var(--serif);font-size:calc(var(--fs) - 3px);line-height:1.5;color:#4A3F35;margin:4px 0 0}
.naast{display:grid;gap:14px}
.naast .vers{font-size:calc(var(--fs) - 3px)}
.naast .blok.zh p{font-size:var(--fs)}
.blad{display:flex;justify-content:space-between;align-items:center;margin:26px 0 8px;gap:10px}
.blad button{flex:1;border:1px solid var(--lijn);background:var(--kaart);border-radius:22px;padding:11px 0;font:500 14px var(--sans);color:var(--ac);cursor:pointer}
.blad button:disabled{opacity:.35}
.voortgang{text-align:center;font-size:12px;color:var(--zacht);margin:10px 0 0}
.slot{margin:22px 0;background:var(--kaart);border:1px solid var(--lijn);border-radius:18px;padding:22px 18px;text-align:center}
.slot h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 8px}
.slot p{color:var(--zacht);font-size:14px;line-height:1.5;margin:0 0 14px}
.knop{display:block;width:100%;border:0;border-radius:24px;background:var(--ac);color:#fff;font:600 16px var(--sans);padding:14px 0;cursor:pointer}
.knop.licht{background:var(--kaart);color:var(--ac);border:1px solid var(--lijn);margin-top:10px}
.link{border:0;background:none;color:var(--ac);font:500 13px var(--sans);cursor:pointer;margin-top:10px}
.vaag{opacity:.35;max-height:120px;overflow:hidden;-webkit-mask-image:linear-gradient(#000,transparent)}
.lijst h4{font:700 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ac);margin:20px 0 6px}
.rij{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--lijn);cursor:pointer}
.rij .n{font-family:var(--serif);color:var(--ac);width:28px;text-align:right;font-size:17px}
.rij .tx{flex:1;font-family:var(--serif);font-size:15px;color:var(--inkt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rij .tx small{display:block;font-family:var(--zh);color:var(--zacht);font-size:12px}
.rij .st{color:var(--zacht);font-size:13px}
.groot{font-family:var(--serif);font-size:24px;font-weight:400;margin:10px 0 4px}
.uitleg{color:var(--zacht);font-size:14px;line-height:1.5}
.instel{background:var(--kaart);border:1px solid var(--lijn);border-radius:16px;padding:4px 14px;margin:14px 0}
.instel .r{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--lijn);font-size:15px;gap:10px}
.instel .r:last-child{border-bottom:0}
.seg{display:flex;border:1px solid var(--lijn);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--kaart);padding:7px 10px;font:500 13px var(--sans);color:var(--zacht);cursor:pointer}
.seg button.aan{background:var(--ac);color:#fff}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;z-index:20}
.sheet{background:#F2F2F7;width:100%;border-radius:18px 18px 0 0;padding:16px 18px 28px;font-family:var(--sans)}
.sheet .grip{width:40px;height:5px;border-radius:3px;background:#C7C7CC;margin:0 auto 14px}
.sheet .app{display:flex;gap:12px;align-items:center;background:#fff;border-radius:12px;padding:12px}
.sheet .icoon{width:52px;height:52px;border-radius:12px;background:var(--papier);border:1px solid var(--lijn);display:grid;place-items:center;font-family:var(--zh);font-size:26px;color:var(--ac)}
.sheet .prijs{display:flex;justify-content:space-between;background:#fff;border-radius:12px;padding:12px;margin-top:10px;font-size:15px}
.sheet .blauw{display:block;width:100%;border:0;border-radius:12px;background:#0A84FF;color:#fff;font:600 17px var(--sans);padding:14px;margin-top:14px;cursor:pointer}
.sheet .klein{font-size:11px;color:#8E8E93;text-align:center;margin-top:10px}
.widgetscherm{position:absolute;inset:0;z-index:15;background:linear-gradient(#C9D3C8,#8FA39A);display:flex;flex-direction:column;align-items:center;padding:60px 22px 30px}
.widgetscherm .klok{color:#fff;font:300 64px var(--sans)}
.widgetscherm .datum{color:#fff;font:500 16px var(--sans);margin-bottom:22px}
.widget{width:100%;background:var(--papier);border-radius:24px;padding:16px 18px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.widget .wk{display:flex;justify-content:space-between;font:700 13px var(--sans);color:var(--ac)}
.widget .wk span{font-weight:500;color:var(--zacht)}
.widget .wz{font-family:var(--zh);font-size:17px;color:var(--inkt);margin:10px 0 6px;letter-spacing:.05em}
.widget .wn{font-family:var(--serif);font-size:15px;line-height:1.45;color:var(--inkt);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.widget .wt{font-size:11px;color:var(--zacht);margin-top:8px}
.tegels{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;width:100%;margin-top:26px}
.tegels div{aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.5)}
.widgetklein{width:150px;background:var(--papier);border-radius:22px;padding:14px;margin-top:22px;align-self:flex-start}
.widgetklein .z{font-family:var(--zh);font-size:30px;color:var(--ac)}
.widgetklein .s{font-size:11px;color:var(--zacht)}
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:var(--inkt);color:#fff;font-size:13px;padding:9px 16px;border-radius:18px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.zien{opacity:.92}
.proto{font-size:11px;color:var(--zacht);text-align:center;margin:18px 0 0}
</style>

<script>
const DATA = [{"n":1,"r":"I","d":"Tao","zh":["道可道，非常道，名可名，非常名；無名，天地之始，有名，萬物之母。","故常無欲，以觀其妙，常有欲，以觀其徼；此兩者，同出而異名，同謂之玄。","玄之又玄，眾妙之門。"],"nl":[[1,["Kon Tao uitgezegd worden, dan zou het de eeuwige Tao niet zijn; kon de naam genoemd worden, dan zou het de eeuwige Naam niet zijn."]],[2,["Als Niet-Zijn kan men Het noemen het begin van Hemel en Aarde; als Zijn kan men Het noemen de Moeder van alle Dingen."]],[3,["Daarom, als het hart voortdurend Niet-Is (d.i. vrij van alle aardse begeerten) kan men het Mysterie aanschouwen van Tao’s spirituele essence; als het voortdurend Is (d.i. vol begeerten), kan men er enkel den begrensden Vorm van zien."]],[4,["Deze beiden, Zijn en Niet-Zijn, komen uit hetzelfde voort, en hebben verschillenden naam."]],[5,["Beiden zijn zij geheimzinnig. Het geheimzinnige er van is dubbel geheimzinnig."]],[6,["Dit alles is de Poort van het spirituele Mysterie."]]],"n98":[[1,["Kon Tao uitgezegd worden, dan zou het de eeuwige Tao niet zijn; kon de naam genoemd worden, dan zou het de eeuwige Naam niet zijn."]],[2,["Als Niet-Zijn kan men Het noemen het begin van Hemel en Aarde; als Zijn kan men Het noemen de Moeder van alle Dingen."]],[3,["Daarom, als het hart voortdurend Niet-Is (d.i. vrij van alle aardsche begeerten) kan men het Mysterie aanschouwen van Tao’s spiritueele essence; als het voortdurend Is (d.i. vol begeerten), kan men er enkel den begrensden Vorm van zien."]],[4,["Deze beiden, Zijn en Niet-Zijn, komen uit hetzelfde voort, en hebben verschillenden naam."]],[5,["Beiden zijn zij geheimzinnig. Het geheimzinnige er van is dubbel geheimzinnig."]],[6,["Dit alles is de Poort van het spiritueele Mysterie."]]],"en":[[1,["The Tao that can be trodden is not the enduring and unchanging Tao. The name that can be named is not the enduring and unchanging name."]],[2,["(Conceived of as) having no name, it is the Originator of heaven and earth; (conceived of as) having a name, it is the Mother of all things."]],[3,["Always without desire we must be found,\nIf its deep mystery we would sound;\nBut if desire always within us be,\nIts outer fringe is all that we shall see."]],[4,["Under these two aspects, it is really the same; but as development takes place, it receives the different names. Together we call them the Mystery. Where the Mystery is the deepest is the gate of all that is subtle and wonderful."]]],"no":[{"v":[1],"l":"1","t":"Dat het tweede Tao in den chinesen tekst van den eersten zin „zeggen” betekent wordt bevestigd door meer dan één chinesen commentator, door het te omschrijven door „met den mond zeggen”.","t98":"Dat het tweede Tao in den chineeschen tekst van den eersten zin „zeggen” beteekent wordt bevestigd door meer dan één chineeschen commentator, door het te omschrijven door „met den mond zeggen”."},{"v":[2],"l":"2","t":"Van iets, dat eeuwig en onvergankelijk is, kan natuurlijk niet gezegd worden dat het is of niet is, daar deze tegenstellingen alleen betrekking kunnen hebben op sterfelijke dingen. Als abstractie, te subtiel voor woorden, zou men het kunnen noemen: „het Begin van Hemel en Aarde”, en, beschouwd met betrekking tot zijn oorsprong van alle dingen, als Zijn, kan men het noemen: „de Moeder van alle Dingen”.","t98":"Van iets, dat eeuwig en onvergankelijk is, kan natuurlijk niet gezegd worden dat het is of niet is, daar deze tegenstellingen alleen betrekking kunnen hebben op sterfelijke dingen. Als abstractie, te subtiel voor woorden, zou men het kunnen noemen: „het Begin van Hemel en Aarde”, en, beschouwd met betrekking tot zijn oorsprong van alle dingen, als Zijn, kan men het noemen: „de Moeder van alle Dingen”."},{"v":[3],"l":"3","t":"„Niet zijn” (Wu Yiu) betekent hier „vrij zijn van alle aardse begeerten” en „zijn” betekent hier „in aardse begeerte zijn”.","t98":"„Niet zijn” (Wu Yiu) beteekent hier „vrij zijn van alle aardsche begeerten” en „zijn” beteekent hier „in aardsche begeerte zijn”."}]},{"n":2,"r":"II","d":"Tao","zh":["天下皆知美之為美，斯惡已。","皆知善之為善，斯不善已。","故有無相生，難易相成，長短相較，高下相傾，音聲相和，前後相隨。","是以聖人處無為之事，行不言之教；萬物作焉而不辭，生而不有，為而不恃，功成而弗居。","夫唯弗居，是以不去。"],"nl":[[1,["Allen onder den Hemel weten zo dat mooi „mooi” is; dan komt het „lelijke” voor den dag. Allen weten zo dat goed „goed” is; dan komt het „slechte” voor den dag."]],[2,["Daarom, Zijn en Niet-Zijn produceren elkaar wederkerig."]],[3,["Moeilijk en Gemakkelijk brengen zich wederkerig voort. Lang en kort geven elkaar wederkerig verschil in vorm. Hoog en Laag brengen elkaar’s ongelijkheid voort. De Toon en de Stem harmoniëren wederkerig. Het Vóór en het Ná volgen elkaar wederkerig op."]],[4,["Daarom is het, dat de Wijze zijn zaak maakt van Wu Wei (Niet-Doen), en hij begaat de leer zonder woorden."]],[5,["Alle dingen ontstaan (door hem), en hij weigert er géén."]],[6,["Hij brengt ze voort, zonder ze (als bezit) te hebben. Hij vermeerdert en vermenigvuldigt, en rekent niet op hun beloning."]],[7,["Als het werk volbracht is, hecht hij er zich niet (meer) aan. Juist omdat hij er zich niet aan hecht, gaat het (de verdienste er van) niet van hem weg."]]],"n98":[[1,["Allen onder den Hemel weten zoo dat mooi „mooi” is; dan komt het „leelijke” voor den dag. Allen weten zoo dat goed „goed” is; dan komt het „slechte” voor den dag."]],[2,["Daarom, Zijn en Niet-Zijn produceeren elkaar wederkeerig."]],[3,["Moeilijk en Gemakkelijk brengen zich wederkeerig voort. Lang en kort geven elkaar wederkeerig verschil in vorm. Hoog en Laag brengen elkaar’s ongelijkheid voort. De Toon en de Stem harmoniëeren wederkeerig. Het Vóór en het Ná volgen elkaar wederkeerig op."]],[4,["Daarom is het, dat de Wijze zijn zaak maakt van Wu Wei (Niet-Doen), en hij begaat de leer zonder woorden."]],[5,["Alle dingen ontstaan (door hem), en hij weigert er géén."]],[6,["Hij brengt ze voort, zonder ze (als bezit) te hebben. Hij vermeerdert en vermenigvuldigt, en rekent niet op hun belooning."]],[7,["Als het werk volbracht is, hecht hij er zich niet (meer) aan. Juist omdat hij er zich niet aan hecht, gaat het (de verdienste er van) niet van hem weg."]]],"en":[[1,["All in the world know the beauty of the beautiful, and in doing this they have (the idea of) what ugliness is; they all know the skill of the skilful, and in doing this they have (the idea of) what the want of skill is."]],[2,["So it is that existence and non-existence give birth the one to (the idea of) the other; that difficulty and ease produce the one (the idea of) the other; that length and shortness fashion out the one the figure of the other; that (the ideas of) height and lowness arise from the contrast of the one with the other; that the musical notes and tones become harmonious through the relation of one with another; and that being before and behind give the idea of one following another."]],[3,["Therefore the sage manages affairs without doing anything, and conveys his instructions without the use of speech."]],[4,["All things spring up, and there is not one which declines to show itself; they grow, and there is no claim made for their ownership; they go through their processes, and there is no expectation (of a reward for the results). The work is accomplished, and there is no resting in it (as an achievement).","The work is done, but how no one can see;\n'Tis this that makes the power not cease to be."]]],"no":[{"v":[1],"l":"1","t":"De hoofdbedoeling van dit hoofdstuk is aan te tonen, dat alle dingen alleen gekend worden door hunne contrasten. Lao Tszʼ vond het gevaarlijk, het „goed” en „mooi” vinden, want goed en mooi moeten dat van-zelf zijn. De mens moet „mooi” en „goed” vergeten, en van-zelf „Wu Wei” zijn, volgens het natuurlijke rythme, hem door Tao gegeven. Aan het slot heb ik enige teksten onvertaald gelaten, omdat ik niet kan vermoeden wat zij betekenen, en ook geen der bestaande versies aannemelijk acht. En er maar iets van maken wilde ik niet.","t98":"De hoofdbedoeling van dit hoofdstuk is aan te toonen, dat alle dingen alleen gekend worden door hunne contrasten. Lao Tszʼ vond het gevaarlijk, het „goed” en „mooi” vinden, want goed en mooi moeten dat van-zelf zijn. De mensch moet „mooi” en „goed” vergeten, en van-zelf „Wu Wei” zijn, volgens het natuurlijke rythme, hem door Tao gegeven. Aan het slot heb ik eenige teksten onvertaald gelaten, omdat ik niet kan vermoeden wat zij beteekenen, en ook geen der bestaande versies aannemelijk acht. En er maar iets van maken wilde ik niet."}]},{"n":3,"r":"III","d":"Tao","zh":["不尚賢，使民不爭；不貴難得之貨，使民不為盜；不見可欲，使民心不亂。","是以聖人之治，虛其心，實其腹，弱其志，強其骨。","常使民無知無欲。","使夫智者不敢為也。","為無為，則無不治。"],"nl":[[1,["Maakt geen ophef van eerwaardigheid, dan zal het volk niet twisten."]],[2,["Hecht geen hoge waarde aan moeilijk te verkrijgen goederen, dan zal het volk geen diefstal plegen."]],[3,["Ziet niet naar wat begeerlijk is, dan zal het hart van het volk niet in verwarring komen."]],[4,["Daarom, de Wijze regeert door de harten ledig (van begeerte) te maken, de buiken stevig te voeden, de (slechte) neigingen te verzwakken, en het beenderstelsel te versterken."]],[5,["Hij maakt voortdurend, dat het volk niet weet, en geen begeerten heeft."]],[6,["Als dit niet geheel gelukt, maakt hij dat zij, die (wèl) weten, niet durven ageren."]],[7,["Hij doet Wu Wei (Niet-Doen), en dan is er niets, wat hij niet (goed) regeert."]]],"n98":[[1,["Maakt geen ophef van eerwaardigheid, dan zal het volk niet twisten."]],[2,["Hecht geen hooge waarde aan moeilijk te verkrijgen goederen, dan zal het volk geen diefstal plegen."]],[3,["Ziet niet naar wat begeerlijk is, dan zal het hart van het volk niet in verwarring komen."]],[4,["Daarom, de Wijze regeert door de harten ledig (van begeerte) te maken, de buiken stevig te voeden, de (slechte) neigingen te verzwakken, en het beenderstelsel te versterken."]],[5,["Hij maakt voortdurend, dat het volk niet weet, en geen begeerten heeft."]],[6,["Als dit niet geheel gelukt, maakt hij dat zij, die (wèl) weten, niet durven ageeren."]],[7,["Hij doet Wu Wei (Niet-Doen), en dan is er niets, wat hij niet (goed) regeert."]]],"en":[[1,["Not to value and employ men of superior ability is the way to keep the people from rivalry among themselves; not to prize articles which are difficult to procure is the way to keep them from becoming thieves; not to show them what is likely to excite their desires is the way to keep their minds from disorder."]],[2,["Therefore the sage, in the exercise of his government, empties their minds, fills their bellies, weakens their wills, and strengthens their bones."]],[3,["He constantly (tries to) keep them without knowledge and without desire, and where there are those who have knowledge, to keep them from presuming to act (on it). When there is this abstinence from action, good order is universal."]]],"no":[{"v":[5],"l":"5","t":"Zoals Stanislas Julien terecht opmerkt, betekent dit niets anders dan „Hij brengt het volk tot zijnen primitieven (natuur) staat terug.”","t98":"Zooals Stanislas Julien terecht opmerkt, beteekent dit niets anders dan „Hij brengt het volk tot zijnen primitieven (natuur) staat terug.”"},{"v":[7],"l":"7","t":"De natuurstaat is van-zelf Wu Wei, en daarin gaat alles vanzelf zijn juisten gang.— Men vergelijke dit gehele hoofdstuk met in de „Imitation de Jésus Christ”: „Dès que l’homme convoite une chose désordonnément, aussitôt il devient inquiet en lui même. L’Orgueilleux et l’avare ne sont jamais en repos. Le pauvre et l’humble en esprit vivent dans la plénitude de la paix.” (Chap. VI. trad. L. Moreau.)","t98":"De natuurstaat is van-zelf Wu Wei, en daarin gaat alles vanzelf zijn juisten gang.— Men vergelijke dit geheele hoofdstuk met in de „Imitation de Jésus Christ”: „Dès que l’homme convoite une chose désordonnément, aussitôt il devient inquiet en lui même. L’Orgueilleux et l’avare ne sont jamais en repos. Le pauvre et l’humble en esprit vivent dans la plénitude de la paix.” (Chap. VI. trad. L. Moreau.)"}]},{"n":4,"r":"IV","d":"Tao","zh":["道沖而用之或不盈，淵兮似萬物之宗；挫其銳，解其紛，和其光，同其塵，湛兮似或存。","吾不知誰之子，象帝之先。"],"nl":[[1,["Tao is ledig, en (toch) in Zijne operaties als onuitputtelijk."]],[2,["O! Hoe diep is Het! Het is de Oer-Vader aller dingen."]],[3,["Het verstompt zijn scherpte, ontrafelt zijne verwardheid, tempert zijne (verblindende) schittering, en maakt zich gelijk aan het stof."]],[4,["O! Hoe kalm is Het! Het lijkt wel eeuwig te bestaan."]],[5,["Ik weet niet van wien Het het kind is. Het was vóór Shang Ti (den oppersten God)."]]],"n98":[[1,["Tao is ledig, en (toch) in Zijne operaties als onuitputtelijk."]],[2,["O! Hoe diep is Het! Het is de Oer-Vader aller dingen."]],[3,["Het verstompt zijn scherpte, ontrafelt zijne verwardheid, tempert zijne (verblindende) schittering, en maakt zich gelijk aan het stof."]],[4,["O! Hoe kalm is Het! Het lijkt wel eeuwig te bestaan."]],[5,["Ik weet niet van wien Het het kind is. Het was vóór Shang Ti (den oppersten God)."]]],"en":[[1,["The Tao is (like) the emptiness of a vessel; and in our employment of it we must be on our guard against all fulness. How deep and unfathomable it is, as if it were the Honoured Ancestor of all things!"]],[2,["We should blunt our sharp points, and unravel the complications of things; we should attemper our brightness, and bring ourselves into agreement with the obscurity of others. How pure and still the Tao is, as if it would ever so continue!"]],[3,["I do not know whose son it is. It might appear to have been before God."]]],"no":[]},{"n":5,"r":"V","d":"Tao","zh":["天地不仁，以萬物為芻狗；聖人不仁，以百姓為芻狗。","天地之間，其猶橐籥乎？","虛而不屈，動而愈出。","多言數窮，不如守中。"],"nl":[[1,["Hemel en Aarde zijn niet menslievend, en alle dingen zijn voor hen als de strooien honden (voor de offering)."]],[2,["De Wijze is niet menslievend, en beschouwt het volk als de strooien honden (voor de offering)."]],[3,["Te midden van Hemel en Aarde is als een blaasbalg; Het is ledig en (toch) nooit uitgeput; hoe meer Het beweegt, hoe meer (kracht als wind) er uitkomt."]],[4,["Maar met veel woorden raakt men uitgeput. Het is beter, het midden te bewaren."]]],"n98":[[1,["Hemel en Aarde zijn niet menschlievend, en alle dingen zijn voor hen als de strooien honden (voor de offering)."]],[2,["De Wijze is niet menschlievend, en beschouwt het volk als de strooien honden (voor de offering)."]],[3,["Te midden van Hemel en Aarde is als een blaasbalg; Het is ledig en (toch) nooit uitgeput; hoe meer Het beweegt, hoe meer (kracht als wind) er uitkomt."]],[4,["Maar met veel woorden raakt men uitgeput. Het is beter, het midden te bewaren."]]],"en":[[1,["Heaven and earth do not act from (the impulse of) any wish to be benevolent; they deal with all things as the dogs of grass are dealt with. The sages do not act from (any wish to be) benevolent; they deal with the people as the dogs of grass are dealt with."]],[2,["May not the space between heaven and earth be compared to a bellows?","'Tis emptied, yet it loses not its power;\n'Tis moved again, and sends forth air the more.\nMuch speech to swift exhaustion lead we see;\nYour inner being guard, and keep it free."]]],"no":[{"v":[1],"l":"1","t":"Alle wezens hebben van Tao dezelfde impulsie, hetzelfde rythme gekregen, en deze impulsie doet het gehele Heelal vanzelf zijn natuurlijken gang gaan. Daarom gaat het niet aan, te veronderstellen, dat de Hemel en de Aarde nog eens een aparte affectie voor enkele wezens zouden hebben.","t98":"Alle wezens hebben van Tao dezelfde impulsie, hetzelfde rythme gekregen, en deze impulsie doet het geheele Heelal vanzelf zijn natuurlijken gang gaan. Daarom gaat het niet aan, te veronderstellen, dat de Hemel en de Aarde nog eens eene aparte affectie voor enkele wezens zouden hebben."},{"v":[2],"l":"2","t":"Zo ook met den Wijze, die alle mensen gelijkelijk liefheeft, en niet nog eens apart den een boven den ander.","t98":"Zoo ook met den Wijze, die alle menschen gelijkelijk liefheeft, en niet nog eens apart den een boven den ander."},{"v":[3],"l":"3","t":"Tao is als ledig, en toch onuitputtelijk, en hoe meer het beweegt, hoe meer kracht het voortbrengt.","t98":"Tao is als ledig, en toch onuitputtelijk, en hoe meer het beweegt, hoe meer kracht het voortbrengt."},{"v":[4],"l":"4","t":"Hoe meer woorden men gebruikt om Tao uit te drukken, des te eerder raakt men uitgeput, en bereikt toch niet zijn doel. Daarom is het beter het midden te bewaren, d.i. Wu Wei te zijn.","t98":"Hoe meer woorden men gebruikt om Tao uit te drukken, des te eerder raakt men uitgeput, en bereikt toch niet zijn doel. Daarom is het beter het midden te bewaren, d.i. Wu Wei te zijn."}]},{"n":6,"r":"VI","d":"Tao","zh":["谷神不死，是謂玄牝。","玄牝之門，是謂天地根。","緜緜若存，用之不勤。"],"nl":[[1,["De Geest van de vallei sterft niet, men noemt haar de mystieke Moeder."]],[2,["De deur van de mystieke Moeder is de Wortel (Oorsprong) van Hemel en Aarde."]],[3,["Het gaat eeuwiglijk door en schijnt altijd (als stoffelijk) te blijven bestaan."]],[4,["Houdt u er altijd aan, en gij zult niet behoeven te bewegen."]]],"n98":[[1,["De Geest van de vallei sterft niet, men noemt haar de mystieke Moeder."]],[2,["De deur van de mystieke Moeder is de Wortel (Oorsprong) van Hemel en Aarde."]],[3,["Het gaat eeuwiglijk door en schijnt altijd (als stoffelijk) te blijven bestaan."]],[4,["Houdt u er altijd aan, en gij zult niet behoeven te bewegen."]]],"en":[[1,["The valley spirit dies not, aye the same;\nThe female mystery thus do we name.\nIts gate, from which at first they issued forth,\nIs called the root from which grew heaven and earth.\nLong and unbroken does its power remain,\nUsed gently, and without the touch of pain."]]],"no":[{"v":[1],"l":"1","t":"Deze mystieke chinese uitdrukking betekent heel eenvoudig, dat Tao is als de geest van een vallei, even als een vallei ledig en toch bestaande, een figuurlijke uitdrukking voor „een diepte van ziel” die niet sterft, maar eeuwig is, een onvergankelijke ziele-oneindigheid. Dit is de mystieke Moeder, uit wie alle dingen worden geboren.","t98":"Deze mystieke chineesche uitdrukking beteekent heel eenvoudig, dat Tao is als de geest van eene vallei, even als een vallei ledig en toch bestaande, eene figuurlijke uitdrukking voor „eene diepte van ziel” die niet sterft, maar eeuwig is, eene onvergankelijke ziele-oneindigheid. Dit is de mystieke Moeder, uit wie alle dingen worden geboren."},{"v":[2],"l":"2","t":"Dit betekent eenvoudig, dat alles en allen uit Tao geboren zijn, dus hebben Hemel en Aarde hun oorsprong in Tao.—","t98":"Dit beteekent eenvoudig, dat alles en allen uit Tao geboren zijn, dus hebben Hemel en Aarde hun oorsprong in Tao.—"},{"v":[4],"l":"4","t":"Dan zal namelijk alles van-zelf gaan, Wu Wei.—","t98":"Dan zal namelijk alles van-zelf gaan, Wu Wei.—"}]},{"n":7,"r":"VII","d":"Tao","zh":["天長地久。","天地所以能長且久者，以其不自生，故能長生。","是以聖人後其身而身先；外其身而身存。","非以其無私邪，故能成其私。"],"nl":[[1,["Hemel en Aarde duren eeuwiglijk. Hemel en Aarde kunnen dáárom eeuwiglijk duren, omdat zij niet voor zich zelf leven."]],[2,["Daarom stelt de Wijze zich zelf achter de anderen, en wordt dan zelf (juist) de eerste."]],[3,["Hij maakt zich los van zijn lichaam, en dan blijft zijn lichaam (juist) behouden."]],[4,["Is dit niet, omdat hij geen egoïsme heeft?"]],[5,["En (toch) wordt dan zijn egoïstisch eigenbelang volmaakt."]]],"n98":[[1,["Hemel en Aarde duren eeuwiglijk. Hemel en Aarde kunnen dáárom eeuwiglijk duren, omdat zij niet voor zich zelf leven."]],[2,["Daarom stelt de Wijze zich zelf achter de anderen, en wordt dan zelf (juist) de eerste."]],[3,["Hij maakt zich los van zijn lichaam, en dan blijft zijn lichaam (juist) behouden."]],[4,["Is dit niet, omdat hij geen egoïsme heeft?"]],[5,["En (toch) wordt dan zijn egoïstisch eigenbelang volmaakt."]]],"en":[[1,["Heaven is long-enduring and earth continues long. The reason why heaven and earth are able to endure and continue thus long is because they do not live of, or for, themselves. This is how they are able to continue and endure."]],[2,["Therefore the sage puts his own person last, and yet it is found in the foremost place; he treats his person as if it were foreign to him, and yet that person is preserved. Is it not because he has no personal and private ends, that therefore such ends are realised?"]]],"no":[{"v":[1],"l":"1","t":"„Hemel en Aarde duren lang” omdat dit hun natuur is, n.l. Tszʼ Jan (van-zelf), zonder dat zij er iets voor doen (Wei). Zij leven niet met het doel, toch vooral voor zichzelf te zorgen.","t98":"„Hemel en Aarde duren lang” omdat dit hun natuur is, n.l. Tszʼ Jan (van-zelf), zonder dat zij er iets voor doen (Wei). Zij leven niet met het doel, toch vooral voor zichzelf te zorgen."},{"v":[2],"l":"2","t":"Zo ook moet de Wijze niet aan zichzelf, zijn (egoïstisch) Ego denken, maar zich absorberen in Tao. En dáár één mede, is hij dan vanzelf al vér vóór de anderen.","t98":"Zoo ook moet de Wijze niet aan zichzelf, zijn (egoïstisch) Ego denken, maar zich absorbeeren in Tao. En dáár één mede, is hij dan vanzelf al vér vóór de anderen."},{"v":[3],"l":"3","t":"Letterlijk staat er „hij doet zijn lichaam (hier in den zin van „zijn Zelf”) buiten zich” enz.—Zijn éénige doel is één zijn met Tao.","t98":"Letterlijk staat er „hij doet zijn lichaam (hier in den zin van „zijn Zelf”) buiten zich” enz.—Zijn éénige doel is één zijn met Tao."},{"v":[5],"l":"5","t":"Terwijl hij dus zijn (onreëel) eigenbelang schijnbaar verwaarloost, heeft hij zijn (éénige, reële) belang, het één zijn met het Absolute, toch eigenlijk volmaakt.","t98":"Terwijl hij dus zijn (onreëel) eigenbelang schijnbaar verwaarloost, heeft hij zijn (éénige, reëele) belang, het één zijn met het Absolute, toch eigenlijk volmaakt."}]},{"n":8,"r":"VIII","d":"Tao","zh":["上善若水。","水善利萬物而不爭，處眾人之所惡，故幾於道。","居善地，心善淵，與善仁，言善信，正善治，事善能，動善時。","夫唯不爭，故無尤。"],"nl":[[1,["De opperste Goedheid is als water."]],[2,["Water is goed, doet goed aan alle dingen, en twist niet."]],[3,["Het woont in plaatsen, die de mensen verachten."]],[4,["Daarom komt (de Wijze, die als water is) dicht bij Tao."]],[5,["Hij woont (vanzelf) op de goede plaats. Hij houdt er van dat zijn hart diep is als een afgrond. Als hij weldoet meent hij het in menslievendheid. Als hij spreekt, spreekt hij goed de waarheid. Als hij regeert, houdt hij goed orde. Als hij zaken heeft, doet hij ze goed. Als hij beweegt is het op den rechten tijd."]],[6,["(Maar alleen) als hij niet met anderen in strijd komt is er niets in hem te laken."]]],"n98":[[1,["De opperste Goedheid is als water."]],[2,["Water is goed, doet goed aan alle dingen, en twist niet."]],[3,["Het woont in plaatsen, die de menschen verachten."]],[4,["Daarom komt (de Wijze, die als water is) dicht bij Tao."]],[5,["Hij woont (vanzelf) op de goede plaats. Hij houdt er van dat zijn hart diep is als een afgrond. Als hij weldoet meent hij het in menschlievendheid. Als hij spreekt, spreekt hij goed de waarheid. Als hij regeert, houdt hij goed orde. Als hij zaken heeft, doet hij ze goed. Als hij beweegt is het op den rechten tijd."]],[6,["(Maar alleen) als hij niet met anderen in strijd komt is er niets in hem te laken."]]],"en":[[1,["The highest excellence is like (that of) water. The excellence of water appears in its benefiting all things, and in its occupying, without striving (to the contrary), the low place which all men dislike. Hence (its way) is near to (that of) the Tao."]],[2,["The excellence of a residence is in (the suitability of) the place; that of the mind is in abysmal stillness; that of associations is in their being with the virtuous; that of government is in its securing good order; that of (the conduct of) affairs is in its ability; and that of (the initiation of) any movement is in its timeliness."]],[3,["And when (one with the highest excellence) does not wrangle (about his low position), no one finds fault with him."]]],"no":[{"v":[2],"l":"2","t":"De mensen trachten in hun eerzucht zo hoog mogelijk in de maatschappij te stijgen, verachtend het lage; maar het water (en ook de Goedheid) stroomt naar de laagten en diepten.","t98":"De menschen trachten in hun eerzucht zoo hoog mogelijk in de maatschappij te stijgen, verachtend het lage; maar het water (en ook de Goedheid) stroomt naar de laagten en diepten."},{"v":[5],"l":"5","t":"Er is verschil van gevoelen tussen de chinese commentators of hier „de Wijze” of „Tao” bedoeld wordt. Ik méén de Wijze. Met het „op de goede plaats wonen” wordt bedoeld, dat hij geen bizondere keuze heeft, en het nederige hem tevreden stelt. Met „menslievendheid” liefde voor allen, géén bizondere voor enkelen. Met „goed regeren” het tot rust en vrede brengen van het rijk, zodat het volk van-zelf goed werd. Met „bewegen op den rechten tijd” wordt bedoeld, dat hij alles precies doet (b.v. ambt aanvaarden, ontslag nemen, enz.) als het moment het op dat ogenblik zo meebrengt, en het in de natuurlijke orde ligt.","t98":"Er is verschil van gevoelen tusschen de chineesche commentators of hier „de Wijze” of „Tao” bedoeld wordt. Ik méén de Wijze. Met het „op de goede plaats wonen” wordt bedoeld, dat hij geen bizondere keuze heeft, en het nederige hem tevreden stelt. Met „menschlievendheid” liefde voor allen, géén bizondere voor enkelen. Met „goed regeeren” het tot rust en vrede brengen van het rijk, zoodat het volk van-zelf goed werd. Met „bewegen op den rechten tijd” wordt bedoeld, dat hij alles precies doet (b.v. ambt aanvaarden, ontslag nemen, enz.) als het moment het op dat oogenblik zoo meêbrengt, en het in de natuurlijke orde ligt."},{"v":[6],"l":"6","t":"Lao Tsz’s discipel Chuang Tszʼ vergeleek den mens, die in Tao leeft, met een ledige boot. Géén schipper zou in woede ontsteken tegen een ledige boot, als hij daarmede toevallig in aanvaring kwam.","t98":"Lao Tsz’s discipel Chuang Tszʼ vergeleek den mensch, die in Tao leeft, met een ledige boot. Géén schipper zou in woede ontsteken tegen een ledige boot, als hij daarmede toevallig in aanvaring kwam."}]},{"n":9,"r":"IX","d":"Tao","zh":["持而盈之，不如其已；揣而梲之，不可長保。","金玉滿堂，莫之能守；富貴而驕，自遺其咎。","功遂身退，天之道。"],"nl":[[1,["Beter dan een gevulde vaas aan beide zijden te dragen, is het, er in ’t geheel geen te dragen."]],[2,["Als men (een lemmet), na het gescherpt te hebben, telkens met de hand voelt (om het te proberen), zal het niet lang goed kunnen blijven."]],[3,["Als men zijn zaal vol goud en edelgesteenten heeft, zal men haar niet kunnen behouden."]],[4,["Als men, rijk en in aanzien zijnde, trots is, zal men zelf zijn ongeluk na zich slepen."]],[5,["Als het werk volbracht is, en de naam gemaakt, moet men zich terugtrekken. Dit is de Weg van den Hemel."]]],"n98":[[1,["Beter dan een gevulde vaas aan beide zijden te dragen, is het, er in ’t geheel geen te dragen."]],[2,["Als men (een lemmet), na het gescherpt te hebben, telkens met de hand voelt (om het te probeeren), zal het niet lang goed kunnen blijven."]],[3,["Als men zijn zaal vol goud en edelgesteenten heeft, zal men haar niet kunnen behouden."]],[4,["Als men, rijk en in aanzien zijnde, trotsch is, zal men zelf zijn ongeluk na zich sleepen."]],[5,["Als het werk volbracht is, en de naam gemaakt, moet men zich terugtrekken. Dit is de Weg van den Hemel."]]],"en":[[1,["It is better to leave a vessel unfilled, than to attempt to carry it when it is full. If you keep feeling a point that has been sharpened, the point cannot long preserve its sharpness."]],[2,["When gold and jade fill the hall, their possessor cannot keep them safe. When wealth and honours lead to arrogancy, this brings its evil on itself. When the work is done, and one's name is becoming distinguished, to withdraw into obscurity is the way of Heaven."]]],"no":[{"v":[1],"l":"1","t":"Letterlijk staat er „aan twee zijden (een vaas) vasthouden en (haar) te vullen is niet zo goed als er mede uit te scheiden.” De bedoeling is figuurlijk n.l. dat het veel beter is, iets niet te doen dan het door te zetten in het wilde, en niet van uitscheiden te weten.","t98":"Letterlijk staat er „aan twee zijden (een vaas) vasthouden en (haar) te vullen is niet zoo goed als er mede uit te scheiden.” De bedoeling is figuurlijk n.l. dat het veel beter is, iets niet te doen dan het door te zetten in het wilde, en niet van uitscheiden te weten."},{"v":[2],"l":"2","t":"Dit is eveneens figuurlijk. Het laatste zou misschien ook wel kunnen betekenen „zal men zichzelf niet lang goed kunnen bewaren,” dus „zal men zich wonden.”","t98":"Dit is eveneens figuurlijk. Het laatste zou misschien ook wel kunnen beteekenen „zal men zichzelf niet lang goed kunnen bewaren,” dus „zal men zich wonden.”"},{"v":[4],"l":"4","t":"Voor „na zich slepen,” staat lett. „nalaten.”","t98":"Voor „na zich sleepen,” staat lett. „nalaten.”"},{"v":[5],"l":"5","t":"Als het werk volbracht is, zal de Wijze, het onwezenlijke er van inziende, zich terugtrekken, en streven naar het éénig wezenlijke, naar Tao. Ik teken hierbij aan, dat waar ik hier en in volgende noten van „letterlijk” spreek men dit om zo te zeggen niet „letterlijk” moet opvatten, daar er in ’t chinees geen letters zijn. Ik bedoel dan „het dichtst bij de bedoeling en opvolging der karakters komende.”","t98":"Als het werk volbracht is, zal de Wijze, het onwezenlijke er van inziende, zich terugtrekken, en streven naar het éénig wezenlijke, naar Tao. Ik teeken hierbij aan, dat waar ik hier en in volgende noten van „letterlijk” spreek men dit om zoo te zeggen niet „letterlijk” moet opvatten, daar er in ’t chineesch geen letters zijn. Ik bedoel dan „het dichtst bij de bedoeling en opvolging der karakters komende.”"}]},{"n":10,"r":"X","d":"Tao","zh":["載營魄抱一，能無離乎？","專氣致柔，能嬰兒乎？","滌除玄覽，能無疵乎？","愛國治民，能無知乎？","天門開闔，能為雌乎？","明白四達，能無為乎？","生之，畜之。","生而不有，為而不恃，長而不宰，是謂玄德。"],"nl":[[1,["Hij, die het animale aan het spirituele onderwerpt, kan zijn wil op één ding (d.i. Tao) gericht houden, zodat hij niet verdeeld is (tussen wereldse dingen)."]],[2,["Hij temt zijn vitale kracht, tot hij gedwee (en gevoelig) wordt, en als een pasgeboren kind."]],[3,["Als hij zijn inwendig gezicht klaar en puur maakt (vrij van de duisterheden en twijfelingen van het Verstand), zal hij vrij zijn van alle morele gebreken."]],[4,["Als hij, met liefde voor het volk (als hij een Vorst is) het rijk regeert, zal hij Wu Wei kunnen zijn."]],[5,["Hij zal zijn als de broedende hen, die in volmaakte rust is, terwijl de processen van de natuur voortgaan."]],[6,["Als zijn licht overal doordringt, zal hij als onwetend kunnen zijn."]],[7,["Hij brengt de dingen voort en voedt ze. Hij brengt ze voort, zonder ze (als bezit) te hebben. Hij vermeerdert en vermenigvuldigt, en rekent niet op hun beloning. Hij regeert hen, en beschouwt zich niet als hun Meester.","Dit is wat men noemt de mysterieuze Deugd."]]],"n98":[[1,["Hij, die het animale aan het spiritueele onderwerpt, kan zijn wil op één ding (d.i. Tao) gericht houden, zoodat hij niet verdeeld is (tusschen wereldsche dingen)."]],[2,["Hij temt zijn vitale kracht, tot hij gedwee (en gevoelig) wordt, en als een pasgeboren kind."]],[3,["Als hij zijn inwendig gezicht klaar en puur maakt (vrij van de duisterheden en twijfelingen van het Verstand), zal hij vrij zijn van alle moreele gebreken."]],[4,["Als hij, met liefde voor het volk (als hij een Vorst is) het rijk regeert, zal hij Wu Wei kunnen zijn."]],[5,["Hij zal zijn als de broedende hen, die in volmaakte rust is, terwijl de processen van de natuur voortgaan."]],[6,["Als zijn licht overal doordringt, zal hij als onwetend kunnen zijn."]],[7,["Hij brengt de dingen voort en voedt ze. Hij brengt ze voort, zonder ze (als bezit) te hebben. Hij vermeerdert en vermenigvuldigt, en rekent niet op hun belooning. Hij regeert hen, en beschouwt zich niet als hun Meester.","Dit is wat men noemt de mysterieuze Deugd."]]],"en":[[1,["When the intelligent and animal souls are held together in one embrace, they can be kept from separating. When one gives undivided attention to the (vital) breath, and brings it to the utmost degree of pliancy, he can become as a (tender) babe. When he has cleansed away the most mysterious sights (of his imagination), he can become without a flaw."]],[2,["In loving the people and ruling the state, cannot he proceed without any (purpose of) action? In the opening and shutting of his gates of heaven, cannot he do so as a female bird? While his intelligence reaches in every direction, cannot he (appear to) be without knowledge?"]],[3,["(The Tao) produces (all things) and nourishes them; it produces them and does not claim them as its own; it does all, and yet does not boast of it; it presides over all, and yet does not control them. This is what is called 'The mysterious Quality' (of the Tao)."]]],"no":[{"v":[1],"l":"1","t":"Alexander vertaalt dit met „He who makes the investigation of his spiritual nature his chief object” enz. St. Julien met „L’âme spirituelle doit commander à l’âme sensitive” enz. Beiden, evenals ik, hebben iets in den tekst moeten veranderen en verplaatsen.","t98":"Alexander vertaalt dit met „He who makes the investigation of his spiritual nature his chief object” enz. St. Julien met „L’âme spirituelle doit commander à l’âme sensitive” enz. Beiden, evenals ik, hebben iets in den tekst moeten veranderen en verplaatsen."},{"v":[2],"l":"2","t":"De ongetemde vitale kracht leidt n.l. tot woestheid en losbandigheid. Het „als een pas geboren kind” zijn duidt aan een zuivere gevoeligheid voor indrukken, en het volkomen puur zijn, zonder verwarring, van het spirituele.","t98":"De ongetemde vitale kracht leidt n.l. tot woestheid en losbandigheid. Het „als een pas geboren kind” zijn duidt aan een zuivere gevoeligheid voor indrukken, en het volkomen puur zijn, zonder verwarring, van het spiritueele."},{"v":[5],"l":"5","t":"Letterlijk staat er voor „de processen van de natuur”: „het openen en sluiten van de deuren des Hemels,” en wel deze operaties precies op de juiste tijden gedaan.","t98":"Letterlijk staat er voor „de processen van de natuur”: „het openen en sluiten van de deuren des Hemels,” en wel deze operaties precies op de juiste tijden gedaan."},{"v":[7],"l":"7","t":"Het is niet recht duidelijk of Tao hier het onderwerp is dan wel de Wijze.","t98":"Het is niet recht duidelijk of Tao hier het onderwerp is dan wel de Wijze."}]},{"n":11,"r":"XI","d":"Tao","zh":["三十輻共一轂，當其無，有車之用。","埏埴以為器，當其無，有器之用。","鑿戶牖以為室，當其無，有室之用。","故有之以為利，無之以為用。"],"nl":[[1,["De dertig spaken van een wiel verenigen zich om een naaf. Maar alleen door de ledige ruimte is de wagen van nut."]],[2,["De vaas is uit klei gekneed tot huisraad. Maar alleen door de ledige ruimte (binnen in) is zij van nut."]],[3,["Men boort deuren en vensters uit om een huis te bouwen. Maar alleen door de ledige ruimte zijn zij van nut."]],[4,["Daarom, het Zijn (het materiële) heeft zijn voordeel, maar van het Niet-Zijn (het immateriële) hangt het eigenlijke nut af."]]],"n98":[[1,["De dertig spaken van een wiel vereenigen zich om een naaf. Maar alleen door de ledige ruimte is de wagen van nut."]],[2,["De vaas is uit klei gekneed tot huisraad. Maar alleen door de ledige ruimte (binnen in) is zij van nut."]],[3,["Men boort deuren en vensters uit om een huis te bouwen. Maar alleen door de ledige ruimte zijn zij van nut."]],[4,["Daarom, het Zijn (het materieele) heeft zijn voordeel, maar van het Niet-Zijn (het immaterieele) hangt het eigenlijke nut af."]]],"en":[[1,["The thirty spokes unite in the one nave; but it is on the empty space (for the axle), that the use of the wheel depends. Clay is fashioned into vessels; but it is on their empty hollowness, that their use depends. The door and windows are cut out (from the walls) to form an apartment; but it is on the empty space (within), that its use depends. Therefore, what has a (positive) existence serves for profitable adaptation, and what has not that for (actual) usefulness."]]],"no":[{"v":[1],"l":"1","t":"In den ouden tijd had een wiel dertig spaken, corresponderende met de dertig dagen van de maan (Lo Tchin Kong en Julien).","t98":"In den ouden tijd had een wiel dertig spaken, correspondeerende met de dertig dagen van de maan (Lo Tchin Kong en Julien)."},{"v":[2],"l":"2","t":"Julien vertaalt „C’est pourquoi l’utilité vient de l’être, l’usage vient du non-être.” Alexander door „however beneficial the material may be, without the immaterial it would be useless.” Giles vindt dit gehele hoofdstuk zo absurd, dat hij het niet eens vertaalt, en zegt: „This chapter is beneath contempt.” De commentator Peh Yü Sjen van een mijner edities zegt nog van den laatsten zin: „Dat ik dit lichaam van mijne ouders kreeg is voordeel” en vergelijkt dan het immateriële met „het eeuwig behouden van den Oorsprong, de eeuwige natuur, voor welke geen in- of uitwendig bestaat.”","t98":"Julien vertaalt „C’est pourquoi l’utilité vient de l’être, l’usage vient du non-être.” Alexander door „however beneficial the material may be, without the immaterial it would be useless.” Giles vindt dit geheele hoofdstuk zoo absurd, dat hij het niet eens vertaalt, en zegt: „This chapter is beneath contempt.” De commentator Peh Yü Sjen van een mijner edities zegt nog van den laatsten zin: „Dat ik dit lichaam van mijne ouders kreeg is voordeel” en vergelijkt dan het immaterieele met „het eeuwig behouden van den Oorsprong, de eeuwige natuur, voor welke geen in- of uitwendig bestaat.”"}]},{"n":12,"r":"XII","d":"Tao","zh":["五色令人目盲，五音令人耳聾，五味令人口爽，馳騁畋獵令人心發狂，難得之貨令人行妨。","是以聖人為腹不為目，故去彼取此。"],"nl":[[1,["De vijf kleuren verblinden het oog van den mens. De vijf tonen verdoven het oor. De vijf smaken bederven den smaak."]],[2,["Dolle ritten en jachten brengen het menselijk hart in verdwaling. Moeilijk te verkrijgen goederen brengen den mens tot verderfelijke daden."]],[3,["Daarom maakt de Wijze werk van zijn binnenste en niet van zijne ogen."]],[4,["Hij verwerpt wat van buiten komt, en langt naar wat van binnen is."]]],"n98":[[1,["De vijf kleuren verblinden het oog van den mensch. De vijf tonen verdooven het oor. De vijf smaken bederven den smaak."]],[2,["Dolle ritten en jachten brengen het menschelijk hart in verdwaling. Moeilijk te verkrijgen goederen brengen den mensch tot verderfelijke daden."]],[3,["Daarom maakt de Wijze werk van zijn binnenste en niet van zijne oogen."]],[4,["Hij verwerpt wat van buiten komt, en langt naar wat van binnen is."]]],"en":[[1,["Colour's five hues from th' eyes their sight will take;\nMusic's five notes the ears as deaf can make;\nThe flavours five deprive the mouth of taste;\nThe chariot course, and the wild hunting waste\nMake mad the mind; and objects rare and strange,\nSought for, men's conduct will to evil change."]],[2,["Therefore the sage seeks to satisfy (the craving of) the belly, and not the (insatiable longing of the) eyes. He puts from him the latter, and prefers to seek the former."]]],"no":[{"v":[1],"l":"1","t":"„De vijf kleuren” zijn blauw, geel, rood, wit en zwart. Er zal hier wel bedoeld zijn „alle kleuren,” in ’t algemeen. „De vijf tonen” zijn de chinese tonen, „kung, shang, kioh, chʼi en yü.” De vijf smaken: „zoet, scherp, zuur, zout, bitter.”","t98":"„De vijf kleuren” zijn blauw, geel, rood, wit en zwart. Er zal hier wel bedoeld zijn „alle kleuren,” in ’t algemeen. „De vijf tonen” zijn de chineesche tonen, „kung, shang, kioh, chʼi en yü.” De vijf smaken: „zoet, scherp, zuur, zout, bitter.”"},{"v":[3],"l":"3","t":"Letterlijk staat er „zijn binnenste vullen,” in den zin van „vullen met spirituele dingen” en „ledigen zowel van animale dingen als van belemmerende affecties.”","t98":"Letterlijk staat er „zijn binnenste vullen,” in den zin van „vullen met spiritueele dingen” en „ledigen zoowel van animale dingen als van belemmerende affecties.”"},{"v":[4],"l":"4","t":"Men vergelijke Thomas à Kempis „Imitation de Jésus Christ”: „Travaille donc à retirer ton cœur de l’amour des choses visibles pour te porter aux invisibles. (Livre I, Ch. I, trad. L. Moreau.)","t98":"Men vergelijke Thomas à Kempis „Imitation de Jésus Christ”: „Travaille donc à retirer ton cœur de l’amour des choses visibles pour te porter aux invisibles. (Livre I, Ch. I, trad. L. Moreau.)"}]},{"n":13,"r":"XIII","d":"Tao","zh":["寵辱若驚，貴大患若身。","何謂寵辱若驚？","寵為下，得之若驚，失之若驚，是謂寵辱若驚。","何謂貴大患若身？","吾所以有大患者，為吾有身，及吾無身，吾有何患？","故貴以身為天下，若可寄天下；愛以身為天下，若可託天下。"],"nl":[[1,["Hoge gratie en degradatie zijn dingen van vreze. Het lichaam is als een grote ramp."]],[2,["Hoe is het, dat men (dit) zegt (van) hoge gratie en degradatie? Hoge gratie is iets inferieurs. Verkrijgt men haar, dan is men als in vreze. Verliest men haar, dan is men als in vreze. Daarom zegt men: hoge gratie en degradatie zijn dingen van vreze."]],[3,["Hoe is het, dat men zegt: „Het lichaam is als een grote ramp”? Ik heb dáárom grote rampen, omdat ik een lichaam heb."]],[4,["Als ik zover was, dat ik géén lichaam had, welke rampen zou ik dan hebben?"]],[5,["Daarom, wie het als een zware karrewei beschouwt, om het rijk te regeren, dien kan men het rijk toevertrouwen; wie het iets verwerpelijks vindt om zelf het rijk te regeren, dien kan men de regering van het rijk opdragen."]]],"n98":[[1,["Hooge gratie en degradatie zijn dingen van vreeze. Het lichaam is als een groote ramp."]],[2,["Hoe is het, dat men (dit) zegt (van) hooge gratie en degradatie? Hooge gratie is iets inferieurs. Verkrijgt men haar, dan is men als in vreeze. Verliest men haar, dan is men als in vreeze. Daarom zegt men: hooge gratie en degradatie zijn dingen van vreeze."]],[3,["Hoe is het, dat men zegt: „Het lichaam is als eene groote ramp”? Ik heb dáárom groote rampen, omdat ik een lichaam heb."]],[4,["Als ik zoover was, dat ik géén lichaam had, welke rampen zou ik dan hebben?"]],[5,["Daarom, wie het als een zware karrewei beschouwt, om het rijk te regeeren, dien kan men het rijk toevertrouwen; wie het iets verwerpelijks vindt om zelf het rijk te regeeren, dien kan men de regeering van het rijk opdragen."]]],"en":[[1,["Favour and disgrace would seem equally to be feared; honour and great calamity, to be regarded as personal conditions (of the same kind)."]],[2,["What is meant by speaking thus of favour and disgrace? Disgrace is being in a low position (after the enjoyment of favour). The getting that (favour) leads to the apprehension (of losing it), and the losing it leads to the fear of (still greater calamity):--this is what is meant by saying that favour and disgrace would seem equally to be feared.","And what is meant by saying that honour and great calamity are to be (similarly) regarded as personal conditions? What makes me liable to great calamity is my having the body (which I call myself); if I had not the body, what great calamity could come to me?"]],[3,["Therefore he who would administer the kingdom, honouring it as he honours his own person, may be employed to govern it, and he who would administer it with the love which he bears to his own person may be entrusted with it."]]],"no":[{"v":[1],"l":"1","t":"Er is in verschillende edities van den Tao Teh King geen overeenstemming wat de volgorde van enige karakters in dit hoofdstuk aangaat. Zóó geven enkele commentators voor den tweden volzin: „geëerdheid en grote rampen zijn als het lichaam”.—De hoofdidee blijft echter dezelfde. Peh Yü Shen tekent bij dit nummer aan: „De van-zelve (d.i. natuurlijke) toestand van het hart (hier meer in den zin van ziel) is zonder glorie of vernedering.”","t98":"Er is in verschillende edities van den Tao Teh King geen overeenstemming wat de volgorde van eenige karakters in dit hoofdstuk aangaat. Zóó geven enkele commentators voor den tweeden volzin: „geëerdheid en groote rampen zijn als het lichaam”.—De hoofdidee blijft echter dezelfde. Peh Yü Shen teekent bij dit nummer aan: „De van-zelve (d.i. natuurlijke) toestand van het hart (hier meer in den zin van ziel) is zonder glorie of vernedering.”"},{"v":[2],"l":"2","t":"Is men bij den vorst in hoge gratie, dan is men in vreze, dat men haar niet behoudt, en is men in degradatie, dan is men in vreze, dat het misschien nooit weer beter kan worden.","t98":"Is men bij den vorst in hooge gratie, dan is men in vreeze, dat men haar niet behoudt, en is men in degradatie, dan is men in vreeze, dat het misschien nooit weer beter kan worden."},{"v":[3],"l":"3","t":"Peh Yü Shen tekent hierbij aan: „Ben ik Ik, dan heb ik ook een lichaam, ben ik niet Ik, dan heb ik ook geen lichaam”. M.a.w. men moet vrij zijn van alle begeerten en behoeften van het lichaam, en geheel opgaan in Tao; dan kunnen rampen ons niet meer bereiken.","t98":"Peh Yü Shen teekent hierbij aan: „Ben ik Ik, dan heb ik ook een lichaam, ben ik niet Ik, dan heb ik ook geen lichaam”. M.a.w. men moet vrij zijn van alle begeerten en behoeften van het lichaam, en geheel opgaan in Tao; dan kunnen rampen ons niet meer bereiken."},{"v":[4],"l":"4","t":"Dezelfde commentator zegt: „het Ik vergeten, en de wereld vergeten, dit is de reële en Tszʼ Jan (van-zelve) toestand van den Hemel”.","t98":"Dezelfde commentator zegt: „het Ik vergeten, en de wereld vergeten, dit is de reëele en Tszʼ Jan (van-zelve) toestand van den Hemel”."},{"v":[5],"l":"5","t":"Wie het vorst-zijn in ’t geheel niet als iets bizonder glorieus’ beschouwt, maar zich eigenlijk veel liever van alles terugtrok, om zich geheel over te geven aan Tao, zóó iemand zou alleen als vorst geschikt zijn, en zich nooit te buiten gaan aan eerzucht, haat, enz. Een commentator maakt de vergelijking er bij: „Het hart (de ziel) is de Vorst, het lichaam is het rijk.”","t98":"Wie het vorst-zijn in ’t geheel niet als iets bizonder glorieus’ beschouwt, maar zich eigenlijk veel liever van alles terugtrok, om zich geheel over te geven aan Tao, zóó iemand zou alleen als vorst geschikt zijn, en zich nooit te buiten gaan aan eerzucht, haat, enz. Een commentator maakt de vergelijking er bij: „Het hart (de ziel) is de Vorst, het lichaam is het rijk.”"}]},{"n":14,"r":"XIV","d":"Tao","zh":["視之不見名曰夷，聽之不聞名曰希，搏之不得名曰微。","此三者，不可致詰，故混而為一。","其上不皦，其下不昧。","繩繩不可名，復歸於無物。","是謂無狀之狀，無物之象，是謂惚恍。","迎之不見其首，隨之不見其後。","執古之道，以御今之有。","能知古始，是謂道紀。"],"nl":[[1,["Gij kijkt er naar, en gij ziet Het niet; men noemt Het kleurloos (I).","Gij luistert er naar, en gij hoort Het niet; men noemt Het aphoon (Hi).","Gij tast er naar, en gij raakt Het niet; men noemt Het onstoffelijk (Wei)."]],[2,["Deze drie dingen zijn niet met eigen woorden uit te leggen."]],[3,["Daarom, zij smelten samen tot één."]],[4,["Zijn bovenste is niet verlicht, Zijn onderste is niet duister (heeft geen schaduw)."]],[5,["Het is eeuwig, en kan niet met een naam worden genoemd! Het keert terug tot het Niet-Zijn! Dit noem ik het beeld van het beeldeloze, den vorm van het vormeloze. Dit noem ik vaag en onbestemd (een mysterie)."]],[6,["Gij nadert Het, en gij ziet niet Zijn begin. Gij volgt Het, en gij ziet niet Zijn einde."]],[7,["Gij moet het Tao van de Oudheid doorgronden, om over het bestaan van het Heden te regeren. Wie het Begin weet van het Oude, heeft de draad van Tao in handen."]]],"n98":[[1,["Gij kijkt er naar, en gij ziet Het niet; men noemt Het kleurloos (I).","Gij luistert er naar, en gij hoort Het niet; men noemt Het aphoon (Hi).","Gij tast er naar, en gij raakt Het niet; men noemt Het onstoffelijk (Wei)."]],[2,["Deze drie dingen zijn niet met eigen woorden uit te leggen."]],[3,["Daarom, zij smelten samen tot één."]],[4,["Zijn bovenste is niet verlicht, Zijn onderste is niet duister (heeft geen schaduw)."]],[5,["Het is eeuwig, en kan niet met een naam worden genoemd! Het keert terug tot het Niet-Zijn! Dit noem ik het beeld van het beeldelooze, den vorm van het vormelooze. Dit noem ik vaag en onbestemd (een mysterie)."]],[6,["Gij nadert Het, en gij ziet niet Zijn begin. Gij volgt Het, en gij ziet niet Zijn einde."]],[7,["Gij moet het Tao van de Oudheid doorgronden, om over het bestaan van het Heden te regeeren. Wie het Begin weet van het Oude, heeft de draad van Tao in handen."]]],"en":[[1,["We look at it, and we do not see it, and we name it 'the Equable.' We listen to it, and we do not hear it, and we name it 'the Inaudible.' We try to grasp it, and do not get hold of it, and we name it 'the Subtle.' With these three qualities, it cannot be made the subject of description; and hence we blend them together and obtain The One."]],[2,["Its upper part is not bright, and its lower part is not obscure. Ceaseless in its action, it yet cannot be named, and then it again returns and becomes nothing. This is called the Form of the Formless, and the Semblance of the Invisible; this is called the Fleeting and Indeterminable."]],[3,["We meet it and do not see its Front; we follow it, and do not see its Back. When we can lay hold of the Tao of old to direct the things of the present day, and are able to know it as it was of old in the beginning, this is called (unwinding) the clue of Tao."]]],"no":[{"v":[1],"l":"1","t":"Rémusat, Strauss en nog anderen zagen in deze drie woorden „I” „Hi” en „Wei” een verbastering voor „Jehovah” en groot was de verrassing toen men hoorde, dat de chinezen vóór onze jaartelling reeds van Jehovah afwisten. Er is echter geen kwestie van, of deze woorden hebben den zin, die ik hier gebruik, evenals zij in authentieke commentaren voorkomen. Julien en Legge hebben het ook nooit geloofd. De bedoeling is: „Tao is kleurloos, aphoon, en onstoffelijk.”","t98":"Rémusat, Strauss en nog anderen zagen in deze drie woorden „I” „Hi” en „Wei” een verbastering voor „Jehovah” en groot was de verrassing toen men hoorde, dat de chineezen vóór onze jaartelling reeds van Jehovah afwisten. Er is echter geen kwestie van, of deze woorden hebben den zin, die ik hier gebruik, evenals zij in authentieke commentaren voorkomen. Julien en Legge hebben het ook nooit geloofd. De bedoeling is: „Tao is kleurloos, aphoon, en onstoffelijk.”"},{"v":[2,3],"l":"2 en 3","t":"Wat deze drie dingen zijn is niet met woorden uit te drukken, omdat zij met niets zijn te vergelijken, en ook niet van elkaar te onderscheiden. Samen geven zij het immateriële aan van Tao.","t98":"Wat deze drie dingen zijn is niet met woorden uit te drukken, omdat zij met niets zijn te vergelijken, en ook niet van elkaar te onderscheiden. Samen geven zij het immaterieele aan van Tao."},{"v":[4],"l":"4","t":"Omdat het onstoffelijk is, is het ook niet, als alle stoffelijke dingen van boven meer verlicht dan van onderen. Het kan licht noch schaduw hebben.","t98":"Omdat het onstoffelijk is, is het ook niet, als alle stoffelijke dingen van boven meer verlicht dan van onderen. Het kan licht noch schaduw hebben."},{"v":[5],"l":"5","t":"Het Niet-Zijn, hierin voorkomend, is het voor ons Niet-Zijn, daar wij alleen stoffelijke, met de zintuigen waar te nemen dingen Zijn noemen. Maar, hoger denkend, is dit Zijn reëel, want niet eeuwigdurend, en onderhevig aan geboorte en dood, terwijl het zogenaamde Niet-Zijn eigenlijk het éénige reële, eeuwigdurende Zijn is.—Een vorm, die vergaat (als die van alle sterfelijke dingen) is eigenlijk geen vorm, evenmin als een beeld, dat weer uitgewischt wordt een beeld is, dat uit-zich-zelf eeuwig bestaat. Tao is voor ons onzichtbaar, dus voor ons beeldeloos en vormeloos. Maar Tao bestaat uit zich-zelf eeuwig, en daarom belichaamt Tao eigenlijk het éénige reële beeld, den éénigen reëlen vorm.","t98":"Het Niet-Zijn, hierin voorkomend, is het voor ons Niet-Zijn, daar wij alleen stoffelijke, met de zintuigen waar te nemen dingen Zijn noemen. Maar, hooger denkend, is dit Zijn reëel, want niet eeuwigdurend, en onderhevig aan geboorte en dood, terwijl het zoogenaamde Niet-Zijn eigenlijk het éénige reëele, eeuwigdurende Zijn is.—Een vorm, die vergaat (als die van alle sterfelijke dingen) is eigenlijk geen vorm, evenmin als een beeld, dat weer uitgewischt wordt een beeld is, dat uit-zich-zelf eeuwig bestaat. Tao is voor ons onzichtbaar, dus voor ons beeldeloos en vormeloos. Maar Tao bestaat uit zich-zelf eeuwig, en daarom belichaamt Tao eigenlijk het éénige reëele beeld, den éénigen reëelen vorm."},{"v":[6],"l":"6","t":"Tao heeft verder begin noch einde, verleden noch toekomst.","t98":"Tao heeft verder begin noch einde, verleden noch toekomst."},{"v":[7],"l":"7","t":"Het Tao weten van de Oudheid is weten, dat er oorspronkelijk geen leven en dood is, dat er geen leven en dood als reële dingen bestaan. Het Begin van het Oude weten is weten, dat er geen verleden of toekomst bestaat voor Tao, dat, voor hem, die in Tao opgaat, het heden morgen en het morgen heden is, daar Tao alleen reëel in en nooit vergaat, vermindert of vermeerdert.","t98":"Het Tao weten van de Oudheid is weten, dat er oorspronkelijk geen leven en dood is, dat er geen leven en dood als reëele dingen bestaan. Het Begin van het Oude weten is weten, dat er geen verleden of toekomst bestaat voor Tao, dat, voor hem, die in Tao opgaat, het heden morgen en het morgen heden is, daar Tao alleen reëel in en nooit vergaat, vermindert of vermeerdert."}]},{"n":15,"r":"XV","d":"Tao","zh":["古之善為士者，微妙玄通，深不可識。","夫唯不可識，故強為之容。","豫焉若冬涉川，猶兮若畏四鄰，儼兮其若容，渙兮若冰之將釋，敦兮其若樸，曠兮其若谷，混兮其若濁。","孰能濁以靜之徐清？","孰能安以久動之徐生？","保此道者不欲盈，夫唯不盈，故能蔽不新成。"],"nl":[[1,["In de Oudheid waren de goede filosofen, die zich aan Tao wijdden, (als) gering, subtiel, duister, en vèr-doordringend. Zij waren zóó diep, dat het niet is te begrijpen."]],[2,["Maar omdat het niet te begrijpen is, zal ik mij moeite doen om er een beeld van te geven."]],[3,["Zij waren bedeesd als een, die in den winter een stroom doorwaadt. Zij waren op hun hoede, als een, die zijne buren vreest. Zij waren ernstig als een gast (tegenover zijn gastheer). Zij verdwenen als het ijs, dat gaat smelten. Zij waren simpel, als onbewerkt hout. Zij waren ledig, als een vallei. Zij waren als troebel water."]],[4,["Wie kan de onzuiverheden (van zijn hart) verreinen tot rust?","Wie kan langzamerhand geboren worden (in Tao) door een langdurig betrachte kalmte?"]],[5,["Hij, die Tao behoudt, wenst niet vol te zijn. Juist omdat hij niet vol is, is hij voor altijd gevrijwaard tegen verandering."]]],"n98":[[1,["In de Oudheid waren de goede filosofen, die zich aan Tao wijdden, (als) gering, subtiel, duister, en vèr-doordringend. Zij waren zóó diep, dat het niet is te begrijpen."]],[2,["Maar omdat het niet te begrijpen is, zal ik mij moeite doen om er een beeld van te geven."]],[3,["Zij waren bedeesd als een, die in den winter een stroom doorwaadt. Zij waren op hun hoede, als een, die zijne buren vreest. Zij waren ernstig als een gast (tegenover zijn gastheer). Zij verdwenen als het ijs, dat gaat smelten. Zij waren simpel, als onbewerkt hout. Zij waren ledig, als een vallei. Zij waren als troebel water."]],[4,["Wie kan de onzuiverheden (van zijn hart) verreinen tot rust?","Wie kan langzamerhand geboren worden (in Tao) door een langdurig betrachte kalmte?"]],[5,["Hij, die Tao behoudt, wenscht niet vol te zijn. Juist omdat hij niet vol is, is hij voor altijd gevrijwaard tegen verandering."]]],"en":[[1,["The skilful masters (of the Tao) in old times, with a subtle and exquisite penetration, comprehended its mysteries, and were deep (also) so as to elude men's knowledge. As they were thus beyond men's knowledge, I will make an effort to describe of what sort they appeared to be."]],[2,["Shrinking looked they like those who wade through a stream in winter; irresolute like those who are afraid of all around them; grave like a guest (in awe of his host); evanescent like ice that is melting away; unpretentious like wood that has not been fashioned into anything; vacant like a valley, and dull like muddy water."]],[3,["Who can (make) the muddy water (clear)? Let it be still, and it will gradually become clear. Who can secure the condition of rest? Let movement go on, and the condition of rest will gradually arise."]],[4,["They who preserve this method of the Tao do not wish to be full (of themselves). It is through their not being full of themselves that they can afford to seem worn and not appear new and complete."]]],"no":[{"v":[1],"l":"1","t":"Deze volzin is een verwijt tegen de filosofen in Lao Tsz’s tijd, die wanhopig waren, als zij miskend en onbekend bleven. De filosofen uit de Oudheid waren één met Tao, en, evenals Tao zelf, schenen zij voor de gewone mensen als gering, subtiel en duister, en drongen toch in alles door.","t98":"Deze volzin is een verwijt tegen de filosofen in Lao Tsz’s tijd, die wanhopig waren, als zij miskend en onbekend bleven. De filosofen uit de Oudheid waren één met Tao, en, evenals Tao zelf, schenen zij voor de gewone menschen als gering, subtiel en duister, en drongen toch in alles door."},{"v":[3],"l":"3","t":"Het doorwaden van een stroom in den winter symboliseert hier een grote moeilijkheid, waar men niet lichtvaardig aan begint. Het als gast zijn betekent zich mindere voelen en reverend zijn.—Het versmelten als ijs in water symboliseert het terugkeren van het lichaam om te vergaan in Tao.—Als onbewerkt hout zijn is in den natuurlijken staat zijn, zonder fraaiigheid.—Het ledig zijn als een vallei symboliseert het vrij zijn van alle begeerten en stoffelijke aantrekkingen.—Het vaag zijn duidt aan, dat zij zich volstrekt niet als bizonder verlicht voordeden, maar dat de mensen hen als troebel en duister vonden, en dachten, dat zij onwetend waren, daar zij zich niet boven hun gewone dingen trachten te verheffen.","t98":"Het doorwaden van een stroom in den winter symboliseert hier een groote moeilijkheid, waar men niet lichtvaardig aan begint. Het als gast zijn beteekent zich mindere voelen en reverend zijn.—Het versmelten als ijs in water symboliseert het terugkeeren van het lichaam om te vergaan in Tao.—Als onbewerkt hout zijn is in den natuurlijken staat zijn, zonder fraaiigheid.—Het ledig zijn als een vallei symboliseert het vrij zijn van alle begeerten en stoffelijke aantrekkingen.—Het vaag zijn duidt aan, dat zij zich volstrekt niet als bizonder verlicht voordeden, maar dat de menschen hen als troebel en duister vonden, en dachten, dat zij onwetend waren, daar zij zich niet boven hun gewone dingen trachten te verheffen."},{"v":[4],"l":"4","t":"Iedere beweging maakt de ziel onzuiver, evenals een beweging in water. Alleen door volkomen kalmte blijven de ziel en het water helder en puur.—Gedachten, begeerten, affecties, deze bewegen de ziel, en alleen rust en kalmte houden haar rein.","t98":"Iedere beweging maakt de ziel onzuiver, evenals een beweging in water. Alleen door volkomen kalmte blijven de ziel en het water helder en puur.—Gedachten, begeerten, affecties, deze bewegen de ziel, en alleen rust en kalmte houden haar rein."},{"v":[5],"l":"5","t":"Wat vol is, loopt spoedig over, en verandert dus, of vermindert. Tao is van een natuur, dat er niets bij kan of af kan gaan, dat het groter of kleiner maakt. Peh Yü Shen vergelijkt hier direct de ziel met Tao door te zeggen: „Tao kan niet uitgeput worden, de ziel kan niet uitgeput worden.” De filosofen van den nieuwen tijd, dacht Lao Tszʼ, wilden altijd maar vol schijnen, vol glorie en geleerdheid. Die der Oudheid waren ogenschijnlijk als ledig, maar bleven dan ook altijd hetzelfde, in Tao.","t98":"Wat vol is, loopt spoedig over, en verandert dus, of vermindert. Tao is van een natuur, dat er niets bij kan of af kan gaan, dat het grooter of kleiner maakt. Peh Yü Shen vergelijkt hier direct de ziel met Tao door te zeggen: „Tao kan niet uitgeput worden, de ziel kan niet uitgeput worden.” De filosofen van den nieuwen tijd, dacht Lao Tszʼ, wilden altijd maar vol schijnen, vol glorie en geleerdheid. Die der Oudheid waren oogenschijnlijk als ledig, maar bleven dan ook altijd hetzelfde, in Tao."}]},{"n":16,"r":"XVI","d":"Tao","zh":["致虛極，守靜篤。","萬物並作，吾以觀復。","夫物芸芸，各復歸其根。","歸根曰靜，是謂復命。","復命曰常，知常曰明。","不知常，妄作凶。","知常容，容乃公，公乃全，全乃天，天乃道，道乃久，沒身不殆。"],"nl":[[1,["Als men tot het opperste Ledig is gekomen, handhaaft men een onvergankelijke rust."]],[2,["Alle dingen worden te samen geboren; ik zie ze (daarna) weder terugkeren."]],[3,["Alle dingen bloeien overvloediglijk; (daarna) keert elk terug tot zijn Oorsprong."]],[4,["Tot den Oorsprong terugkeren heet in rust zijn. In rust zijn heet terugkeren tot het (eeuwige, reële) Leven."]],[5,["Terugkeren tot het Leven heet ik eeuwigdurend zijn."]],[6,["Te weten wat eeuwigdurend is heet verlicht zijn. Niet te weten wat eeuwigdurend is heet eigen ellende bewerken."]],[7,["Weten wat eeuwigdurend is is een grote ziel hebben. Een grote ziel hebbende is men rechtvaardig. Rechtvaardig zijnde is men koning. Koning zijnde is men de Hemel. De Hemel zijnde is men Tao."]],[8,["Tao zijnde is men altijd-durend. Al sterft het lichaam, er is (dan toch) geen gevaar (meer te duchten)."]]],"n98":[[1,["Als men tot het opperste Ledig is gekomen, handhaaft men eene onvergankelijke rust."]],[2,["Alle dingen worden te samen geboren; ik zie ze (daarna) weder terugkeeren."]],[3,["Alle dingen bloeien overvloediglijk; (daarna) keert elk terug tot zijn Oorsprong."]],[4,["Tot den Oorsprong terugkeeren heet in rust zijn. In rust zijn heet terugkeeren tot het (eeuwige, reëele) Leven."]],[5,["Terugkeeren tot het Leven heet ik eeuwigdurend zijn."]],[6,["Te weten wat eeuwigdurend is heet verlicht zijn. Niet te weten wat eeuwigdurend is heet eigen ellende bewerken."]],[7,["Weten wat eeuwigdurend is is een groote ziel hebben. Een groote ziel hebbende is men rechtvaardig. Rechtvaardig zijnde is men koning. Koning zijnde is men de Hemel. De Hemel zijnde is men Tao."]],[8,["Tao zijnde is men altijd-durend. Al sterft het lichaam, er is (dan toch) geen gevaar (meer te duchten)."]]],"en":[[1,["The (state of) vacancy should be brought to the utmost degree, and that of stillness guarded with unwearying vigour. All things alike go through their processes of activity, and (then) we see them return (to their original state). When things (in the vegetable world) have displayed their luxuriant growth, we see each of them return to its root. This returning to their root is what we call the state of stillness; and that stillness may be called a reporting that they have fulfilled their appointed end."]],[2,["The report of that fulfilment is the regular, unchanging rule. To know that unchanging rule is to be intelligent; not to know it leads to wild movements and evil issues. The knowledge of that unchanging rule produces a (grand) capacity and forbearance, and that capacity and forbearance lead to a community (of feeling with all things). From this community of feeling comes a kingliness of character; and he who is king-like goes on to be heaven-like. In that likeness to heaven he possesses the Tao. Possessed of the Tao, he endures long; and to the end of his bodily life, is exempt from all danger of decay."]]],"no":[{"v":[1],"l":"1","t":"„Ledig” betekent hier weer „ledig van begeerten en egoïsme”.—Ik heb hier letterlijk vertaald, waar Johnson, minder getrouw, maar misschien duidelijker heeft: „Whoso has wholly ceased from self shall find immovable rest”. „Het ledig en de ruste”, zegt Sie Hoei hierbij, „zijn de wortel (basis) van onze natuur” (Julien).","t98":"„Ledig” beteekent hier weer „ledig van begeerten en egoïsme”.—Ik heb hier letterlijk vertaald, waar Johnson, minder getrouw, maar misschien duidelijker heeft: „Whoso has wholly ceased from self shall find immovable rest”. „Het ledig en de ruste”, zegt Sie Hoei hierbij, „zijn de wortel (basis) van onze natuur” (Julien)."},{"v":[4],"l":"4","t":"Met „Leven” wordt hier bedoeld het Leven zoals het oorspronkelijk is, het eeuwige leven, zonder passies, van Tao. En dit is voor ieder te bereiken, daar het de oorsprong van zijne natuur is. Alle beweging ontstaat uit en is geworteld in rust.","t98":"Met „Leven” wordt hier bedoeld het Leven zooals het oorspronkelijk is, het eeuwige leven, zonder passies, van Tao. En dit is voor ieder te bereiken, daar het de oorsprong van zijne natuur is. Alle beweging ontstaat uit en is geworteld in rust."},{"v":[6],"l":"6","t":"Wie niet weet wat eeuwigdurend is houdt zich op met voorbijgaande verschijningen, en leeft van sterfelijke hartstochten, die hem ongelukkig maken, omdat zij niet reëel zijn.","t98":"Wie niet weet wat eeuwigdurend is houdt zich op met voorbijgaande verschijningen, en leeft van sterfelijke hartstochten, die hem ongelukkig maken, omdat zij niet reëel zijn."},{"v":[7],"l":"7","t":"Hier doet Lao Tszʼ wat ook Confucius deed: het exalteren van den Wijze, en hem één verklaren met den Hemel (zie Confucius’ „Choeng Yoeng”). Alleen hij, die de hoogste rechtvaardigheid bezat, was volgens Lao Tszʼ en Confucius waard koning te zijn, en over allen zonder onderscheid zijne weldaden te verspreiden.","t98":"Hier doet Lao Tszʼ wat ook Confucius deed: het exalteeren van den Wijze, en hem één verklaren met den Hemel (zie Confucius’ „Choeng Yoeng”). Alleen hij, die de hoogste rechtvaardigheid bezat, was volgens Lao Tszʼ en Confucius waard koning te zijn, en over allen zonder onderscheid zijne weldaden te verspreiden."},{"v":[8],"l":"8","t":"Volgens enkele commentators moet de laatste zin luiden: „tot aan den dood is er voor hem geen gevaar”.—Ik kan hier niet met hen medegaan. Johnson vertaalt hier gelijk ik; Julien echter niet.—Johnson haalt bij dit hoofdstuk de volgende twee schone teksten aan uit de Vedanta: „Those who know the Supreme Brahma become even Brahma”, en „When He is known as the nature of every thought, than immortality is known”.","t98":"Volgens enkele commentators moet de laatste zin luiden: „tot aan den dood is er voor hem geen gevaar”.—Ik kan hier niet met hen medegaan. Johnson vertaalt hier gelijk ik; Julien echter niet.—Johnson haalt bij dit hoofdstuk de volgende twee schoone teksten aan uit de Vedanta: „Those who know the Supreme Brahma become even Brahma”, en „When He is known as the nature of every thought, than immortality is known”."}]},{"n":17,"r":"XVII","d":"Tao","zh":["太上，下知有之，其次，親而譽之，其次，畏之，其次，侮之。","信不足焉，有不信焉。","悠兮其貴言，功成事遂，百姓皆謂：我自然。"],"nl":[[1,["In de hoge Oudheid wist het volk alleen van de vorsten dat zij bestonden."]],[2,["De vorsten die dáárna kwamen had het volk lief en prees hen."]],[3,["Die dáárna kwamen, vreesde het."]],[4,["Die dáárna kwamen, verachtte het."]],[5,["Hij, die anderen niet vertrouwt, krijgt het vertrouwen van anderen niet."]],[6,["(De Ouden) waren langzaam en ernstig in hun woorden."]],[7,["Als zij de verdiensten hadden gemaakt, en de zaken volvoerd, zeide het volk: „Wij zijn vanzelven (zoals onze natuur is)”."]]],"n98":[[1,["In de hooge Oudheid wist het volk alleen van de vorsten dat zij bestonden."]],[2,["De vorsten die dáárna kwamen had het volk lief en prees hen."]],[3,["Die dáárna kwamen, vreesde het."]],[4,["Die dáárna kwamen, verachtte het."]],[5,["Hij, die anderen niet vertrouwt, krijgt het vertrouwen van anderen niet."]],[6,["(De Ouden) waren langzaam en ernstig in hun woorden."]],[7,["Als zij de verdiensten hadden gemaakt, en de zaken volvoerd, zeide het volk: „Wij zijn vanzelven (zooals onze natuur is)”."]]],"en":[[1,["In the highest antiquity, (the people) did not know that there were (their rulers). In the next age they loved them and praised them. In the next they feared them; in the next they despised them. Thus it was that when faith (in the Tao) was deficient (in the rulers) a want of faith in them ensued (in the people)."]],[2,["How irresolute did those (earliest rulers) appear, showing (by their reticence) the importance which they set upon their words! Their work was done and their undertakings were successful, while the people all said, 'We are as we are, of ourselves!'"]]],"no":[{"v":[1],"l":"1","t":"Lao Tszʼ bedoelde, dat vroeger de regering zo van-zelf (Tszʼ Jan), zo „Wu Wei” ging, doordat de Vorsten in Tao leefden, dat er niets bizonders behoefde gedaan te worden, doordat alles van-zelf ageerde, en zóó wist het volk alleen van de vorsten, dat zij bestonden.","t98":"Lao Tszʼ bedoelde, dat vroeger de regeering zoo van-zelf (Tszʼ Jan), zoo „Wu Wei” ging, doordat de Vorsten in Tao leefden, dat er niets bizonders behoefde gedaan te worden, doordat alles van-zelf ageerde, en zóó wist het volk alleen van de vorsten, dat zij bestonden."},{"v":[2,3,4],"l":"2,3, en 4","t":"Dit is een voorlooper van Hoofdstuk XVIII. Het verval wordt erger en erger, zodra alles niet meer „Wu Wei” is. In plaats van natuurlijke dingen kwamen wetten, die dan veinzerij veroorzaakten, enz. enz.","t98":"Dit is een voorlooper van Hoofdstuk XVIII. Het verval wordt erger en erger, zoodra alles niet meer „Wu Wei” is. In plaats van natuurlijke dingen kwamen wetten, die dan veinzerij veroorzaakten, enz. enz."},{"v":[5],"l":"5","t":"Zo de vorsten strenge wetten nodig hadden in plaats van natuurlijk vertrouwen in het volk, vertrouwde het volk hen ook niet meer.","t98":"Zoo de vorsten strenge wetten noodig hadden in plaats van natuurlijk vertrouwen in het volk, vertrouwde het volk hen ook niet meer."},{"v":[7],"l":"7","t":"Alles „Wu Wei” gaande, was er ook niets bizonders aan als alle zaken gelukten en er voorspoed was. Dit was niet anders dan „Tszʼ Jan”, vanzelf.","t98":"Alles „Wu Wei” gaande, was er ook niets bizonders aan als alle zaken gelukten en er voorspoed was. Dit was niet anders dan „Tszʼ Jan”, vanzelf."}]},{"n":18,"r":"XVIII","d":"Tao","zh":["大道廢，有仁義；智慧出，有大偽；六親不和，有孝慈；國家昏亂，有忠臣。"],"nl":[[1,["Toen Tao werd verwaarloosd, kwamen Menslievendheid en Gerechtigheid."]],[2,["Toen de „scherpzinnigheid” en „het schrandere doorzicht” voor den dag kwamen, ontstond de grote Huichelarij."]],[3,["Toen de familie niet meer in harmonie leefde, kwamen de Hiao en de Ts’zʼ."]],[4,["Toen de staten van het rijk in verwarring waren, kwamen de getrouwe onderdanen."]]],"n98":[[1,["Toen Tao werd verwaarloosd, kwamen Menschlievendheid en Gerechtigheid."]],[2,["Toen de „scherpzinnigheid” en „het schrandere doorzicht” voor den dag kwamen, ontstond de groote Huichelarij."]],[3,["Toen de familie niet meer in harmonie leefde, kwamen de Hiao en de Ts’zʼ."]],[4,["Toen de staten van het rijk in verwarring waren, kwamen de getrouwe onderdanen."]]],"en":[[1,["When the Great Tao (Way or Method) ceased to be observed, benevolence and righteousness came into vogue. (Then) appeared wisdom and shrewdness, and there ensued great hypocrisy."]],[2,["When harmony no longer prevailed throughout the six kinships, filial sons found their manifestation; when the states and clans fell into disorder, loyal ministers appeared."]]],"no":[{"v":[1],"l":"1","t":"Toen het volk nog in Tao leefde was er vanzelf liefde van de mensen onder elkaar, was er vanzelf geen strijd en misdaad. Alles was Wu Wei. Vanzelf was er dus ook geen begrip Menslievendheid en geen begrip Ger
