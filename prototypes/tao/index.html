]],"no":[{"v":[2],"l":"2","t":"In het chinees staat, zonder verdere verbinding, enkel achter elkaar: „groot—klein—veel—weinig”. Men begrijpt hoe moeilijk de vertaling wordt. Johnson, von Strauss aanhalend, heeft: „Let thy great be as little, thy many the few”. Julien „Les choses grandes et petites, nombreuses ou rares (sont égales à ses yeux)”. Alexander: „Turn the small into the great, and the few into the many”, enz. Ik nam mijne versie, omdat deze mij het nauwkeurigst scheen aan te sluiten aan wat volgt.","t98":"In het chineesch staat, zonder verdere verbinding, enkel achter elkaar: „groot—klein—veel—weinig”. Men begrijpt hoe moeilijk de vertaling wordt. Johnson, von Strauss aanhalend, heeft: „Let thy great be as little, thy many the few”. Julien „Les choses grandes et petites, nombreuses ou rares (sont égales à ses yeux)”. Alexander: „Turn the small into the great, and the few into the many”, enz. Ik nam mijne versie, omdat deze mij het nauwkeurigst scheen aan te sluiten aan wat volgt."},{"v":[3],"l":"3","t":"Letterlijk staat er: „Hij wreekt kwaad met deugd”.","t98":"Letterlijk staat er: „Hij wreekt kwaad met deugd”."},{"v":[5],"l":"5","t":"Letterlijk staat er niet „uit” maar „met”.","t98":"Letterlijk staat er niet „uit” maar „met”."}]},{"n":64,"r":"LXIV","d":"Teh","zh":["其安易持，其未兆易謀。","其脆易泮，其微易散。","為之於未有，治之於未亂。","合抱之木，生於毫末；九層之臺，起於累土；千里之行，始於足下。","為者敗之，執者失之。","是以聖人無為故無敗，無執故無失。","民之從事，常於幾成而敗之。","慎終如始，則無敗事。","是以聖人欲不欲，不貴難得之貨；學不學，復眾人之所過。","以輔萬物之自然，而不敢為。"],"nl":[[1,["Dat, wat in rust is, is gemakkelijk te behouden in zijn toestand; dat wat nog niet verschenen is, is gemakkelijk te voorkomen; dat wat broos is, is gemakkelijk te breken; dat wat klein is, is gemakkelijk te verspreiden."]],[2,["Houdt het kwaad tegen vóór het bestaat, regeer wanorde vóór zij uitbarst."]],[3,["Een boom dien gij met beide armen (nauwelijks) kunt omvatten is gegroeid uit een vezeltje zo fijn als een haar; een toren van negen verdiepingen is uit een klein hoopje aarde opgericht, en een reis van duizend li’s begint met een enkelen voetstap."]],[4,["Wie „doet” faalt, wie grijpt verliest (wat hij grijpt)."]],[5,["Daarom, de Wijze is Wu Wei en faalt daarom niet, de Wijze grijpt niet en verliest daarom niet."]],[6,["Als het volk iets doet faalt het altijd als het op het punt is om te slagen."]],[7,["Zorg voor het einde zowel als voor het begin, dan zult gij niet falen."]],[8,["Vandaar, de Wijze begeert géén begeerten te hebben, en hecht geen waarde aan moeilijk te verkrijgen dingen; zijn studie is géén studie en daardoor ontkomt hij aan de fouten der mensen. Hij laat alle dingen hun natuurlijken gang gaan, en komt niet tussenbeide."]]],"n98":[[1,["Dat, wat in rust is, is gemakkelijk te behouden in zijn toestand; dat wat nog niet verschenen is, is gemakkelijk te voorkomen; dat wat broos is, is gemakkelijk te breken; dat wat klein is, is gemakkelijk te verspreiden."]],[2,["Houdt het kwaad tegen vóór het bestaat, regeer wanorde vóór zij uitbarst."]],[3,["Een boom dien gij met beide armen (nauwelijks) kunt omvatten is gegroeid uit een vezeltje zoo fijn als een haar; een toren van negen verdiepingen is uit een klein hoopje aarde opgericht, en een reis van duizend li’s begint met een enkelen voetstap."]],[4,["Wie „doet” faalt, wie grijpt verliest (wat hij grijpt)."]],[5,["Daarom, de Wijze is Wu Wei en faalt daarom niet, de Wijze grijpt niet en verliest daarom niet."]],[6,["Als het volk iets doet faalt het altijd als het op het punt is om te slagen."]],[7,["Zorg voor het einde zoowel als voor het begin, dan zult gij niet falen."]],[8,["Vandaar, de Wijze begeert géén begeerten te hebben, en hecht geen waarde aan moeilijk te verkrijgen dingen; zijn studie is géén studie en daardoor ontkomt hij aan de fouten der menschen. Hij laat alle dingen hun natuurlijken gang gaan, en komt niet tusschenbeide."]]],"en":[[1,["That which is at rest is easily kept hold of; before a thing has given indications of its presence, it is easy to take measures against it; that which is brittle is easily broken; that which is very small is easily dispersed. Action should be taken before a thing has made its appearance; order should be secured before disorder has begun."]],[2,["The tree which fills the arms grew from the tiniest sprout; the tower of nine storeys rose from a (small) heap of earth; the journey of a thousand li commenced with a single step."]],[3,["He who acts (with an ulterior purpose) does harm; he who takes hold of a thing (in the same way) loses his hold. The sage does not act (so), and therefore does no harm; he does not lay hold (so), and therefore does not lose his hold. (But) people in their conduct of affairs are constantly ruining them when they are on the eve of success. If they were careful at the end, as (they should be) at the beginning, they would not so ruin them."]],[4,["Therefore the sage desires what (other men) do not desire, and does not prize things difficult to get; he learns what (other men) do not learn, and turns back to what the multitude of men have passed by. Thus he helps the natural development of all things, and does not dare to act (with an ulterior purpose of his own)."]]],"no":[{"v":[],"l":"hoofdstuk","t":"Dit Hoofdstuk biedt vele moeilijkheden, zodat ik vooruit moet verklaren, niet in te durven staan voor de juistheid van de vertaling op enige punten. Ik zal deze nader aangeven.","t98":"Dit Hoofdstuk biedt vele moeilijkheden, zoodat ik vooruit moet verklaren, niet in te durven staan voor de juistheid van de vertaling op eenige punten. Ik zal deze nader aangeven."},{"v":[1],"l":"1","t":"Ik volg hier, zelf geen rechte versie wetende, Stanislas Julien, in wiens vertaling als letterlijke vertaling der woorden, zoals ik reeds zeide, ik het meest vertrouw, maar ik betwijfel of zij de bedoeling wel weergeeft. Giles, toch ook een eminent sinoloog, heeft: „While times are quiet, it is easy to take action; ere coming troubles have cast their shadows before, it is easy to lay plans”. Men ziet, het scheelt nog al wat!","t98":"Ik volg hier, zelf geen rechte versie wetende, Stanislas Julien, in wiens vertaling als letterlijke vertaling der woorden, zooals ik reeds zeide, ik het meest vertrouw, maar ik betwijfel of zij de bedoeling wel weergeeft. Giles, toch ook een eminent sinoloog, heeft: „While times are quiet, it is easy to take action; ere coming troubles have cast their shadows before, it is easy to lay plans”. Men ziet, het scheelt nog al wat!"},{"v":[2],"l":"2","t":"Als boven. Alexander heeft „It is easier to prevent than to suppress”. De chinese commentaren, die ik bezit, verschillen allen.","t98":"Als boven. Alexander heeft „It is easier to prevent than to suppress”. De chineesche commentaren, die ik bezit, verschillen allen."},{"v":[4],"l":"4","t":"„Doet” hier in den zin als reeds zovele malen, en in de inleiding, door mij aangegeven.","t98":"„Doet” hier in den zin als reeds zoovele malen, en in de inleiding, door mij aangegeven."},{"v":[8],"l":"8","t":"„Daardoor ontkomt hij aan de fouten der mensen”. Dit is op gezag van enige chinese commentators, die ook Julien volgt.—Giles heeft: „And you (hier dus he) will revert to a condition which mankind in general have lost”.","t98":"„Daardoor ontkomt hij aan de fouten der menschen”. Dit is op gezag van eenige chineesche commentators, die ook Julien volgt.—Giles heeft: „And you (hier dus he) will revert to a condition which mankind in general have lost”."}]},{"n":65,"r":"LXV","d":"Teh","zh":["古之善為道者，非以明民，將以愚之。","民之難治，以其智多。","故以智治國，國之賊，不以智治國，國之福。","知此兩者亦稽式。","常知稽式，是謂玄德。","玄德深矣，遠矣，與物反矣，然後乃至大順。"],"nl":[[1,["De Ouden, die Tao betrachtten, gebruikten Het niet om het volk verlicht te maken, maar om het simpel te houden."]],[2,["Het volk is moeilijk te regeren omdat het zoveel weet."]],[3,["Hij, die een rijk regeert door het weten te vermeerderen, is de gesel van het volk; hij die niet met al dat weten het rijk regeert, is het geluk van het volk."]],[4,["Hij die deze beide dingen weet, is ook een voorbeeld (voor het rijk). Altijd een voorbeeld weten te zijn, noem ik de mystieke deugd (hebben). (Deze deugd) is diep, en vèr-reikend, en tegenovergesteld aan de (materiële) dingen!"]],[5,["En daarna komt men tot den groten vrede."]]],"n98":[[1,["De Ouden, die Tao betrachtten, gebruikten Het niet om het volk verlicht te maken, maar om het simpel te houden."]],[2,["Het volk is moeilijk te regeeren omdat het zooveel weet."]],[3,["Hij, die een rijk regeert door het weten te vermeerderen, is de geesel van het volk; hij die niet met al dat weten het rijk regeert, is het geluk van het volk."]],[4,["Hij die deze beide dingen weet, is ook een voorbeeld (voor het rijk). Altijd een voorbeeld weten te zijn, noem ik de mystieke deugd (hebben). (Deze deugd) is diep, en vèr-reikend, en tegenovergesteld aan de (materieele) dingen!"]],[5,["En daarna komt men tot den grooten vrede."]]],"en":[[1,["The ancients who showed their skill in practising the Tao did so, not to enlighten the people, but rather to make them simple and ignorant."]],[2,["The difficulty in governing the people arises from their having much knowledge. He who (tries to) govern a state by his wisdom is a scourge to it; while he who does not (try to) do so is a blessing."]],[3,["He who knows these two things finds in them also his model and rule. Ability to know this model and rule constitutes what we call the mysterious excellence (of a governor). Deep and far-reaching is such mysterious excellence, showing indeed its possessor as opposite to others, but leading them to a great conformity to him."]]],"no":[{"v":[3],"l":"3","t":"Letterlijk staat er: „Hij die met het weten het rijk regeert”.","t98":"Letterlijk staat er: „Hij die met het weten het rijk regeert”."},{"v":[5],"l":"5","t":"Letterlijk staat in plaats van vrede: „gehoorzaamheid, volgzaamheid”.","t98":"Letterlijk staat in plaats van vrede: „gehoorzaamheid, volgzaamheid”."}]},{"n":66,"r":"LXVI","d":"Teh","zh":["江海所以能為百谷王者，以其善下之，故能為百谷王。","是以欲上民，必以言下之。","欲先民，必以身後之。","是以聖人處上而民不重，處前而民不害。","是以天下樂推而不厭，以其不爭，故天下莫能與之爭。"],"nl":[[1,["Waarom kunnen de grote rivieren en zeeën de koningen zijn van alle stromen? Omdat zij zich onder hen weten te houden, daarom kunnen zij de koningen aller stromen zijn."]],[2,["Daarom, als de Wijze superieur wil zijn aan het volk, moet hij in zijn spreken ónder het volk blijven. Als hij voor het volk uit wil staan, moet hij zich op den achtergrond houden."]],[3,["Daardoor staat hij boven allen, en weegt (toch) niet zwaar op het volk, staat hij voor allen uit en kwetst (toch) het volk niet. Daardoor gehoorzaamt het rijk hem met vreugde, en wordt hem niet moede."]],[4,["Omdat hij allen strijd vermijdt is er niemand in het rijk, die met hem strijden kan."]]],"n98":[[1,["Waarom kunnen de groote rivieren en zeeën de koningen zijn van alle stroomen? Omdat zij zich onder hen weten te houden, daarom kunnen zij de koningen aller stroomen zijn."]],[2,["Daarom, als de Wijze superieur wil zijn aan het volk, moet hij in zijn spreken ónder het volk blijven. Als hij voor het volk uit wil staan, moet hij zich op den achtergrond houden."]],[3,["Daardoor staat hij boven allen, en weegt (toch) niet zwaar op het volk, staat hij voor allen uit en kwetst (toch) het volk niet. Daardoor gehoorzaamt het rijk hem met vreugde, en wordt hem niet moede."]],[4,["Omdat hij allen strijd vermijdt is er niemand in het rijk, die met hem strijden kan."]]],"en":[[1,["That whereby the rivers and seas are able to receive the homage and tribute of all the valley streams, is their skill in being lower than they;--it is thus that they are the kings of them all. So it is that the sage (ruler), wishing to be above men, puts himself by his words below them, and, wishing to be before them, places his person behind them."]],[2,["In this way though he has his place above them, men do not feel his weight, nor though he has his place before them, do they feel it an injury to them."]],[3,["Therefore all in the world delight to exalt him and do not weary of him. Because he does not strive, no one finds it possible to strive with him."]]],"no":[]},{"n":67,"r":"LXVII","d":"Teh","zh":["天下皆謂我道大，似不肖。","夫唯大，故似不肖。","若肖，久矣其細也夫！","我有三寶，持而保之。","一曰慈，二曰儉，三曰不敢為天下先。","慈故能勇，儉故能廣，不敢為天下先，故能成器長。","今舍慈且勇，舍儉且廣，舍後且先，死矣！","夫慈以戰則勝，以守則固。","天將救之，以慈衛之。"],"nl":[[1,["Allen in het rijk noemen mij groot, maar ik ben als gedegenereerd. Juist omdát ik groot ben, ben ik als gedegenereerd."]],[2,["Als ik daaraan (d.i. aan groot) gelijk ware.... reeds lang, naar ik meen, weet ik daar het kleine van."]],[3,["Welnu, ik heb drie schatten, die ik vasthoud en in ere houd. De ene heet Liefde. De tweede heet Zuinigheid. De derde heet Nederigheid."]],[4,["Door mijn liefde kan ik dapper zijn, door mijn zuinigheid kan ik veel geven, door mijn nederigheid kan ik de eerste zijn."]],[5,["Tegenwoordig verwerpt men de liefde en is (toch) dapper, verwerpt men de zuinigheid, en geeft (toch) veel uit, en verwerpt men de laatste plaats om (toch) de eerste te zijn.","Dit leidt tot den dood, naar ik meen."]],[6,["Welnu, als men strijdt vervuld van liefde, overwint men, en als men iets verdedigt vervuld van liefde, zal men het behouden."]],[7,["De Hemel schenkt de gave van liefde aan hem, dien zij beschermen wil."]]],"n98":[[1,["Allen in het rijk noemen mij groot, maar ik ben als gedegenereerd. Juist omdát ik groot ben, ben ik als gedegenereerd."]],[2,["Als ik daaraan (d.i. aan groot) gelijk ware.... reeds lang, naar ik meen, weet ik daar het kleine van."]],[3,["Welnu, ik heb drie schatten, die ik vasthoud en in eere houd. De eene heet Liefde. De tweede heet Zuinigheid. De derde heet Nederigheid."]],[4,["Door mijn liefde kan ik dapper zijn, door mijn zuinigheid kan ik veel geven, door mijn nederigheid kan ik de eerste zijn."]],[5,["Tegenwoordig verwerpt men de liefde en is (toch) dapper, verwerpt men de zuinigheid, en geeft (toch) veel uit, en verwerpt men de laatste plaats om (toch) de eerste te zijn.","Dit leidt tot den dood, naar ik meen."]],[6,["Welnu, als men strijdt vervuld van liefde, overwint men, en als men iets verdedigt vervuld van liefde, zal men het behouden."]],[7,["De Hemel schenkt de gave van liefde aan hem, dien zij beschermen wil."]]],"en":[[1,["All the world says that, while my Tao is great, it yet appears to be inferior (to other systems of teaching). Now it is just its greatness that makes it seem to be inferior. If it were like any other (system), for long would its smallness have been known!"]],[2,["But I have three precious things which I prize and hold fast. The first is gentleness; the second is economy; and the third is shrinking from taking precedence of others."]],[3,["With that gentleness I can be bold; with that economy I can be liberal; shrinking from taking precedence of others, I can become a vessel of the highest honour. Now-a-days they give up gentleness and are all for being bold; economy, and are all for being liberal; the hindmost place, and seek only to be foremost;--(of all which the end is) death."]],[4,["Gentleness is sure to be victorious even in battle, and firmly to maintain its ground. Heaven will save its possessor, by his (very) gentleness protecting him."]]],"no":[{"v":[1],"l":"1","t":"De bedoeling van deze in ’t hollands moeilijk weer te geven woordspelingen (siao is n.l. zowel „gelijk als” als „klein” en met „niet” er voor „gedegenereerd”) is blijkbaar, dat indien men iemand groot noemt, en hij zich groot vindt, hij al niet groot meer is. Het is dan niet Wu Wei meer. Zie ook Hfdst. II.","t98":"De bedoeling van deze in ’t hollandsch moeilijk weer te geven woordspelingen (siao is n.l. zoowel „gelijk als” als „klein” en met „niet” er voor „gedegenereerd”) is blijkbaar, dat indien men iemand groot noemt, en hij zich groot vindt, hij al niet groot meer is. Het is dan niet Wu Wei meer. Zie ook Hfdst. II."},{"v":[3],"l":"3","t":"Er staat niet in het chinees „nederigheid” maar omschreven: „niet durven de eerste in het rijk zijn”.","t98":"Er staat niet in het chineesch „nederigheid” maar omschreven: „niet durven de eerste in het rijk zijn”."},{"v":[6],"l":"6","t":"Letterlijk staat er: „Als men strijdt met liefde”.","t98":"Letterlijk staat er: „Als men strijdt met liefde”."}]},{"n":68,"r":"LXVIII","d":"Teh","zh":["善為士者不武，善戰者不怒，善勝敵者不與，善用人者為之下，是謂不爭之德，是謂用人之力，是謂配天古之極。"],"nl":[[1,["Hij, die een goed veldheer is, is niet krijgszuchtig. Hij, die een goed strijder is, is niet toornig. Hij, die een goed overwinnaar is, worstelt niet. Hij, die goed mensen (weet te) gebruiken, stelt zich onder hen."]],[2,["Dit noem ik de deugd die niet strijdt. Dit noem ik de kracht die de mensen weet te gebruiken. Dit noem ik met den Hemel samen één zijn."]],[3,["Dit was het opperste, waartoe de Ouden kwamen."]]],"n98":[[1,["Hij, die een goed veldheer is, is niet krijgszuchtig. Hij, die een goed strijder is, is niet toornig. Hij, die een goed overwinnaar is, worstelt niet. Hij, die goed menschen (weet te) gebruiken, stelt zich onder hen."]],[2,["Dit noem ik de deugd die niet strijdt. Dit noem ik de kracht die de menschen weet te gebruiken. Dit noem ik met den Hemel samen één zijn."]],[3,["Dit was het opperste, waartoe de Ouden kwamen."]]],"en":[[1,["He who in (Tao's) wars has skill\nAssumes no martial port;\nHe who fights with most good will\nTo rage makes no resort.\nHe who vanquishes yet still\nKeeps from his foes apart;\nHe whose hests men most fulfil\nYet humbly plies his art.","Thus we say, 'He ne'er contends,\nAnd therein is his might.'\nThus we say, 'Men's wills he bends,\nThat they with him unite.'\nThus we say, 'Like Heaven's his ends,\nNo sage of old more bright.'"]]],"no":[]},{"n":69,"r":"LXIX","d":"Teh","zh":["用兵有言：「吾不敢為主而為客，不敢進寸而退尺。","」是謂行無行，攘無臂，扔無敵，執無兵。","禍莫大於輕敵，輕敵幾喪吾寶。","故抗兵相加，哀者勝矣。"],"nl":[[1,["Een veldheer zeide eens: Ik durf niet gastheer te zijn (d.i. aan te vallen); ik ben liever gast (d.i. defensief). Ik durf geen duim vooruit te gaan; ik ga liever een voet terug."]],[2,["Dit noem ik vorderingen maken zonder vooruit te gaan, terugslaan zonder de armen uit te strekken, vervolgen zonder dat er een vijand is, grijpen zonder wapenen."]],[3,["Er is geen groter ramp dan den vijand (te) gering te achten. Den vijand gering te achten is bijna onzen schat verliezen."]],[4,["Als twee legers van gelijke kracht strijden, overwint dat leger dat de liefde heeft."]]],"n98":[[1,["Een veldheer zeide eens: Ik durf niet gastheer te zijn (d.i. aan te vallen); ik ben liever gast (d.i. defensief). Ik durf geen duim vooruit te gaan; ik ga liever een voet terug."]],[2,["Dit noem ik vorderingen maken zonder vooruit te gaan, terugslaan zonder de armen uit te strekken, vervolgen zonder dat er een vijand is, grijpen zonder wapenen."]],[3,["Er is geen grooter ramp dan den vijand (te) gering te achten. Den vijand gering te achten is bijna onzen schat verliezen."]],[4,["Als twee legers van gelijke kracht strijden, overwint dat leger dat de liefde heeft."]]],"en":[[1,["A master of the art of war has said, 'I do not dare to be the host (to commence the war); I prefer to be the guest (to act on the defensive). I do not dare to advance an inch; I prefer to retire a foot.' This is called marshalling the ranks where there are no ranks; baring the arms (to fight) where there are no arms to bare; grasping the weapon where there is no weapon to grasp; advancing against the enemy where there is no enemy."]],[2,["There is no calamity greater than lightly engaging in war. To do that is near losing (the gentleness) which is so precious. Thus it is that when opposing weapons are (actually) crossed, he who deplores (the situation) conquers."]]],"no":[{"v":[2],"l":"2","t":"Letterlijk staat er: „Gaan zonder te gaan”. Mijn commentator Peh Yü Shen merkt hier terecht op dat deze tekst niets dan een illustratie is van „Wu Wei”, van „werken aan géén werk”, enz.","t98":"Letterlijk staat er: „Gaan zonder te gaan”. Mijn commentator Peh Yü Shen merkt hier terecht op dat deze tekst niets dan eene illustratie is van „Wu Wei”, van „werken aan géén werk”, enz."},{"v":[4],"l":"4","t":"„De liefde” hier vooral als het „medelijden”, meen ik. Anderen zien er in „de liefde voor het vaderland”.","t98":"„De liefde” hier vooral als het „medelijden”, meen ik. Anderen zien er in „de liefde voor het vaderland”."}]},{"n":70,"r":"LXX","d":"Teh","zh":["吾言甚易知，甚易行。","天下莫能知，莫能行。","言有宗，事有君。","夫唯無知，是以不我知。","知我者希，則我者貴。","是以聖人被褐懷玉。"],"nl":[[1,["Mijne woorden zijn heel gemakkelijk te begrijpen, heel gemakkelijk te betrachten. Maar niemand in het rijk kan ze begrijpen, noch ze betrachten."]],[2,["Mijne woorden hebben een’ Oorsprong, mijne daden hebben een’ Meester (Tao). Maar de mensen weten dat niet, en daarom begrijpen ze mij niet."]],[3,["Zij, die mij kennen, zijn zeldzaam. Dat is (juist) mijne eerwaardigheid, naar ik meen."]],[4,["Daarom, de Wijze trekt grove wollen klederen aan, en verbergt zijn edelstenen in zijn boezem."]]],"n98":[[1,["Mijne woorden zijn heel gemakkelijk te begrijpen, heel gemakkelijk te betrachten. Maar niemand in het rijk kan ze begrijpen, noch ze betrachten."]],[2,["Mijne woorden hebben een’ Oorsprong, mijne daden hebben een’ Meester (Tao). Maar de menschen weten dat niet, en daarom begrijpen ze mij niet."]],[3,["Zij, die mij kennen, zijn zeldzaam. Dat is (juist) mijne eerwaardigheid, naar ik meen."]],[4,["Daarom, de Wijze trekt grove wollen kleederen aan, en verbergt zijn edelsteenen in zijn boezem."]]],"en":[[1,["My words are very easy to know, and very easy to practise; but there is no one in the world who is able to know and able to practise them."]],[2,["There is an originating and all-comprehending (principle) in my words, and an authoritative law for the things (which I enforce). It is because they do not know these, that men do not know me."]],[3,["They who know me are few, and I am on that account (the more) to be prized. It is thus that the sage wears (a poor garb of) hair cloth, while he carries his (signet of) jade in his bosom."]]],"no":[]},{"n":71,"r":"LXXI","d":"Teh","zh":["知不知上，不知知病。","夫唯病病，是以不病。","聖人不病，以其病病，是以不病。"],"nl":[[1,["Te weten dat wij niet weten is superieur. Niet te weten en denken te weten is de ziekte der mensen."]],[2,["Als men om deze ziekte lijdt zal men haar ontkomen."]],[3,["De Wijze heeft deze ziekte niet, (juist) omdat hij er het lijden van weet. Dáárom is hij er niet ziek van."]]],"n98":[[1,["Te weten dat wij niet weten is superieur. Niet te weten en denken te weten is de ziekte der menschen."]],[2,["Als men om deze ziekte lijdt zal men haar ontkomen."]],[3,["De Wijze heeft deze ziekte niet, (juist) omdat hij er het lijden van weet. Dáárom is hij er niet ziek van."]]],"en":[[1,["To know and yet (think) we do not know is the highest (attainment); not to know (and yet think) we do know is a disease."]],[2,["It is simply by being pained at (the thought of) having this disease that we are preserved from it. The sage has not the disease. He knows the pain that would be inseparable from it, and therefore he does not have it."]]],"no":[{"v":[],"l":"hoofdstuk","t":"De eigenaardige woordspeling, met het achtmaal in dit korte hoofdstukje voorkomende karakter „ping”, dat zowel „ziekte” als „ziek zijn” betekent, en hier zelfs ook „lijden door de ziekte”, gaat natuurlijk in de vertaling geheel verloren. De bedoeling blijft echter, hoop ik, duidelijk genoeg. Ik ben strikt getrouw aan den tekst gebleven, waarin staat: „weten niet weten (is) superieur”. Anderen vertalen: „te weten, maar te doen alsof men niet weet is superieur”. Maar het eerste is veel mooier en juister, en waar het bovendien precies accuraat den tekst weergeeft, vond ik het verre te verkiezen.","t98":"De eigenaardige woordspeling, met het achtmaal in dit korte hoofdstukje voorkomende karakter „ping”, dat zoowel „ziekte” als „ziek zijn” beteekent, en hier zelfs ook „lijden door de ziekte”, gaat natuurlijk in de vertaling geheel verloren. De bedoeling blijft echter, hoop ik, duidelijk genoeg. Ik ben strikt getrouw aan den tekst gebleven, waarin staat: „weten niet weten (is) superieur”. Anderen vertalen: „te weten, maar te doen alsof men niet weet is superieur”. Maar het eerste is veel mooier en juister, en waar het bovendien precies accuraat den tekst weergeeft, vond ik het verre te verkiezen."}]},{"n":72,"r":"LXXII","d":"Teh","zh":["民不畏威，則大威至。","無狎其所居，無厭其所生。","夫唯不厭，是以不厭。","是以聖人自知不自見，自愛不自貴；故去彼取此。"],"nl":[[1,["Als het volk niet vreest wat te vrezen is, zal dat, wat te vrezen is, tot hem komen."]],[2,["Vindt uwe woning niet te nauw, walg niet van uw levenslot."]],[3,["Nu, ik walg niet van het mijne, daarom boezemt het mij geen walging in."]],[4,["Daarom, de Wijze kent zichzelf, maar zonder gezien te willen worden; hij heeft zich zelf lief, maar zonder zich hoog te stellen. Hij verwerpt het ene, en langt naar het andere."]]],"n98":[[1,["Als het volk niet vreest wat te vreezen is, zal dat, wat te vreezen is, tot hem komen."]],[2,["Vindt uwe woning niet te nauw, walg niet van uw levenslot."]],[3,["Nu, ik walg niet van het mijne, daarom boezemt het mij geen walging in."]],[4,["Daarom, de Wijze kent zichzelf, maar zonder gezien te willen worden; hij heeft zich zelf lief, maar zonder zich hoog te stellen. Hij verwerpt het eene, en langt naar het andere."]]],"en":[[1,["When the people do not fear what they ought to fear, that which is their great dread will come on them."]],[2,["Let them not thoughtlessly indulge themselves in their ordinary life; let them not act as if weary of what that life depends on."]],[3,["It is by avoiding such indulgence that such weariness does not arise."]],[4,["Therefore the sage knows (these things) of himself, but does not parade (his knowledge); loves, but does not (appear to set a) value on, himself. And thus he puts the latter alternative away and makes choice of the former."]]],"no":[{"v":[1],"l":"1","t":"„Dat wat te vrezen is”, is hier: „de dood”.","t98":"„Dat wat te vreezen is”, is hier: „de dood”."},{"v":[4],"l":"4","t":"„Het ene” is hier: „zelf gezien willen worden”, het andere „zich zelf kennen”. Zo ook met het tweede.","t98":"„Het eene” is hier: „zelf gezien willen worden”, het andere „zich zelf kennen”. Zoo ook met het tweede."}]},{"n":73,"r":"LXXIII","d":"Teh","zh":["勇於敢則殺，勇於不敢則活。","此兩者，或利或害。","天之所惡，孰知其故？","是以聖人猶難之。","天之道，不爭而善勝，不言而善應，不召而自來，繟然而善謀。","天網恢恢，疏而不失。"],"nl":[[1,["Hij, die zijn moed aanwendt om te durven, vindt den dood, maar hij, die moed (genoeg) heeft om niet te durven, zal leven."]],[2,["Van deze twee dingen is het ene nuttig, het andere schadelijk."]],[3,["Wie weet de reden als de Hemel iets haat?"]],[4,["Daarom, de Wijze is alsof hij alles moeilijk vindt."]],[5,["De Tao van den Hemel is niet te strijden en (toch) goed te overwinnen, niet te spreken, en (toch) goed geantwoord te worden, niet op te roepen en (toch) de mensen vanzelf te doen komen."]],[6,["Hij lijkt stil, maar maakt goed plannen."]],[7,["Het net van den Hemel is (eindeloos) groot; zijn mazen zijn ver van elkaar, maar niemand ontsnapt er aan."]]],"n98":[[1,["Hij, die zijn moed aanwendt om te durven, vindt den dood, maar hij, die moed (genoeg) heeft om niet te durven, zal leven."]],[2,["Van deze twee dingen is het eene nuttig, het andere schadelijk."]],[3,["Wie weet de reden als de Hemel iets haat?"]],[4,["Daarom, de Wijze is alsof hij alles moeilijk vindt."]],[5,["De Tao van den Hemel is niet te strijden en (toch) goed te overwinnen, niet te spreken, en (toch) goed geantwoord te worden, niet op te roepen en (toch) de menschen vanzelf te doen komen."]],[6,["Hij lijkt stil, maar maakt goed plannen."]],[7,["Het net van den Hemel is (eindeloos) groot; zijn mazen zijn ver van elkaar, maar niemand ontsnapt er aan."]]],"en":[[1,["He whose boldness appears in his daring (to do wrong, in defiance of the laws) is put to death; he whose boldness appears in his not daring (to do so) lives on. Of these two cases the one appears to be advantageous, and the other to be injurious. But","When Heaven's anger smites a man,\nWho the cause shall truly scan?","On this account the sage feels a difficulty (as to what to do in the former case)."]],[2,["It is the way of Heaven not to strive, and yet it skilfully overcomes; not to speak, and yet it is skilful in obtaining a reply; does not call, and yet men come to it of themselves. Its demonstrations are quiet, and yet its plans are skilful and effective. The meshes of the net of Heaven are large; far apart, but letting nothing escape."]]],"no":[{"v":[1],"l":"1","t":"Als een bewijs hoe weinig in ’t chinees letterlijke accuratesse van vertaling er toe doet, diene de volgende vertaling van Alexander: „He, whose courage amounts to rashness, will lose his life, but he in whom it is tempered with discretion, will save it”. Mijne vertaling is getrouwer aan den tekst, maar de bedoeling blijkt dezelfde.","t98":"Als een bewijs hoe weinig in ’t chineesch letterlijke accuratesse van vertaling er toe doet, diene de volgende vertaling van Alexander: „He, whose courage amounts to rashness, will lose his life, but he in whom it is tempered with discretion, will save it”. Mijne vertaling is getrouwer aan den tekst, maar de bedoeling blijkt dezelfde."},{"v":[3],"l":"3","t":"Het verband is mij hier niet duidelijk.","t98":"Het verband is mij hier niet duidelijk."},{"v":[4],"l":"4","t":"Hetzelfde geldt voor dezen tekst, waarin ik alleen analogie vind met Hfdst. LXIII.","t98":"Hetzelfde geldt voor dezen tekst, waarin ik alleen analogie vind met Hfdst. LXIII."},{"v":[5],"l":"5","t":"M.a.w.: De Tao van den Hemel is Wu Wei. Het „geantwoord” is hier ook „gehoorzaamd”.","t98":"M.a.w.: De Tao van den Hemel is Wu Wei. Het „geantwoord” is hier ook „gehoorzaamd”."},{"v":[6],"l":"6","t":"„Hij” is hier „de Hemel”; „tʼan” is hier stil, rustig, dus in dezen zin als niets doend, bijna lui.","t98":"„Hij” is hier „de Hemel”; „tʼan” is hier stil, rustig, dus in dezen zin als niets doend, bijna lui."}]},{"n":74,"r":"LXXIV","d":"Teh","zh":["民不畏死，奈何以死懼之？","若使民常畏死，而為奇者，吾得執而殺之，孰敢？","常有司殺者殺，夫代司殺者殺，是謂代大匠斲。","夫代大匠斲者，希有不傷其手矣。"],"nl":[[1,["Als het volk den dood niet vreest, hoe het dan schrik aan te jagen met den dood?"]],[2,["Als het volk voortdurend den dood vreesde, en er waren slechten, dan zou ik die grijpen en ter dood brengen, en wie zou dan nog durven?"]],[3,["Er is altijd een Opperrechter om den doodstraf op te leggen. Hij, die in plaats van dien Opperrechter wil doden, is als een, die in plaats van den timmerman hout gaat kappen."]],[4,["Onder hen, die in plaats van den timmerman hout gaan kappen, zijn er maar weinigen, die niet hun vingers snijden."]]],"n98":[[1,["Als het volk den dood niet vreest, hoe het dan schrik aan te jagen met den dood?"]],[2,["Als het volk voortdurend den dood vreesde, en er waren slechten, dan zou ik die grijpen en ter dood brengen, en wie zou dan nog durven?"]],[3,["Er is altijd een Opperrechter om den doodstraf op te leggen. Hij, die in plaats van dien Opperrechter wil dooden, is als een, die in plaats van den timmerman hout gaat kappen."]],[4,["Onder hen, die in plaats van den timmerman hout gaan kappen, zijn er maar weinigen, die niet hun vingers snijden."]]],"en":[[1,["The people do not fear death; to what purpose is it to (try to) frighten them with death? If the people were always in awe of death, and I could always seize those who do wrong, and put them to death, who would dare to do wrong?"]],[2,["There is always One who presides over the infliction of death. He who would inflict death in the room of him who so presides over it may be described as hewing wood instead of a great carpenter. Seldom is it that he who undertakes the hewing, instead of the great carpenter, does not cut his own hands!"]]],"no":[{"v":[1,2],"l":"1 en 2","t":"Lao Tszʼ wilde zeggen dat hoe strenger en wreder het gouvernement met doodstraffen optreedt, hoe meer misdadigers er juist zullen zijn, en hoe minder het volk den dood zal gaan vrezen.","t98":"Lao Tszʼ wilde zeggen dat hoe strenger en wreeder het gouvernement met doodstraffen optreedt, hoe meer misdadigers er juist zullen zijn, en hoe minder het volk den dood zal gaan vreezen."},{"v":[3],"l":"3","t":"Alleen de Opperrechter, hier de Hemel (men vergete hierbij niet dat de Keizer is de Zon des Hemels) mag doden, dus alleen een werkelijk goed en rechtvaardig gouvernement of Keizer. Zij, die de regering usurperen en woest met de onderdanen te werk gaan, zullen zichzelf snijden, d.i. ten onder brengen.","t98":"Alleen de Opperrechter, hier de Hemel (men vergete hierbij niet dat de Keizer is de Zoon des Hemels) mag dooden, dus alleen een werkelijk goed en rechtvaardig gouvernement of Keizer. Zij, die de regeering usurpeeren en woest met de onderdanen te werk gaan, zullen zichzelf snijden, d.i. ten onder brengen."},{"v":[4],"l":"4","t":"Hoe ongelofelijk het ook moge klinken van enkele geleerden, waaronder zelfs de gewezen zendeling, later prof. Legge, hebben zij uit deze eenvoudige vergelijking van een timmerman alweer den christelijken God ontdekt, n.l. den groten Architect (timmerman) van het Heelal!!!","t98":"Hoe ongeloofelijk het ook moge klinken van enkele geleerden, waaronder zelfs de gewezen zendeling, later prof. Legge, hebben zij uit deze eenvoudige vergelijking van een timmerman alweer den christelijken God ontdekt, n.l. den grooten Architect (timmerman) van het Heelal!!!"}]},{"n":75,"r":"LXXV","d":"Teh","zh":["民之饑，以其上食稅之多，是以饑。","民之難治，以其上之有為，是以難治。","民之輕死，以其上求生之厚，是以輕死。","夫唯無以生為者，是賢於貴生。"],"nl":[[1,["Het volk heeft honger, omdat zijn vorst veel belastingen heft. Dáárom heeft het honger. Het volk is moeilijk te regeren, omdat zijn Heer (te veel) doet. Dáárom is het moeilijk te regeren. Het volk schat den dood gering, omdat het te intens zoekt te leven."]],[2,["Maar hij, die niets doet om te leven, is wijzer dan hij die het leven (bovenmatig) hoogschat."]]],"n98":[[1,["Het volk heeft honger, omdat zijn vorst veel belastingen heft. Dáárom heeft het honger. Het volk is moeilijk te regeeren, omdat zijn Heer (te veel) doet. Dáárom is het moeilijk te regeeren. Het volk schat den dood gering, omdat het te intens zoekt te leven."]],[2,["Maar hij, die niets doet om te leven, is wijzer dan hij die het leven (bovenmatig) hoogschat."]]],"en":[[1,["The people suffer from famine because of the multitude of taxes consumed by their superiors. It is through this that they suffer famine."]],[2,["The people are difficult to govern because of the (excessive) agency of their superiors (in governing them). It is through this that they are difficult to govern."]],[3,["The people make light of dying because of the greatness of their labours in seeking for the means of living. It is this which makes them think light of dying. Thus it is that to leave the subject of living altogether out of view is better than to set a high value on it."]]],"no":[]},{"n":76,"r":"LXXVI","d":"Teh","zh":["人之生也柔弱，其死也堅強。","萬物草木之生也柔脆，其死也枯槁。","故堅強者死之徒，柔弱者生之徒。","是以兵強則不勝，木強則兵。","強大處下，柔弱處上。"],"nl":[[1,["Als de mens geboren wordt is hij zacht en zwak, als hij sterft is hij stijf en sterk. Als het gras en de bomen geboren worden zijn zij soepel en teer, als zij sterven zijn zij droog en schraal."]],[2,["Stijfheid en sterkte zijn de volgelingen van den dood, zachtheid en zwakheid zijn de volgelingen van het leven."]],[3,["Daarom, als een leger sterk is overwint het niet, als de boom sterk is wordt hij omgehakt."]],[4,["Wat sterk en groot is, is inferieur, wat zacht en zwak is, is superieur."]]],"n98":[[1,["Als de mensch geboren wordt is hij zacht en zwak, als hij sterft is hij stijf en sterk. Als het gras en de boomen geboren worden zijn zij soepel en teêr, als zij sterven zijn zij droog en schraal."]],[2,["Stijfheid en sterkte zijn de volgelingen van den dood, zachtheid en zwakheid zijn de volgelingen van het leven."]],[3,["Daarom, als een leger sterk is overwint het niet, als de boom sterk is wordt hij omgehakt."]],[4,["Wat sterk en groot is, is inferieur, wat zacht en zwak is, is superieur."]]],"en":[[1,["Man at his birth is supple and weak; at his death, firm and strong. (So it is with) all things. Trees and plants, in their early growth, are soft and brittle; at their death, dry and withered."]],[2,["Thus it is that firmness and strength are the concomitants of death; softness and weakness, the concomitants of life."]],[3,["Hence he who (relies on) the strength of his forces does not conquer; and a tree which is strong will fill the out-stretched arms, (and thereby invites the feller.)"]],[4,["Therefore the place of what is firm and strong is below, and that of what is soft and weak is above."]]],"no":[]},{"n":77,"r":"LXXVII","d":"Teh","zh":["天之道，其猶張弓與？","高者抑之，下者舉之；有餘者損之，不足者補之。","天之道，損有餘而補不足。","人之道則不然，損不足以奉有餘。","孰能有餘以奉天下？","唯有道者。","是以聖人為而不恃，功成而不處，其不欲見賢。"],"nl":[[1,["De Tao van den Hemel is als het spannen van een boog, dat het hoge naar de laagte brengt, en het lage verheft, dat afneemt van wat te veel, en toevoegt aan wat te weinig is."]],[2,["De Tao van den Hemel is om af te nemen van wat te veel, om toe te voegen aan wat te weinig is."]],[3,["Maar de Tao van de mensen is om af te nemen van wie (al) niet genoeg hebben, en toe te voegen aan wie (al) te veel hebben."]],[4,["Wie is in staat om wat hij over heeft aan de wereld te schenken? Alleen hij, die Tao heeft."]],[5,["Daarom, de Wijze doet (goed) maar steunt er niet op; als zijn werk volbracht is hecht hij er zich niet aan, en hij wenst niet zijn eigen eerwaardigheid te doen uitkomen."]]],"n98":[[1,["De Tao van den Hemel is als het spannen van een boog, dat het hooge naar de laagte brengt, en het lage verheft, dat afneemt van wat te veel, en toevoegt aan wat te weinig is."]],[2,["De Tao van den Hemel is om af te nemen van wat te veel, om toe te voegen aan wat te weinig is."]],[3,["Maar de Tao van de menschen is om af te nemen van wie (al) niet genoeg hebben, en toe te voegen aan wie (al) te veel hebben."]],[4,["Wie is in staat om wat hij over heeft aan de wereld te schenken? Alleen hij, die Tao heeft."]],[5,["Daarom, de Wijze doet (goed) maar steunt er niet op; als zijn werk volbracht is hecht hij er zich niet aan, en hij wenscht niet zijn eigen eerwaardigheid te doen uitkomen."]]],"en":[[1,["May not the Way (or Tao) of Heaven be compared to the (method of) bending a bow? The (part of the bow) which was high is brought low, and what was low is raised up. (So Heaven) diminishes where there is superabundance, and supplements where there is deficiency."]],[2,["It is the Way of Heaven to diminish superabundance, and to supplement deficiency. It is not so with the way of man. He takes away from those who have not enough to add to his own superabundance."]],[3,["Who can take his own superabundance and therewith serve all under heaven? Only he who is in possession of the Tao!"]],[4,["Therefore the (ruling) sage acts without claiming the results as his; he achieves his merit and does not rest (arrogantly) in it:--he does not wish to display his superiority."]]],"no":[{"v":[1],"l":"1","t":"Als de chinese boogschutter zijn boog spant, heft hij het benedenste eind op en brengt hij het bovenste eind naar de laagte, en hij neemt zijn afstand door de hoogte van den boog minder of groter te maken naarmate het doel lager of hoger is.","t98":"Als de chineesche boogschutter zijn boog spant, heft hij het benedenste eind op en brengt hij het bovenste eind naar de laagte, en hij neemt zijn afstand door de hoogte van den boog minder of grooter te maken naarmate het doel lager of hooger is."},{"v":[2],"l":"2","t":"In 2 en 3 is hier Tao weer meer de weg, de manier van doen.","t98":"In 2 en 3 is hier Tao weer meer de weg, de manier van doen."}]},{"n":78,"r":"LXXVIII","d":"Teh","zh":["天下莫柔弱於水，而攻堅強者，莫之能勝，其無以易之。","弱之勝強，柔之勝剛，天下莫不知莫能行。","是以聖人云：「受國之垢，是謂社稷主；受國不祥，是為天下王。","」正言若反。"],"nl":[[1,["Niets in de wereld is zachter en zwakker dan het water, en toch is er niets, dat het overtreft in het breken van wat hard is. Daarom is er niets, dat water evenaart. Het zachte overwint het harde, het zwakke overwint het sterke."]],[2,["Er is niemand in de wereld, die dit niet weet, maar niemand kan het in toepassing brengen."]],[3,["Daarom zegt de Wijze: Hij, die de schande van het rijk op zich nemen kan, is (geschikt om) Heer van het rijk (te zijn); hij, die de rampen van het rijk op zich nemen kan, is (geschikt om) koning van het rijk te zijn."]],[4,["Dit zijn ware woorden, die contradicties schijnen."]]],"n98":[[1,["Niets in de wereld is zachter en zwakker dan het water, en toch is er niets, dat het overtreft in het breken van wat hard is. Daarom is er niets, dat water evenaart. Het zachte overwint het harde, het zwakke overwint het sterke."]],[2,["Er is niemand in de wereld, die dit niet weet, maar niemand kan het in toepassing brengen."]],[3,["Daarom zegt de Wijze: Hij, die de schande van het rijk op zich nemen kan, is (geschikt om) Heer van het rijk (te zijn); hij, die de rampen van het rijk op zich nemen kan, is (geschikt om) koning van het rijk te zijn."]],[4,["Dit zijn ware woorden, die contradicties schijnen."]]],"en":[[1,["There is nothing in the world more soft and weak than water, and yet for attacking things that are firm and strong there is nothing that can take precedence of it;--for there is nothing (so effectual) for which it can be changed."]],[2,["Every one in the world knows that the soft overcomes the hard, and the weak the strong, but no one is able to carry it out in practice."]],[3,["Therefore a sage has said,\n'He who accepts his state's reproach,\nIs hailed therefore its altars' lord;\nTo him who bears men's direful woes\nThey all the name of King accord.'"]],[4,["Words that are strictly true seem to be paradoxical."]]],"no":[{"v":[1],"l":"1","t":"Letterlijk staat er: „Daarom is er niets, dat het water kan vervangen”.","t98":"Letterlijk staat er: „Daarom is er niets, dat het water kan vervangen”."},{"v":[3],"l":"3","t":"Alleen de zachte en zwakke kan die schande en die rampen verduren zonder morren en beklag.","t98":"Alleen de zachte en zwakke kan die schande en die rampen verduren zonder morren en beklag."},{"v":[4],"l":"4","t":"Want de meeste mensen denken dat iemand een laag, verachtelijk karakter moet hebben, om te verduren zonder in woede op te vliegen.","t98":"Want de meeste menschen denken dat iemand een laag, verachtelijk karakter moet hebben, om te verduren zonder in woede op te vliegen."}]},{"n":79,"r":"LXXIX","d":"Teh","zh":["和大怨，必有餘怨，安可以為善？","是以聖人執左契，而不責於人。","有德司契，無德司徹。","天道無親，常與善人。"],"nl":[[1,["Als een grote twist beslecht is, blijft er stellig (altijd) nog wat vijandigheid over. De kwestie is, hoe dit nu goed te maken."]],[2,["Daarom, de Wijze bewaart de linkerzijde van het contract, en eischt niets van de anderen."]],[3,["Wie deugd heeft zorgt voor geven, wie geen deugd heeft zorgt voor eischen."]],[4,["De hemelse Tao heeft geen lievelingen, maar is toch altijd mild voor de goeden."]]],"n98":[[1,["Als een groote twist beslecht is, blijft er stellig (altijd) nog wat vijandigheid over. De kwestie is, hoe dit nu goed te maken."]],[2,["Daarom, de Wijze bewaart de linkerzijde van het contract, en eischt niets van de anderen."]],[3,["Wie deugd heeft zorgt voor geven, wie geen deugd heeft zorgt voor eischen."]],[4,["De hemelsche Tao heeft geen lievelingen, maar is toch altijd mild voor de goeden."]]],"en":[[1,["When a reconciliation is effected (between two parties) after a great animosity, there is sure to be a grudge remaining (in the mind of the one who was wrong). And how can this be beneficial (to the other)?"]],[2,["Therefore (to guard against this), the sage keeps the left-hand portion of the record of the engagement, and does not insist on the (speedy) fulfilment of it by the other party. (So), he who has the attributes (of the Tao) regards (only) the conditions of the engagement, while he who has not those attributes regards only the conditions favourable to himself."]],[3,["In the Way of Heaven, there is no partiality of love; it is always on the side of the good man."]]],"no":[{"v":[2],"l":"2","t":"Letterlijk staat er niet „contract” maar „tablet”. In den ouden tijd werden de contracten geschreven op houten tabletten, die in twee delen waren verdeeld. Hij, die de zaak, waarover gecontracteerd was, moest geven, behield de linkerzijde van de tablet, hij die haar had te eischen, behield de rechterzijde. Later, bij eventuele geschillen, moesten de twee helften, die gekarteld of getand waren, weer precies in elkaar passen, als de echtheid van het contract moest bewezen worden (Pue Yeou Thsing, Julien).","t98":"Letterlijk staat er niet „contract” maar „tablet”. In den ouden tijd werden de contracten geschreven op houten tabletten, die in twee deelen waren verdeeld. Hij, die de zaak, waarover gecontracteerd was, moest geven, behield de linkerzijde van de tablet, hij die haar had te eischen, behield de rechterzijde. Later, bij eventueele geschillen, moesten de twee helften, die gekarteld of getand waren, weer precies in elkaar passen, als de echtheid van het contract moest bewezen worden (Pue Yeou Thsing, Julien)."},{"v":[3],"l":"3","t":"Letterlijk staat er voor „eischen”: „belasting heffen”.","t98":"Letterlijk staat er voor „eischen”: „belasting heffen”."}]},{"n":80,"r":"LXXX","d":"Teh","zh":["小國寡民，使有什伯之器而不用，使民重死而不遠徙。","雖有舟輿，無所乘之；雖有甲兵，無所陳之。","使人復結繩而用之，甘其食，美其服，安其居，樂其俗。","鄰國相望，雞犬之聲相聞，民至老死，不相往來。"],"nl":[[1,["Als ik over een kleinen staat regeerde met een weinig volk zou ik, al waren er wapenen voor tientallen of honderdtallen, die (toch) niet gebruiken."]],[2,["Ik zou maken, dat het volk den dood vreesde, en niet emigreerde."]],[3,["Al waren er schepen en wagenen, men zou er niet ingaan.","Al waren er kurassen en wapenen, men zou ze niet aandoen."]],[4,["Ik zou maken dat het volk terugkeerde tot het gebruik der geknoopte koorden."]],[5,["Het volk zou zoet genieten van zijn eten, zou zijn klederen mooi maken, rust hebben in zijn woning, en vreugde scheppen in zijn simpele zeden."]],[6,["Al lag een naburige staat vlak over den mijnen, zodat de honden en hanen aan weerszijden elkanders geluid konden horen, mijn volk zou oud worden en sterven zonder er gemeenschap mede te hebben gehad."]]],"n98":[[1,["Als ik over een kleinen staat regeerde met een weinig volk zou ik, al waren er wapenen voor tientallen of honderdtallen, die (toch) niet gebruiken."]],[2,["Ik zou maken, dat het volk den dood vreesde, en niet emigreerde."]],[3,["Al waren er schepen en wagenen, men zou er niet ingaan.","Al waren er kurassen en wapenen, men zou ze niet aandoen."]],[4,["Ik zou maken dat het volk terugkeerde tot het gebruik der geknoopte koorden."]],[5,["Het volk zou zoet genieten van zijn eten, zou zijn kleederen mooi maken, rust hebben in zijn woning, en vreugde scheppen in zijn simpele zeden."]],[6,["Al lag een naburige staat vlak over den mijnen, zoodat de honden en hanen aan weerszijden elkanders geluid konden hooren, mijn volk zou oud worden en sterven zonder er gemeenschap mede te hebben gehad."]]],"en":[[1,["In a little state with a small population, I would so order it, that, though there were individuals with the abilities of ten or a hundred men, there should be no employment of them; I would make the people, while looking on death as a grievous thing, yet not remove elsewhere (to avoid it)."]],[2,["Though they had boats and carriages, they should have no occasion to ride in them; though they had buff coats and sharp weapons, they should have no occasion to don or use them."]],[3,["I would make the people return to the use of knotted cords (instead of the written characters)."]],[4,["They should think their (coarse) food sweet; their (plain) clothes beautiful; their (poor) dwellings places of rest; and their common (simple) ways sources of enjoyment."]],[5,["There should be a neighbouring state within sight, and the voices of the fowls and dogs should be heard all the way from it to us, but I would make the people to old age, even to death, not have any intercourse with it."]]],"no":[{"v":[4],"l":"4","t":"In de oude, oude tijden gebruikte men koorden met knopen voor het tellen.","t98":"In de oude, oude tijden gebruikte men koorden met knoopen voor het tellen."}]},{"n":81,"r":"LXXXI","d":"Teh","zh":["信言不美，美言不信。","善者不辯，辯者不善。","知者不博，博者不知。","聖人不
