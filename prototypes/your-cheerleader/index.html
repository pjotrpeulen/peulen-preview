function normaliseer(t) { t = t.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, ""); t = t.replace(/[^a-z0-9]+/g, " "); return " " + t.split(" ").filter(Boolean).join(" ") + " "; }
